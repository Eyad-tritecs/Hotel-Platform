<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("reservations", ["Reservations", "Reservations"]);
var s = PG.getState();

function roomSummary(r){
  return r.rooms.map(function(room){
    var rt = s.roomTypes.find(function(x){return x.id===room.roomTypeId;});
    return room.qty + '× ' + rt.name;
  }).join(', ');
}
function reservationTotal(r) {
  var nights = PG.dateRange(r.checkIn, r.checkOut);
  var total = 0;
  r.rooms.forEach(function(room){
    nights.forEach(function(d){ total += PG.rateFor(s, room.roomTypeId, d) * room.qty; });
  });
  return total;
}

var STATUSES = ['All','Draft','Pending Payment','Confirmed','Cancelled','Completed','No Show'];

var html = '';
html += '<div class="pg-page-head"><div><h1>Reservations</h1><div class="sub">All bookings for Palestine Grand Hotel</div></div>' +
  '<div class="pg-actions"><a class="btn btn-primary" href="new-reservation.html">+ New Reservation</a></div></div>';

html += '<div class="card"><div class="card-body" style="padding:16px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">' +
  '<input class="form-control" style="max-width:280px;" id="searchBox" placeholder="Search by reservation ID or guest name">' +
  '<select class="form-control" style="max-width:190px;" id="statusFilter">' + STATUSES.map(function(st){return '<option value="'+st+'">'+(st==='All'?'All Statuses':st)+'</option>';}).join('') + '</select>' +
  '<select class="form-control" style="max-width:190px;" id="sourceFilter"><option value="All">All Sources</option>' +
  ['Admin / Direct Manual','Phone','WhatsApp','Walk-in','Travel Agency','Other Manual'].map(function(src){return '<option value="'+src+'">'+src+'</option>';}).join('') +
  '</select>' +
  '<span class="muted text-sm" id="resultCount" style="margin-left:auto;"></span>' +
'</div></div>';

html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
  '<th>Reservation</th><th>Guest</th><th>Rooms</th><th>Check-in</th><th>Check-out</th><th>Source</th><th>Status</th><th>Payment</th><th class="num">Total</th>' +
  '</tr></thead><tbody id="resBody"></tbody></table></div></div></div>';

page.innerHTML = html;

function render(){
  var q = document.getElementById('searchBox').value.trim().toLowerCase();
  var statusF = document.getElementById('statusFilter').value;
  var sourceF = document.getElementById('sourceFilter').value;
  var rows = s.reservations.slice().sort(function(a,b){return b.createdAt<a.createdAt?-1:1;}).filter(function(r){
    var cust = s.customers.find(function(c){return c.id===r.customerId;});
    if (statusF!=='All' && r.status!==statusF) return false;
    if (sourceF!=='All' && r.source!==sourceF) return false;
    if (q && !(r.id.toLowerCase().indexOf(q)>-1 || cust.name.toLowerCase().indexOf(q)>-1)) return false;
    return true;
  });
  document.getElementById('resultCount').textContent = rows.length + ' reservation' + (rows.length===1?'':'s');
  var body = document.getElementById('resBody');
  if (!rows.length){
    body.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="ic">&#128203;</div>No reservations match your filters.</div></td></tr>';
    return;
  }
  body.innerHTML = rows.map(function(r){
    var cust = s.customers.find(function(c){return c.id===r.customerId;});
    return '<tr onclick="location.href=\'reservation-detail.html?id='+r.id+'\'" style="cursor:pointer;">' +
      '<td class="row-link">'+r.id+'</td>' +
      '<td>'+PG.esc(cust.name)+'</td>' +
      '<td class="text-sm">'+roomSummary(r)+'</td>' +
      '<td>'+PG.fmtDateShort(r.checkIn)+'</td>' +
      '<td>'+PG.fmtDateShort(r.checkOut)+'</td>' +
      '<td class="text-sm">'+r.source+'</td>' +
      '<td>'+PG.statusBadge(r.status)+'</td>' +
      '<td>'+PG.payBadge(r.paymentStatus)+'</td>' +
      '<td class="num">'+PG.fmtMoney(reservationTotal(r))+'</td>' +
    '</tr>';
  }).join('');
}

['input','change'].forEach(function(ev){
  document.getElementById('searchBox').addEventListener(ev, render);
  document.getElementById('statusFilter').addEventListener(ev, render);
  document.getElementById('sourceFilter').addEventListener(ev, render);
});
render();
</script>
</body>
</html>
