<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .res-chiprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("reservations", ["Hotel Operations", "Reservations"]);
var s = PG.getState();

function roomCount(r){ return r.rooms.reduce(function(a,x){return a+x.qty;},0); }
function reservationTotal(r) { return PG.reservationRoomCharges(s, r); }

var STATUSES = ['All','Draft','Pending Payment','Confirmed','Cancelled','Completed','No Show'];
var PAY_STATUSES = ['All','Pay on Arrival','Payment Required','Link Sent','Paid','Failed','Expired','Refund Pending','Refunded'];
var SOURCES = ['All','Admin / Direct Manual','Phone','WhatsApp','Walk-in','Travel Agency','Other Manual'];

var html = '';
html += '<div class="pg-page-head"><div><h1>Reservations</h1><div class="sub">All bookings for Palestine Grand Hotel</div></div>' +
  '<div class="pg-actions"><a class="btn btn-primary" href="new-reservation.html">+ New Reservation</a></div></div>';

// Search-first toolbar: search, then Reservation Status as chips (the single most
// common filter here). Payment Status, Source, and the arrival/departure date range
// are lower-frequency, so they live in an Advanced Filters drawer and report back as
// removable applied chips — same pattern as Physical Rooms / Guests.
html += '<div class="card"><div class="card-body" style="display:flex;flex-direction:column;gap:14px;">' +
  '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">' +
    '<div class="pg-searchwrap" style="flex:1 1 260px;min-width:220px;"><span class="ic">' + PG.icon('search',15) + '</span>' +
      '<input class="form-control" id="searchBox" type="search" placeholder="Search by Reservation ID, Guest Name or Mobile" aria-label="Search reservations"></div>' +
    '<button class="btn btn-outline btn-sm" id="advFiltersBtn">' + PG.icon('filter',15) + ' Advanced Filters<span id="advCount"></span></button>' +
  '</div>' +
  '<div class="res-chiprow"><span class="text-sm muted" style="font-weight:600;">Status</span>' +
    PG.filterChips('resStatus', STATUSES.map(function(st){return {value:st, label: st==='All'?'All':st};}), 'All', {ariaLabel:'Filter by reservation status'}) +
  '</div>' +
  '<div id="resApplied" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"></div>' +
  '<div style="display:flex;justify-content:flex-end;">' +
    '<span class="muted text-sm" id="resultCount"></span>' +
  '</div>' +
'</div></div>';

html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
  '<th>Reservation #</th><th>Guest</th><th>Arrival</th><th>Departure</th><th>Rooms</th><th>Source</th><th>Reservation Status</th><th>Payment Status</th><th class="num">Total</th><th>Created</th><th></th>' +
  '</tr></thead><tbody id="resBody"></tbody></table></div></div></div>';

page.innerHTML = html;
PG.enhanceSelects(page);

var filters = { status: 'All', pay: 'All', source: 'All', arrival: '', departure: '' };

// Pre-filter from a deep link, e.g. reservations.html?arrival=2026-08-23&payStatus=Payment%20Required
(function applyUrlFilters(){
  var qp = new URLSearchParams(location.search);
  if (qp.get('arrival')) filters.arrival = qp.get('arrival');
  if (qp.get('departure')) filters.departure = qp.get('departure');
  if (qp.get('status')) filters.status = qp.get('status');
  if (qp.get('payStatus')) filters.pay = qp.get('payStatus');
  if (qp.get('source')) filters.source = qp.get('source');
})();

function syncChipUi(){
  page.querySelectorAll('[data-chips="resStatus"] .pg-chip').forEach(function(chip){
    var on = chip.dataset.chipValue === filters.status;
    chip.classList.toggle('active', on); chip.setAttribute('aria-pressed', on);
  });
}
function appliedFilterList(){
  var out = [];
  if (filters.pay !== 'All') out.push({key:'pay', label:'Payment Status', value: filters.pay});
  if (filters.source !== 'All') out.push({key:'source', label:'Source', value: filters.source});
  if (filters.arrival) out.push({key:'arrival', label:'Arrival', value: PG.fmtDateShort(filters.arrival)});
  if (filters.departure) out.push({key:'departure', label:'Departure', value: PG.fmtDateShort(filters.departure)});
  return out;
}
function renderApplied(){
  var applied = appliedFilterList();
  var extra = filters.status !== 'All' ? 1 : 0;
  var total = applied.length + extra;
  var box = document.getElementById('resApplied');
  box.innerHTML = total
    ? '<span class="text-sm muted">' + total + ' active filter' + (total===1?'':'s') + '</span>' +
      PG.appliedChips(applied) +
      '<button class="btn btn-light btn-sm" id="clearFilters">Clear Filters</button>'
    : '';
  var badge = document.getElementById('advCount');
  if (badge) badge.innerHTML = applied.length ? ' <span class="pg-chip-count" style="background:var(--pg-primary);color:#fff;">' + applied.length + '</span>' : '';
  box.querySelectorAll('[data-remove-filter]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var k = btn.dataset.removeFilter;
      filters[k] = (k === 'arrival' || k === 'departure') ? '' : 'All';
      render();
    });
  });
  var clear = document.getElementById('clearFilters');
  if (clear) clear.addEventListener('click', clearFilters);
}

function render(){
  var q = document.getElementById('searchBox').value.trim().toLowerCase();
  syncChipUi();
  renderApplied();

  var rows = s.reservations.slice().sort(function(a,b){return b.createdAt<a.createdAt?-1:1;}).filter(function(r){
    var cust = s.customers.find(function(c){return c.id===r.customerId;});
    if (filters.status!=='All' && r.status!==filters.status) return false;
    if (filters.pay!=='All' && r.paymentStatus!==filters.pay) return false;
    if (filters.source!=='All' && r.source!==filters.source) return false;
    if (filters.arrival && r.checkIn!==filters.arrival) return false;
    if (filters.departure && r.checkOut!==filters.departure) return false;
    if (q && !(r.id.toLowerCase().indexOf(q)>-1 || cust.name.toLowerCase().indexOf(q)>-1 || (cust.phone||'').toLowerCase().replace(/\s/g,'').indexOf(q.replace(/\s/g,''))>-1)) return false;
    return true;
  });

  document.getElementById('resultCount').textContent = rows.length + ' reservation' + (rows.length===1?'':'s');
  var body = document.getElementById('resBody');
  if (!rows.length){
    body.innerHTML = '<tr><td colspan="11"><div class="empty-state"><div class="ic">' + PG.icon('list',30) + '</div><strong>No reservations match your filters</strong></div></td></tr>';
    return;
  }
  body.innerHTML = rows.map(function(r){
    var cust = s.customers.find(function(c){return c.id===r.customerId;});
    var n = roomCount(r);
    return '<tr>' +
      '<td class="row-link" onclick="location.href=\'reservation-detail.html?id='+r.id+'\'" style="cursor:pointer;">'+r.id+'</td>' +
      '<td>'+PG.esc(cust.name)+'</td>' +
      '<td>'+PG.fmtDate(r.checkIn)+'</td>' +
      '<td>'+PG.fmtDate(r.checkOut)+'</td>' +
      '<td>'+n+' room'+(n===1?'':'s')+'</td>' +
      '<td class="text-sm">'+r.source+'</td>' +
      '<td>'+PG.statusBadge(r.status)+'</td>' +
      '<td>'+PG.payBadge(r.paymentStatus)+'</td>' +
      '<td class="num">'+PG.fmtMoney(reservationTotal(r))+'</td>' +
      '<td class="text-sm">'+PG.fmtDate(r.createdAt.slice(0,10))+'</td>' +
      '<td><a class="btn btn-outline btn-sm" href="reservation-detail.html?id='+r.id+'">View Reservation</a></td>' +
    '</tr>';
  }).join('');
}

document.getElementById('searchBox').addEventListener('input', render);
PG.wireChips(page, 'resStatus', function(v){ filters.status = v; render(); });

function clearFilters(){
  filters = { status: 'All', pay: 'All', source: 'All', arrival: '', departure: '' };
  document.getElementById('searchBox').value = '';
  render();
}

/* Advanced filters drawer — Payment Status, Source, and the arrival/departure range. */
var advDrawer = document.createElement('div');
advDrawer.className = 'pg-drawer-overlay';
advDrawer.id = 'resAdvDrawer';
document.body.appendChild(advDrawer);
document.getElementById('advFiltersBtn').addEventListener('click', function(){
  advDrawer.innerHTML = '<div class="pg-drawer" style="max-width:400px;">' +
    '<div class="pg-drawer-header"><h3>Advanced Filters</h3>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'resAdvDrawer\')" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
    '<div class="pg-drawer-body">' +
      '<div class="form-group"><label class="form-label" for="adv-pay">Payment Status</label>' +
        '<select class="form-control" id="adv-pay">' + PAY_STATUSES.map(function(p){return '<option value="'+p+'"'+(filters.pay===p?' selected':'')+'>'+(p==='All'?'All Payment Statuses':p)+'</option>';}).join('') + '</select></div>' +
      '<div class="form-group"><label class="form-label" for="adv-source">Reservation Source</label>' +
        '<select class="form-control" id="adv-source">' + SOURCES.map(function(src){return '<option value="'+src+'"'+(filters.source===src?' selected':'')+'>'+(src==='All'?'All Sources':src)+'</option>';}).join('') + '</select></div>' +
      '<div class="grid-2" style="margin-bottom:0;"><div class="form-group"><label class="form-label" for="adv-arrival">Arrival Date</label>' +
        '<input type="date" class="form-control" id="adv-arrival" value="'+PG.esc(filters.arrival)+'"></div>' +
        '<div class="form-group"><label class="form-label" for="adv-departure">Departure Date</label>' +
        '<input type="date" class="form-control" id="adv-departure" value="'+PG.esc(filters.departure)+'"></div></div>' +
    '</div>' +
    '<div class="pg-drawer-footer"><button class="btn btn-light" id="adv-clear">Clear</button>' +
      '<button class="btn btn-primary" id="adv-apply">Apply Filters</button></div>' +
  '</div>';
  PG.enhanceSelects(advDrawer);
  var pending = { pay: filters.pay, source: filters.source, arrival: filters.arrival, departure: filters.departure };
  document.getElementById('adv-pay').addEventListener('change', function(){ pending.pay = this.value; });
  document.getElementById('adv-source').addEventListener('change', function(){ pending.source = this.value; });
  document.getElementById('adv-arrival').addEventListener('change', function(){ pending.arrival = this.value; });
  document.getElementById('adv-departure').addEventListener('change', function(){ pending.departure = this.value; });
  document.getElementById('adv-clear').addEventListener('click', function(){
    filters.pay = 'All'; filters.source = 'All'; filters.arrival = ''; filters.departure = '';
    PG.closeModal('resAdvDrawer'); render();
  });
  document.getElementById('adv-apply').addEventListener('click', function(){
    filters.pay = pending.pay; filters.source = pending.source; filters.arrival = pending.arrival; filters.departure = pending.departure;
    PG.closeModal('resAdvDrawer'); render();
  });
  PG.openModal('resAdvDrawer');
});

render();
window.pgAssistantRefresh = render; // lets the Hotel Assistant update this screen after applying a change
PG.mountHotelAssistant('Reservations');
</script>
</body>
</html>
