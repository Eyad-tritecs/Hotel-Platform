<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physical Rooms — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .sum-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px;}
  @media (max-width:1300px){.sum-grid{grid-template-columns:repeat(2,1fr);}}
  .filters-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .filters-grid .form-group{margin-bottom:0;}
  .filters-grid .form-label{font-size:11px;}
  @media (max-width:1100px){.filters-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:1500px){.col-attrs{display:none;}}
  @media (max-width:1300px){.col-bed{display:none;}}
  @media (max-width:1100px){.col-bldg{display:none;}}
  .chip{display:inline-block;background:var(--pg-gray-100);border:1px solid var(--pg-border);border-radius:12px;padding:2px 8px;font-size:11px;color:var(--pg-gray-700);margin:2px 4px 2px 0;white-space:nowrap;}
  .checklist-box{border:1px solid var(--pg-border);border-radius:6px;padding:10px 12px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .checklist-box .form-check{gap:8px;}
  .field-error{color:var(--pg-danger);font-size:11.5px;margin-top:5px;}
  .form-control.error{border-color:var(--pg-danger);}
  .detail-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--pg-gray-200);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .v{font-weight:700;text-align:right;}
  .drawer-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--pg-gray-500);margin:20px 0 10px;}
  .drawer-section-title:first-child{margin-top:0;}
  .skeleton-row td{padding:16px;}
  .skeleton-bar{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--pg-gray-200) 25%,var(--pg-gray-100) 37%,var(--pg-gray-200) 63%);background-size:400% 100%;animation:pg-skel 1.4s ease infinite;}
  @keyframes pg-skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  /* .more-wrap / .more-btn / .more-menu now live in style.css so every table row menu
     in the app is literally the same component. */
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("physical-rooms", ["Rooms Management & Pricing", "Physical Rooms"]);
var s = PG.getState();

// Role gating mirrors the existing superAdminOnly pattern in app.js's NAV — CURRENT_ROLE
// is hardcoded today (no login/role-switcher UI), so this branch never actually fires,
// but it's here for when a future prompt wires up real role switching.
var CAN_VIEW = PG.hasPermission('view_physical_rooms');
var CAN_MANAGE = PG.hasPermission('manage_physical_rooms'); // create / edit / deactivate
var CAN_BLOCK = PG.hasPermission('block_rooms');
var CAN_VIEW_CALENDAR = PG.hasPermission('view_operations_calendar');

function distinct(arr) {
  var out = [];
  arr.forEach(function (v) { if (v != null && v !== '' && out.indexOf(v) === -1) out.push(v); });
  return out;
}
function rt(id) { return s.roomTypes.find(function (r) { return r.id === id; }); }
function rtName(id) { var r = rt(id); return r ? r.name : id; }
function roomById(id) { return s.physicalRooms.find(function (r) { return r.id === id; }); }

var ACCESSIBILITY_OPTIONS = ['Wheelchair Accessible', 'Grab Bars', 'Roll-in Shower', 'Visual Alarm'];
// VIEW_OPTIONS is gone — Room View is now a reusable, property-scoped list
// (PG.getState().roomViews) editable in place via PG.renderManagedSelect, same as
// Bed Configuration below.
var STATUS_OPTIONS = ['Available', 'Reserved', 'Held', 'Out of Order', 'Out of Service', 'Inactive'];
// "Reserved" is never a stored baseline — it's always derived live from a covering
// roomAssignment (PG.roomStatusOn, README §4.6) — so it's excluded from what staff can
// directly set as the room's own operationalStatus.
var OPERATIONAL_STATUS_OPTIONS = ['Available', 'Held', 'Out of Order', 'Out of Service', 'Inactive'];

function init() {
  var filters = { q: '', roomType: 'all', building: 'all', floor: 'all', status: 'all', active: 'all' };
  var editingId = null; // null = Add mode
  var currentRoom = null; // room targeted by the Block Room modal

  var html = '';
  html += '<div class="pg-page-head"><div><h1>Physical Rooms</h1>' +
    '<div class="sub">Individual rooms that belong to each room type — used to assign a specific room to a reservation.</div></div>' +
    '<div class="pg-actions">' + (CAN_MANAGE ? '<button class="btn btn-primary" id="addRoomBtn">+ Add Physical Room</button>' : '') + '</div></div>';

  html += '<div class="sum-grid" id="sumGrid"></div>';

  // Search first, then the two filters staff reach for constantly as chips. Building,
  // floor and active state are lower-frequency, so they live in an advanced drawer and
  // report back as removable chips — no filter is ever invisible state (§8).
  html += '<div class="card"><div class="card-body" style="padding:16px 20px;display:flex;flex-direction:column;gap:14px;">' +
    '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">' +
      '<div class="pg-searchwrap" style="flex:1 1 240px;"><span class="ic">' + PG.icon('search',15) + '</span>' +
        '<input class="form-control" id="searchBox" type="search" placeholder="Search by room number" aria-label="Search by room number"></div>' +
      '<button class="btn btn-outline btn-sm" id="advFiltersBtn">' + PG.icon('filter',15) + ' More Filters<span id="advCount"></span></button>' +
    '</div>' +
    '<div>' + PG.filterChips('prRoomType',
      [{value:'all',label:'All Room Types'}].concat(s.roomTypes.map(function(r){
        return {value:r.id, label:r.name, count: s.physicalRooms.filter(function(p){return p.roomTypeId===r.id;}).length};
      })), 'all', {ariaLabel:'Filter by room type'}) + '</div>' +
    '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">' +
      '<span class="text-sm muted" style="font-weight:600;">Today&rsquo;s status</span>' +
      PG.filterChips('prStatus', [{value:'all',label:'All'}].concat(STATUS_OPTIONS.map(function(st2){return {value:st2,label:st2};})), 'all', {ariaLabel:'Filter by operational status'}) +
    '</div>' +
    '<div id="prApplied" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"></div>' +
    '<div style="display:flex;justify-content:flex-end;align-items:center;">' +
      '<span class="muted text-sm" id="resultCount"></span>' +
    '</div>' +
  '</div></div>';

  html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
    '<th>Room Number</th><th>Room Type</th><th class="col-bldg">Building / Floor</th><th class="col-bed">Bed Configuration</th>' +
    '<th class="col-attrs">Key Attributes</th><th class="col-attrs">Amenities</th><th>Today\'s Status</th><th>Current / Next Reservation</th><th>Active State</th><th></th>' +
  '</tr></thead><tbody id="roomsBody"></tbody></table></div></div></div>';

  page.innerHTML = html;
  PG.enhanceSelects(page);

  // ---- Summary strip ----
  function renderSummary() {
    var st = PG.getState();
    var rooms = st.physicalRooms;
    var total = rooms.length;
    var activeSellable = rooms.filter(function (r) { return r.isActive && r.isSellable; }).length;
    var reservedToday = rooms.filter(function (r) { return PG.roomStatusOn(st, r.id, PG.TODAY) === 'Reserved'; }).length;
    var blockedToday = rooms.filter(function (r) { return !!PG.physicalRoomBlockOn(st, r.id, PG.TODAY); }).length;
    var inactive = rooms.filter(function (r) { return !r.isActive; }).length;
    function tile(label, value, note) {
      return '<div class="kpi"><div class="kpi-label">' + label + '</div><div class="kpi-value">' + value + '</div><div class="kpi-note">' + (note || '&nbsp;') + '</div></div>';
    }
    document.getElementById('sumGrid').innerHTML =
      tile('Total Rooms', total, s.hotel.name) +
      tile('Active &amp; Sellable', activeSellable, 'Assignable to reservations') +
      tile('Reserved Today', reservedToday, PG.fmtDate(PG.TODAY, { month: 'short', day: 'numeric' })) +
      tile('Blocked Today', blockedToday, 'Out of Order / Service / Hold') +
      tile('Inactive', inactive, 'Retired from service');
  }

  // ---- Key attributes cell ----
  function keyAttributesHtml(r) {
    var chips = [];
    if (r.view) chips.push(r.view);
    (r.accessibilityFeatures || []).forEach(function (a) { chips.push(a); });
    if (r.connectingRoomIds && r.connectingRoomIds.length) {
      var nums = r.connectingRoomIds.map(function (id) { var pr = roomById(id); return pr ? pr.roomNumber : id; });
      chips.push('Connects: ' + nums.join(', '));
    }
    if (!chips.length) return '<span class="muted text-sm">—</span>';
    return chips.map(function (c) { return '<span class="chip">' + PG.esc(c) + '</span>'; }).join('');
  }

  // Compact "N amenities" badge — guaranteed (inherited from Room Type) + this room's
  // own extra features combined, with a hover tooltip listing every name so the table
  // doesn't need a wide chip list per row.
  function amenitiesBadgeHtml(r) {
    var st2 = PG.getState();
    var type = st2.roomTypes.find(function (t) { return t.id === r.roomTypeId; });
    var ids = (type ? (type.amenities || []) : []).concat(r.features || []);
    return PG.amenityChipsHtml(ids, 4);
  }

  function reservationCellHtml(r) {
    var st = PG.getState();
    var cn = PG.currentOrNextAssignment(st, r.id, PG.TODAY);
    if (!cn) return '<span class="muted text-sm">No upcoming reservation</span>';
    var res = st.reservations.find(function (x) { return x.id === cn.assignment.reservationId; });
    var cust = res ? st.customers.find(function (c) { return c.id === res.customerId; }) : null;
    var label = cn.when === 'current' ? 'Current' : 'Next';
    var dateLbl = cn.when === 'current' ? ('until ' + PG.fmtDateShort(cn.assignment.departureDate)) : ('from ' + PG.fmtDateShort(cn.assignment.arrivalDate));
    return '<a class="row-link" href="reservation-detail.html?id=' + cn.assignment.reservationId + '">' + cn.assignment.reservationId + '</a>' +
      '<div class="muted text-sm">' + label + (cust ? ' &middot; ' + PG.esc(cust.name) : '') + ' &middot; ' + dateLbl + (cn.assignment.assignmentStatus === 'Held' ? ' &middot; Held' : '') + '</div>';
  }

  function activeStateHtml(r) {
    var out = r.isActive ? '<span class="badge badge-green"><span class="badge-dot"></span>Active</span>' : '<span class="badge badge-gray"><span class="badge-dot"></span>Inactive</span>';
    if (r.isActive && !r.isSellable) out += '<div class="muted text-sm" style="margin-top:4px;">Not sellable</div>';
    return out;
  }

  function filteredRooms() {
    var st = PG.getState();
    var q = filters.q.trim().toLowerCase();
    return st.physicalRooms.filter(function (r) {
      if (filters.roomType !== 'all' && r.roomTypeId !== filters.roomType) return false;
      if (filters.building !== 'all' && r.building !== filters.building) return false;
      if (filters.floor !== 'all' && String(r.floor) !== filters.floor) return false;
      if (filters.status !== 'all' && PG.roomStatusOn(st, r.id, PG.TODAY) !== filters.status) return false;
      if (filters.active === 'active' && !r.isActive) return false;
      if (filters.active === 'inactive' && r.isActive) return false;
      if (q && r.roomNumber.toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function (a, b) {
      if (a.building !== b.building) return a.building < b.building ? -1 : 1;
      if (a.floor !== b.floor) return a.floor - b.floor;
      return a.roomNumber < b.roomNumber ? -1 : 1;
    });
  }

  function renderTable() {
    s = PG.getState();
    var rows = filteredRooms();
    document.getElementById('resultCount').textContent = rows.length + ' room' + (rows.length === 1 ? '' : 's');
    renderApplied();
    var body = document.getElementById('roomsBody');
    if (!s.physicalRooms.length) {
      body.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="ic">' + PG.icon('door',30) + '</div>No physical rooms configured yet.' + (CAN_MANAGE ? '<br><br><button class="btn btn-primary" id="emptyAddBtn">+ Add Physical Room</button>' : '') + '</div></td></tr>';
      var emptyAddBtn = document.getElementById('emptyAddBtn');
      if (emptyAddBtn) emptyAddBtn.addEventListener('click', function () { openRoomDrawer(null); });
      return;
    }
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="ic">' + PG.icon('search',30) + '</div>No rooms match your filters.<br><br><button class="btn btn-outline btn-sm" id="emptyClearBtn">Clear Filters</button></div></td></tr>';
      document.getElementById('emptyClearBtn').addEventListener('click', clearFilters);
      return;
    }
    body.innerHTML = rows.map(function (r) {
      var today = PG.roomStatusOn(s, r.id, PG.TODAY);
      return '<tr>' +
        '<td><a class="row-link view-btn" data-id="' + r.id + '" style="font-weight:700;">' + PG.esc(r.roomNumber) + '</a></td>' +
        '<td>' + PG.esc(rtName(r.roomTypeId)) + '</td>' +
        '<td class="col-bldg text-sm">' + PG.esc(r.building) + ' &middot; Floor ' + r.floor + '</td>' +
        '<td class="col-bed text-sm">' + PG.esc(r.bedConfiguration) + '</td>' +
        '<td class="col-attrs">' + keyAttributesHtml(r) + '</td>' +
        '<td class="col-attrs">' + amenitiesBadgeHtml(r) + '</td>' +
        '<td>' + PG.roomStatusBadge(today) + '</td>' +
        '<td>' + reservationCellHtml(r) + '</td>' +
        '<td>' + activeStateHtml(r) + '</td>' +
        '<td><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">' +
          '<button class="btn btn-outline btn-sm view-btn" data-id="' + r.id + '">View</button>' +
          '<div class="more-wrap"><button class="more-btn" data-id="' + r.id + '" aria-label="Actions for room ' + PG.esc(r.roomNumber) + '" aria-haspopup="menu" title="More actions">' + PG.icon('dots', 16) + '</button>' +
            '<div class="more-menu" data-menu-for="' + r.id + '" role="menu">' +
              (CAN_MANAGE ? '<button class="edit-action" data-id="' + r.id + '">' + PG.icon('edit', 15) + ' Edit Room</button>' : '') +
              '<a href="new-reservation.html?rt=' + r.roomTypeId + '&room=' + r.id + '&date=' + PG.TODAY + '">' + PG.icon('plus', 15) + ' Create Reservation</a>' +
              (CAN_BLOCK ? '<button class="block-action" data-id="' + r.id + '">' + PG.icon('lockClosed', 15) + ' Add Room Block</button>' : '') +
              '<div class="menu-sep"></div>' +
              (CAN_VIEW_CALENDAR ? '<a href="operations-calendar.html?room=' + r.id + '">' + PG.icon('calendar', 15) + ' View Calendar</a>' : '') +
              '<button class="view-detail-action" data-id="' + r.id + '">' + PG.icon('info', 15) + ' View Room Details</button>' +
              (CAN_MANAGE ? '<div class="menu-sep"></div><button class="toggle-active-action' + (r.isActive ? ' danger' : '') + '" data-id="' + r.id + '">' +
                PG.icon(r.isActive ? 'ban' : 'check', 15) + ' ' + (r.isActive ? 'Deactivate Room' : 'Activate Room') + '</button>' : '') +
            '</div>' +
          '</div>' +
        '</div></td>' +
      '</tr>';
    }).join('');
    PG.wireMoreMenus(body);
  }

  function renderAll() { renderSummary(); renderTable(); }
  window.pgAssistantRefresh = renderAll; // lets the Hotel Assistant update this screen after applying a change

  // Row menus are wired per-render by PG.wireMoreMenus() (called at the end of
  // renderTable()) — it owns open/close, outside-click, Escape, and the portal
  // positioning that keeps the menu from being clipped by the table container.
  //
  // This delegate listens on `document`, not `#roomsBody`: while a menu is open its
  // items live under <body> (PG.openMoreMenu reparents them there), so a listener
  // scoped to the table would stop seeing clicks on them the moment the portal moves.
  document.addEventListener('click', function (e) {
    var t;
    if (t = e.target.closest('#roomsBody .view-btn')) { openDetailsDrawer(t.dataset.id); return; }
    if (t = e.target.closest('.view-detail-action')) { PG.closeMoreMenu(false); openDetailsDrawer(t.dataset.id); return; }
    if (t = e.target.closest('.edit-action')) { PG.closeMoreMenu(false); openRoomDrawer(t.dataset.id); return; }
    if (t = e.target.closest('.block-action')) { PG.closeMoreMenu(false); openBlockModal(t.dataset.id); return; }
    if (t = e.target.closest('.toggle-active-action')) { PG.closeMoreMenu(false); toggleActive(t.dataset.id); return; }
  });

  // ---- Filters ----
  function clearFilters() {
    filters = { q: '', roomType: 'all', building: 'all', floor: 'all', status: 'all', active: 'all' };
    document.getElementById('searchBox').value = '';
    syncChipUi();
    renderTable();
  }
  // Repaint chip pressed-states from `filters` rather than tracking them separately, so
  // a chip, the drawer, and a removable applied-chip can never disagree about state.
  function syncChipUi(){
    page.querySelectorAll('[data-chips="prRoomType"] .pg-chip').forEach(function(c){
      var on = c.dataset.chipValue === filters.roomType;
      c.classList.toggle('active', on); c.setAttribute('aria-pressed', on);
    });
    page.querySelectorAll('[data-chips="prStatus"] .pg-chip').forEach(function(c){
      var on = c.dataset.chipValue === filters.status;
      c.classList.toggle('active', on); c.setAttribute('aria-pressed', on);
    });
  }
  // Only drawer-held filters need applied-chips; the chip rows already show their own state.
  function appliedFilterList(){
    var out = [];
    if (filters.building !== 'all') out.push({key:'building', label:'Building', value: filters.building});
    if (filters.floor !== 'all') out.push({key:'floor', label:'Floor', value: 'Floor ' + filters.floor});
    if (filters.active !== 'all') out.push({key:'active', label:'State', value: filters.active === 'active' ? 'Active' : 'Inactive'});
    if (filters.q) out.push({key:'q', label:'Search', value: filters.q});
    return out;
  }
  function renderApplied(){
    var applied = appliedFilterList();
    var extra = (filters.roomType !== 'all' ? 1 : 0) + (filters.status !== 'all' ? 1 : 0);
    var total = applied.length + extra;
    var box = document.getElementById('prApplied');
    // Clear Filters appears only while something is actually filtered (§8).
    box.innerHTML = total
      ? '<span class="text-sm muted">' + total + ' active filter' + (total===1?'':'s') + '</span>' +
        PG.appliedChips(applied) +
        '<button class="btn btn-light btn-sm" id="clearFilters">Clear Filters</button>'
      : '';
    var badge = document.getElementById('advCount');
    if (badge) badge.innerHTML = applied.length ? ' <span class="pg-chip-count" style="background:var(--pg-primary);color:#fff;">' + applied.length + '</span>' : '';
    box.querySelectorAll('[data-remove-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.dataset.removeFilter;
        if (k === 'q'){ filters.q = ''; document.getElementById('searchBox').value = ''; }
        else filters[k] = 'all';
        renderTable();
      });
    });
    var clear = document.getElementById('clearFilters');
    if (clear) clear.addEventListener('click', clearFilters);
  }

  document.getElementById('searchBox').addEventListener('input', function () { filters.q = this.value; renderTable(); });
  PG.wireChips(page, 'prRoomType', function(v){ filters.roomType = v; syncChipUi(); renderTable(); });
  PG.wireChips(page, 'prStatus', function(v){ filters.status = v; syncChipUi(); renderTable(); });

  /* Advanced filters drawer — the lower-frequency dimensions, kept out of the toolbar
     but always reported back as removable chips (progressive disclosure, §3). */
  var advDrawer = document.createElement('div');
  advDrawer.className = 'pg-drawer-overlay';
  advDrawer.id = 'prAdvDrawer';
  document.body.appendChild(advDrawer);
  document.getElementById('advFiltersBtn').addEventListener('click', function(){
    var buildings = distinct(s.physicalRooms.map(function(r){return r.building;})).sort();
    var floors = distinct(s.physicalRooms.map(function(r){return r.floor;})).sort(function(a,b){return a-b;});
    advDrawer.innerHTML = '<div class="pg-drawer" style="max-width:400px;">' +
      '<div class="pg-drawer-header"><h3>More Filters</h3>' +
        '<button class="pg-modal-close" onclick="PG.closeModal(\'prAdvDrawer\')" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
      '<div class="pg-drawer-body">' +
        '<div class="form-group"><label class="form-label" for="adv-bldg">Building</label>' +
          '<select class="form-control" id="adv-bldg"><option value="all">All Buildings</option>' +
          buildings.map(function(b){ return '<option value="'+PG.esc(b)+'"'+(filters.building===b?' selected':'')+'>'+PG.esc(b)+'</option>'; }).join('') + '</select></div>' +
        '<div class="form-group"><label class="form-label" for="adv-floor">Floor</label>' +
          '<select class="form-control" id="adv-floor"><option value="all">All Floors</option>' +
          floors.map(function(f){ return '<option value="'+f+'"'+(String(filters.floor)===String(f)?' selected':'')+'>Floor '+f+'</option>'; }).join('') + '</select></div>' +
        '<div class="form-group"><label class="form-label">Active State</label>' +
          PG.segmented('advActive', [{value:'all',label:'All'},{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}], filters.active, {ariaLabel:'Active state'}) + '</div>' +
      '</div>' +
      '<div class="pg-drawer-footer"><button class="btn btn-light" id="adv-clear">Clear</button>' +
        '<button class="btn btn-primary" id="adv-apply">Apply Filters</button></div>' +
    '</div>';
    PG.enhanceSelects(advDrawer);
    // Edits stay in a pending copy until Apply — Cancel/Escape leaves the grid untouched.
    var pending = { building: filters.building, floor: filters.floor, active: filters.active };
    document.getElementById('adv-bldg').addEventListener('change', function(){ pending.building = this.value; });
    document.getElementById('adv-floor').addEventListener('change', function(){ pending.floor = this.value; });
    PG.wireSegmented(advDrawer, 'advActive', function(v){ pending.active = v; });
    document.getElementById('adv-clear').addEventListener('click', function(){
      filters.building = 'all'; filters.floor = 'all'; filters.active = 'all';
      PG.closeModal('prAdvDrawer'); renderTable();
    });
    document.getElementById('adv-apply').addEventListener('click', function(){
      filters.building = pending.building; filters.floor = pending.floor; filters.active = pending.active;
      PG.closeModal('prAdvDrawer'); renderTable();
    });
    PG.openModal('prAdvDrawer');
  });

  // ---- Loading state: brief skeleton, then real data ----
  renderSummary();
  document.getElementById('roomsBody').innerHTML = [0, 1, 2].map(function () {
    return '<tr class="skeleton-row"><td colspan="10"><div class="skeleton-bar" style="width:60%;"></div></td></tr>';
  }).join('');
  setTimeout(renderTable, 220);

  // Deep-link support, e.g. physical-rooms.html?room=std-101 — opens straight to that
  // room's Details drawer (used by Operations Calendar's "View Room" quick action).
  var deepLinkRoomId = new URLSearchParams(location.search).get('room');
  if (deepLinkRoomId) setTimeout(function () { if (roomById(deepLinkRoomId)) openDetailsDrawer(deepLinkRoomId); }, 260);

  /* ================================================================ */
  /* Add / Edit drawer                                                  */
  /* ================================================================ */
  var roomDrawer = document.createElement('div');
  roomDrawer.className = 'pg-drawer-overlay';
  roomDrawer.id = 'roomDrawer';
  document.body.appendChild(roomDrawer);
  var bedConfigValue = '';
  var viewValue = '';
  // Assigned-option protection (§3/§4): a View or Bed Configuration in use on ANY
  // physical room — not just ones visible under the current filters — can't be
  // deleted. Excludes the room currently open in this drawer so re-saving the same
  // room with its own existing value never falsely blocks deletion of anything else.
  function roomsUsingView(v) { return PG.getState().physicalRooms.filter(function (r) { return r.view === v && r.id !== editingId; }).length; }
  function roomsUsingBed(v) {
    var st2 = PG.getState();
    var onRooms = st2.physicalRooms.filter(function (r) { return r.bedConfiguration === v && r.id !== editingId; }).length;
    var onTypes = st2.roomTypes.filter(function (rt2) { return rt2.bed === v; }).length;
    return onRooms + onTypes;
  }

  function buildRoomDrawer(room) {
    editingId = room ? room.id : null;
    var rtOptions = s.roomTypes.map(function (r) { return '<option value="' + r.id + '"' + (room && room.roomTypeId === r.id ? ' selected' : '') + '>' + PG.esc(r.name) + '</option>'; }).join('');
    var accHtml = ACCESSIBILITY_OPTIONS.map(function (a, i) {
      var checked = room && (room.accessibilityFeatures || []).indexOf(a) > -1 ? ' checked' : '';
      return '<div class="form-check"><input type="checkbox" class="acc-check" id="acc-' + i + '" value="' + a + '"' + checked + '><label class="form-label" style="margin:0;" for="acc-' + i + '">' + a + '</label></div>';
    }).join('');
    var otherRooms = s.physicalRooms.filter(function (r) { return !room || r.id !== room.id; });
    var connHtml = otherRooms.length ? otherRooms.map(function (r) {
      var checked = room && (room.connectingRoomIds || []).indexOf(r.id) > -1 ? ' checked' : '';
      return '<div class="form-check"><input type="checkbox" class="conn-check" id="conn-' + r.id + '" value="' + r.id + '"' + checked + '><label class="form-label" style="margin:0;" for="conn-' + r.id + '">' + PG.esc(r.roomNumber) + ' &middot; ' + PG.esc(rtName(r.roomTypeId)) + '</label></div>';
    }).join('') : '<span class="muted text-sm">No other rooms yet.</span>';

    bedConfigValue = room ? room.bedConfiguration : s.bedConfigs[0];
    viewValue = room ? room.view : (s.roomViews[0] || '');

    roomDrawer.innerHTML = '<div class="pg-drawer">' +
      '<div class="pg-drawer-header"><h3>' + (room ? 'Edit Physical Room' : 'Add Physical Room') + '</h3><button class="pg-modal-close" onclick="PG.closeModal(\'roomDrawer\')">&times;</button></div>' +
      '<div class="pg-drawer-body">' +
        '<div class="grid-2">' +
          '<div class="form-group"><label class="form-label">Room Number / Code <span class="opt">(required)</span></label><input class="form-control" id="rm-number" value="' + (room ? PG.esc(room.roomNumber) : '') + '"><div class="field-error" id="err-number"></div></div>' +
          '<div class="form-group"><label class="form-label">Room Type <span class="opt">(required)</span></label><select class="form-control" id="rm-type">' + rtOptions + '</select><div class="field-error" id="err-type"></div></div>' +
          '<div class="form-group"><label class="form-label">Building</label><input class="form-control" id="rm-building" value="' + (room ? PG.esc(room.building) : (s.hotel.name ? 'Main Building' : '')) + '"></div>' +
          '<div class="form-group"><label class="form-label">Floor</label><input type="number" class="form-control" id="rm-floor" value="' + (room ? room.floor : 1) + '"></div>' +
          '<div class="form-group"><label class="form-label">Bed Configuration</label><div id="rm-bed-container"></div></div>' +
          '<div class="form-group"><label class="form-label">View</label><div id="rm-view-container"></div></div>' +
          '<div class="form-group"><label class="form-label">Operational Status <span class="opt">(baseline, when not overridden by a live reservation or block)</span></label><select class="form-control" id="rm-opstatus">' +
            OPERATIONAL_STATUS_OPTIONS.map(function (st2) { return '<option value="' + st2 + '"' + (room && room.operationalStatus === st2 ? ' selected' : '') + '>' + st2 + '</option>'; }).join('') +
          '</select></div>' +
        '</div>' +
        '<div class="form-group"><label class="form-label">Accessibility Features</label><div class="checklist-box">' + accHtml + '</div></div>' +
        '<div class="form-group"><label class="form-label">Connecting Rooms</label><div class="checklist-box">' + connHtml + '</div></div>' +
        '<div class="form-group" id="rm-amenities-section"></div>' +
        '<div class="form-check"><input type="checkbox" id="rm-sellable"' + (!room || room.isSellable ? ' checked' : '') + '><label class="form-label" style="margin:0;" for="rm-sellable">Sellable</label></div>' +
        '<div class="form-check" style="margin-top:10px;"><input type="checkbox" id="rm-active"' + (!room || room.isActive ? ' checked' : '') + '><label class="form-label" style="margin:0;" for="rm-active">Active</label></div>' +
        '<div class="form-group" style="margin-top:16px;"><label class="form-label">Internal Notes <span class="opt">(optional)</span></label><textarea class="form-control" id="rm-notes">' + (room ? PG.esc(room.notes) : '') + '</textarea></div>' +
      '</div>' +
      '<div class="pg-drawer-footer"><button class="btn btn-light" onclick="PG.closeModal(\'roomDrawer\')">Cancel</button><button class="btn btn-primary" id="roomSave">' + (room ? 'Save Changes' : 'Add Room') + '</button></div>' +
    '</div>';
    PG.enhanceSelects(roomDrawer);
    PG.renderManagedSelect(document.getElementById('rm-bed-container'), {
      value: bedConfigValue,
      getList: function () { return PG.getState().bedConfigs; },
      setList: function (list) { var st = PG.getState(); st.bedConfigs = list; PG.setState(st); },
      onChange: function (v) { bedConfigValue = v; },
      placeholder: 'e.g. 2 Queen Beds',
      entityLabel: 'Bed Configuration',
      deleteButtonLabel: 'Configuration',
      isUsedCount: roomsUsingBed,
      addedMessage: 'Bed configuration added successfully.',
      deletedMessage: 'Bed configuration deleted successfully.',
      auditModule: 'Physical Rooms'
    });
    PG.renderManagedSelect(document.getElementById('rm-view-container'), {
      value: viewValue,
      getList: function () { return PG.getState().roomViews; },
      setList: function (list) { var st = PG.getState(); st.roomViews = list; PG.setState(st); },
      onChange: function (v) { viewValue = v; },
      placeholder: 'e.g. Sea View',
      entityLabel: 'View',
      isUsedCount: roomsUsingView,
      addedMessage: 'View added successfully.',
      deletedMessage: 'View deleted successfully.',
      auditModule: 'Physical Rooms'
    });
    // Amenities & Features (§5) — inherited amenities are read-only and follow
    // whichever Room Type is currently selected in the form (live, before Save);
    // room-specific extras are a separate catalog-backed multi-select that excludes
    // whatever is already guaranteed by that room type, so the same amenity is never
    // offered twice.
    featuresValue = room ? (room.features || []) : [];
    renderRoomAmenitiesSection();
    document.getElementById('rm-type').addEventListener('change', renderRoomAmenitiesSection);
    document.getElementById('roomSave').addEventListener('click', saveRoom);
  }

  var featuresValue = [];
  function renderRoomAmenitiesSection(){
    var st = PG.getState();
    var typeId = document.getElementById('rm-type').value;
    var type = st.roomTypes.find(function (r) { return r.id === typeId; });
    var inheritedIds = type ? (type.amenities || []) : [];
    // If the room type changed and a room-specific feature is now guaranteed by the
    // new type, drop it from the extras list rather than showing it in both places.
    featuresValue = featuresValue.filter(function (fid) { return inheritedIds.indexOf(fid) === -1; });
    var inherited = st.amenityCatalog.filter(function (a) { return a.active && inheritedIds.indexOf(a.id) > -1; });
    var extras = st.amenityCatalog.filter(function (a) { return a.active && featuresValue.indexOf(a.id) > -1; });
    var inheritedHtml = inherited.length
      ? inherited.map(function (a) { return '<span class="am-inherited-chip">' + PG.icon('lockClosed', 11) + PG.esc(a.name) + '</span>'; }).join('')
      : '<span class="text-sm muted">No guaranteed amenities on this room type yet.</span>';
    var extrasHtml = extras.length
      ? '<div class="am-section-chips">' + extras.map(function (a) { return '<span class="chip">' + PG.esc(a.name) + '</span>'; }).join('') + '</div>'
      : '<div class="text-sm muted">No room-specific features added.</div>';
    document.getElementById('rm-amenities-section').innerHTML =
      '<label class="form-label">Amenities &amp; Features</label>' +
      '<div class="text-sm muted" style="margin-bottom:6px;">Inherited from ' + (type ? PG.esc(type.name) : 'Room Type') + (type ? ' &middot; <a href="room-type-form.html?id=' + type.id + '&mode=view" target="_blank">View Room Type</a>' : '') + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">' + inheritedHtml + '</div>' +
      '<div class="help-note" style="margin-bottom:10px;">Use room-specific features only for differences that help staff assign the most suitable room.</div>' +
      extrasHtml +
      '<div class="am-section-actions">' +
        '<button type="button" class="btn btn-primary btn-sm" id="editFeaturesBtn">'+PG.icon('edit',13)+' Edit Room-Specific Features</button>' +
        '<button type="button" class="btn btn-outline btn-sm am-add-custom-btn" id="quickAddFeatureBtn">'+PG.icon('plus',13)+' Add Feature</button>' +
      '</div>';
    function openFeatureSelector(openCustom){
      PG.openAmenitySelector({
        scope: 'physicalRoom',
        title: 'Room-Specific Features',
        helperText: 'Use room-specific features only for differences that help staff assign the most suitable room.',
        selectedIds: featuresValue,
        excludeIds: inheritedIds,
        auditModule: 'Physical Rooms',
        openCustomFormOnInit: !!openCustom,
        onApply: function (newIds) { featuresValue = newIds; renderRoomAmenitiesSection(); }
      });
    }
    document.getElementById('editFeaturesBtn').addEventListener('click', function () { openFeatureSelector(false); });
    document.getElementById('quickAddFeatureBtn').addEventListener('click', function () { openFeatureSelector(true); });
  }

  function clearFieldErrors() {
    ['number', 'type'].forEach(function (k) {
      document.getElementById('err-' + k).textContent = '';
    });
    document.getElementById('rm-number').classList.remove('error');
  }

  function saveRoom() {
    clearFieldErrors();
    var st = PG.getState();
    var number = document.getElementById('rm-number').value.trim();
    var roomTypeId = document.getElementById('rm-type').value;
    var errors = {};
    if (!number) errors.number = 'Room number or code is required.';
    else {
      var dup = st.physicalRooms.some(function (pr) {
        return pr.propertyId === st.hotel.propertyCode && pr.roomNumber.toLowerCase() === number.toLowerCase() && pr.id !== editingId;
      });
      if (dup) errors.number = 'A room with this number already exists at this property.';
    }
    if (!roomTypeId) errors.type = 'Room type is required.';

    if (Object.keys(errors).length) {
      if (errors.number) { document.getElementById('err-number').textContent = errors.number; document.getElementById('rm-number').classList.add('error'); }
      if (errors.type) { document.getElementById('err-type').textContent = errors.type; }
      PG.toast('Please fix the highlighted fields.', 'danger');
      return;
    }

    var accessibility = Array.prototype.slice.call(document.querySelectorAll('.acc-check:checked')).map(function (c) { return c.value; });
    var connecting = Array.prototype.slice.call(document.querySelectorAll('.conn-check:checked')).map(function (c) { return c.value; });
    var data = {
      roomNumber: number,
      roomTypeId: roomTypeId,
      building: document.getElementById('rm-building').value.trim(),
      floor: parseInt(document.getElementById('rm-floor').value, 10) || 0,
      bedConfiguration: bedConfigValue,
      view: viewValue,
      operationalStatus: document.getElementById('rm-opstatus').value,
      accessibilityFeatures: accessibility,
      features: featuresValue,
      connectingRoomIds: connecting,
      notes: document.getElementById('rm-notes').value.trim(),
      isSellable: document.getElementById('rm-sellable').checked,
      isActive: document.getElementById('rm-active').checked
    };

    var roomId, previousConnIds, prevStatus = null;
    if (editingId) {
      var idx = st.physicalRooms.findIndex(function (pr) { return pr.id === editingId; });
      previousConnIds = st.physicalRooms[idx].connectingRoomIds || [];
      prevStatus = st.physicalRooms[idx].operationalStatus;
      st.physicalRooms[idx] = Object.assign({}, st.physicalRooms[idx], data);
      roomId = editingId;
    } else {
      roomId = 'room-' + Date.now();
      previousConnIds = [];
      st.physicalRooms.push(Object.assign({ id: roomId, propertyId: st.hotel.propertyCode }, data));
    }
    // Keep connecting-room links mutual.
    previousConnIds.filter(function (id) { return connecting.indexOf(id) === -1; }).forEach(function (otherId) {
      var other = st.physicalRooms.find(function (pr) { return pr.id === otherId; });
      if (other) other.connectingRoomIds = (other.connectingRoomIds || []).filter(function (id) { return id !== roomId; });
    });
    connecting.forEach(function (otherId) {
      var other = st.physicalRooms.find(function (pr) { return pr.id === otherId; });
      if (other && (other.connectingRoomIds || []).indexOf(roomId) === -1) other.connectingRoomIds = (other.connectingRoomIds || []).concat([roomId]);
    });

    PG.setState(st);
    PG.addAudit(editingId ? 'Physical Room Updated' : 'Physical Room Created', 'Room ' + number + ' (' + rtName(roomTypeId) + ') ' + (editingId ? 'updated.' : 'created.'), null,
      { module: 'Physical Rooms', recordId: roomId, previousValue: prevStatus, newValue: data.operationalStatus });
    PG.toast('Room ' + number + ' ' + (editingId ? 'updated.' : 'created.'), 'success');
    PG.closeModal('roomDrawer');
    renderAll();
  }

  function openRoomDrawer(id) {
    buildRoomDrawer(id ? roomById(id) : null);
    PG.openModal('roomDrawer');
  }
  var addRoomBtn = document.getElementById('addRoomBtn');

  detailsDrawer.id = 'detailsDrawer';
  document.body.appendChild(detailsDrawer);

  function roomAuditEntries(room) {
    return s.audit.filter(function (a) { return a.details && a.details.indexOf('Room ' + room.roomNumber) > -1; }).slice(0, 6);
  }

  function openDetailsDrawer(id) {
    s = PG.getState();
    var room = roomById(id);
    if (!room) return;
    var cn = PG.currentOrNextAssignment(s, room.id, PG.TODAY);
    var upcoming = PG.upcomingAssignmentsForRoom(s, room.id, PG.TODAY);
    var activeBlock = PG.physicalRoomBlockOn(s, room.id, PG.TODAY);

    function drow(label, value) { return '<div class="detail-row"><span class="muted">' + label + '</span><span class="v">' + value + '</span></div>'; }

    var body = '';
    body += '<div class="drawer-section-title">Room Identity &amp; Attributes</div>';

      drow('Building / Floor', PG.esc(room.building) + ' &middot; Floor ' + room.floor) + drow('Bed Configuration', PG.esc(room.bedConfiguration)) +
      drow('View', room.view ? PG.esc(room.view) : '<span class="muted">—</span>') +
      drow('Accessibility', room.accessibilityFeatures.length ? room.accessibilityFeatures.map(function (a) { return PG.esc(a); }).join(', ') : '<span class="muted">None</span>') +
      drow('Connecting Rooms', room.connectingRoomIds.length ? room.connectingRoomIds.map(function (id2) { var pr = roomById(id2); return pr ? PG.esc(pr.roomNumber) : id2; }).join(', ') : '<span class="muted">None</span>') +
      drow('Sellable', room.isSellable ? 'Yes' : 'No');
    if (room.notes) body += '<div class="form-group" style="margin-top:10px;"><div class="form-label">Notes</div><div class="text-sm">' + PG.esc(room.notes) + '</div></div>';

    body += '<div class="drawer-section-title">Current Status</div>';
    body += '<div style="margin-bottom:6px;">' + PG.roomStatusBadge(PG.roomStatusOn(s, room.id, PG.TODAY)) + '</div>';

    body += '<div class="drawer-section-title">Current / Next Reservation</div>';
    if (cn) {
      var res = s.reservations.find(function (x) { return x.id === cn.assignment.reservationId; });
      var cust = res ? s.customers.find(function (c) { return c.id === res.customerId; }) : null;
      body += drow(cn.when === 'current' ? 'Current' : 'Next', '<a href="reservation-detail.html?id=' + cn.assignment.reservationId + '">' + cn.assignment.reservationId + '</a>') +

        drow('Dates', PG.fmtDateShort(cn.assignment.arrivalDate) + ' &ndash; ' + PG.fmtDateShort(cn.assignment.departureDate)) +
        drow('Assignment Status', cn.assignment.assignmentStatus);
    } else {
      body += '<div class="text-sm muted">No current or upcoming reservation for this room.</div>';
    }

    body += '<div class="drawer-section-title">Active Room Block</div>';
    if (activeBlock) {
      body += drow('Type', activeBlock.type) + drow('Dates', PG.fmtDateShort(activeBlock.startDate) + ' &ndash; ' + PG.fmtDateShort(PG.addDays(activeBlock.endDate, -1))) +
        drow('Reason', PG.esc(activeBlock.reason)) + (activeBlock.notes ? drow('Notes', PG.esc(activeBlock.notes)) : '');
    } else {
      body += '<div class="text-sm muted">No active room block.</div>';
    }

    body += '<div class="drawer-section-title">Upcoming Reservations</div>';
    if (upcoming.length) {
      body += upcoming.map(function (a) {
        var res2 = s.reservations.find(function (x) { return x.id === a.reservationId; });
        var cust2 = res2 ? s.customers.find(function (c) { return c.id === res2.customerId; }) : null;
        return '<div class="detail-row"><span><a href="reservation-detail.html?id=' + a.reservationId + '">' + a.reservationId + '</a>' + (cust2 ? ' &middot; ' + PG.esc(cust2.name) : '') + '</span>' +
          '<span class="v">' + PG.fmtDateShort(a.arrivalDate) + '&ndash;' + PG.fmtDateShort(a.departureDate) + (a.assignmentStatus === 'Held' ? ' (Held)' : '') + '</span></div>';
      }).join('');
    } else {
      body += '<div class="text-sm muted">No upcoming reservations booked into this room.</div>';
    }

    body += '<div class="drawer-section-title">Recent Activity</div>';
    var entries = roomAuditEntries(room);
    if (entries.length) {
      body += '<div class="timeline" style="padding-left:18px;position:relative;">' + entries.map(function (a) {
        return '<div style="padding-bottom:12px;font-size:12.5px;"><div class="muted text-sm">' + PG.fmtDateShort(a.ts.slice(0, 10)) + ' &middot; ' + a.ts.slice(11) + '</div><div>' + PG.esc(a.details) + '</div></div>';
      }).join('') + '</div>';
    } else {
      body += '<div class="text-sm muted">No recorded activity yet for this room.</div>';
    }

    detailsDrawer.innerHTML = '<div class="pg-drawer">' +
      '<div class="pg-drawer-header"><h3>Room ' + PG.esc(room.roomNumber) + '</h3><button class="pg-modal-close" onclick="PG.closeModal(\'detailsDrawer\')">&times;</button></div>' +
      '<div class="pg-drawer-body">' + body + '</div>' +
      '<div class="pg-drawer-footer" style="flex-direction:column;align-items:stretch;gap:8px;">' +
        '<div style="display:flex;gap:8px;">' +
          '<a class="btn btn-primary" style="flex:1;text-align:center;" href="new-reservation.html?rt=' + room.roomTypeId + '&room=' + room.id + '&date=' + PG.TODAY + '">Create Reservation</a>' +
          (CAN_MANAGE ? '<button class="btn btn-light" style="flex:1;" id="detailsEditBtn">Edit</button>' : '') +
          (CAN_BLOCK ? '<button class="btn btn-danger-outline" style="flex:1;" id="detailsBlockBtn">Block Room</button>' : '') +
        '</div>' +
        (CAN_VIEW_CALENDAR ? '<a class="btn btn-outline" style="text-align:center;" href="operations-calendar.html?room=' + room.id + '">View on Operations Calendar</a>' : '') +
        '<div class="text-sm muted">Physical rooms can\'t be deleted once they have reservation, assignment, block, or audit history — deactivate a room instead to retire it from service.</div>' +
      '</div>' +

    var detailsEditBtn = document.getElementById('detailsEditBtn');

    var detailsBlockBtn = document.getElementById('detailsBlockBtn');
    if (detailsBlockBtn) detailsBlockBtn.addEventListener('click', function () { PG.closeModal('detailsDrawer'); openBlockModal(room.id); });
    PG.openModal('detailsDrawer');
  }

  /* ================================================================ */
  /* Block Room — opens the shared PG.renderBlockRoomModal (the same modal    */
  /* Operations Calendar uses), so both surfaces run one implementation of    */
  /* the conflict-check/confirm/audit rules instead of two.                  */
  /* ================================================================ */
  // Still used by the Deactivate-blocked flow below, which has its own
  // "Change Room" resolution buttons independent of the Block Room modal.
  function openChangeRoomForConflict(assignmentId, onDone) {
    var st = PG.getState();
    var a = st.roomAssignments.find(function (x) { return x.id === assignmentId; });
    var res = st.reservations.find(function (r) { return r.id === a.reservationId; });
    var item = res.rooms.find(function (x) { return x.id === a.reservationItemId; });
    var cust = st.customers.find(function (c) { return c.id === res.customerId; });
    var otherRoomIds = [];
    res.rooms.forEach(function (it) {
      if (it.id === item.id) return;
      st.roomAssignments.filter(function (x) { return x.reservationItemId === it.id && x.assignmentStatus !== 'Cancelled'; }).forEach(function (x) { otherRoomIds.push(x.physicalRoomId); });
    });
    PG.renderChangeRoomDrawer({
      roomTypeId: item.roomTypeId, checkIn: a.arrivalDate, checkOut: a.departureDate,
      preferences: {}, currentRoomId: a.physicalRoomId, excludeRoomIds: otherRoomIds, excludeAssignmentId: a.id,
      title: 'Change Room', summaryLabel: res.id + ' &middot; ' + (cust ? cust.name : 'Guest'),
      summarySub: PG.fmtDateShort(a.arrivalDate) + ' – ' + PG.fmtDateShort(a.departureDate),
      onConfirm: function (newRoomId) {
        try {
          var st2 = PG.getState();
          var newRoom = st2.physicalRooms.find(function (p) { return p.id === newRoomId; });
          if (!newRoom || !PG.roomEligibleForStay(st2, newRoom, a.arrivalDate, a.departureDate, a.id)) {
            PG.toast('That room is no longer available — the previous assignment has been kept.', 'danger');
            return;
          }
          var oldRoom = st2.physicalRooms.find(function (p) { return p.id === a.physicalRoomId; });
          var rec = st2.roomAssignments.find(function (x) { return x.id === assignmentId; });
          rec.physicalRoomId = newRoomId; rec.assignedAt = PG.nowIso(); rec.assignedBy = 'Hotel Admin';
          var idx = st2.reservations.findIndex(function (r) { return r.id === res.id; });
          st2.reservations[idx].activity.push({ ts: PG.nowIso(), text: 'Room changed from ' + (oldRoom ? oldRoom.roomNumber : '—') + ' to ' + newRoom.roomNumber + ' while resolving a deactivation conflict.' });
          PG.setState(st2);
          PG.addAudit('Room Assignment Changed', res.id + ' — room changed from ' + (oldRoom ? oldRoom.roomNumber : '—') + ' to ' + newRoom.roomNumber + ' (resolving a deactivation conflict).');
          PG.toast('Room ' + newRoom.roomNumber + ' assigned.', 'success');
          s = PG.getState();
          if (onDone) onDone();
        } catch (e) {
          PG.toast('Failed to save changes — the previous room assignment has been kept.', 'danger');
        }
      }
    });
  }
  function openBlockModal(id) {
    s = PG.getState();
    currentRoom = roomById(id);
    if (!currentRoom) return;
    PG.renderBlockRoomModal({
      physicalRoomId: currentRoom.id,
      defaultStart: PG.TODAY,
      defaultEnd: PG.TODAY,
      onSaved: function () { renderAll(); }

  /* ================================================================ */

  var deactivateBlockedModal = document.createElement('div');
  deactivateBlockedModal.className = 'pg-modal-overlay';
  deactivateBlockedModal.id = 'deactivateBlockedModal';
  document.body.appendChild(deactivateBlockedModal);
  function openDeactivateBlockedModal(room, activeAssignments) {
    function renderRows() {
      var st = PG.getState();
      var live = st.roomAssignments.filter(function (a) { return a.physicalRoomId === room.id && a.assignmentStatus !== 'Cancelled' && a.departureDate > PG.TODAY; });
      if (!live.length) { PG.closeModal('deactivateBlockedModal'); toggleActive(room.id); return; }
      var rows = live.map(function (a) {
        var res = st.reservations.find(function (r) { return r.id === a.reservationId; });
        var cust = res ? st.customers.find(function (c) { return c.id === res.customerId; }) : null;
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:12.5px;gap:8px;">' +
          '<span><a href="reservation-detail.html?id=' + a.reservationId + '" target="_blank">' + a.reservationId + '</a>' + (cust ? ' &middot; ' + PG.esc(cust.name) : '') +
            '<div class="muted text-sm">' + PG.fmtDateShort(a.arrivalDate) + '&ndash;' + PG.fmtDateShort(a.departureDate) + (a.assignmentStatus === 'Held' ? ' &middot; Held' : '') + '</div></span>' +
          '<button type="button" class="btn btn-outline btn-sm deactivate-conflict-change" data-assignment="' + a.id + '">Change Room</button>' +
        '</div>';
      }).join('');
      deactivateBlockedModal.innerHTML = '<div class="pg-modal">' +
        '<div class="pg-modal-header"><h3>Can\'t Deactivate Room ' + PG.esc(room.roomNumber) + '</h3><button class="pg-modal-close" onclick="PG.closeModal(\'deactivateBlockedModal\')">&times;</button></div>' +
        '<div class="pg-modal-body">' +
          '<div class="help-note help-note-danger" style="margin-bottom:14px;flex-direction:column;align-items:stretch;">' +
            '<div style="font-weight:700;margin-bottom:6px;">This room has ' + live.length + ' active reservation' + (live.length === 1 ? '' : 's') + ' or hold' + (live.length === 1 ? '' : 's') + '.</div>' +
            rows +
            '<div style="margin-top:8px;">Reassign every affected reservation before this room can be deactivated.</div>' +
          '</div>' +
        '</div>' +
        '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'deactivateBlockedModal\')">Close</button></div>' +
      '</div>';
      deactivateBlockedModal.querySelectorAll('.deactivate-conflict-change').forEach(function (btn) {
        btn.addEventListener('click', function () { openChangeRoomForConflict(btn.dataset.assignment, renderRows); });
      });
    }
    renderRows();
    PG.openModal('deactivateBlockedModal');
  }
  function toggleActive(id) {
    var st = PG.getState();
    var room = st.physicalRooms.find(function (pr) { return pr.id === id; });
    if (!room) return;
    if (room.isActive) {
      // A room can't be deactivated out from under an active reservation or temporary
      // hold — staff must reassign those first, the same rule that governs Block Room.
      var activeAssignments = st.roomAssignments.filter(function (a) { return a.physicalRoomId === id && a.assignmentStatus !== 'Cancelled' && a.departureDate > PG.TODAY; });
      if (activeAssignments.length) { openDeactivateBlockedModal(room, activeAssignments); return; }
      if (!confirm('Deactivate Room ' + room.roomNumber + '? It will no longer be assignable to reservations.\n\nPhysical rooms with reservation, assignment, block, or audit history can\'t be deleted — deactivating is the supported way to retire a room from service.')) return;
      room.isActive = false;
      room.isSellable = false;
    } else {
      if (!confirm('Activate Room ' + room.roomNumber + '? It will become assignable to reservations again.')) return;
      room.isActive = true;
      room.isSellable = true;
    }
    PG.setState(st);
    PG.addAudit(room.isActive ? 'Physical Room Activated' : 'Physical Room Deactivated', 'Room ' + room.roomNumber + ' ' + (room.isActive ? 'activated.' : 'deactivated.'));
    PG.toast('Room ' + room.roomNumber + ' ' + (room.isActive ? 'activated.' : 'deactivated.'), room.isActive ? 'success' : 'warn');
    renderAll();
  }
}

if (!CAN_VIEW) {
  page.innerHTML = '<div class="pg-page-head"><div><h1>Physical Rooms</h1></div></div>' +
    '<div class="card"><div class="card-body"><div class="empty-state"><div class="ic">' + PG.icon('lock',30) + '</div>' +
    'You don\'t have permission to view Physical Rooms.<br>Contact a Hotel Admin to request access.</div></div></div>';
} else {
  init();
  PG.mountHotelAssistant('Physical Rooms');
}
</script>
