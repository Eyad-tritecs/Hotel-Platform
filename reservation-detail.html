<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation Detail — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .timeline{position:relative;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--pg-gray-200);}
  .t-item{position:relative;padding-bottom:18px;}
  .t-item:last-child{padding-bottom:0;}
  .t-item::before{content:"";position:absolute;left:-22px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--pg-primary);border:2px solid #fff;box-shadow:0 0 0 1px var(--pg-primary);}
  .t-item .t-time{font-size:11px;color:var(--pg-gray-500);}
  .t-item .t-text{font-size:12.8px;color:var(--pg-gray-800);margin-top:2px;}
  .section-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pg-gray-200);color:var(--pg-gray-700);font-size:11px;font-weight:700;margin-right:8px;}
  .more-wrap{position:relative;display:inline-block;}
  .more-menu{position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--pg-border);border-radius:8px;box-shadow:var(--pg-shadow);min-width:190px;z-index:30;display:none;overflow:hidden;}
  .more-menu.show{display:block;}
  .more-menu a, .more-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12.5px;color:var(--pg-gray-800);background:none;border:none;cursor:pointer;}
  .more-menu a:hover, .more-menu button:hover{background:var(--pg-gray-100);}
  .room-item-card{border:1px solid var(--pg-border);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:var(--pg-gray-100);}
  .room-item-card .ri-top{display:flex;justify-content:space-between;align-items:center;}
  .room-item-card h4{font-size:13.5px;}
  .room-item-card .ri-meta{font-size:12px;color:var(--pg-gray-600);margin-top:4px;}
  .room-item-card .ri-total{font-weight:700;font-size:14px;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("reservations", ["Reservations", "Reservation Detail"]);
var s = PG.getState();
var id = new URLSearchParams(location.search).get('id');
var r = s.reservations.find(function(x){return x.id===id;});

if (!r){
  page.innerHTML = '<div class="empty-state"><div class="ic">&#10060;</div>Reservation "'+PG.esc(id||'')+'" was not found.<br><br><a class="btn btn-primary" href="reservations.html">Back to Reservations</a></div>';
} else {
  render();
}

function cust(){ return s.customers.find(function(c){return c.id===r.customerId;}); }
function nights(){ return PG.dateRange(r.checkIn, r.checkOut); }
function ratePlanNameFor(room){
  if (room.ratePlanName) return room.ratePlanName;
  var plans = s.ratePlans.filter(function(p){ return p.roomTypeId===room.roomTypeId && p.active; });
  return plans.length ? plans[0].name : 'Standard Rate';
}
function lines(){
  var n = nights();
  return r.rooms.map(function(room){
    var rt = s.roomTypes.find(function(x){return x.id===room.roomTypeId;});
    var subtotal = 0;
    n.forEach(function(d){ subtotal += PG.rateFor(s, room.roomTypeId, d) * room.qty; });
    return {name: rt.name, qty: room.qty, nights: n.length, subtotal: subtotal, ratePlan: ratePlanNameFor(room)};
  });
}
function roomCharges(){ return lines().reduce(function(a,l){return a+l.subtotal;},0); }
function taxAmount(){ return r.taxAmount != null ? r.taxAmount : Math.round(roomCharges()*0.04*100)/100; }
function feeAmount(){ return r.feeAmount != null ? r.feeAmount : (r.rooms.length ? 20 : 0); }
function total(){ return roomCharges() + taxAmount() + feeAmount(); }

function render(){
  var c = cust();
  var canCancel = r.status!=='Cancelled' && r.status!=='Completed';
  var html = '';

  html += '<div class="pg-page-head"><div><h1>'+r.id+' <span style="font-size:14px;display:inline-flex;gap:6px;">'+PG.statusBadge(r.status)+PG.payBadge(r.paymentStatus)+'</span></h1>' +
    '<div class="sub">Created '+PG.fmtDate(r.createdAt.slice(0,10))+' via '+r.source+'</div></div>' +
    '<div class="pg-actions">' +
      (canCancel ? '<button class="btn btn-danger-outline" id="cancelBtn">Cancel Reservation</button>' : '') +
      '<div class="more-wrap">' +
        '<button class="btn btn-outline" id="moreBtn">More &#9662;</button>' +
        '<div class="more-menu" id="moreMenu">' +
          '<a href="availability-inventory.html">View Inventory</a>' +
          '<a href="reservations.html">Back to Reservations</a>' +
          '<button id="printStub">Print Summary</button>' +
        '</div>' +
      '</div>' +
    '</div></div>';

  html += '<div class="row"><div class="col" style="flex:2;">';

  // Section 1 — Reservation Summary
  html += sectionCard(1, 'Reservation Summary', '<div class="grid-3">' +
    field('Reservation ID', r.id) + field('Reservation Source', r.source) + field('Created Date', PG.fmtDate(r.createdAt.slice(0,10))) +
    field('Arrival', PG.fmtDate(r.checkIn)) + field('Departure', PG.fmtDate(r.checkOut)) + field('Nights', nights().length) +
    field('Status', PG.statusBadge(r.status)) +
  '</div>');

  // Section 2 — Guest
  html += sectionCard(2, 'Guest', '<div class="grid-3">' +
    field('Name', c.name) + field('Mobile', c.phone) + field('Email', c.email) +
  '</div>' + (r.notes ? '<div class="form-group" style="margin-top:6px;"><div class="form-label">Notes</div><div class="text-sm">'+PG.esc(r.notes)+'</div></div>' : ''));

  // Section 3 — Room Items
  html += sectionCard(3, 'Room Items', lines().map(function(l){
    return '<div class="room-item-card"><div class="ri-top"><h4>'+l.qty+'× '+l.name+'</h4><span class="ri-total">'+PG.fmtMoney(l.subtotal)+'</span></div>' +
      '<div class="ri-meta">'+l.ratePlan+' &middot; '+PG.fmtDateShort(r.checkIn)+'&ndash;'+PG.fmtDateShort(r.checkOut)+' &middot; '+l.nights+' night'+(l.nights===1?'':'s')+'</div></div>';
  }).join(''));

  // Section 4 — Pricing
  html += sectionCard(4, 'Pricing', prow('Room Charges', PG.fmtMoney(roomCharges())) + prow('Taxes', PG.fmtMoney(taxAmount())) + prow('Fees', PG.fmtMoney(feeAmount())) +
    '<div class="divider"></div><div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;"><span>Total</span><span>'+PG.fmtMoney(total())+'</span></div>');

  // Section 6 — Activity / Audit
  html += sectionCard(6, 'Activity / Audit', '<div class="timeline">' +
    r.activity.slice().reverse().map(function(a){ return '<div class="t-item"><div class="t-time">'+PG.fmtDate(a.ts.slice(0,10),{month:'short',day:'numeric'})+' &middot; '+a.ts.slice(11)+'</div><div class="t-text">'+PG.esc(a.text)+'</div></div>'; }).join('') +
  '</div>');

  html += '</div>';

  // Right column — Section 5: Payment
  html += '<div class="col">';
  html += sectionCard(5, 'Payment',
    field('Method', r.paymentMethod) +
    '<div class="form-group"><div class="form-label">Status</div>'+PG.payBadge(r.paymentStatus)+'</div>' +
    (r.paymentLinkUrl ? field('Payment Link', '<a href="#" onclick="return false;" style="word-break:break-all;">'+r.paymentLinkUrl+'</a>') : '') +
    (r.paymentLinkGeneratedAt ? field('Generated At', PG.fmtDate(r.paymentLinkGeneratedAt.slice(0,10)) + ' ' + r.paymentLinkGeneratedAt.slice(11)) : '') +
    (r.paymentLinkExpiresAt && r.paymentStatus==='Link Sent' ? field('Expires At', PG.fmtDate(r.paymentLinkExpiresAt.slice(0,10)) + ' ' + r.paymentLinkExpiresAt.slice(11)) : '') +
    (r.transactionRef ? field('Transaction', r.transactionRef) : '') +
    (r.paymentStatus==='Paid' ? field('Paid Amount', PG.fmtMoney(total())) : '') +
    (r.paymentPaidAt ? field('Paid At', PG.fmtDate(r.paymentPaidAt.slice(0,10)) + ' ' + r.paymentPaidAt.slice(11)) : '') +
    (r.paymentStatus==='Pay on Arrival' ? field('Payment Amount', PG.fmtMoney(total())) + field('Outstanding', PG.fmtMoney(total())) : '') +
    '<div class="divider"></div>' +
    '<div id="paymentActions" style="display:flex;flex-direction:column;gap:8px;"></div>'
  );

  html += '</div></div>';

  page.innerHTML = html;
  renderPaymentActions();

  if (canCancel) document.getElementById('cancelBtn').addEventListener('click', openCancelConfirm);
  document.getElementById('moreBtn').addEventListener('click', function(e){ e.stopPropagation(); document.getElementById('moreMenu').classList.toggle('show'); });
  document.addEventListener('click', function(){ var m=document.getElementById('moreMenu'); if(m) m.classList.remove('show'); });
  document.getElementById('printStub').addEventListener('click', function(){ PG.toast('Printing / export is outside this MVP prototype.', 'warn'); });
}

function sectionCard(num, title, bodyHtml){
  return '<div class="card"><div class="card-header"><h3><span class="section-num">'+num+'</span>'+title+'</h3></div><div class="card-body">'+bodyHtml+'</div></div>';
}
function prow(l,v){ return '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;"><span class="muted">'+l+'</span><span style="font-weight:600;">'+v+'</span></div>'; }

function field(label, value){
  return '<div class="form-group"><div class="form-label">'+label+'</div><div style="font-size:13px;font-weight:500;">'+value+'</div></div>';
}

function renderPaymentActions(){
  var box = document.getElementById('paymentActions');
  var html = '';
  if (r.status==='Cancelled'){
    if (r.paymentStatus==='Paid' || r.paymentStatus==='Refund Pending'){
      if (r.paymentStatus==='Refund Pending'){
        html += '<button class="btn btn-outline btn-block" id="markRefunded">Mark as Refunded</button>';
      } else {
        html += '<div class="text-sm muted">Payment already settled prior to cancellation.</div>';
      }
    } else {
      html += '<div class="text-sm muted">No further payment action needed.</div>';
    }
  } else if (r.paymentMethod==='Payment Link'){
    if (r.paymentStatus==='Payment Required'){
      html += '<button class="btn btn-primary btn-block" id="genLinkBtn">Generate Payment Link</button>';
    } else if (r.paymentStatus==='Link Sent'){
      html += '<div class="form-group"><div class="form-label">Payment Link</div>' +
        '<div style="display:flex;gap:6px;"><input class="form-control" id="linkUrlBox" value="'+r.paymentLinkUrl+'" readonly style="font-size:12px;">' +
        '<button class="btn btn-outline btn-sm" id="copyLinkBtn" title="Copy Link">Copy</button></div></div>';
      html += '<div style="display:flex;gap:8px;"><button class="btn btn-outline btn-sm" style="flex:1;" id="sendLinkBtn">Send</button><button class="btn btn-outline btn-sm" style="flex:1;" id="resendLinkBtn">Resend</button></div>';
      html += '<div class="divider"></div>';
      html += '<div class="help-note" style="margin-bottom:4px;">Prototype actions — simulate the guest\'s payment outcome.</div>';
      html += '<button class="btn btn-success btn-block" id="markPaid">Simulate Payment Success</button>';
      html += '<button class="btn btn-outline btn-block" id="markFailed">Simulate: Payment Failed</button>';
      html += '<button class="btn btn-light btn-block" id="markExpired">Simulate: Link Expired</button>';
    } else if (r.paymentStatus==='Failed' || r.paymentStatus==='Expired'){
      html += '<div class="text-sm muted" style="margin-bottom:8px;">Payment '+r.paymentStatus.toLowerCase()+'. Generate a new link to retry.</div>';
      html += '<button class="btn btn-primary btn-block" id="genLinkBtn">Generate New Payment Link</button>';
    } else if (r.paymentStatus==='Paid'){
      html += '<div class="text-sm muted">Payment complete. No further action needed.</div>';
    }
  } else {
    html += '<div class="text-sm muted" style="margin-bottom:10px;">Guest will pay on arrival at check-in.</div>';
    html += '<div class="help-note">Payment will be collected offline by the hotel. Cash collection, folio and accounting settlement are outside the Initial MVP.</div>';
  }
  box.innerHTML = html;

  var b;
  if (b=document.getElementById('genLinkBtn')) b.addEventListener('click', openGenLinkModal);
  if (b=document.getElementById('copyLinkBtn')) b.addEventListener('click', function(){
    var input = document.getElementById('linkUrlBox');
    input.select();
    if (navigator.clipboard) navigator.clipboard.writeText(input.value).catch(function(){});
    else document.execCommand('copy');
    PG.toast('Payment link copied to clipboard.', 'success');
  });
  if (b=document.getElementById('sendLinkBtn')) b.addEventListener('click', function(){ r.activity.push({ts:PG.nowIso(), text:'Payment link sent to guest.'}); save('Payment Link Sent', r.id + ' — payment link sent to guest.'); });
  if (b=document.getElementById('resendLinkBtn')) b.addEventListener('click', function(){ r.paymentLinkExpiresAt = PG.nowIso(); r.activity.push({ts:PG.nowIso(), text:'Payment link resent to guest.'}); save('Payment Link Resent', r.id + ' — payment link resent.'); });
  if (b=document.getElementById('markPaid')) b.addEventListener('click', function(){
    r.paymentPaidAt = PG.nowIso();
    r.transactionRef = 'PAY-' + new Date().getFullYear() + '-' + Math.floor(10000 + Math.random()*89999);
    transition('Paid', 'Confirmed', 'Payment successful — Transaction Ref: ' + r.transactionRef + '.');
    r.activity.push({ts: PG.nowIso(), text: 'Reservation confirmed.'});
    save('Payment Received', 'Payment confirmed for ' + r.id + ' — Transaction Ref: ' + r.transactionRef + '.');
  });
  if (b=document.getElementById('markFailed')) b.addEventListener('click', function(){ transition('Failed', r.status, 'Payment attempt failed.'); save('Payment Failed', 'Payment attempt failed for ' + r.id + '.'); });
  if (b=document.getElementById('markExpired')) b.addEventListener('click', function(){ transition('Expired', r.status, 'Payment link expired without payment.'); save('Payment Link Expired', 'Payment link expired for ' + r.id + '.'); });
  if (b=document.getElementById('markRefunded')) b.addEventListener('click', function(){ transition('Refunded', r.status, 'Refund completed for cancelled reservation.'); save('Refund Completed', 'Refund completed for ' + r.id + '.'); });
}

// Generate Payment Link modal
if (r && r.paymentMethod==='Payment Link'){
  var linkModal = document.createElement('div');
  linkModal.className = 'pg-modal-overlay';
  linkModal.id = 'genLinkModal';
  linkModal.innerHTML = '<div class="pg-modal">' +
    '<div class="pg-modal-header"><h3>Generate Payment Link</h3><button class="pg-modal-close" onclick="PG.closeModal(\'genLinkModal\')">&times;</button></div>' +
    '<div class="pg-modal-body">' +
      '<div class="grid-2">' +
        '<div class="form-group"><label class="form-label">Reservation ID</label><input class="form-control" value="'+r.id+'" disabled></div>' +
        '<div class="form-group"><label class="form-label">Guest</label><input class="form-control" value="'+PG.esc(cust().name)+'" disabled></div>' +
        '<div class="form-group"><label class="form-label">Amount</label><input class="form-control" value="'+total().toFixed(2)+'" disabled></div>' +
        '<div class="form-group"><label class="form-label">Currency</label><input class="form-control" value="'+s.hotel.currency+'" disabled></div>' +
        '<div class="form-group"><label class="form-label">Expiry</label><select class="form-control" id="link-expiry"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72">72 hours</option></select></div>' +
      '</div>' +
      '<div class="form-check" style="margin-top:6px;"><input type="checkbox" id="send-email" checked><label class="form-label" style="margin:0;" for="send-email">Send via Email</label></div>' +
      '<div class="form-check" style="margin-top:10px;"><input type="checkbox" id="send-sms"><label class="form-label" style="margin:0;" for="send-sms">Send via SMS <span class="opt">(optional)</span></label></div>' +
    '</div>' +
    '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'genLinkModal\')">Cancel</button><button class="btn btn-primary" id="genLinkSave">Generate Link</button></div>' +
  '</div>';
  document.body.appendChild(linkModal);

  document.getElementById('genLinkSave').addEventListener('click', function(){
    var hours = parseInt(document.getElementById('link-expiry').value, 10);
    var viaEmail = document.getElementById('send-email').checked;
    var viaSms = document.getElementById('send-sms').checked;
    r.paymentLinkUrl = 'https://pay.example.com/' + r.id;
    r.paymentLinkGeneratedAt = PG.nowIso();
    var expiryDate = new Date(PG.nowIso() + ':00Z');
    expiryDate.setUTCHours(expiryDate.getUTCHours() + hours);
    r.paymentLinkExpiresAt = expiryDate.toISOString().slice(0,16);
    r.paymentStatus = 'Link Sent';
    r.status = 'Pending Payment';
    r.activity.push({ts: PG.nowIso(), text: 'Payment Link generated.'});
    var via = [];
    if (viaEmail) via.push('Email');
    if (viaSms) via.push('SMS');
    r.activity.push({ts: PG.nowIso(), text: 'Payment Link sent' + (via.length ? ' via ' + via.join(' & ') : '') + '.'});
    PG.closeModal('genLinkModal');
    save('Payment Link Sent', r.id + ' — payment link generated and sent' + (via.length ? ' via ' + via.join(' & ') : '') + '.');
  });
}
function openGenLinkModal(){ PG.openModal('genLinkModal'); }

function transition(paymentStatus, status, note){
  r.paymentStatus = paymentStatus;
  r.status = status;
  r.activity.push({ts: PG.nowIso(), text: note});
}
function save(auditAction, auditDetails){
  var st = PG.getState();
  var idx = st.reservations.findIndex(function(x){return x.id===r.id;});
  st.reservations[idx] = r;
  PG.setState(st);
  PG.addAudit(auditAction, auditDetails);
  PG.toast(auditDetails, 'success');
  setTimeout(function(){ location.reload(); }, 500);
}

function openCancelConfirm(){
  if (!confirm('Cancel reservation ' + r.id + '? This will release all reserved rooms back into inventory' + (r.paymentStatus==='Paid' ? ' and mark the payment as Refund Pending.' : '.'))) return;
  r.status = 'Cancelled';
  var refundNote = '';
  if (r.paymentStatus==='Paid'){
    r.paymentStatus = 'Refund Pending';
    refundNote = ' Payment marked Refund Pending.';
  }
  r.activity.push({ts: PG.nowIso(), text: 'Reservation cancelled by Hotel Admin. Inventory released.' + refundNote});
  var st = PG.getState();
  var idx = st.reservations.findIndex(function(x){return x.id===r.id;});
  st.reservations[idx] = r;
  PG.setState(st);
  PG.addAudit('Reservation Cancelled', r.id + ' cancelled — inventory restored for ' + lines().map(function(l){return l.qty+'× '+l.name;}).join(', ') + '.' + refundNote);
  PG.toast('Reservation ' + r.id + ' cancelled. Inventory restored.', 'warn');
  setTimeout(function(){ location.reload(); }, 600);
}
</script>
</body>
</html>
