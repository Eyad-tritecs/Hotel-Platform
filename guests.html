<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guests — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  @media (max-width:1300px){.col-nat{display:none;}}
  .field-error{color:var(--pg-danger);font-size:11.5px;margin-top:5px;}
  .form-control.error{border-color:var(--pg-danger);}
  .skeleton-bar{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--pg-gray-200) 25%,var(--pg-gray-100) 37%,var(--pg-gray-200) 63%);background-size:400% 100%;animation:pg-skel-g 1.4s ease infinite;}
  @keyframes pg-skel-g{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  /* .more-wrap / .more-btn / .more-menu now live in style.css (PG.wireMoreMenus) so
     every table row menu in the app is literally the same component. */
  .dup-match{border:1px solid var(--pg-border);border-radius:8px;padding:10px 12px;margin-top:10px;background:#fff;}
  .note-link{cursor:pointer;background:none;border:none;padding:0;font-size:14px;}
  .notes-modal-text{white-space:pre-wrap;font-size:13px;line-height:1.6;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("guests", ["Guests", "Guests"]);
var s = PG.getState();
// Same dead-code-today role gate used by physical-rooms.html / operations-calendar.html.
var CAN_VIEW = PG.hasPermission('view_guests');
var CAN_MANAGE = PG.hasPermission('manage_guests'); // create / edit / delete

var LANGUAGES = ['Arabic', 'English', 'Other'];

function init() {
  var filters = { q: '', upcoming: 'all', past: 'all', important: 'all', language: 'all', stayFrom: '', stayTo: '' };

  function guestReservations(custId) { return s.reservations.filter(function (r) { return r.customerId === custId; }); }
  function upcomingFor(custId) {
    return guestReservations(custId).filter(function (r) { return r.status !== 'Cancelled' && r.checkIn >= PG.TODAY; })
      .sort(function (a, b) { return a.checkIn < b.checkIn ? -1 : 1; })[0] || null;
  }
  function lastStayFor(custId) {
    return guestReservations(custId).filter(function (r) { return r.status !== 'Cancelled' && r.checkOut <= PG.TODAY; })
      .sort(function (a, b) { return a.checkOut > b.checkOut ? -1 : 1; })[0] || null;
  }

  var html = '';
  html += '<div class="pg-page-head"><div><h1>Guests</h1><div class="sub" id="guestCountSub"></div></div>' +
    '<div class="pg-actions">' + (CAN_MANAGE ? '<button class="btn btn-primary" id="addGuestBtn">+ Add Guest</button>' : '') + '</div></div>';

  // Search-first toolbar: search, then the two filters staff reach for constantly as
  // chips (Upcoming Reservation, Important/VIP). Language and the stay-date range are
  // lower-frequency, so they live in an Advanced Filters drawer and report back as
  // removable applied chips — the same pattern established on Physical Rooms.
  html += '<div class="card"><div class="card-body" style="display:flex;flex-direction:column;gap:14px;">' +
    '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">' +
      '<div class="pg-searchwrap" style="flex:1 1 260px;min-width:220px;"><span class="ic">' + PG.icon('search',15) + '</span>' +
        '<input class="form-control" id="searchBox" type="search" placeholder="Search by name, phone, email, or ID reference" aria-label="Search guests"></div>' +
      '<button class="btn btn-outline btn-sm" id="advFiltersBtn">' + PG.icon('filter',15) + ' More Filters<span id="advCount"></span></button>' +
    '</div>' +
    '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">' +
      '<span class="text-sm muted" style="font-weight:600;">Upcoming reservation</span>' +
      PG.filterChips('gUpcoming', [{value:'all',label:'All'},{value:'yes',label:'Yes'},{value:'no',label:'No'}], 'all', {ariaLabel:'Filter by upcoming reservation'}) +
    '</div>' +
    '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">' +
      '<span class="text-sm muted" style="font-weight:600;">Important / VIP</span>' +
      PG.filterChips('gImportant', [{value:'all',label:'All'},{value:'yes',label:'Important only'},{value:'no',label:'Not flagged'}], 'all', {ariaLabel:'Filter by important/VIP flag'}) +
    '</div>' +
    '<div id="gApplied" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"></div>' +
    '<div style="display:flex;justify-content:flex-end;">' +
      '<span class="muted text-sm" id="resultCount"></span>' +
    '</div>' +
  '</div></div>';

  html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
    '<th>Guest Name</th><th>Phone / Email</th><th class="col-nat">Nationality</th><th>Preferred Language</th><th>Upcoming Reservation</th><th>Last Stay</th><th class="num">Total Reservations</th><th>Notes</th><th></th>' +
  '</tr></thead><tbody id="guestsBody"></tbody></table></div></div></div>';

  page.innerHTML = html;
  PG.enhanceSelects(page);
  document.getElementById('guestCountSub').textContent = s.customers.length + ' guest' + (s.customers.length === 1 ? '' : 's');

  function filteredGuests() {
    var q = filters.q.trim().toLowerCase();
    return s.customers.filter(function (c) {
      if (q) {
        var hay = [c.name, c.phone, c.email, c.idRef].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (filters.upcoming !== 'all') { var hasUp = !!upcomingFor(c.id); if ((filters.upcoming === 'yes') !== hasUp) return false; }
      if (filters.past !== 'all') { var hasPast = !!lastStayFor(c.id); if ((filters.past === 'yes') !== hasPast) return false; }
      if (filters.important !== 'all') { var imp = !!c.important; if ((filters.important === 'yes') !== imp) return false; }
      if (filters.language !== 'all' && (c.preferredLanguage || '') !== filters.language) return false;
      if (filters.stayFrom || filters.stayTo) {
        var last = lastStayFor(c.id);
        if (!last) return false;
        if (filters.stayFrom && last.checkOut < filters.stayFrom) return false;
        if (filters.stayTo && last.checkOut > filters.stayTo) return false;
      }
      return true;
    }).sort(function (a, b) { return a.name < b.name ? -1 : 1; });
  }

  function renderTable() {
    s = PG.getState();
    var rows = filteredGuests();
    document.getElementById('resultCount').textContent = rows.length + ' guest' + (rows.length === 1 ? '' : 's');
    renderApplied();
    var body = document.getElementById('guestsBody');
    if (!s.customers.length) {
      body.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="ic">' + PG.icon('user',30) + '</div><strong>No guests yet</strong>' + (CAN_MANAGE ? '<br><br><button class="btn btn-primary" id="emptyAddBtn">+ Add Guest</button>' : '') + '</div></td></tr>';
      var emptyAddBtn = document.getElementById('emptyAddBtn');
      if (emptyAddBtn) emptyAddBtn.addEventListener('click', function () { openGuestDrawer(null); });
      return;
    }
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="ic">' + PG.icon('search',30) + '</div><strong>No guests match your filters</strong><button class="btn btn-outline btn-sm" id="emptyClearBtn">Clear Filters</button></div></td></tr>';
      document.getElementById('emptyClearBtn').addEventListener('click', clearFilters);
      return;
    }
    body.innerHTML = rows.map(function (c) {
      var up = upcomingFor(c.id);
      var last = lastStayFor(c.id);
      var total = guestReservations(c.id).length;
      var hasNote = !!(c.notes && c.notes.trim());
      return '<tr>' +
        '<td><a class="row-link view-link" data-id="' + c.id + '" style="font-weight:700;">' + PG.esc(c.name) + '</a>' + (c.important ? ' <span class="badge badge-purple"><span class="badge-dot"></span>Important</span>' : '') + '</td>' +
        '<td class="text-sm">' + PG.esc(c.phone || '—') + '<div class="muted text-sm">' + PG.esc(c.email || '—') + '</div></td>' +
        '<td class="col-nat text-sm">' + PG.esc(c.nationality || '—') + '</td>' +
        '<td class="text-sm">' + PG.esc(c.preferredLanguage || '—') + '</td>' +
        '<td class="text-sm">' + (up ? '<a href="reservation-detail.html?id=' + up.id + '">' + up.id + '</a><div class="muted text-sm">' + PG.fmtDateShort(up.checkIn) + '</div>' : '<span class="muted">None</span>') + '</td>' +
        '<td class="text-sm">' + (last ? PG.fmtDateShort(last.checkOut) : '<span class="muted">—</span>') + '</td>' +
        '<td class="num">' + total + '</td>' +
        '<td>' + (hasNote ? '<button type="button" class="note-link" data-id="' + c.id + '" title="View note">&#128172;</button>' : '<span class="muted">—</span>') + '</td>' +
        '<td><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">' +
          '<button class="btn btn-outline btn-sm view-link" data-id="' + c.id + '">View</button>' +
          '<div class="more-wrap"><button class="more-btn" data-id="' + c.id + '" aria-label="Actions for ' + PG.esc(c.name) + '" aria-haspopup="menu" title="More actions">' + PG.icon('dots',16) + '</button>' +
            '<div class="more-menu" data-menu-for="' + c.id + '" role="menu">' +
              (CAN_MANAGE ? '<button class="edit-action" data-id="' + c.id + '">' + PG.icon('edit',15) + ' Edit Guest</button>' : '') +
              '<a href="new-reservation.html?customer=' + c.id + '">' + PG.icon('plus',15) + ' Create Reservation</a>' +
              (CAN_MANAGE ? '<div class="menu-sep"></div><button class="danger delete-action" data-id="' + c.id + '">' + PG.icon('trash',15) + ' Delete Guest</button>' : '') +
            '</div>' +
          '</div>' +
        '</div></td>' +
      '</tr>';
    }).join('');
    PG.wireMoreMenus(document.getElementById('guestsBody'));
  }

  // Menu items are portaled to <body> while open, so this delegate listens on
  // `document` rather than the table body — see PG.wireMoreMenus in app.js.
  document.addEventListener('click', function (e) {
    var t;
    if (t = e.target.closest('.view-link')) { location.href = 'guest-detail.html?id=' + t.dataset.id; return; }
    if (t = e.target.closest('.edit-action')) { PG.closeMoreMenu(false); openGuestDrawer(t.dataset.id); return; }
    if (t = e.target.closest('.delete-action')) { PG.closeMoreMenu(false); openDeleteGuestModal(t.dataset.id); return; }
    if (t = e.target.closest('.note-link')) { openNoteModal(t.dataset.id); return; }
  });

  function syncChipUi(){
    page.querySelectorAll('[data-chips="gUpcoming"] .pg-chip').forEach(function(chip){
      var on = chip.dataset.chipValue === filters.upcoming;
      chip.classList.toggle('active', on); chip.setAttribute('aria-pressed', on);
    });
    page.querySelectorAll('[data-chips="gImportant"] .pg-chip').forEach(function(chip){
      var on = chip.dataset.chipValue === filters.important;
      chip.classList.toggle('active', on); chip.setAttribute('aria-pressed', on);
    });
  }
  function appliedFilterList(){
    var out = [];
    if (filters.past !== 'all') out.push({key:'past', label:'Past Reservations', value: filters.past === 'yes' ? 'Yes' : 'No'});
    if (filters.language !== 'all') out.push({key:'language', label:'Language', value: filters.language});
    if (filters.stayFrom) out.push({key:'stayFrom', label:'Last Stay From', value: PG.fmtDateShort(filters.stayFrom)});
    if (filters.stayTo) out.push({key:'stayTo', label:'Last Stay To', value: PG.fmtDateShort(filters.stayTo)});
    return out;
  }
  function renderApplied(){
    var applied = appliedFilterList();
    var extra = (filters.upcoming !== 'all' ? 1 : 0) + (filters.important !== 'all' ? 1 : 0);
    var total = applied.length + extra;
    var box = document.getElementById('gApplied');
    box.innerHTML = total
      ? '<span class="text-sm muted">' + total + ' active filter' + (total===1?'':'s') + '</span>' +
        PG.appliedChips(applied) +
        '<button class="btn btn-light btn-sm" id="clearFilters">Clear Filters</button>'
      : '';
    var badge = document.getElementById('advCount');
    if (badge) badge.innerHTML = applied.length ? ' <span class="pg-chip-count" style="background:var(--pg-primary);color:#fff;">' + applied.length + '</span>' : '';
    box.querySelectorAll('[data-remove-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.dataset.removeFilter;
        filters[k] = (k === 'stayFrom' || k === 'stayTo') ? '' : 'all';
        renderTable();
      });
    });
    var clear = document.getElementById('clearFilters');
    if (clear) clear.addEventListener('click', clearFilters);
  }

  function clearFilters() {
    filters = { q: '', upcoming: 'all', past: 'all', important: 'all', language: 'all', stayFrom: '', stayTo: '' };
    document.getElementById('searchBox').value = '';
    syncChipUi();
    renderTable();
  }
  document.getElementById('searchBox').addEventListener('input', function () { filters.q = this.value; renderTable(); });
  PG.wireChips(page, 'gUpcoming', function(v){ filters.upcoming = v; syncChipUi(); renderTable(); });
  PG.wireChips(page, 'gImportant', function(v){ filters.important = v; syncChipUi(); renderTable(); });

  /* Advanced filters drawer — Past Reservations, Language, and the stay-date range. */
  var advDrawer = document.createElement('div');
  advDrawer.className = 'pg-drawer-overlay';
  advDrawer.id = 'gAdvDrawer';
  document.body.appendChild(advDrawer);
  document.getElementById('advFiltersBtn').addEventListener('click', function(){
    advDrawer.innerHTML = '<div class="pg-drawer" style="max-width:400px;">' +
      '<div class="pg-drawer-header"><h3>More Filters</h3>' +
        '<button class="pg-modal-close" onclick="PG.closeModal(\'gAdvDrawer\')" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
      '<div class="pg-drawer-body">' +
        '<div class="form-group"><label class="form-label">Has Past Reservations</label>' +
          PG.segmented('advPast', [{value:'all',label:'All'},{value:'yes',label:'Yes'},{value:'no',label:'No'}], filters.past, {ariaLabel:'Past reservations'}) + '</div>' +
        '<div class="form-group"><label class="form-label" for="adv-lang">Communication Language</label>' +
          '<select class="form-control" id="adv-lang"><option value="all">All Languages</option>' +
          LANGUAGES.map(function(l){ return '<option value="'+PG.esc(l)+'"'+(filters.language===l?' selected':'')+'>'+PG.esc(l)+'</option>'; }).join('') + '</select></div>' +
        '<div class="grid-2" style="margin-bottom:0;"><div class="form-group"><label class="form-label" for="adv-from">Last Stay From</label>' +
          '<input type="date" class="form-control" id="adv-from" value="'+PG.esc(filters.stayFrom)+'"></div>' +
          '<div class="form-group"><label class="form-label" for="adv-to">Last Stay To</label>' +
          '<input type="date" class="form-control" id="adv-to" value="'+PG.esc(filters.stayTo)+'"></div></div>' +
      '</div>' +
      '<div class="pg-drawer-footer"><button class="btn btn-light" id="adv-clear">Clear</button>' +
        '<button class="btn btn-primary" id="adv-apply">Apply Filters</button></div>' +
    '</div>';
    PG.enhanceSelects(advDrawer);
    var pending = { past: filters.past, language: filters.language, stayFrom: filters.stayFrom, stayTo: filters.stayTo };
    PG.wireSegmented(advDrawer, 'advPast', function(v){ pending.past = v; });
    document.getElementById('adv-lang').addEventListener('change', function(){ pending.language = this.value; });
    document.getElementById('adv-from').addEventListener('change', function(){ pending.stayFrom = this.value; });
    document.getElementById('adv-to').addEventListener('change', function(){ pending.stayTo = this.value; });
    document.getElementById('adv-clear').addEventListener('click', function(){
      filters.past = 'all'; filters.language = 'all'; filters.stayFrom = ''; filters.stayTo = '';
      PG.closeModal('gAdvDrawer'); renderTable();
    });
    document.getElementById('adv-apply').addEventListener('click', function(){
      filters.past = pending.past; filters.language = pending.language; filters.stayFrom = pending.stayFrom; filters.stayTo = pending.stayTo;
      PG.closeModal('gAdvDrawer'); renderTable();
    });
    PG.openModal('gAdvDrawer');
  });

  // ---- Loading state ----
  document.getElementById('guestsBody').innerHTML = [0, 1, 2].map(function () {
    return '<tr><td colspan="9"><div class="skeleton-bar" style="width:60%;"></div></td></tr>';
  }).join('');
  setTimeout(renderTable, 200);

  /* ================================================================ */
  /* Add / Edit Guest drawer — shared component, see PG.renderGuestDrawer   */
  /* ================================================================ */
  function openGuestDrawer(id) {
    PG.renderGuestDrawer({
      editingId: id,
      onSaved: function (guestId, info) {
        if (info && info.usedExisting) { location.href = 'guest-detail.html?id=' + guestId; return; }
        renderTable();
        s = PG.getState();
        document.getElementById('guestCountSub').textContent = s.customers.length + ' guest' + (s.customers.length === 1 ? '' : 's');
      }
    });
  }
  var addGuestBtn = document.getElementById('addGuestBtn');
  if (addGuestBtn) addGuestBtn.addEventListener('click', function () { openGuestDrawer(null); });

  /* ================================================================ */
  /* Delete Guest — shared confirm modal, see PG.renderDeleteGuestModal     */
  /* ================================================================ */
  function openDeleteGuestModal(id) {
    PG.renderDeleteGuestModal({
      guestId: id,
      canManage: CAN_MANAGE,
      onDeleted: function () {
        s = PG.getState();
        renderTable();
        document.getElementById('guestCountSub').textContent = s.customers.length + ' guest' + (s.customers.length === 1 ? '' : 's');
      }
    });
  }

  /* ================================================================ */
  /* View Note — a lightweight read-only modal so staff don't have to open  */
  /* the full guest profile just to read the notes column.                  */
  /* ================================================================ */
  var noteModal = document.createElement('div');
  noteModal.className = 'pg-modal-overlay';
  noteModal.id = 'noteModal';
  document.body.appendChild(noteModal);
  function openNoteModal(id) {
    var c = s.customers.find(function (x) { return x.id === id; });
    if (!c) return;
    noteModal.innerHTML = '<div class="pg-modal">' +
      '<div class="pg-modal-header"><h3>Notes &mdash; ' + PG.esc(c.name) + '</h3><button class="pg-modal-close" id="noteModalClose">&times;</button></div>' +
      '<div class="pg-modal-body"><div class="notes-modal-text">' + PG.esc(c.notes || '') + '</div></div>' +
      '<div class="pg-modal-footer"><button class="btn btn-primary" id="noteModalClose2">Close</button></div>' +
    '</div>';
    noteModal.querySelector('#noteModalClose').addEventListener('click', function () { PG.closeModal('noteModal'); });
    noteModal.querySelector('#noteModalClose2').addEventListener('click', function () { PG.closeModal('noteModal'); });
    PG.openModal('noteModal');
  }
}

if (!CAN_VIEW) {
  page.innerHTML = '<div class="pg-page-head"><div><h1>Guests</h1></div></div>' +
    '<div class="card"><div class="card-body"><div class="empty-state"><div class="ic">' + PG.icon('lock',30) + '</div>' +
    'You don\'t have permission to view Guests.<br>Contact a Hotel Admin to request access.</div></div></div>';
} else {
  init();
}
</script>
</body>
</html>
