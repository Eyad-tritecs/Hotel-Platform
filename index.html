<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("dashboard", ["Dashboard"]);
var s = PG.getState();

function kpis() {
  var active = s.reservations.filter(function(r){return r.status!=="Cancelled";});
  var pendingPay = s.reservations.filter(function(r){return r.paymentStatus==="Link Sent" || r.paymentStatus==="Payment Required";});
  var totalRoomsSellable = s.roomTypes.reduce(function(a,r){return a+r.sellable;},0);
  var bookedToday = s.roomTypes.reduce(function(a,rt){return a + PG.bookedCount(s, rt.id, PG.TODAY);},0);
  var occPct = Math.round((bookedToday/totalRoomsSellable)*100);
  var revenue = active.filter(function(r){return r.paymentStatus==="Paid";}).reduce(function(sum,r){
    return sum + reservationTotal(r);
  },0);
  return {active: active.length, pendingPay: pendingPay.length, occPct: occPct, revenue: revenue, bookedToday: bookedToday, totalRoomsSellable: totalRoomsSellable};
}

function reservationTotal(r) {
  var nights = PG.dateRange(r.checkIn, r.checkOut);
  var total = 0;
  r.rooms.forEach(function(room){
    nights.forEach(function(d){ total += PG.rateFor(s, room.roomTypeId, d) * room.qty; });
  });
  return total;
}

var k = kpis();

var html = '';
html += '<div class="pg-page-head"><div><h1>Welcome back, Hotel Admin</h1><div class="sub">Palestine Grand Hotel &middot; Bethlehem, Palestine &middot; ' + PG.fmtDate(PG.TODAY) + '</div></div>' +
  '<div class="pg-actions"><a class="btn btn-primary" href="new-reservation.html">+ New Reservation</a><a class="btn btn-outline" href="reservations.html">View Reservations</a></div></div>';

html += '<div class="card" style="background:linear-gradient(135deg,var(--pg-primary-light),#fff);border-color:#cfe6ff;"><div class="card-body" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">' +
  '<div><h3 style="font-size:15px;margin-bottom:4px;">New here? Take the Guided Journey</h3><div class="muted text-sm">A clickable, step-by-step walkthrough of one real booking &mdash; from WhatsApp request to payment to cancellation.</div></div>' +
  '<a class="btn btn-primary" href="demo-journey.html">Start Guided Journey &rarr;</a>' +
'</div></div>';

html += '<div class="grid-4">';
html += '<div class="kpi"><div class="kpi-label">Active Reservations</div><div class="kpi-value">' + k.active + '</div><div class="kpi-note">Excludes cancelled</div></div>';
html += '<div class="kpi"><div class="kpi-label">Today\'s Occupancy</div><div class="kpi-value">' + k.occPct + '%</div><div class="kpi-note">' + k.bookedToday + ' of ' + k.totalRoomsSellable + ' rooms booked</div></div>';
html += '<div class="kpi"><div class="kpi-label">Awaiting Payment</div><div class="kpi-value">' + k.pendingPay + '</div><div class="kpi-note">Link sent or payment required</div></div>';
html += '<div class="kpi"><div class="kpi-label">Confirmed Revenue</div><div class="kpi-value">' + PG.fmtMoney(k.revenue) + '</div><div class="kpi-note">From paid reservations</div></div>';
html += '</div>';

html += '<div class="row">';
html += '<div class="col" style="flex:2;">';
html += '<div class="card"><div class="card-header"><div><h3>Recent Reservations</h3><div class="desc">Latest bookings across all sources</div></div><a class="btn btn-outline btn-sm" href="reservations.html">View all</a></div>';
html += '<div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr><th>Reservation</th><th>Guest</th><th>Dates</th><th>Status</th><th>Payment</th></tr></thead><tbody>';
s.reservations.slice().sort(function(a,b){return b.createdAt<a.createdAt?-1:1;}).slice(0,6).forEach(function(r){
  var cust = s.customers.find(function(c){return c.id===r.customerId;});
  html += '<tr onclick="location.href=\'reservation-detail.html?id='+r.id+'\'" style="cursor:pointer;">' +
    '<td class="row-link">'+r.id+'</td><td>'+PG.esc(cust.name)+'</td>' +
    '<td>'+PG.fmtDateShort(r.checkIn)+' &rarr; '+PG.fmtDateShort(r.checkOut)+'</td>' +
    '<td>'+PG.statusBadge(r.status)+'</td><td>'+PG.payBadge(r.paymentStatus)+'</td></tr>';
});
html += '</tbody></table></div></div></div>';
html += '</div>';

html += '<div class="col">';
html += '<div class="card"><div class="card-header"><h3>Room Type Snapshot</h3></div><div class="card-body">';
s.roomTypes.forEach(function(rt){
  var a = PG.computeAvailability(s, rt.id, PG.TODAY);
  html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--pg-gray-200);">' +
    '<div><div style="font-weight:600;font-size:13px;">'+rt.name+'</div><div class="muted text-sm">'+PG.fmtMoney(rt.baseRate)+' / night</div></div>' +
    '<div class="avail-cell ' + (a.available===0?'avail-stop':(a.available<=2?'avail-low':'avail-ok')) + '" style="min-width:70px;">'+a.available+' avail.</div></div>';
});
html += '<a class="btn btn-outline btn-block" style="margin-top:14px;" href="availability-inventory.html">Manage Availability</a>';
html += '</div></div>';

html += '<div class="card"><div class="card-header"><h3>Quick Links</h3></div><div class="card-body" style="display:flex;flex-direction:column;gap:8px;">' +
  '<a class="btn btn-light btn-block" href="hotel-profile.html">Hotel Profile</a>' +
  '<a class="btn btn-light btn-block" href="rates.html">Rates</a>' +
  '<a class="btn btn-light btn-block" href="payments.html">Payments</a>' +
  '<a class="btn btn-light btn-block" href="audit.html">Audit Log</a>' +
  '<a class="btn btn-light btn-block" href="reservation-detail-ar.html">Arabic (RTL) Preview</a>' +
  '</div></div>';
html += '</div></div>';

page.innerHTML = html;
</script>
</body>
</html>
