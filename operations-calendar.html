  function openChangeRoomForBlockConflict(assignmentId, onDone){
    var st = PG.getState();
    var a = st.roomAssignments.find(function(x){return x.id===assignmentId;});
    var res = st.reservations.find(function(r){return r.id===a.reservationId;});
    var item = res.rooms.find(function(x){return x.id===a.reservationItemId;});
    var cust = custOf(res);
    var otherRoomIds = otherAssignedRoomIds(res.id, item.id);
    PG.renderChangeRoomDrawer({
      roomTypeId: item.roomTypeId, checkIn: a.arrivalDate, checkOut: a.departureDate,
      preferences: {}, currentRoomId: a.physicalRoomId, excludeRoomIds: otherRoomIds, excludeAssignmentId: a.id,
      title: 'Change Room', summaryLabel: res.id + ' &middot; ' + (cust?cust.name:'Guest'),
      summarySub: PG.fmtDateShort(a.arrivalDate) + ' – ' + PG.fmtDateShort(a.departureDate),
      onConfirm: function(newRoomId){
        try {
          var st2 = PG.getState();
          var newRoom = st2.physicalRooms.find(function(p){return p.id===newRoomId;});
          if (!newRoom || !PG.roomEligibleForStay(st2, newRoom, a.arrivalDate, a.departureDate, a.id)){
            PG.toast('That room is no longer available — the previous assignment has been kept.', 'danger');
            return;
          }
          var oldRoom = st2.physicalRooms.find(function(p){return p.id===a.physicalRoomId;});
          var rec = st2.roomAssignments.find(function(x){return x.id===assignmentId;});
          rec.physicalRoomId = newRoomId; rec.assignedAt = PG.nowIso(); rec.assignedBy = 'Hotel Admin';
          var idx = st2.reservations.findIndex(function(r){return r.id===res.id;});
          st2.reservations[idx].activity.push({ts:PG.nowIso(), text:'Room changed from '+(oldRoom?oldRoom.roomNumber:'—')+' to '+newRoom.roomNumber+' while resolving a block conflict.'});
          PG.setState(st2);
          PG.addAudit('Room Assignment Changed', res.id+' — room changed from '+(oldRoom?oldRoom.roomNumber:'—')+' to '+newRoom.roomNumber+' (resolving a block conflict).');
          PG.toast('Room '+newRoom.roomNumber+' assigned.', 'success');
          if (onDone) onDone();
          renderGrid();
        } catch (e) {
          PG.toast('Failed to save changes — the previous room assignment has been kept.', 'danger');
        }
      }
    });
  }

  var editBlockModal = document.createElement('div');
  editBlockModal.className = 'pg-modal-overlay';
  editBlockModal.id = 'editBlockModal';
  document.body.appendChild(editBlockModal);
  function openEditBlockModal(blockId){
    var st = PG.getState();
    var blk = st.roomBlocks.find(function(b){return b.id===blockId;});
    editBlockModal.innerHTML = '<div class="pg-modal">' +
      '<div class="pg-modal-header"><h3>Edit Block</h3><button class="pg-modal-close" onclick="PG.closeModal(\'editBlockModal\')">&times;</button></div>' +
      '<div class="pg-modal-body">' +
        '<div class="form-group"><label class="form-label">Block Type</label><select class="form-control" id="eb-type">' + BLOCK_TYPES.map(function(t){return '<option value="'+t+'"'+(t===blk.type?' selected':'')+'>'+t+'</option>';}).join('') + '</select></div>' +
        '<div class="grid-2">' +
          '<div class="form-group"><label class="form-label">Start Date</label><input type="date" class="form-control" id="eb-start" value="'+blk.startDate+'"></div>' +
          '<div class="form-group"><label class="form-label">End Date</label><input type="date" class="form-control" id="eb-end" value="'+PG.addDays(blk.endDate,-1)+'"></div>' +
        '</div>' +
        '<div class="form-group"><label class="form-label">Reason <span class="opt">(required)</span></label><input class="form-control" id="eb-reason" value="'+PG.esc(blk.reason)+'"></div>' +
        '<div class="form-group"><label class="form-label">Notes <span class="opt">(optional)</span></label><textarea class="form-control" id="eb-notes">'+PG.esc(blk.notes||'')+'</textarea></div>' +
        '<div id="eb-conflict"></div>' +
      '</div>' +
      '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'editBlockModal\')">Cancel</button><button class="btn btn-primary" id="eb-save">Save Changes</button></div>' +
    '</div>';
    PG.enhanceSelects(editBlockModal);
    function checkConflict(){
      var freshState = PG.getState();
      var start = document.getElementById('eb-start').value, endIncl = document.getElementById('eb-end').value;
      var box = document.getElementById('eb-conflict'), saveBtn = document.getElementById('eb-save');
      if (!start || !endIncl || endIncl<start){ box.innerHTML=''; saveBtn.disabled=false; return; }
      var endExclusive = PG.addDays(endIncl,1);
      var overlapping = PG.assignmentsOverlapping(freshState, blk.physicalRoomId, start, endExclusive).filter(function(a){return a.reservationItemId; });
      if (!overlapping.length){ box.innerHTML=''; saveBtn.disabled=false; return; }
      var rows = overlapping.map(function(a){
        var res = freshState.reservations.find(function(r){return r.id===a.reservationId;});
        var cust = res ? freshState.customers.find(function(c){return c.id===res.customerId;}) : null;
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:12.5px;gap:8px;">' +
          '<span><a href="reservation-detail.html?id='+a.reservationId+'" target="_blank">'+a.reservationId+'</a>'+(cust?' &middot; '+PG.esc(cust.name):'')+
            '<div class="muted text-sm">'+PG.fmtDateShort(a.arrivalDate)+'&ndash;'+PG.fmtDateShort(a.departureDate)+(a.assignmentStatus==='Held'?' &middot; Held':'')+'</div></span>' +
          '<button type="button" class="btn btn-outline btn-sm eb-conflict-change" data-assignment="'+a.id+'">Change Room</button>' +
        '</div>';
      }).join('');
      box.innerHTML = '<div class="help-note help-note-danger" style="margin-top:12px;flex-direction:column;align-items:stretch;">' +
        '<div style="font-weight:700;margin-bottom:6px;">This range conflicts with '+overlapping.length+' existing reservation assignment'+(overlapping.length===1?'':'s')+'.</div>' +
        rows +
        '<div style="margin-top:8px;">Resolve or reassign the affected reservation'+(overlapping.length===1?'':'s')+' before saving.</div>' +
      '</div>';
      saveBtn.disabled = true;
      box.querySelectorAll('.eb-conflict-change').forEach(function(btn){
        btn.addEventListener('click', function(){ openChangeRoomForBlockConflict(btn.dataset.assignment, checkConflict); });
      });
    }
    ['eb-start','eb-end'].forEach(function(id){ document.getElementById(id).addEventListener('change', checkConflict); });
    document.getElementById('eb-save').addEventListener('click', function(){
      var reason = document.getElementById('eb-reason').value.trim();
      var start = document.getElementById('eb-start').value, endIncl = document.getElementById('eb-end').value;
      if (!reason){ PG.toast('A reason is required.', 'danger'); return; }
      if (!start || !endIncl || endIncl<start){ PG.toast('Please choose a valid date range.', 'danger'); return; }
      var endExclusive = PG.addDays(endIncl,1);
      var overlapping = PG.assignmentsOverlapping(st, blk.physicalRoomId, start, endExclusive);
      if (overlapping.length){ PG.toast('Resolve the conflicting reservation(s) before saving.', 'danger'); return; }
      try {
        var st2 = PG.getState();
        var rec = st2.roomBlocks.find(function(b){return b.id===blockId;});
        rec.type = document.getElementById('eb-type').value;
        rec.startDate = start; rec.endDate = endExclusive;
        rec.reason = reason; rec.notes = document.getElementById('eb-notes').value.trim();
        PG.setState(st2);
        PG.addAudit('Room Block Updated', blockId + ' updated on Room ' + (st2.physicalRooms.find(function(p){return p.id===rec.physicalRoomId;})||{}).roomNumber + '.');
        PG.toast('Block updated.', 'success');
        PG.closeModal('editBlockModal');
        PG.closeModal('blockDrawer');
        renderGrid();
      } catch (e) {
        PG.toast('Failed to save changes. Please try again.', 'danger');
      }
    });
    PG.openModal('editBlockModal');
  }
  function endOrRemoveBlock(blockId){
    var st = PG.getState();
    var blk = st.roomBlocks.find(function(b){return b.id===blockId;});
    var room = st.physicalRooms.find(function(p){return p.id===blk.physicalRoomId;});
    var hasStarted = blk.startDate <= PG.TODAY;
    var msg = hasStarted ? 'End this block as of today? Room '+room.roomNumber+' will become available again starting tomorrow.' : 'Remove this upcoming block entirely?';
    if (!confirm(msg)) return;
    try {
      var st2 = PG.getState();
      if (hasStarted){
        var rec = st2.roomBlocks.find(function(b){return b.id===blockId;});
        rec.endDate = PG.addDays(PG.TODAY, 1);
      } else {
        st2.roomBlocks = st2.roomBlocks.filter(function(b){return b.id!==blockId;});
      }
      PG.setState(st2);
      PG.addAudit('Room Block Ended', blockId + ' ended/removed on Room ' + room.roomNumber + '.');
      PG.toast('Block '+(hasStarted?'ended.':'removed.'), 'success');
      PG.closeModal('blockDrawer');
      renderGrid();
    } catch (e) {
      PG.toast('Failed to save changes. Please try again.', 'danger');
    }
  }
}

if (!CAN_VIEW) {
  page.innerHTML = '<div class="pg-page-head"><div><h1>Operations Calendar</h1></div></div>' +
    '<div class="card"><div class="card-body"><div class="empty-state"><div class="ic">' + PG.icon('lock',30) + '</div>' +
    'You don\'t have permission to view the Operations Calendar.<br>Contact a Hotel Admin to request access.</div></div></div>';
} else {
  init();
}
</script>
