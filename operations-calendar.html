<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Calendar — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .opc-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .opc-toolbar-left, .opc-toolbar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .opc-toolbar input[type="date"]{width:150px;}
  .opc-range-label{font-size:13px;font-weight:700;color:var(--pg-gray-900);white-space:nowrap;padding:0 2px;}
  .opc-search{width:230px;}
  .opc-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11.5px;color:var(--pg-gray-600);margin-bottom:12px;}
  .opc-legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .opc-legend-swatch{width:16px;height:11px;border-radius:3px;flex-shrink:0;}
  .opc-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .opc-chip{display:inline-flex;align-items:center;gap:6px;background:var(--pg-primary-light);color:var(--pg-primary);border-radius:20px;padding:5px 10px 5px 12px;font-size:12px;font-weight:600;}
  .opc-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0;}

  .opc-wrap{position:relative;overflow:auto;border:1px solid var(--pg-border);border-radius:var(--pg-radius);background:#fff;height:calc(100vh - 400px);min-height:440px;}
  .opc-grid{position:relative;}
  .opc-header-row{position:sticky;top:0;z-index:20;display:flex;background:var(--pg-gray-100);border-bottom:1px solid var(--pg-border);}
  .opc-corner{position:sticky;left:0;z-index:21;width:210px;min-width:210px;background:var(--pg-gray-100);border-right:1px solid var(--pg-border);display:flex;align-items:center;padding:0 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--pg-gray-600);}
  .opc-date-cell{width:90px;min-width:90px;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--pg-gray-700);border-right:1px solid var(--pg-gray-200);}
  .opc-date-cell .dow{font-size:10px;color:var(--pg-gray-500);text-transform:uppercase;}
  .opc-date-cell.today{background:var(--pg-primary-light);color:var(--pg-primary);}
  .opc-date-cell.weekend{background:#fbfbfd;}

  .opc-group-header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--pg-gray-100);border-bottom:1px solid var(--pg-border);position:sticky;left:0;width:fit-content;min-width:100%;font-size:12.5px;box-sizing:border-box;}
  .opc-collapse-btn{background:none;border:none;cursor:pointer;font-size:11px;color:var(--pg-gray-600);width:16px;flex-shrink:0;}

  .opc-row{display:flex;border-bottom:1px solid var(--pg-gray-200);position:relative;}
  .opc-room-info{position:sticky;left:0;z-index:10;width:210px;min-width:210px;background:#fff;border-right:1px solid var(--pg-border);padding:6px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;box-sizing:border-box;}
  .opc-row:hover .opc-room-info{background:var(--pg-gray-100);}
  .opc-room-num{font-weight:700;font-size:12.8px;color:var(--pg-gray-900);}
  .opc-room-meta{font-size:11px;color:var(--pg-gray-500);}
  /* Compact operational-status dot + label — replaces the old full-width badge pill. */
  .opc-status{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--pg-gray-700);}
  .opc-status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--pg-gray-400);}
  .opc-status-dot.available{background:#0BB463;}
  .opc-status-dot.reserved{background:var(--pg-primary);}
  .opc-status-dot.held{background:#c99400;}
  .opc-status-dot.out-of-order{background:var(--pg-danger);}
  .opc-status-dot.out-of-service{background:var(--pg-gray-500);}
  .opc-status-dot.inactive{background:var(--pg-gray-300);}

  .opc-track{position:relative;height:56px;flex-shrink:0;}
  .opc-cell{position:absolute;top:0;bottom:0;border-right:1px solid var(--pg-gray-200);cursor:pointer;}
  .opc-cell:hover{background:var(--pg-primary-light);}
  .opc-cell.today{background:rgba(27,132,255,.05);}
  .opc-cell.weekend{background:#fbfbfd;}
  /* Subtle hover teaser only — the real affordance is the persistent selection's own
     "+ Add" control rendered once a cell (or range) is actually selected. */
  .opc-cell:not(.has-selection):hover::after{
    content:"+ Add";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:700;color:var(--pg-primary);pointer-events:none;
  }

  .opc-bar{position:absolute;top:9px;height:44px;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-align:left;
    transition:box-shadow .12s,transform .12s;}
  .opc-bar:hover{box-shadow:0 4px 12px rgba(0,0,0,.14);z-index:6;}
  /* The body of an editable bar is the MOVE affordance; the two edges are RESIZE. */
  .opc-bar.editable{cursor:grab;}
  .opc-bar.editable:active{cursor:grabbing;}
  .opc-bar:not(.editable){cursor:pointer;}
  .opc-bar-body{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;flex:1;
    padding-inline:2px;pointer-events:none;}
  .opc-bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;line-height:1.25;}
  .opc-bar-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:500;opacity:.78;
    display:flex;align-items:center;gap:5px;}
  .opc-bar-icons{display:flex;align-items:center;gap:4px;flex-shrink:0;pointer-events:none;}
  .opc-bar-icons svg{width:13px;height:13px;}

  /* ---- Visible resize handles (section 7) --------------------------------
     The single most-reported problem with the old calendar was that a bar looked
     like a flat rectangle with no hint that its ends could be dragged. Each editable
     bar now carries a real 11px handle at each end, with a two-line grip, a
     col-resize cursor and its own tooltip naming what that end changes. They are
     visible by default for a user with edit permission (not hover-only), and they
     darken on hover so the target is unmistakable. */
  .opc-handle{position:absolute;top:0;bottom:0;width:11px;display:flex;align-items:center;justify-content:center;
    cursor:col-resize;background:rgba(0,0,0,.07);opacity:.9;transition:background .12s,opacity .12s;z-index:2;}
  .opc-handle.start{inset-inline-start:0;border-radius:7px 0 0 7px;}
  .opc-handle.end{inset-inline-end:0;border-radius:0 7px 7px 0;}
  .opc-handle::before{content:"";width:3px;height:16px;border-radius:2px;
    border-inline-start:1.5px solid currentColor;border-inline-end:1.5px solid currentColor;opacity:.65;}
  .opc-bar:hover .opc-handle{background:rgba(0,0,0,.15);opacity:1;}
  .opc-handle:hover{background:rgba(0,0,0,.24);}
  .opc-bar:focus-visible .opc-handle{background:rgba(0,0,0,.2);opacity:1;}
  /* A bar clipped by the view edge has no real boundary there, so no handle either. */
  .opc-bar.clip-start .opc-handle.start,.opc-bar.clip-end .opc-handle.end{display:none;}
  /* Too narrow for a label: keep the handles, drop the text (dates live in the tooltip). */
  .opc-bar.narrow .opc-bar-body{display:none;}
  .opc-bar.narrow .opc-bar-icons{display:none;}
  /* Edge dates, shown only when the bar is wide enough to carry them. */
  .opc-bar-date{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;
    opacity:.55;pointer-events:none;letter-spacing:.02em;white-space:nowrap;}
  .opc-bar-date.s{inset-inline-start:16px;}
  .opc-bar-date.e{inset-inline-end:16px;}
  /* When the edge dates are shown the body must give up room for them, or the guest
     name prints straight through the date text. */
  .opc-bar.with-dates .opc-bar-body{padding-inline:46px 46px;}
  .opc-ic{flex-shrink:0;font-size:11px;}
  .opc-bar:focus-visible{outline:3px solid var(--pg-primary);outline-offset:1px;}
  .opc-bar.dim{opacity:.28;}
  .opc-bar.match{box-shadow:0 0 0 2px var(--pg-primary);}

  .opc-bar.res.st-draft{background:var(--pg-gray-200);border:1.5px dashed var(--pg-gray-500);color:var(--pg-gray-800);}
  .opc-bar.res.st-pending-payment{background:var(--pg-warning-light);border:1.5px dashed #c99400;color:#8a5a00;}
  .opc-bar.res.st-confirmed{background:var(--pg-success-light);border:1.5px solid #0bb463;color:#0a7d45;}
  .opc-bar.res.st-completed{background:var(--pg-primary-light);border:1.5px solid var(--pg-primary);color:var(--pg-primary-dark);}
  .opc-bar.res.st-no-show{background:var(--pg-danger-light);border:1.5px solid var(--pg-danger);color:var(--pg-danger);}

  .opc-bar.block{color:var(--pg-gray-800);background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 6px, transparent 6px 12px);}
  .opc-bar.block.blk-out-of-order{background-color:var(--pg-danger-light);border:1.5px solid var(--pg-danger);color:var(--pg-danger);}
  .opc-bar.block.blk-out-of-service{background-color:var(--pg-gray-300);border:1.5px dashed var(--pg-gray-600);}
  .opc-bar.block.blk-management-hold{background-color:var(--pg-warning-light);border:1.5px dashed #c99400;color:#8a5a00;}
  .opc-bar.block.blk-other{background-color:var(--pg-gray-200);border:1.5px dotted var(--pg-gray-500);}

  .opc-bar.conflict{outline:2.5px solid var(--pg-danger);outline-offset:1px;background-image:repeating-linear-gradient(45deg, rgba(248,40,90,.18) 0 6px, transparent 6px 12px);}
  .opc-ic.conflict-ic{color:var(--pg-danger);}

  .opc-skeleton-row{height:52px;border-bottom:1px solid var(--pg-gray-200);}
  .opc-skeleton-bar{height:14px;margin:19px 14px;border-radius:4px;background:linear-gradient(90deg,var(--pg-gray-200) 25%,var(--pg-gray-100) 37%,var(--pg-gray-200) 63%);background-size:400% 100%;animation:pg-skel-opc 1.4s ease infinite;}
  @keyframes pg-skel-opc{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  .opc-empty-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:5;}

  .opc-drawer-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--pg-gray-200);font-size:13px;}
  .opc-drawer-row:last-child{border-bottom:none;}
  .opc-drawer-row .v{font-weight:700;text-align:right;}
  .opc-drawer-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--pg-gray-500);margin:18px 0 8px;}
  .opc-drawer-section-title:first-child{margin-top:0;}

  /* ---- Reservation drawer header: guest name is the strongest label, the       */
  /* reservation number is visually secondary (§3). ---- */
  .rd-head-guest{font-size:17px;font-weight:700;color:var(--pg-gray-900);line-height:1.25;}
  .rd-head-num{font-size:12px;color:var(--pg-gray-500);font-weight:500;margin-top:1px;}
  .rd-head-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

  /* ---- Compact icon rows for the Stay Summary card ---- */
  .rd-card{border:1px solid var(--pg-border);border-radius:var(--pg-radius-btn);background:#fff;overflow:hidden;}
  .rd-irow{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--pg-gray-200);font-size:12.5px;}
  .rd-irow:last-child{border-bottom:none;}
  .rd-irow .ic{width:16px;height:16px;flex-shrink:0;color:var(--pg-gray-500);display:inline-flex;}
  .rd-irow .k{color:var(--pg-gray-600);min-width:108px;flex-shrink:0;}
  .rd-irow .v{font-weight:600;color:var(--pg-gray-900);text-align:right;flex:1;}
  .rd-attr-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;}

  /* ---- Action hierarchy: primary dominant, secondary neutral, destructive        */
  /* separated at the bottom — buttons must NOT all carry the same visual weight    */
  /* (§3). This replaces the old 2-column grid of identical outline buttons. ---- */
  .rd-actions{display:flex;flex-direction:column;gap:10px;width:100%;}
  .rd-actions .btn{width:100%;justify-content:center;}
  .rd-secondary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .rd-danger-row{border-top:1px solid var(--pg-border);padding-top:10px;margin-top:2px;}

  @media (max-width:900px){ .opc-wrap{height:calc(100vh - 460px);} }

  .opc-group-header{flex-wrap:wrap;row-gap:6px;}
  .opc-group-summary{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:11px;color:var(--pg-gray-600);}
  .opc-group-summary b{color:var(--pg-gray-900);font-weight:700;}
  .opc-row.highlight-flash{animation:opc-row-flash 1.8s ease-out 1;}
  @keyframes opc-row-flash{0%{background:var(--pg-primary-light);}100%{background:transparent;}}

  .opc-bar.res, .opc-bar.block{touch-action:none;}
  .opc-bar.drag-source{opacity:.35;}
  .opc-drag-ghost{position:absolute;top:8px;height:36px;border-radius:6px;border:2px dashed var(--pg-primary);background:rgba(27,132,255,.14);z-index:15;pointer-events:none;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:700;color:var(--pg-primary-dark);overflow:hidden;white-space:nowrap;}
  .opc-drag-ghost.invalid{border-color:var(--pg-danger);background:rgba(248,40,90,.12);color:var(--pg-danger);}

  /* ---- Contextual range selection: replaces the old permanently-visible per-row  */
  /* quickadd (+) and block (🚫) icon buttons. A click or drag on empty cells marks */
  /* a pending selection — highlighted range, a small tooltip bubble, and a single  */
  /* "+ Add" control — which the user must explicitly click to choose what to do    */
  /* with it, via the quick-create popover below. Nothing happens until that click. */
  .opc-range-select{position:absolute;top:2px;bottom:2px;background:rgba(27,132,255,.12);border:2px solid var(--pg-primary);border-radius:6px;z-index:14;display:flex;align-items:center;justify-content:center;}
  .opc-range-select.dragging{border-style:dashed;pointer-events:none;}
  .opc-range-tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--pg-gray-900);color:#fff;font-size:11px;font-weight:600;white-space:nowrap;padding:5px 10px;border-radius:6px;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.18);}
  .opc-range-tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pg-gray-900);}
  .opc-range-add{background:var(--pg-primary);color:#fff;border:none;border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(27,132,255,.35);}
  .opc-range-add:hover{background:var(--pg-primary-dark);}

  .opc-quickcreate-popover{position:fixed;z-index:60;width:270px;background:#fff;border:1px solid var(--pg-border);border-radius:12px;box-shadow:0 12px 32px rgba(17,24,39,.18);padding:8px;}
  .opc-qc-opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:1.5px solid transparent;border-radius:9px;padding:9px 10px;cursor:pointer;font-family:inherit;}
  .opc-qc-opt + .opc-qc-opt{margin-top:4px;}
  .opc-qc-opt > span:last-child{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .opc-qc-opt .qc-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .opc-qc-opt .qc-label{font-size:13px;font-weight:700;color:var(--pg-gray-900);}
  .opc-qc-opt .qc-desc{font-size:11.5px;color:var(--pg-gray-500);margin-top:1px;}
  .opc-qc-opt.new-res .qc-ic{background:var(--pg-primary-light);color:var(--pg-primary);}
  .opc-qc-opt.new-res:hover{background:var(--pg-primary-light);border-color:var(--pg-primary);}
  .opc-qc-opt.block-room .qc-ic{background:var(--pg-danger-light);color:var(--pg-danger);}
  .opc-qc-opt.block-room:hover{background:var(--pg-danger-light);border-color:var(--pg-danger);}
  .opc-qc-cancel{display:block;width:100%;text-align:center;background:none;border:none;padding:8px 0 2px;margin-top:2px;font-size:12px;font-weight:600;color:var(--pg-gray-500);cursor:pointer;border-top:1px solid var(--pg-gray-200);}
  .opc-qc-cancel:hover{color:var(--pg-gray-800);}

  .opc-helper-text{font-size:11.5px;color:var(--pg-gray-500);display:flex;align-items:center;gap:6px;}

  .impact-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--pg-gray-200);font-size:12.5px;gap:10px;}
  .impact-row:last-child{border-bottom:none;}
  .impact-row .chg{color:var(--pg-primary);font-weight:700;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("operations-calendar", ["Hotel Operations", "Operations Calendar"]);
var s = PG.getState();
// Same dead-code-today role gate as physical-rooms.html — CURRENT_ROLE is hardcoded.
var CAN_VIEW = PG.hasPermission('view_operations_calendar');
var CAN_MANAGE = PG.hasPermission('assign_rooms'); // move/resize/create reservations, assign/change room
var CAN_BLOCK = PG.hasPermission('block_rooms'); // create/move/resize/edit/end room blocks

var CELL_W = 90, ROOM_COL_W = 210;
var BLOCK_TYPES = ['Out of Order', 'Out of Service', 'Management Hold', 'Other'];
var RES_STATUSES = ['Draft','Pending Payment','Confirmed','Completed','No Show'];
var PAY_STATUSES = ['Pay on Arrival','Payment Required','Link Sent','Paid','Failed','Expired','Refund Pending','Refunded'];
var ROOM_STATUSES = ['Available','Reserved','Held','Out of Order','Out of Service','Inactive'];
var CANCEL_REASONS = ['Guest requested cancellation','Change of plans','Duplicate booking','Hotel-initiated','Other'];

function init(){
  var viewDays = 14;
  var startDate = PG.TODAY;
  var collapsed = {};
  var searchQuery = '';
  var filters = { building:'all', floor:'all', roomStatus:'all', resStatus:'all', payStatus:'all', arrDep:'all' };

  function distinct(arr){ var out=[]; arr.forEach(function(v){ if(v!=null && v!=='' && out.indexOf(v)===-1) out.push(v); }); return out; }
  function rt(id){ return s.roomTypes.find(function(r){return r.id===id;}); }
  function rtName(id){ var r=rt(id); return r?r.name:id; }
  function custOf(res){ return s.customers.find(function(c){return c.id===res.customerId;}); }

  var html = '';
  html += '<div class="pg-page-head"><div><h1>Operations Calendar</h1><div class="sub">Manage reservations, room assignments, and room blocks</div></div>' +
    '<div class="pg-actions">' +
      (CAN_BLOCK ? '<button type="button" class="btn btn-outline" id="headerAddBlockBtn">' + PG.icon('ban',15) + ' Add Room Block</button>' : '') +
      (CAN_MANAGE ? '<a class="btn btn-primary" href="new-reservation.html">' + PG.icon('plus',15) + ' New Reservation</a>' : '') +
    '</div></div>';

  html += '<div class="card"><div class="card-body">' +
    '<div class="opc-toolbar">' +
      '<div class="opc-toolbar-left">' +
        '<button class="btn btn-outline btn-sm ic-dir" id="prevBtn" aria-label="Previous period" title="Previous period">' + PG.icon('chevronLeft',15) + '</button>' +
        '<button class="btn btn-outline btn-sm" id="todayBtn">Today</button>' +
        '<button class="btn btn-outline btn-sm ic-dir" id="nextBtn" aria-label="Next period" title="Next period">' + PG.icon('chevronRight',15) + '</button>' +
        '<span class="opc-range-label" id="opcRangeLabel"></span>' +
        '<input type="date" class="form-control" id="datePicker" aria-label="Jump to date" title="Jump to date" value="'+startDate+'" style="width:132px;">' +
        PG.segmented('opcSpan', [{value:'7',label:'7 Days'},{value:'14',label:'14 Days'},{value:'30',label:'30 Days'}], String(viewDays), {ariaLabel:'Date range length'}) +
      '</div>' +
      '<div class="opc-toolbar-right">' +
        '<input class="form-control opc-search" id="opcSearch" type="search" placeholder="Search guest, reservation or room" aria-label="Search calendar">' +
        '<button class="btn btn-outline btn-sm" id="filtersBtn">' + PG.icon('filter',15) + ' Filters<span id="filterCount"></span></button>' +
        '<button type="button" class="btn-icon" id="moreActionsBtn" aria-haspopup="menu" aria-expanded="false" title="More actions" aria-label="More actions">' + PG.icon('dots',16) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="opc-legend" id="opcLegend"></div>' +
    '<div class="opc-chips" id="opcChips"></div>' +
    '<div class="opc-helper-text">' + PG.icon('info',13) + ' Drag a bar to move &middot; Drag its edges to resize &middot; Select a room and date range to add a reservation or block.</div>' +
    '<div class="opc-wrap" id="opcWrap"><div class="opc-grid" id="opcGrid"></div></div>' +
  '</div></div>';

  page.innerHTML = html;
  PG.enhanceSelects(page);

  renderLegend();
  syncRangeLabel();
  attachDragHandlers();
  wireHeaderActions();
  document.getElementById('opcGrid').innerHTML = skeletonHtml();
  // Deep-link support, e.g. operations-calendar.html?room=std-101 — used by Physical
  // Rooms' "View on Operations Calendar" action. Expands that room's group if collapsed
  // and scrolls/flashes its row once the grid has rendered.
  var deepLinkRoomId = new URLSearchParams(location.search).get('room');
  setTimeout(function(){
    renderGrid();
    if (deepLinkRoomId){

  function renderChips(){
    var chips = [];
    function chip(key, label){ chips.push('<span class="opc-chip">'+label+'<button data-clear="'+key+'" aria-label="Remove filter">&times;</button></span>'); }
    if (filters.from && filters.to) chip('date', PG.fmtDateShort(filters.from)+' – '+PG.fmtDateShort(filters.to));
    if (filters.roomType && filters.roomType!=='all') chip('roomType', 'Room Type: '+rtName(filters.roomType));
    if (filters.building && filters.building!=='all') chip('building', 'Building: '+filters.building);
    if (filters.floor && filters.floor!=='all') chip('floor', 'Floor: '+filters.floor);
    if (filters.roomStatus!=='all') chip('roomStatus', 'Room Status: '+filters.roomStatus);
    if (filters.resStatus!=='all') chip('resStatus', 'Reservation: '+filters.resStatus);
    if (filters.payStatus!=='all') chip('payStatus', 'Payment: '+filters.payStatus);
    if (filters.arrDep!=='all') chip('arrDep', filters.arrDep==='arrivals'?'Arrivals in view':'Departures in view');
    var box = document.getElementById('opcChips');
    if (!chips.length){
      box.innerHTML='';
      var zeroEl = document.getElementById('filterCount');
      if (zeroEl) zeroEl.innerHTML = '';
      return;
    }
    box.innerHTML = chips.join('') + '<button class="btn btn-outline btn-sm" id="chipsClearAll">Clear All</button>';
    var countEl = document.getElementById('filterCount');
    if (countEl) countEl.innerHTML = chips.length ? ' <span class="pg-chip-count" style="background:var(--pg-primary);color:#fff;">' + chips.length + '</span>' : '';
    box.querySelectorAll('[data-clear]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.dataset.clear;
        if (k==='date'){ filters.from=null; filters.to=null; } else { filters[k]='all'; }
        renderChips(); renderGrid();
      });
    });
    var clearAll = document.getElementById('chipsClearAll');
    if (clearAll) clearAll.addEventListener('click', function(){ filters = { building:'all', floor:'all', roomStatus:'all', resStatus:'all', payStatus:'all', arrDep:'all' }; renderChips(); renderGrid(); });
  }

  /* ================================================================ */
  /* Grid rendering                                                     */
  /* ================================================================ */
  function skeletonHtml(){
    return [0,1,2,3,4].map(function(){ return '<div class="opc-skeleton-row"><div class="opc-skeleton-bar" style="width:160px;"></div></div>'; }).join('');
  }
  function dateWindow(){ return PG.dateRange(startDate, PG.addDays(startDate, viewDays)); }

  function visibleRooms(st){
    return st.physicalRooms.filter(function(r){
      if (filters.roomType && filters.roomType!=='all' && r.roomTypeId!==filters.roomType) return false;
      if (filters.building!=='all' && r.building!==filters.building) return false;
      if (filters.floor!=='all' && String(r.floor)!==filters.floor) return false;
      if (filters.roomStatus!=='all' && PG.roomStatusOn(st, r.id, PG.TODAY)!==filters.roomStatus) return false;
      return true;
    });
  }
  function barsForRoom(st, roomId){
    var out = [];
    st.roomAssignments.filter(function(a){return a.physicalRoomId===roomId && a.assignmentStatus!=='Cancelled';}).forEach(function(a){
      var res = st.reservations.find(function(r){return r.id===a.reservationId;});
      if (!res) return;
      out.push({kind:'reservation', assignment:a, reservation:res, start:a.arrivalDate, end:a.departureDate});
    });
    st.roomBlocks.filter(function(b){return b.physicalRoomId===roomId;}).forEach(function(b){
      out.push({kind:'block', block:b, start:b.startDate, end:b.endDate});
    });
    out.forEach(function(bar){ bar.conflict=false; });
    for (var i=0;i<out.length;i++){
      for (var j=i+1;j<out.length;j++){
        if (out[i].start < out[j].end && out[j].start < out[i].end){ out[i].conflict=true; out[j].conflict=true; }
      }
    }
    return out;
  }
  function barMatchesSearch(bar, room){
    if (!searchQuery) return null;
    var hay = [];
    if (bar.kind==='reservation'){
      var res=bar.reservation, cust=custOf(res);
      hay = [res.id, cust?cust.name:'', cust?cust.phone:''];
    }
    if (room) hay = hay.concat([room.roomNumber, rtName(room.roomTypeId)]);
    return hay.some(function(v){ return (v||'').toLowerCase().indexOf(searchQuery)>-1; });
  }
  function barPassesFilters(bar, viewStart, viewEndExclusive){
    if (bar.kind==='block') return true;
    var res = bar.reservation;
    if (filters.resStatus!=='all' && res.status!==filters.resStatus) return false;
    if (filters.payStatus!=='all' && res.paymentStatus!==filters.payStatus) return false;
    if (filters.arrDep==='arrivals' && !(res.checkIn>=viewStart && res.checkIn<viewEndExclusive)) return false;
    if (filters.arrDep==='departures' && !(res.checkOut>=viewStart && res.checkOut<viewEndExclusive)) return false;
    return true;
  }

  function renderBarHtml(bar, room, dates){
    var viewStart = dates[0], viewEndExclusive = PG.addDays(dates[dates.length-1], 1);
    if (bar.start >= viewEndExclusive || bar.end <= viewStart) return '';
    var clipStart = bar.start < viewStart, clipEnd = bar.end > viewEndExclusive;
    var effStart = clipStart ? viewStart : bar.start, effEnd = clipEnd ? viewEndExclusive : bar.end;
    var startIdx = PG.nightsBetween(viewStart, effStart), endIdx = PG.nightsBetween(viewStart, effEnd);
    var left = startIdx*CELL_W + 3, width = Math.max(10, (endIdx-startIdx)*CELL_W - 6);
    var radiusStyle = (clipStart?'border-top-left-radius:0;border-bottom-left-radius:0;':'') + (clipEnd?'border-top-right-radius:0;border-bottom-right-radius:0;':'');

    // Handles are rendered for anything the current user may actually resize, and are
    // suppressed on a clipped edge (there is no real boundary there to drag).
    function handles(canEdit, whatStart, whatEnd){
      if (!canEdit) return '';
      return '<span class="opc-handle start" title="' + whatStart + '" aria-hidden="true"></span>' +
             '<span class="opc-handle end" title="' + whatEnd + '" aria-hidden="true"></span>';
    }
    var narrow = width < 76;
    var wideEnoughForDates = width >= 240;

    if (bar.kind==='block'){
      var typeClass = 'blk-'+bar.block.type.toLowerCase().replace(/\s+/g,'-');
      var label = bar.block.type + (room?' — Room '+room.roomNumber:'');
      var blkEndInclusive = PG.addDays(bar.block.endDate,-1);
      return '<button type="button" class="opc-bar block '+typeClass+(bar.conflict?' conflict':'')+
        (CAN_BLOCK?' editable':'')+(clipStart?' clip-start':'')+(clipEnd?' clip-end':'')+(narrow?' narrow':'')+(wideEnoughForDates?' with-dates':'')+
        '" style="left:'+left+'px;width:'+width+'px;'+radiusStyle+'" ' +
        'data-kind="block" data-block="'+bar.block.id+'" tabindex="0" ' +
        'aria-label="'+PG.esc(label)+', '+PG.fmtDateShort(bar.block.startDate)+' to '+PG.fmtDateShort(blkEndInclusive)+
        (bar.conflict?', conflicts with another item':'')+(CAN_BLOCK?'. Use the row menu to move or resize this block.':'')+'" ' +
        'title="'+PG.esc(bar.block.type + ' — ' + (bar.block.reason||'no reason recorded') + '\n' +
          PG.fmtDate(bar.block.startDate) + ' to ' + PG.fmtDate(blkEndInclusive))+'">' +
        handles(CAN_BLOCK, 'Drag to change the block start', 'Drag to change the block end') +
        (wideEnoughForDates ? '<span class="opc-bar-date s">'+PG.fmtDateShort(bar.block.startDate)+'</span>' +
          '<span class="opc-bar-date e">'+PG.fmtDateShort(blkEndInclusive)+'</span>' : '') +
        '<span class="opc-bar-body"><span class="opc-bar-label">'+PG.esc(bar.block.type)+'</span>' +
        '<span class="opc-bar-sub">'+PG.icon(blockIcon(bar.block.type),12)+' '+PG.esc(bar.block.reason||'Blocked')+'</span></span>' +
        '<span class="opc-bar-icons">' + (bar.conflict?PG.icon('alert',13):'') + '</span>' +
      '</button>';
    }

    var res = bar.reservation, cust = custOf(res);
    var statusClass = 'st-'+res.status.toLowerCase().replace(/\s+/g,'-');
    var payException = ['Failed','Expired','Refund Pending'].indexOf(res.paymentStatus)>-1;
    var multiRoom = res.rooms.reduce(function(a,x){return a+x.qty;},0) > 1;
    var matches = barMatchesSearch(bar, room);
    var label = (cust?cust.name:'Guest') + ' — ' + res.status;
    var tip = (cust?cust.name:'Guest') + '  ·  ' + res.id + '\n' +
      PG.fmtDate(res.checkIn) + ' → ' + PG.fmtDate(res.checkOut) + '  (' + PG.nightsBetween(res.checkIn,res.checkOut) + ' nights)\n' +
      res.status + '  ·  ' + res.paymentStatus + (room ? '\nRoom ' + room.roomNumber : '') +
      (res.notes ? '\nNote: ' + res.notes : '') +
      (CAN_MANAGE ? '\n\nDrag the bar to move the stay, or an edge to change arrival/departure.' : '');
    return '<button type="button" class="opc-bar res '+statusClass+(bar.conflict?' conflict':'')+
      (matches===true?' match':'')+(matches===false?' dim':'')+(CAN_MANAGE?' editable':'')+
      (clipStart?' clip-start':'')+(clipEnd?' clip-end':'')+(narrow?' narrow':'')+(wideEnoughForDates?' with-dates':'')+
      '" style="left:'+left+'px;width:'+width+'px;'+radiusStyle+'" ' +
      'data-kind="reservation" data-assignment="'+bar.assignment.id+'" data-res="'+res.id+'" data-item="'+bar.assignment.reservationItemId+'" tabindex="0" ' +
      'aria-label="'+PG.esc(label)+', '+PG.fmtDateShort(res.checkIn)+' to '+PG.fmtDateShort(res.checkOut)+
        (payException?', payment exception':'')+(bar.conflict?', conflicts with another item':'')+
        (CAN_MANAGE?'. Press Enter to open, or use the drawer to change dates and room.':'')+'" ' +
      'title="'+PG.esc(tip)+'">' +
      handles(CAN_MANAGE, 'Drag to change arrival', 'Drag to change departure') +
      (wideEnoughForDates ? '<span class="opc-bar-date s">'+PG.fmtDateShort(res.checkIn)+'</span>' +
        '<span class="opc-bar-date e">'+PG.fmtDateShort(res.checkOut)+'</span>' : '') +
      '<span class="opc-bar-body">' +
        '<span class="opc-bar-label">'+PG.esc(cust?cust.name:'Guest')+'</span>' +
        '<span class="opc-bar-sub">'+PG.esc(res.id)+' · '+PG.esc(res.status)+'</span>' +
      '</span>' +
      '<span class="opc-bar-icons">' +
        (payException?'<span title="Payment exception: '+PG.esc(res.paymentStatus)+'">'+PG.icon('card',13)+'</span>':'') +
        (multiRoom?'<span title="Multi-room reservation">'+PG.icon('layers',13)+'</span>':'') +
        (res.notes?'<span title="Has notes">'+PG.icon('note',13)+'</span>':'') +
        (bar.conflict?'<span title="Conflict — overlapping assignment">'+PG.icon('alert',13)+'</span>':'') +
      '</span>' +
    '</button>';
  }

  // Block types carry their own glyph so the meaning is never colour-only.
  function blockIcon(type){
    return { 'Out of Order':'wrench', 'Out of Service':'ban', 'Management Hold':'lockClosed' }[type] || 'info';
  }

  function renderGrid(){
    clearSelection();
    var st = PG.getState();
    s = st;
    var dates = dateWindow();
    var wrap = document.getElementById('opcGrid');
    syncRangeLabel();

    if (!st.physicalRooms.length){
      wrap.innerHTML = '<div class="empty-state"><div class="ic">&#127976;</div>No physical rooms exist for this property yet.<br><br><a class="btn btn-primary" href="physical-rooms.html">Go to Physical Rooms</a></div>';
      return;
    }

    var headerHtml = '<div class="opc-header-row"><div class="opc-corner">Room</div>' +
      dates.map(function(d){
        var isToday = d===PG.TODAY, isWeekend = [4,5].indexOf(PG.dayOfWeek(d))>-1;
        return '<div class="opc-date-cell'+(isToday?' today':'')+(isWeekend?' weekend':'')+'"><div class="dow">'+PG.weekdayOf(d)+'</div>'+PG.fmtDateShort(d)+'</div>';
      }).join('') + '</div>';

    var bodyHtml = '';

    var rooms = visibleRooms(st);
    if (!rooms.length){
      bodyHtml += '<div class="empty-state"><div class="ic">' + PG.icon('search',30) + '</div>No rooms match your filters.<br><br><button class="btn btn-outline btn-sm" id="opcClearInline">Clear Filters</button></div>';
    } else {
      st.roomTypes.forEach(function(typeDef){
        var typeRooms = rooms.filter(function(r){return r.roomTypeId===typeDef.id;}).sort(function(a,b){
          var na=parseInt(a.roomNumber,10), nb=parseInt(b.roomNumber,10);
          if (!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
          return a.roomNumber<b.roomNumber?-1:1;
        });
        if (!typeRooms.length) return;
        var isCollapsed = !!collapsed[typeDef.id];
        var gs = groupSummary(st, typeDef);
        bodyHtml += '<div class="opc-group-header" data-group="'+typeDef.id+'">' +
          '<button type="button" class="opc-collapse-btn" data-toggle-group="'+typeDef.id+'" aria-expanded="'+(!isCollapsed)+'">'+(isCollapsed?'&#9656;':'&#9662;')+'</button>' +
          '<span class="ic" style="display:inline-flex;color:var(--pg-gray-500);">'+PG.icon('bed',14)+'</span>' +
          '<strong style="text-transform:uppercase;letter-spacing:.02em;font-size:11.5px;">'+PG.esc(typeDef.name)+'</strong>' +
          '<span class="muted text-sm">&middot; '+typeRooms.length+' room'+(typeRooms.length===1?'':'s')+'</span>' +
          '<div class="opc-group-summary">' +
            '<span><b>'+gs.available+'</b> available &middot; <b>'+gs.reserved+'</b> reserved &middot; <b>'+gs.held+'</b> held &middot; <b>'+gs.blocked+'</b> blocked</span>' +
          '</div>' +
        '</div>';
        if (!isCollapsed) bodyHtml += typeRooms.map(function(room){ return renderRoomRow(st, room, dates); }).join('');
      });
    }

    wrap.innerHTML = headerHtml + bodyHtml;
    wrap.querySelectorAll('[data-toggle-group]').forEach(function(btn){
      btn.addEventListener('click', function(){ var g=btn.dataset.toggleGroup; collapsed[g]=!collapsed[g]; renderGrid(); });
    });
    var clearInline = document.getElementById('opcClearInline');
    if (clearInline) clearInline.addEventListener('click', function(){ document.getElementById('f-clear').click(); });
    wireGridInteractions(wrap);

    if (searchQuery){
      var firstMatch = wrap.querySelector('.opc-bar.match');
      if (firstMatch) firstMatch.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    }
  }

  // Compact dot + label — Clean/Dirty/Inspected/Checked In/Out are deliberately not
  // among the supported statuses (housekeeping/front-desk workflows are out of scope).
  function statusDotClass(status){
    return { 'Available':'available', 'Reserved':'reserved', 'Held':'held',
      'Out of Order':'out-of-order', 'Out of Service':'out-of-service', 'Inactive':'inactive' }[status] || 'inactive';
  }
  function renderRoomRow(st, room, dates){
    var bars = barsForRoom(st, room.id);
    var visibleBars = bars.filter(function(b){ return barPassesFilters(b, dates[0], PG.addDays(dates[dates.length-1],1)); });
    var barsHtml = visibleBars.map(function(b){ return renderBarHtml(b, room, dates); }).join('');
    var cellsHtml = dates.map(function(d,i){
      var isToday=d===PG.TODAY, isWeekend=[4,5].indexOf(PG.dayOfWeek(d))>-1;
      return '<div class="opc-cell'+(isToday?' today':'')+(isWeekend?' weekend':'')+'" style="left:'+(i*CELL_W)+'px;width:'+CELL_W+'px;" data-empty-room="'+room.id+'" data-empty-rt="'+room.roomTypeId+'" data-empty-date="'+d+'"></div>';
    }).join('');
    var status = PG.roomStatusOn(st, room.id, PG.TODAY);
    return '<div class="opc-row" data-room-row="'+room.id+'">' +
      '<div class="opc-room-info"><div class="opc-room-num">Room '+PG.esc(room.roomNumber)+'</div>' +
      '<div class="opc-room-meta">'+PG.esc(rtName(room.roomTypeId))+' &middot; Floor '+room.floor+'</div>' +
      '<div class="opc-status"><span class="opc-status-dot '+statusDotClass(status)+'"></span>'+PG.esc(status)+'</div>' +
      '</div>' +
      '<div class="opc-track" style="width:'+(dates.length*CELL_W)+'px;">'+cellsHtml+barsHtml+'</div>' +
    '</div>';
  }

  function wireGridInteractions(root){
    root.querySelectorAll('.opc-bar[data-kind="reservation"]').forEach(function(el){
      el.addEventListener('click', function(){ if (suppressNextClick){ suppressNextClick=false; return; } openReservationDrawer(el.dataset.res, el.dataset.item, el.dataset.assignment); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } });
    });
    root.querySelectorAll('.opc-bar[data-kind="block"]').forEach(function(el){
      el.addEventListener('click', function(){ if (suppressNextClick){ suppressNextClick=false; return; } openBlockDrawer(el.dataset.block); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } });
    });
    // Empty-cell clicks/drags are handled by attachDragHandlers()'s single delegated
    // mousedown listener (beginRangeDrag) — that produces a persistent selection with
    // its own "+ Add" control and quick-create popover, rather than navigating directly.
  }

  /* ================================================================ */
  /* Reservation bar / room-block drag interactions.                          */
  /* Never save immediately: drag → snapped preview → release → confirm       */
  /* modal → revalidate → atomic save → refresh, or Cancel/fail → the         */
  /* preview is discarded and nothing was ever written. Attached once via     */
  /* delegation on the persistent #opcGrid node so it survives every          */
  /* renderGrid() re-render (only .innerHTML is replaced, not the node).      */
  /* ================================================================ */
  var suppressNextClick = false;
  // Must match .opc-handle's width in CSS — the visible handle IS the hit target.
  var EDGE_PX = 11;
  var activeSelection = null; // {roomId, roomTypeId, lo, hi} — the pending click/drag range

  function attachDragHandlers(){
    document.getElementById('opcGrid').addEventListener('mousedown', function(e){
      if ((!CAN_MANAGE && !CAN_BLOCK) || e.button !== 0) return;
      if (e.target.closest('.opc-range-select')) return; // the selection's own "+ Add" control handles its own click
      var bar = e.target.closest('.opc-bar');
      if (bar){
        // A reservation bar needs assign_rooms; a block bar needs block_rooms — each
        // drag path is gated by the specific permission it actually exercises, not the
        // page-wide OR check above (that only decides whether dragging is even possible).
        if (bar.dataset.kind === 'block' ? !CAN_BLOCK : !CAN_MANAGE) return;
        beginBarDrag(bar, e); return;
      }
      var cell = e.target.closest('[data-empty-room]');
      if (cell) beginRangeDrag(cell, e);
    });
    document.addEventListener('mousedown', function(e){
      if (!activeSelection) return;
      if (e.target.closest('.opc-range-select') || e.target.closest('.opc-quickcreate-popover') || e.target.closest('[data-empty-room]')) return;
      clearSelection();
    });
  }

  function ghostEl(){
    var g = document.getElementById('opcDragGhost');
    if (!g){ g = document.createElement('div'); g.id = 'opcDragGhost'; g.className = 'opc-drag-ghost'; }
    return g;
  }
  function removeGhost(){ var g = document.getElementById('opcDragGhost'); if (g && g.parentNode) g.parentNode.removeChild(g); }

  function beginBarDrag(barEl, e){
    var kind = barEl.dataset.kind;
    var rowEl = barEl.closest('.opc-row');
    if (!rowEl) return;
    var rect = barEl.getBoundingClientRect();
    var mode = 'move';
    if (e.clientX - rect.left <= EDGE_PX) mode = 'resize-start';
    else if (rect.right - e.clientX <= EDGE_PX) mode = 'resize-end';

    var ctx = {
      kind: kind, mode: mode, barEl: barEl, origRowEl: rowEl,
      origLeft: parseFloat(barEl.style.left) || 0, origWidth: parseFloat(barEl.style.width) || CELL_W,
      startX: e.clientX, startY: e.clientY, dayDelta: 0, moved: false, targetRowEl: rowEl,
      resId: barEl.dataset.res, itemId: barEl.dataset.item, assignmentId: barEl.dataset.assignment,
      blockId: barEl.dataset.block
    };

    function onMove(ev){
      var dx = ev.clientX - ctx.startX, dy = ev.clientY - ctx.startY;
      if (!ctx.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 6)) ctx.moved = true;
      if (!ctx.moved) return;
      barEl.classList.add('drag-source');
      ctx.dayDelta = Math.round(dx / CELL_W);
      // Vertical row-change detection only applies to moving a whole reservation bar —
      // resizing an edge, and blocks in this pass, always stay on their own row.
      if (kind === 'reservation' && mode === 'move'){
        var under = document.elementFromPoint(ev.clientX, ev.clientY);
        var rowUnder = under && under.closest('.opc-row');
        if (rowUnder) ctx.targetRowEl = rowUnder;
      }
      renderBarGhost(ctx);
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      barEl.classList.remove('drag-source');
      removeGhost();
      if (ctx.moved){ suppressNextClick = true; finishBarDrag(ctx); }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  }

  function renderBarGhost(ctx){
    var track = ctx.targetRowEl.querySelector('.opc-track');
    var g = ghostEl();
    if (g.parentNode !== track) track.appendChild(g);
    var left = ctx.origLeft, width = ctx.origWidth;
    if (ctx.mode === 'move'){ left = ctx.origLeft + ctx.dayDelta * CELL_W; }
    else if (ctx.mode === 'resize-start'){ left = ctx.origLeft + ctx.dayDelta * CELL_W; width = ctx.origWidth - ctx.dayDelta * CELL_W; }
    else if (ctx.mode === 'resize-end'){ width = ctx.origWidth + ctx.dayDelta * CELL_W; }
    var invalid = width < CELL_W - 10;
    g.className = 'opc-drag-ghost' + (invalid ? ' invalid' : '');
    g.style.left = left + 'px';
    g.style.width = Math.max(20, width) + 'px';
    g.textContent = ctx.kind === 'block' ? 'Move/Resize Block' : (ctx.targetRowEl !== ctx.origRowEl ? 'Move to Room ' + (roomById(ctx.targetRowEl.dataset.roomRow)||{}).roomNumber : 'Move / Resize Stay');
  }
  function roomById(id){ return s.physicalRooms.find(function(p){return p.id===id;}); }

  function finishBarDrag(ctx){
    if (ctx.kind === 'block'){ finishBlockDrag(ctx); return; }
    var origRoomId = ctx.origRowEl.dataset.roomRow, targetRoomId = ctx.targetRowEl.dataset.roomRow;
    if (targetRoomId !== origRoomId){
      // Vertical drag onto another room row — treated as a controlled Change Room action:
      // reuse the existing, already-validated Change Room drawer rather than a bespoke
      // drop-target validator, so this never duplicates that ranking/eligibility logic.
      PG.toast('Dropped on Room ' + (roomById(targetRoomId)||{}).roomNumber + ' — choose a room to confirm the change.', 'warn');
      openChangeRoomFor(ctx.resId, ctx.itemId, ctx.assignmentId);
      return;
    }
    var st = PG.getState();
    var res = st.reservations.find(function(r){return r.id===ctx.resId;});
    if (!res){ renderGrid(); return; }
    var newCheckIn = res.checkIn, newCheckOut = res.checkOut;
    if (ctx.mode === 'move'){ newCheckIn = PG.addDays(res.checkIn, ctx.dayDelta); newCheckOut = PG.addDays(res.checkOut, ctx.dayDelta); }
    else if (ctx.mode === 'resize-start'){ newCheckIn = PG.addDays(res.checkIn, ctx.dayDelta); }
    else if (ctx.mode === 'resize-end'){ newCheckOut = PG.addDays(res.checkOut, ctx.dayDelta); }
    if (ctx.dayDelta === 0 || newCheckOut <= newCheckIn){
      if (newCheckOut <= newCheckIn) PG.toast('Invalid date range — the stay must be at least 1 night.', 'danger');
      renderGrid();
      return;
    }
    openDateChangeConfirm(ctx.resId, newCheckIn, newCheckOut);
  }

  /* ---- Reservation date-change confirm modal ---- */
  var dateChangeModal = document.createElement('div');
  dateChangeModal.className = 'pg-modal-overlay';
  dateChangeModal.id = 'dateChangeModal';
  document.body.appendChild(dateChangeModal);
  function openDateChangeConfirm(resId, newCheckIn, newCheckOut){
    var st = PG.getState();
    var impact = PG.computeDateChangeImpact(st, resId, newCheckIn, newCheckOut);
    var res = st.reservations.find(function(r){return r.id===resId;});
    var cust = custOf(res);
    var roomsBefore = res.rooms.map(function(room){
      var a = st.roomAssignments.find(function(x){return x.reservationItemId===room.id && x.assignmentStatus!=='Cancelled';});
      var pr = a ? st.physicalRooms.find(function(p){return p.id===a.physicalRoomId;}) : null;
      return pr ? pr.roomNumber : '—';
    }).join(', ');
    var roomsAfter = impact.items.map(function(it){
      return it.assignedRoomIds.map(function(rid){ var pr=st.physicalRooms.find(function(p){return p.id===rid;}); return pr?pr.roomNumber:'—'; }).join('/') || 'none';
    }).join(', ');
    var totalChanged = Math.round(impact.oldTotal*100)!==Math.round(impact.total*100);
    var body = '';
    body += drow('Guest', PG.esc(cust?cust.name:'Guest')) + drow('Reservation #', res.id);
    body += drow('Room(s)', roomsBefore + (roomsBefore!==roomsAfter ? ' <span class="chg">&rarr; ' + PG.esc(roomsAfter) + '</span>' : ''));
    body += drow('Arrival', PG.fmtDate(impact.oldCheckIn) + (impact.oldCheckIn!==impact.newCheckIn ? ' <span class="chg">&rarr; ' + PG.fmtDate(impact.newCheckIn) + '</span>' : ''));
    body += drow('Departure', PG.fmtDate(impact.oldCheckOut) + (impact.oldCheckOut!==impact.newCheckOut ? ' <span class="chg">&rarr; ' + PG.fmtDate(impact.newCheckOut) + '</span>' : ''));
    body += drow('Nights', impact.oldNights + (impact.oldNights!==impact.newNights ? ' <span class="chg">&rarr; ' + impact.newNights + '</span>' : ''));
    if (res.rooms.length>1) body += '<div class="help-note" style="margin:10px 0;">This reservation has multiple rooms. Stay dates are shared across the whole reservation — this change applies to <strong>all ' + res.rooms.length + ' room item(s)</strong>, not just the one you dragged.</div>';
    body += drow('Room Charges', PG.fmtMoney(impact.oldRoomCharges) + (totalChanged ? ' <span class="chg">&rarr; ' + PG.fmtMoney(impact.roomCharges) + '</span>' : ''));
    body += drow('Taxes', PG.fmtMoney(impact.oldTaxAmount) + (totalChanged ? ' <span class="chg">&rarr; ' + PG.fmtMoney(impact.taxAmount) + '</span>' : ''));
    body += drow('Fees', PG.fmtMoney(impact.oldFeeAmount) + (totalChanged ? ' <span class="chg">&rarr; ' + PG.fmtMoney(impact.feeAmount) + '</span>' : ''));
    body += drow('Total', PG.fmtMoney(impact.oldTotal) + (totalChanged ? ' <span class="chg">&rarr; ' + PG.fmtMoney(impact.total) + '</span>' : ''));
    if (res.paymentStatus==='Paid' || res.paymentStatus==='Link Sent'){
      body += '<div class="help-note help-note-warning" style="margin-top:10px;">This reservation\'s payment status is ' + res.paymentStatus + '. Review the new total against the amount already paid/linked in Reservation Detail after confirming — this action does not change payment status automatically.</div>';
    }
    var problems = [];
    impact.items.forEach(function(it, i){
      if (!it.avail.ok) problems.push('Room Item ' + (i+1) + ': insufficient ' + PG.esc(rtName(it.roomTypeId)) + ' inventory for the new dates.');
      else if (it.shortfall>0) problems.push('Room Item ' + (i+1) + ': no eligible physical room for the new dates.');
    });
    if (!impact.validDates) problems.push('Departure must be after arrival.');
    var warningHtml = problems.length ? '<div class="help-note help-note-danger" style="margin-top:10px;">' + problems.map(PG.esc).join('<br>') + '</div>' : '';

    dateChangeModal.innerHTML = '<div class="pg-modal">' +
      '<div class="pg-modal-header"><h3>Confirm Date Change</h3><button class="pg-modal-close" id="dc-close">&times;</button></div>' +
      '<div class="pg-modal-body">' + body + warningHtml + '</div>' +
      '<div class="pg-modal-footer"><button class="btn btn-light" id="dc-cancel">Cancel and Revert</button><button class="btn btn-primary" id="dc-confirm"' + (impact.ok?'':' disabled') + '>Confirm Change</button></div>' +
    '</div>';
    document.getElementById('dc-close').addEventListener('click', function(){ PG.closeModal('dateChangeModal'); renderGrid(); });
    document.getElementById('dc-cancel').addEventListener('click', function(){ PG.closeModal('dateChangeModal'); renderGrid(); });
    if (impact.ok){
      document.getElementById('dc-confirm').addEventListener('click', function(){
        try {
          // Revalidate immediately before saving — state may have changed since the drawer opened.
          var freshImpact = PG.computeDateChangeImpact(PG.getState(), resId, newCheckIn, newCheckOut);
          if (!freshImpact || !freshImpact.ok){
            PG.toast('This change is no longer valid — availability changed. The reservation has been kept as it was.', 'danger');
            PG.closeModal('dateChangeModal'); renderGrid();
            return;
          }
          PG.applyDateChangeImpact(freshImpact, 'Hotel Admin');
          PG.toast('Reservation dates updated.', 'success');
          PG.closeModal('dateChangeModal');
          renderGrid();
        } catch (e) {
          PG.toast('Failed to save changes — the reservation has been kept as it was.', 'danger');
          PG.closeModal('dateChangeModal');
          renderGrid();
        }
      });
    }
    PG.openModal('dateChangeModal');
  }

  /* ---- Room block drag (move / resize, same room) ---- */
  function finishBlockDrag(ctx){
    var st = PG.getState();
    var blk = st.roomBlocks.find(function(b){return b.id===ctx.blockId;});
    if (!blk){ renderGrid(); return; }
    var newStart = blk.startDate, newEnd = blk.endDate;
    if (ctx.mode === 'move'){ newStart = PG.addDays(blk.startDate, ctx.dayDelta); newEnd = PG.addDays(blk.endDate, ctx.dayDelta); }
    else if (ctx.mode === 'resize-start'){ newStart = PG.addDays(blk.startDate, ctx.dayDelta); }
    else if (ctx.mode === 'resize-end'){ newEnd = PG.addDays(blk.endDate, ctx.dayDelta); }
    if (ctx.dayDelta === 0 || newEnd <= newStart){
      if (newEnd <= newStart) PG.toast('Invalid date range for this block.', 'danger');
      renderGrid();
      return;
    }
    openBlockDateChangeConfirm(ctx.blockId, newStart, newEnd);
  }
  var blockDateChangeModal = document.createElement('div');
  blockDateChangeModal.className = 'pg-modal-overlay';
  blockDateChangeModal.id = 'blockDateChangeModal';
  document.body.appendChild(blockDateChangeModal);
  function openBlockDateChangeConfirm(blockId, newStart, newEnd){
    var st = PG.getState();
    var blk = st.roomBlocks.find(function(b){return b.id===blockId;});
    var room = st.physicalRooms.find(function(p){return p.id===blk.physicalRoomId;});
    var overlapping = PG.assignmentsOverlapping(st, blk.physicalRoomId, newStart, newEnd);
    var body = drow('Room', room ? 'Room '+PG.esc(room.roomNumber) : '—') + drow('Block Type', blk.type) +
      drow('Dates', PG.fmtDate(blk.startDate)+' – '+PG.fmtDate(PG.addDays(blk.endDate,-1)) + ' <span class="chg">&rarr; ' + PG.fmtDate(newStart)+' – '+PG.fmtDate(PG.addDays(newEnd,-1)) + '</span>');
    var conflictHtml = '';
    if (overlapping.length){
      var rows = overlapping.map(function(a){
        var res = st.reservations.find(function(r){return r.id===a.reservationId;});
        var cust = res ? st.customers.find(function(c){return c.id===res.customerId;}) : null;
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:12.5px;gap:8px;">' +
          '<span><a href="reservation-detail.html?id='+a.reservationId+'" target="_blank">'+a.reservationId+'</a>'+(cust?' &middot; '+PG.esc(cust.name):'')+
            '<div class="muted text-sm">'+PG.fmtDateShort(a.arrivalDate)+'&ndash;'+PG.fmtDateShort(a.departureDate)+'</div></span>' +
          '<button type="button" class="btn btn-outline btn-sm bdc-conflict-change" data-assignment="'+a.id+'">Change Room</button>' +
        '</div>';
      }).join('');
      conflictHtml = '<div class="help-note help-note-danger" style="margin-top:12px;flex-direction:column;align-items:stretch;">' +
        '<div style="font-weight:700;margin-bottom:6px;">Room '+PG.esc(room.roomNumber)+' cannot be blocked for these dates — it conflicts with '+overlapping.length+' existing assignment'+(overlapping.length===1?'':'s')+'.</div>' +
        rows + '<div style="margin-top:8px;">Resolve or reassign before saving.</div></div>';
    }
    blockDateChangeModal.innerHTML = '<div class="pg-modal">' +
      '<div class="pg-modal-header"><h3>Confirm Block Change</h3><button class="pg-modal-close" id="bdc-close">&times;</button></div>' +
      '<div class="pg-modal-body">' + body + conflictHtml + '</div>' +
      '<div class="pg-modal-footer"><button class="btn btn-light" id="bdc-cancel">Cancel and Revert</button><button class="btn btn-primary" id="bdc-confirm"' + (overlapping.length?' disabled':'') + '>Confirm Change</button></div>' +
    '</div>';
    document.getElementById('bdc-close').addEventListener('click', function(){ PG.closeModal('blockDateChangeModal'); renderGrid(); });
    document.getElementById('bdc-cancel').addEventListener('click', function(){ PG.closeModal('blockDateChangeModal'); renderGrid(); });
    blockDateChangeModal.querySelectorAll('.bdc-conflict-change').forEach(function(btn){
      btn.addEventListener('click', function(){ openChangeRoomForBlockConflict(btn.dataset.assignment, function(){ openBlockDateChangeConfirm(blockId, newStart, newEnd); }); });
    });
    if (!overlapping.length){
      document.getElementById('bdc-confirm').addEventListener('click', function(){
        try {
          var fresh = PG.getState();
          var freshOverlap = PG.assignmentsOverlapping(fresh, blk.physicalRoomId, newStart, newEnd);
          if (freshOverlap.length){ PG.toast('This range now conflicts with a reservation — the block has been kept as it was.', 'danger'); PG.closeModal('blockDateChangeModal'); renderGrid(); return; }
          var rec = fresh.roomBlocks.find(function(b){return b.id===blockId;});
          var oldStart = rec.startDate, oldEnd = rec.endDate;
          rec.startDate = newStart; rec.endDate = newEnd;
          PG.setState(fresh);
          PG.addAudit('Room Block Updated', blockId + ' on Room ' + room.roomNumber + ' moved from ' + PG.fmtDateShort(oldStart) + '–' + PG.fmtDateShort(PG.addDays(oldEnd,-1)) + ' to ' + PG.fmtDateShort(newStart) + '–' + PG.fmtDateShort(PG.addDays(newEnd,-1)) + ' via Operations Calendar.');
          PG.toast('Block updated.', 'success');
          PG.closeModal('blockDateChangeModal');
          renderGrid();
        } catch (e) {
          PG.toast('Failed to save changes — the block has been kept as it was.', 'danger');
          PG.closeModal('blockDateChangeModal');
          renderGrid();
        }
      });
    }
    PG.openModal('blockDateChangeModal');
  }

  /* ---- Click or drag across empty cells → persistent selection → "+ Add" →   */
  /* quick-create popover (New Reservation / Block Room). Nothing is created    */
  /* until the user explicitly picks one of those two options. ---- */
  function beginRangeDrag(cellEl, e){
    var dates = dateWindow();
    var startIdx = dates.indexOf(cellEl.dataset.emptyDate);
    var ctx = { roomId: cellEl.dataset.emptyRoom, roomTypeId: cellEl.dataset.emptyRt, startIdx: startIdx, endIdx: startIdx, startX: e.clientX, moved: false };

    function onMove(ev){
      var dx = ev.clientX - ctx.startX;
      if (!ctx.moved && Math.abs(dx) > 4) ctx.moved = true;
      if (!ctx.moved) return;
      var deltaIdx = Math.round(dx / CELL_W);
      ctx.endIdx = Math.max(0, Math.min(dates.length - 1, startIdx + deltaIdx));
      renderSelectionOverlay(ctx.roomId, ctx.roomTypeId, Math.min(ctx.startIdx,ctx.endIdx), Math.max(ctx.startIdx,ctx.endIdx), true);
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      suppressNextClick = true;
      var lo = Math.min(ctx.startIdx, ctx.endIdx), hi = Math.max(ctx.startIdx, ctx.endIdx);
      setSelection(ctx.roomId, ctx.roomTypeId, lo, hi);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  }

  function setSelection(roomId, roomTypeId, lo, hi){
    activeSelection = { roomId: roomId, roomTypeId: roomTypeId, lo: lo, hi: hi };
    renderSelectionOverlay(roomId, roomTypeId, lo, hi, false);
  }
  function clearSelection(){
    activeSelection = null;
    var g = document.getElementById('opcSelectionBox');
    if (g && g.parentNode) g.parentNode.removeChild(g);
    closeQuickCreatePopover();
  }
  function renderSelectionOverlay(roomId, roomTypeId, lo, hi, dragging){
    var trackEl = document.querySelector('[data-room-row="'+roomId+'"] .opc-track');
    if (!trackEl) return;
    var dates = dateWindow();
    var room = roomById(roomId);
    var g = document.getElementById('opcSelectionBox');
    if (!g){ g = document.createElement('div'); g.id = 'opcSelectionBox'; trackEl.appendChild(g); }
    else if (g.parentNode !== trackEl){ trackEl.appendChild(g); }
    g.className = 'opc-range-select' + (dragging ? ' dragging' : '');
    g.style.left = (lo * CELL_W + 2) + 'px';
    g.style.width = ((hi - lo + 1) * CELL_W - 4) + 'px';
    if (dragging || (!CAN_MANAGE && !CAN_BLOCK)){ g.innerHTML = ''; return; }
    var nights = hi - lo + 1;
    var tip = 'Room ' + (room?PG.esc(room.roomNumber):'') + ' &middot; ' + PG.fmtDateShort(dates[lo]) + '&ndash;' + PG.fmtDateShort(PG.addDays(dates[hi],1)) + ' &middot; ' + nights + ' night' + (nights===1?'':'s');
    g.innerHTML = '<div class="opc-range-tip">' + tip + '</div>' +
      '<button type="button" class="opc-range-add" id="opcRangeAddBtn">' + PG.icon('plus',12) + ' Add</button>';
    document.getElementById('opcRangeAddBtn').addEventListener('click', function(e){
      e.stopPropagation();
      openQuickCreatePopover(document.getElementById('opcRangeAddBtn'));
    });
  }

  function openQuickCreatePopover(anchorBtn){
    closeQuickCreatePopover();
    if (!activeSelection) return;
    var sel = activeSelection;

    if (CAN_BLOCK) opts += '<button type="button" class="opc-qc-opt block-room" id="qcBlockRoom"><span class="qc-ic">' + PG.icon('ban',16) + '</span><span><span class="qc-label">Block Room</span><span class="qc-desc">Make Room ' + PG.esc(room.roomNumber) + ' unavailable</span></span></button>';

    // Anchored beside the "+ Add" trigger, flipped/clamped to stay in the viewport so it
    // never covers the selected row or the reservations around it.
    var popW = 270;
    var left = rect.right + 10;
    if (left + popW > window.innerWidth - 8) left = rect.left - popW - 10;
    if (left < 8) left = Math.max(8, Math.min(window.innerWidth - popW - 8, rect.left));

    pop.style.top = Math.max(8, rect.top - 6) + 'px';
    var popH = pop.offsetHeight;
    if (rect.top - 6 + popH > window.innerHeight - 8) pop.style.top = Math.max(8, window.innerHeight - popH - 8) + 'px';

    var newResBtn = document.getElementById('qcNewRes');
    if (newResBtn) newResBtn.addEventListener('click', function(){

  function onOutsideQuickCreate(e){

  function closeQuickCreatePopover(){
    var pop = document.getElementById('opcQuickCreatePopover');
    if (pop && pop.parentNode) pop.parentNode.removeChild(pop);
    document.removeEventListener('mousedown', onOutsideQuickCreate);

  /* ================================================================ */
  /* Room-type group summary — compact, read-only counters shown in each     */
  /* group header (§ Room-type groups). Manage Availability was removed from  */
  /* the Operations Calendar entirely per spec; the underlying availability   */
  /* engine (PG.computeAvailability et al.) is untouched and still used       */
  /* elsewhere (Rate Plans & Pricing, the hidden Availability & Inventory      */
  /* page) — only this page's UI surface for editing it was removed.          */
  /* ================================================================ */
  function groupSummary(st, typeDef){
    var typeRooms = st.physicalRooms.filter(function(r){return r.roomTypeId===typeDef.id;});
    var activeSellable = typeRooms.filter(function(r){return r.isActive && r.isSellable;}).length;
    var reserved=0, held=0, blocked=0;
    typeRooms.forEach(function(r){
      var stt = PG.roomStatusOn(st, r.id, PG.TODAY);
      if (stt==='Reserved') reserved++;
      else if (stt==='Held') held++;
      else if (stt==='Out of Order' || stt==='Out of Service') blocked++;
    });
    return { activeSellable: activeSellable, reserved: reserved, held: held, blocked: blocked,
      available: Math.max(0, activeSellable - reserved - held - blocked) };
  }

  /* ================================================================ */
  /* Reservation drawer                                                 */
  /* ================================================================ */
  var resDrawer = document.createElement('div');
  resDrawer.className = 'pg-drawer-overlay';
  resDrawer.id = 'resDrawer';
  document.body.appendChild(resDrawer);

  function drow(label, value){ return '<div class="opc-drawer-row"><span class="muted">'+label+'</span><span class="v">'+value+'</span></div>'; }

  function rdIcon(name, size){ return '<span class="ic">' + PG.icon(name, size||16) + '</span>'; }
  function rdRow(icon, label, value){
    return '<div class="rd-irow">' + rdIcon(icon) + '<span class="k">'+label+'</span><span class="v">'+value+'</span></div>';
  }

  // Amount paid / outstanding — this MVP has no partial payments, so the split is
  // binary off paymentStatus, matching the same logic reservation-detail.html uses.
  function paymentAmounts(res, total){
    if (res.paymentStatus === 'Paid') return { paid: total, outstanding: 0 };
    if (res.paymentStatus === 'Refunded') return { paid: 0, outstanding: 0 };
    return { paid: 0, outstanding: total };
  }

  function openReservationDrawer(resId, itemId, assignmentId){
    var st = PG.getState();
    var res = st.reservations.find(function(r){return r.id===resId;});
    if (!res) return;
    var item = res.rooms.find(function(x){return x.id===itemId;}) || res.rooms[0];
    var cust = custOf(res);
    var assignment = assignmentId ? st.roomAssignments.find(function(a){return a.id===assignmentId;}) : null;
    var room = assignment ? st.physicalRooms.find(function(p){return p.id===assignment.physicalRoomId;}) : null;
    var nights = PG.nightsBetween(res.checkIn, res.checkOut);
    var guests = res.rooms.reduce(function(a,x){return a+x.adults+(x.children||0);},0);
    var total = PG.reservationTotal(st, res);
    var amounts = paymentAmounts(res, total);
    var needsAttention = room ? !PG.roomEligibleForStay(st, room, res.checkIn, res.checkOut, assignment.id) : false;
    var canCancel = res.status!=='Cancelled' && res.status!=='Completed';

    /* ---- Header: guest name is the strongest label, reservation # secondary ---- */
    var header = '<div><h3 class="rd-head-guest">' + PG.esc(cust ? cust.name : 'Guest') + '</h3>' +
      '<div class="rd-head-num">' + res.id + '</div>' +
      '<div class="rd-head-badges">' + PG.statusBadge(res.status) + PG.payBadge(res.paymentStatus) + '</div></div>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'resDrawer\')" aria-label="Close">' + PG.icon('x',18) + '</button>';

    var body = '';

    /* ---- Stay summary card ---- */
    body += '<div class="opc-drawer-section-title">Stay Summary</div>';
    body += '<div class="rd-card">' +
      rdRow('calendar', 'Check-in', PG.fmtDateShort(res.checkIn)) +
      rdRow('calendar', 'Check-out', PG.fmtDateShort(res.checkOut)) +
      rdRow('clock', 'Nights', nights) +
      rdRow('user', 'Guests', guests) +
      rdRow('door', 'Room Type', PG.esc(rtName(item.roomTypeId))) +
      (room
        ? rdRow('door', 'Assigned Room', 'Room ' + PG.esc(room.roomNumber) + ' &middot; Floor ' + room.floor)
        : rdRow('alert', 'Assigned Room', '<span style="color:var(--pg-danger);">Needs Attention</span>')) +
      (room && roomAttrChips(room) ? '<div class="rd-irow">' + rdIcon('tag') + '<span class="k">Attributes</span><span class="v rd-attr-chips">' + roomAttrChips(room) + '</span></div>' : '') +
    '</div>';
    if (needsAttention) body += '<div class="help-note help-note-danger" style="margin-top:10px;">' + PG.icon('alert',16) + '<div>This room is no longer eligible for these dates (blocked or reassigned elsewhere). Choose a replacement.</div></div>';
    else if (!room) body += '<div class="help-note help-note-danger" style="margin-top:10px;">' + PG.icon('alert',16) + '<div>Needs Attention — this unit has no physical room. Assign one to resolve this reservation.</div></div>';

    /* ---- Guest section ---- */
    body += '<div class="opc-drawer-section-title">Guest</div>';
    body += '<div class="rd-card">' +
      rdRow('user', 'Name', PG.esc(cust ? cust.name : '—')) +
      rdRow('card', 'Phone', PG.esc(cust && cust.phone ? cust.phone : '—')) +
      rdRow('note', 'Email', PG.esc(cust && cust.email ? cust.email : '—')) +
      (cust && cust.nationality ? rdRow('info', 'Nationality', PG.esc(cust.nationality)) : '') +
    '</div>' +
    (cust ? '<a class="btn btn-light btn-sm" style="margin-top:8px;" href="guest-detail.html?id='+cust.id+'">' + PG.icon('user',15) + ' Open Guest Profile</a>' : '');

    /* ---- Payment section ---- */
    body += '<div class="opc-drawer-section-title">Payment</div>';
    body += '<div class="rd-card">' +
      '<div class="rd-irow">' + rdIcon('card') + '<span class="k">Status</span><span class="v">' + PG.payBadge(res.paymentStatus) + '</span></div>' +
      rdRow('money', 'Amount Paid', PG.fmtMoney(amounts.paid)) +
      rdRow('money', 'Outstanding', PG.fmtMoney(amounts.outstanding)) +
      rdRow('card', 'Method', PG.esc(res.paymentMethod || '—')) +
    '</div>';
    // A payment action only appears when one is actually applicable — never a dead button.
    if (amounts.outstanding > 0 || res.paymentStatus === 'Failed' || res.paymentStatus === 'Expired'){
      body += '<a class="btn btn-light btn-sm" style="margin-top:8px;" href="reservation-detail.html?id='+res.id+'">' + PG.icon('card',15) + ' Open Payment</a>';
    }

    /* ---- Notes and activity ---- */
    body += '<div class="opc-drawer-section-title">Internal Notes</div>';
    body += res.notes && res.notes.trim()
      ? '<div class="rd-card" style="padding:11px 13px;font-size:12.5px;color:var(--pg-gray-700);">' + PG.esc(res.notes) + '</div>'
      : '<div class="text-sm muted">No internal notes.</div>';

    var roomHistory = res.activity.filter(function(a){ return /room|assign/i.test(a.text); });
    body += '<div class="opc-drawer-section-title">Room Assignment History</div>';
    body += roomHistory.length
      ? '<div class="timeline" style="padding-left:18px;">' + roomHistory.slice().reverse().slice(0,4).map(function(a){
          return '<div style="padding-bottom:10px;font-size:12.5px;"><div class="muted text-sm">'+PG.fmtDateShort(a.ts.slice(0,10))+' &middot; '+a.ts.slice(11)+'</div><div>'+PG.esc(a.text)+'</div></div>';
        }).join('') + '</div>'
      : '<div class="text-sm muted">No room changes recorded.</div>';

    body += '<div class="opc-drawer-section-title">Recent Activity</div>';
    var lastActivity = res.activity.length ? res.activity[res.activity.length-1] : null;
    body += (lastActivity ? '<div class="text-sm muted" style="margin-bottom:8px;">Last updated ' + PG.fmtDateShort(lastActivity.ts.slice(0,10)) + ' &middot; ' + lastActivity.ts.slice(11) + '</div>' : '');
    body += '<div class="timeline" style="padding-left:18px;">' + res.activity.slice().reverse().slice(0,4).map(function(a){
      return '<div style="padding-bottom:10px;font-size:12.5px;"><div class="muted text-sm">'+PG.fmtDateShort(a.ts.slice(0,10))+' &middot; '+a.ts.slice(11)+'</div><div>'+PG.esc(a.text)+'</div></div>';
    }).join('') + '</div>';
    body += '<div id="opc-inline-cancel"></div>';

    /* ---- Action hierarchy: primary dominant, secondary neutral, destructive        */
    /* separated and styled danger, each action carries an icon + label (§3). ---- */
    var actions = '<div class="rd-actions">';
    actions += '<a class="btn btn-primary" href="reservation-detail.html?id='+res.id+'">' + PG.icon('edit',16) + ' Edit Reservation</a>';
    actions += '<div class="rd-secondary-row">';
    actions += (room && CAN_MANAGE)
      ? '<button class="btn btn-outline btn-sm" id="opc-change-room">' + PG.icon('door',14) + ' Change Room</button>'
      : (!room && CAN_MANAGE)
        ? '<button class="btn btn-primary btn-sm" id="opc-assign-room">' + PG.icon('door',14) + ' Assign Room</button>'
        : '<span></span>';
    actions += cust ? '<a class="btn btn-outline btn-sm" href="guest-detail.html?id='+cust.id+'">' + PG.icon('user',14) + ' Open Guest</a>' : '<span></span>';
    actions += room ? '<a class="btn btn-outline btn-sm" href="physical-rooms.html?room='+room.id+'">' + PG.icon('door',14) + ' View Room</a>' : '<span></span>';
    actions += '</div>';
    if (canCancel){
      actions += '<div class="rd-danger-row"><button class="btn btn-danger-outline btn-sm" id="opc-cancel-res" style="width:100%;justify-content:center;">' + PG.icon('trash',14) + ' Cancel Reservation</button></div>';
    }
    actions += '</div>';

    resDrawer.innerHTML = '<div class="pg-drawer">' +
      '<div class="pg-drawer-header">'+header+'</div>' +
      '<div class="pg-drawer-body">'+body+'</div>' +
      '<div class="pg-drawer-footer" style="flex-direction:column;align-items:stretch;">'+actions+'</div>' +
    '</div>';

    var chg = document.getElementById('opc-change-room'); if (chg) chg.addEventListener('click', function(){ PG.closeModal('resDrawer'); openChangeRoomFor(resId, itemId, assignmentId); });
    var assignBtn = document.getElementById('opc-assign-room'); if (assignBtn) assignBtn.addEventListener('click', function(){ PG.closeModal('resDrawer'); openChangeRoomFor(resId, itemId, null); });
    var cancelBtn = document.getElementById('opc-cancel-res');
    if (cancelBtn) cancelBtn.addEventListener('click', function(){ showInlineCancel(res); });

    PG.openModal('resDrawer');
  }

  // Compact attribute chips for the assigned room — view, accessibility features,
  // connecting rooms — shown only "when available" per §3, never an empty row.
  function roomAttrChips(room){
    var bits = [];
    if (room.view) bits.push(room.view);
    (room.accessibilityFeatures || []).forEach(function(a){ bits.push(a); });
    if (!bits.length) return '';
    return bits.map(function(b){ return '<span class="chip">' + PG.esc(b) + '</span>'; }).join('');
  }

  function showInlineCancel(res){
    var box = document.getElementById('opc-inline-cancel');
    box.innerHTML = '<div class="opc-drawer-section-title">Cancel Reservation</div>' +
      '<div class="form-group"><label class="form-label">Reason <span class="opt">(required)</span></label><select class="form-control" id="opc-cancel-reason">' + CANCEL_REASONS.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('') + '</select></div>' +
      '<div style="display:flex;gap:8px;"><button class="btn btn-light btn-sm" id="opc-keep-res">Keep Reservation</button><button class="btn btn-danger btn-sm" id="opc-confirm-cancel">Confirm Cancellation</button></div>';
    PG.enhanceSelects(box);
    document.getElementById('opc-keep-res').addEventListener('click', function(){ box.innerHTML=''; });
    document.getElementById('opc-confirm-cancel').addEventListener('click', function(){
      var reason = document.getElementById('opc-cancel-reason').value;
      try {
        var st = PG.getState();
        var idx = st.reservations.findIndex(function(x){return x.id===res.id;});
        var r2 = st.reservations[idx];
        r2.status = 'Cancelled';
        if (r2.paymentStatus==='Paid') r2.paymentStatus = 'Refund Pending';
        r2.activity.push({ts:PG.nowIso(), text:'Reservation cancelled by Hotel Admin. Reason: '+reason+'. Inventory released.'});
        st.roomAssignments.forEach(function(a){ if (a.reservationId===res.id && a.assignmentStatus!=='Cancelled') a.assignmentStatus='Cancelled'; });
        PG.setState(st);
        PG.addAudit('Reservation Cancelled', res.id + ' cancelled from Operations Calendar. Reason: ' + reason + '.');
        PG.toast('Reservation cancelled. Rooms released.', 'warn');
        PG.closeModal('resDrawer');
        renderGrid();
      } catch (e) {
        PG.toast('Failed to save changes. Please try again.', 'danger');
      }
    });
  }

  function barsForRoomLocal(st, roomId){ return barsForRoom(st, roomId); }

  /* ================================================================ */
  /* Change Room / Assign Room                                          */
  /* ================================================================ */
  function otherAssignedRoomIds(resId, excludeItemId){
    var st = PG.getState();
    var ids = [];
    st.reservations.find(function(r){return r.id===resId;}).rooms.forEach(function(item){
      if (item.id===excludeItemId) return;
      st.roomAssignments.filter(function(a){return a.reservationItemId===item.id && a.assignmentStatus!=='Cancelled';}).forEach(function(a){ ids.push(a.physicalRoomId); });
    });
    return ids;
  }
  function openChangeRoomFor(resId, itemId, assignmentId){
    var st = PG.getState();
    var res = st.reservations.find(function(r){return r.id===resId;});
    var item = res.rooms.find(function(x){return x.id===itemId;});
    var a = assignmentId ? st.roomAssignments.find(function(x){return x.id===assignmentId;}) : null;
    var cust = custOf(res);
    PG.renderChangeRoomDrawer({
      roomTypeId: item.roomTypeId, checkIn: res.checkIn, checkOut: res.checkOut,
      preferences: {}, currentRoomId: a ? a.physicalRoomId : null,
      excludeRoomIds: otherAssignedRoomIds(resId, itemId), excludeAssignmentId: a ? a.id : null,
      title: a ? 'Change Room' : 'Assign Room',
      summaryLabel: res.id + ' &middot; ' + (cust?cust.name:'Guest'),
      summarySub: PG.fmtDateShort(res.checkIn) + ' – ' + PG.fmtDateShort(res.checkOut),
      onConfirm: function(newRoomId){
        try {
          var st2 = PG.getState();
          var newRoom = st2.physicalRooms.find(function(p){return p.id===newRoomId;});
          // Revalidate immediately before saving — state may have changed since the drawer opened.
          if (!newRoom || !PG.roomEligibleForStay(st2, newRoom, res.checkIn, res.checkOut, a ? a.id : null)){
            PG.toast('That room is no longer available — the previous assignment has been kept.', 'danger');
            return;
          }
          var idx = st2.reservations.findIndex(function(r){return r.id===resId;});
          var r2 = st2.reservations[idx];
          if (a){
            var oldRoom = st2.physicalRooms.find(function(p){return p.id===a.physicalRoomId;});
            var rec = st2.roomAssignments.find(function(x){return x.id===a.id;});
            rec.physicalRoomId = newRoomId; rec.assignedAt = PG.nowIso(); rec.assignedBy = 'Hotel Admin';
            r2.activity.push({ts:PG.nowIso(), text:'Room changed from '+(oldRoom?oldRoom.roomNumber:'—')+' to '+newRoom.roomNumber+' via Operations Calendar.'});
            PG.addAudit('Room Assignment Changed', resId+' — room changed from '+(oldRoom?oldRoom.roomNumber:'—')+' to '+newRoom.roomNumber+'.');
          } else {
            var assignmentStatus = r2.status==='Confirmed' ? 'Assigned' : 'Held';
            st2.roomAssignments.push({id:'asn-'+Date.now(), propertyId: st2.hotel.propertyCode, reservationId: resId, reservationItemId: itemId,
              physicalRoomId: newRoomId, arrivalDate: r2.checkIn, departureDate: r2.checkOut, assignmentStatus: assignmentStatus,
              assignedAt: PG.nowIso(), assignedBy: 'Hotel Admin', changeReason: ''});
            r2.activity.push({ts:PG.nowIso(), text:'Room '+newRoom.roomNumber+' assigned via Operations Calendar.'});
            PG.addAudit('Room Assigned', resId+' — room '+newRoom.roomNumber+' assigned.');
          }
          PG.setState(st2);
          PG.toast('Room '+newRoom.roomNumber+' '+(a?'assigned (changed).':'assigned.'), 'success');
          renderGrid();
        } catch (e) {
          PG.toast('Failed to save changes. Please try again.', 'danger');
        }
      }
    });
  }

  var blockDrawer = document.createElement('div');
