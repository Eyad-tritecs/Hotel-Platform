function openPlanDrawer(planId){
  s = PG.getState();
  var p = planById(planId);
  if (!p) return;
  var d = drawer('rpPlanDrawer');
  var cur = currentPeriodOf(p);
  var today = PG.resolvePrice(s, p.roomTypeId, p.id, PG.TODAY);
  var periods = (p.periods||[]).slice().sort(function(a,b){ return a.startDate<b.startDate?-1:1; });
  var groups = [
    ['Active', periods.filter(function(x){return PG.periodTimeState(x)==='active';})],
    ['Upcoming', periods.filter(function(x){return PG.periodTimeState(x)==='upcoming';})],
    ['Switched off', periods.filter(function(x){return PG.periodTimeState(x)==='inactive';})],
    ['Expired', periods.filter(function(x){return PG.periodTimeState(x)==='expired';})]
  ];

  function periodCard(pp){
    return '<div class="scope-summary" style="flex-direction:column;align-items:stretch;gap:6px;margin-top:8px;">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">' +
        '<strong>' + PG.esc(pp.name) + '</strong>' + stateBadge(PG.periodTimeState(pp)) + '</div>' +
      '<div class="text-sm muted">' + PG.fmtDateShort(pp.startDate) + ' – ' + PG.fmtDateShort(pp.endDate) + ' · ' +
        ((pp.daysOfWeek||[]).length===7 ? 'All days' : (pp.daysOfWeek||[]).map(function(d){return DOW_SHORT[d];}).join(', ')) +
        ' · ' + (periodPriceLabel(pp) || 'Not priced') + ' · ' + periodNights(pp) + ' nights</div>' +
      (CAN_MANAGE ? '<div style="display:flex;gap:8px;margin-top:4px;">' +
        '<button class="btn btn-light btn-sm" data-editp="'+pp.id+'">' + PG.icon('edit',14) + ' Edit</button>' +
        '<button class="btn btn-light btn-sm" data-dupp="'+pp.id+'">' + PG.icon('copy',14) + ' Duplicate</button></div>' : '') +
    '</div>';
  }

  var activity = s.audit.filter(function(a){ return a.recordId===p.id || (a.details||'').indexOf(p.name)>-1; }).slice(0,6);

  d.innerHTML = '<div class="pg-drawer">' +
    '<div class="pg-drawer-header"><div><h3>' + PG.esc(p.name) + '</h3>' +
      '<div class="muted text-sm">' + PG.esc(rtName(p.roomTypeId)) + ' · ' + PG.esc(p.mealPlan) + (p.code?' · '+PG.esc(p.code):'') + '</div></div>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpPlanDrawer\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
    '<div class="pg-drawer-body">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">' + planStatusBadge(p) +
        (p.isDefault ? '<span class="badge badge-blue"><span class="badge-dot"></span>Default plan</span>' : '') +
        (p.strictPeriodPricing ? '<span class="badge badge-yellow"><span class="badge-dot"></span>Sells only inside its periods</span>' : '') +
      '</div>' +
      (p.description ? '<p class="text-sm" style="color:var(--pg-gray-700);margin:0 0 18px;">' + PG.esc(p.description) + '</p>' : '') +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('door',15) + ' Scope</div>' +
        '<div class="preview-box">' +
          '<div class="pv-line"><span>Applies to</span><span>' + PG.esc(PG.planScopeLabel(s,p)) + '</span></div>' +
          '<div class="pv-line"><span>Room type</span><span>' + PG.esc(rtName(p.roomTypeId)) + '</span></div>' +
          '<div class="pv-line"><span>Rooms covered</span><span>' + PG.planScopeRooms(s,p).length + '</span></div>' +
        '</div></div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('money',15) + ' Pricing</div>' +
        '<div class="preview-box">' +
          '<div class="pv-line"><span>Base price</span><span>' + money(p.basePrice) + ' / night</span></div>' +
          '<div class="pv-line"><span>Current pricing period</span><span>' + (cur ? PG.esc(cur.name) : 'None — base price applies') + '</span></div>' +
          '<div class="pv-line total"><span>Price today (' + PG.fmtDateShort(PG.TODAY) + ')</span><span>' +
            (today.price==null ? '<span class="src-missing">No price</span>' : money(today.price) + ' <span class="text-sm muted">(' + today.label + ')</span>') + '</span></div>' +
        '</div></div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('calendar',15) + ' Pricing periods</div>' +
        (periods.length ? groups.filter(function(g){return g[1].length;}).map(function(g){
          return '<div class="form-label" style="margin-top:12px;">' + g[0] + '</div>' + g[1].map(periodCard).join('');
        }).join('')
        : '<div class="empty-state" style="padding:26px 12px;"><div class="ic">' + PG.icon('calendar',26) + '</div>' +
          '<strong>No pricing periods</strong>This plan sells at its base price on every date.</div>') +
      '</div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('clock',15) + ' Activity</div>' +
        (activity.length ? '<div class="preview-box">' + activity.map(function(a){
          return '<div class="pv-line"><span>' + PG.esc(a.action) + '<br><span class="text-sm muted">' + PG.fmtDateShort(a.ts.slice(0,10)) + ' · ' + PG.esc(a.actor) + '</span></span>' +
            '<span class="text-sm" style="font-weight:400;color:var(--pg-gray-600);max-width:55%;">' + PG.esc((a.details||'').slice(0,90)) + '</span></div>';
        }).join('') + '</div>' : '<div class="text-sm muted">No recorded changes yet.</div>') +
      '</div>' +
    '</div>' +
    '<div class="pg-drawer-footer">' +
      '<button class="btn btn-light" id="pdCal">' + PG.icon('grid',15) + ' Price Calendar</button>' +
      (CAN_MANAGE ? '<div style="display:flex;gap:8px;">' +
        '<button class="btn btn-outline" id="pdEdit">' + PG.icon('edit',15) + ' Edit</button>' +
        '<button class="btn btn-primary" id="pdAddPeriod">' + PG.icon('plus',15) + ' Add Period</button></div>' : '') +
    '</div>' +
  '</div>';

  document.getElementById('pdCal').addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); openPriceCalendar(p.id); });
  if (CAN_MANAGE){
    document.getElementById('pdEdit').addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); openPlanEditor(p.id); });
    document.getElementById('pdAddPeriod').addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); openPeriodEditor(p.id, null); });
    d.querySelectorAll('[data-editp]').forEach(function(b){ b.addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); openPeriodEditor(p.id, b.dataset.editp); }); });
    d.querySelectorAll('[data-dupp]').forEach(function(b){ b.addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); duplicatePeriod(p.id, b.dataset.dupp); }); });
  }
  PG.openModal('rpPlanDrawer');
}

/* ================================================================== */
/* Pricing Period editor drawer                                        */
/* Name → Rate Plan → Scope preview → Dates → Mode → Price → Review    */
/* ================================================================== */
function openPeriodEditor(planId, periodId, prefill){
  s = PG.getState();
  var existing = (planId && periodId) ? periodRef(planId, periodId) : null;
  var d = drawer('rpPeriodEditor');

  var draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id:null, name:(prefill&&prefill.name)||'', startDate:(prefill&&prefill.startDate)||PG.TODAY,
    endDate:(prefill&&prefill.endDate)||PG.addDays(PG.TODAY,30),
    daysOfWeek:(prefill&&prefill.daysOfWeek)||[0,1,2,3,4,5,6],
    mode:(prefill&&prefill.mode)||'same', prices:(prefill&&prefill.prices)||{}, active:true
  };
  var selectedPlanId = planId || null;

  function plan(){ return selectedPlanId ? planById(selectedPlanId) : null; }

  function pricesForm(){
    var p = plan();
    var basePrice = p ? p.basePrice : null;
    if (draft.mode === 'same'){
      return '<div class="form-group" style="margin-bottom:0;"><label class="form-label" for="ppSame">Price for the entire period <span class="req">*</span></label>' +
        '<div class="price-input-wrap"><span class="cur-pre">' + CURRENCY + '</span>' +
        '<input type="number" min="0.01" step="0.01" class="form-control" id="ppSame" value="' +
        (draft.prices.same != null ? draft.prices.same : '') + '" placeholder="' + (basePrice != null ? basePrice : 'e.g. 130') + '">' +
        '<span class="unit">/ night</span></div>' +
        '<div class="form-hint">Applied to every selected night in the range.</div></div>';
    }
    var html = '<div class="copy-row">' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="first">' + PG.icon('copy',14) + ' Copy first to all</button>' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="weekday">Apply to weekdays</button>' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="weekend">Apply to weekend</button>' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="clear">Clear</button>' +
    '</div><div class="byday-grid">';
    for (var i=0;i<7;i++){
      var on = draft.daysOfWeek.indexOf(i)>-1;
      html += '<div class="form-group' + (on?'':' off') + '"><label class="form-label" for="ppD'+i+'">' + DOW_LABELS[i] + '</label>' +
        '<input type="number" min="0.01" step="0.01" class="form-control byday-input" id="ppD'+i+'" data-dow="'+i+'"' +
        (on?'':' disabled') + ' value="' + (draft.prices[String(i)] != null ? draft.prices[String(i)] : '') + '" placeholder="—"></div>';
    }
    return html + '</div>';
  }

  function validate(){
    var p = plan();
    var errs = [];
    if (!p) errs.push('Select the rate plan this period should override.');
    if (!draft.name.trim()) errs.push('Give this pricing period a name — that name is how it will be found and edited later.');
    if (!draft.startDate || !draft.endDate) errs.push('Both a start date and an end date are required.');
    else if (draft.endDate <= draft.startDate) errs.push('The end date must be after the start date.');
    if (!draft.daysOfWeek.length) errs.push('Select at least one day of the week.');

    var priced = 0, bad = false;
    if (draft.mode==='same'){
      var v = draft.prices.same;
      if (v != null && v !== ''){ if (Number(v) > 0) priced++; else bad = true; }
    } else {
      draft.daysOfWeek.forEach(function(dw){
        var x = draft.prices[String(dw)];
        if (x != null && x !== ''){ if (Number(x) > 0) priced++; else bad = true; }
      });
    }
    if (bad) errs.push('Prices must be greater than 0.');
    if (!priced) errs.push('Enter at least one valid price.');

    var overlaps = p ? PG.overlappingPeriods(p, draft, existing ? existing.id : null) : [];
    return { errors: errs, overlaps: overlaps, ok: errs.length===0 && overlaps.length===0 };
  }

  function renderReview(){
    var p = plan(), v = validate(), dates = PG.periodAffectedDates(draft);
    var box = document.getElementById('ppReview'), save = document.getElementById('ppSave');

    var lines = '';
    lines += '<div class="pv-line"><span>Pricing period</span><span>' + (draft.name.trim() ? PG.esc(draft.name) : '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Rate plan</span><span>' + (p ? PG.esc(p.name) : '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Applies to</span><span>' + (p ? PG.esc(PG.planScopeLabel(s,p)) : '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Date range</span><span>' +
      (draft.startDate && draft.endDate && draft.endDate > draft.startDate
        ? PG.fmtDateShort(draft.startDate) + ' – ' + PG.fmtDateShort(draft.endDate) : '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Days of week</span><span>' +
      (draft.daysOfWeek.length===7 ? 'All days' : draft.daysOfWeek.slice().sort().map(function(x){return DOW_SHORT[x];}).join(', ') || '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Nights affected</span><span>' + dates.length + '</span></div>';
    lines += '<div class="pv-line"><span>Base price</span><span>' + (p ? money(p.basePrice) : '—') + '</span></div>';

    if (draft.mode==='same'){
      var np = draft.prices.same ? Number(draft.prices.same) : null;
      lines += '<div class="pv-line total"><span>New price</span><span>' + (np ? money(np) + ' / night' : '—') + '</span></div>';
      if (np && p && p.basePrice){
        var diff = np - Number(p.basePrice);
        if (diff !== 0){
          lines += '<div class="pv-line"><span>Difference from base</span><span class="price-delta ' + (diff>0?'up':'down') + '">' +
            (diff>0?'+':'−') + money(Math.abs(diff)) + (diff>0?' higher':' lower') + '</span></div>';
        }
      }
    } else {
      draft.daysOfWeek.slice().sort().forEach(function(dw){
        var x = draft.prices[String(dw)];
        lines += '<div class="pv-line"><span>' + DOW_LABELS[dw] + '</span><span>' +
          (x != null && x !== '' ? money(Number(x)) : '<span class="src-missing">No price</span>') + '</span></div>';
      });
    }
    lines += '<div class="pv-line"><span>Period state</span><span>' + stateBadge(PG.periodTimeState(draft)) + '</span></div>';

    var msg = '';
    if (v.overlaps.length){
      msg += '<div class="help-note help-note-danger" style="margin-top:14px;">' + PG.icon('alert',16) +
        '<div><strong>Overlaps another active pricing period on this plan.</strong><br>' +
        v.overlaps.map(function(o){
          return PG.esc(o.name) + ' — ' + PG.fmtDateShort(o.startDate) + ' – ' + PG.fmtDateShort(o.endDate) + ', ' +
            ((o.daysOfWeek||[]).length===7 ? 'all days' : (o.daysOfWeek||[]).map(function(x){return DOW_SHORT[x];}).join(', '));
        }).join('<br>') +
        '<br><span class="text-sm">This plan has no period priority, so two periods can’t both claim the same night. Narrow the dates or the weekdays to resolve it.</span></div></div>';
    }
    if (v.errors.length){
      msg += '<div class="help-note help-note-warning" style="margin-top:14px;">' + PG.icon('info',16) +
        '<div>' + v.errors.map(PG.esc).join('<br>') + '</div></div>';
    }
    if (v.ok && dates.length){
      var affected = p ? s.reservations.filter(function(r){
        return r.status !== 'Cancelled' && (r.rooms||[]).some(function(rm){ return rm.ratePlanId===p.id; }) &&
          r.checkOut > draft.startDate && r.checkIn <= draft.endDate;
      }).length : 0;
      msg += '<div class="help-note" style="margin-top:14px;">' + PG.icon('info',16) +
        '<div>Saving changes <strong>' + dates.length + ' night' + (dates.length===1?'':'s') + '</strong> of pricing on “' + PG.esc(p.name) + '”.' +
        (affected ? ' <strong>' + affected + ' existing reservation' + (affected===1?'':'s') + '</strong> fall in this range — they keep the price they were booked at; this is shown for information only.' :
          ' No existing reservation is affected.') + '</div></div>';
    }
    box.innerHTML = lines + msg;
    save.disabled = !v.ok;
  }

  function paintPrices(){
    document.getElementById('ppPrices').innerHTML = pricesForm();
    wirePrices();
    renderReview();
  }
  function paintScope(){
    var p = plan();
    document.getElementById('ppScope').innerHTML = p
      ? '<div class="preview-box">' +
          '<div class="pv-line"><span>Room type</span><span>' + PG.esc(rtName(p.roomTypeId)) + '</span></div>' +
          '<div class="pv-line"><span>Applies to</span><span>' + PG.esc(PG.planScopeLabel(s,p)) + '</span></div>' +
          '<div class="pv-line"><span>Rooms affected</span><span>' + PG.planScopeRooms(s,p).length + '</span></div>' +
          '<div class="pv-line"><span>Current base price</span><span>' + money(p.basePrice) + ' / night</span></div>' +
          '<div class="pv-line"><span>Plan status</span><span>' + (p.active ? 'Active' : 'Inactive') + '</span></div>' +
          ((p.periods||[]).length ? '<div class="pv-line"><span>Existing periods</span><span>' +
            (p.periods||[]).map(function(x){return PG.esc(x.name);}).join(', ') + '</span></div>' : '') +
        '</div>'
      : '<div class="text-sm muted">Select a rate plan to see what this period will affect.</div>';
  }
  function wirePrices(){
    var same = document.getElementById('ppSame');
    if (same) same.addEventListener('input', function(){ draft.prices.same = this.value; renderReview(); });
    d.querySelectorAll('.byday-input').forEach(function(inp){
      inp.addEventListener('input', function(){ draft.prices[inp.dataset.dow] = inp.value; renderReview(); });
    });
    d.querySelectorAll('[data-copy]').forEach(function(b){
      b.addEventListener('click', function(){
        var kind = b.dataset.copy, sorted = draft.daysOfWeek.slice().sort();
        if (kind==='clear'){ draft.prices = {}; paintPrices(); return; }
        var srcDay = kind==='first' ? sorted[0]
          : kind==='weekday' ? sorted.find(function(x){ return WEEKEND_DOW.indexOf(x)===-1; })
          : sorted.find(function(x){ return WEEKEND_DOW.indexOf(x)>-1; });
        var val = draft.prices[String(srcDay)];
        if (val == null || val === ''){ PG.toast('Enter one price first, then copy it across.', 'warn'); return; }
        var targets = kind==='first' ? sorted
          : kind==='weekday' ? sorted.filter(function(x){ return WEEKEND_DOW.indexOf(x)===-1; })
          : sorted.filter(function(x){ return WEEKEND_DOW.indexOf(x)>-1; });
        targets.forEach(function(x){ draft.prices[String(x)] = val; });
        paintPrices();
      });
    });
  }

  d.innerHTML = '<div class="pg-drawer pg-drawer-wide">' +
    '<div class="pg-drawer-header"><div><h3>' + (existing ? 'Edit Pricing Period' : 'Add Pricing Period') + '</h3>' +
      '<div class="muted text-sm">Override a rate plan’s base price for a named date range</div></div>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpPeriodEditor\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
    '<div class="pg-drawer-body">' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('note',15) + ' Pricing period</div>' +
        '<div class="form-group"><label class="form-label" for="ppName">Pricing Period Name <span class="req">*</span></label>' +
          '<input class="form-control" id="ppName" value="'+PG.esc(draft.name)+'" placeholder="e.g. The Summer Vacation, Eid Holiday, Winter Season">' +
          '<div class="form-hint">Name the operational period. This name stays visible wherever the period appears, so it can be found and edited later without remembering its dates.</div></div>' +
        '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Rate Plan <span class="req">*</span></label>' +
          '<div id="ppPlan"></div>' +
          '<div class="form-hint">A pricing period always modifies an existing rate plan — it never creates one.</div></div>' +
      '</div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('door',15) + ' Scope preview</div>' +
        '<div id="ppScope"></div></div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('calendar',15) + ' Date range</div>' +
        '<div class="grid-2" style="margin-bottom:14px;gap:14px;">' +
          '<div class="form-group" style="margin-bottom:0;"><label class="form-label" for="ppStart">Start Date <span class="req">*</span></label>' +
            '<input type="date" class="form-control" id="ppStart" value="'+draft.startDate+'"></div>' +
          '<div class="form-group" style="margin-bottom:0;"><label class="form-label" for="ppEnd">End Date <span class="req">*</span></label>' +
            '<input type="date" class="form-control" id="ppEnd" value="'+draft.endDate+'"></div>' +
        '</div>' +
        '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Days of Week <span class="req">*</span></label>' +
          '<div class="dow-grid" id="ppDow">' + DOW_SHORT.map(function(lbl,i){
            var on = draft.daysOfWeek.indexOf(i)>-1;
            return '<button type="button" class="dow-chip'+(on?' active':'')+'" data-dow="'+i+'" aria-pressed="'+on+'">'+lbl+'</button>';
          }).join('') + '</div>' +
          '<div class="form-hint">Only the selected weekdays are repriced. Unselected days keep the plan’s base price.</div></div>' +
      '</div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('money',15) + ' Pricing</div>' +
        '<div class="form-group">' + PG.segmented('ppMode', [
            {value:'same', label:'Same Price for Entire Period'},
            {value:'byday', label:'Different Price by Day'}
          ], draft.mode, {ariaLabel:'Pricing mode'}) + '</div>' +
        '<div id="ppPrices"></div>' +
      '</div>' +

      '<div class="drawer-section">' +
        '<div class="drawer-section-title">' + PG.icon('check',15) + ' Review and impact</div>' +
        '<div class="preview-box" id="ppReview" role="status" aria-live="polite"></div></div>' +
    '</div>' +
    '<div class="pg-drawer-footer">' +
      '<button class="btn btn-light" onclick="PG.closeModal(\'rpPeriodEditor\')">Cancel</button>' +
      '<button class="btn btn-primary" id="ppSave" disabled>' + (existing ? 'Save Changes' : 'Create Pricing Period') + '</button>' +
    '</div>' +
  '</div>';

  PG.renderCombobox(document.getElementById('ppPlan'), {
    placeholder:'Search rate plans…', ariaLabel:'Rate plan', value: selectedPlanId,
    items: s.ratePlans.map(function(p){
      return { id:p.id, label:p.name,
        sub: rtName(p.roomTypeId) + ' · ' + PG.planScopeLabel(s,p) + ' · base ' + money(p.basePrice) + (p.active?'':' · inactive'),
        badge: p.isDefault ? '<span class="badge badge-blue">Default</span>' : '' };
    }),
    onSelect: function(id){ selectedPlanId = id; paintScope(); renderReview(); }
  });
  document.getElementById('ppName').addEventListener('input', function(){ draft.name=this.value; renderReview(); });
  document.getElementById('ppStart').addEventListener('change', function(){ draft.startDate=this.value; renderReview(); });
  document.getElementById('ppEnd').addEventListener('change', function(){ draft.endDate=this.value; renderReview(); });
  document.getElementById('ppDow').addEventListener('click', function(e){
    var chip = e.target.closest('.dow-chip'); if (!chip) return;
    var dw = +chip.dataset.dow, i = draft.daysOfWeek.indexOf(dw);
    if (i>-1) draft.daysOfWeek.splice(i,1); else draft.daysOfWeek.push(dw);
    chip.classList.toggle('active');
    chip.setAttribute('aria-pressed', chip.classList.contains('active'));
    paintPrices();
  });
  PG.wireSegmented(d, 'ppMode', function(v){ draft.mode=v; paintPrices(); });
  paintScope(); paintPrices();

  document.getElementById('ppSave').addEventListener('click', function(){
    var v = validate(); if (!v.ok) return;
    var btn = this; btn.disabled = true; btn.textContent = 'Saving…';
    setTimeout(function(){
      try {
        var st = PG.getState();
        var target = st.ratePlans.find(function(p){ return p.id===selectedPlanId; });
        if (!target) throw new Error('That rate plan no longer exists.');
        // Revalidate against fresh state — another tab may have added an overlap.
        var recheck = PG.overlappingPeriods(target, draft, existing ? existing.id : null);
        if (recheck.length) throw new Error('“' + recheck[0].name + '” now overlaps these dates.');

        var clean = {
          id: draft.id || newId('pp'), name: draft.name.trim(),
          startDate: draft.startDate, endDate: draft.endDate,
          daysOfWeek: draft.daysOfWeek.slice().sort(function(a,b){return a-b;}),
          mode: draft.mode, prices: {}, active: draft.active !== false,
          createdAt: existing ? existing.createdAt : PG.nowIso(), updatedAt: PG.nowIso()
        };
        if (draft.mode==='same') clean.prices.same = Math.round(Number(draft.prices.same)*100)/100;
        else clean.daysOfWeek.forEach(function(dw){
          var x = draft.prices[String(dw)];
          if (x != null && x !== '') clean.prices[String(dw)] = Math.round(Number(x)*100)/100;
        });

        target.periods = target.periods || [];
        var prev = null;
        if (existing){
          var idx = target.periods.findIndex(function(x){ return x.id===existing.id; });
          if (idx === -1) throw new Error('That pricing period no longer exists.');
          prev = describePeriod(target.periods[idx]);
          target.periods[idx] = clean;
        } else target.periods.push(clean);
        target.updatedAt = PG.nowIso();
        PG.setState(st);

        var nights = PG.periodAffectedDates(clean).length;
        PG.addAudit(existing ? 'Pricing Period Updated' : 'Pricing Period Created',
          '“' + clean.name + '” on ' + target.name + ' (' + PG.planScopeLabel(st, target) + ') — ' + describePeriod(clean) +
          '. ' + nights + ' night' + (nights===1?'':'s') + ' affected. Existing reservations keep their booked price.', null,
          { module:'Rate Plans & Pricing', recordId: clean.id, previousValue: prev, newValue: describePeriod(clean) });

        PG.toast(existing ? 'Pricing period updated.' : 'Pricing period created.', 'success');
        PG.closeModal('rpPeriodEditor');
        s = PG.getState(); renderShell();
      } catch(e){
        btn.disabled = false; btn.textContent = existing ? 'Save Changes' : 'Create Pricing Period';
        document.getElementById('ppReview').innerHTML +=
          '<div class="help-note help-note-danger" style="margin-top:14px;">' + PG.icon('alert',16) +
          '<div>Couldn’t save — ' + PG.esc(e.message) + ' Nothing was changed.</div></div>';
        PG.toast('Couldn’t save the pricing period.', 'danger');
      }
    }, 400);
  });

  PG.openModal('rpPeriodEditor');
}

/* ================================================================== */
/* Price Calendar — opened from a plan, showing where each price came   */
/* from. Not a top-level tab: it answers "why is this night this price" */
/* about a plan you are already looking at.                             */
/* ================================================================== */
function openPriceCalendar(planId){
  s = PG.getState();
  var focus = planById(planId);
  var m = modal('rpCalModal');
  var span = 14, from = PG.TODAY;

  function paint(){
    var days = PG.dateRange(from, PG.addDays(from, span));
    var plans = PG.ratePlansForType(s, focus.roomTypeId);
    var head = '<thead><tr><th class="pcm-plan">Rate Plan</th>' + days.map(function(d){
      return '<th class="' + (d===PG.TODAY?'today':'') + '">' + PG.fmtDateShort(d) + '<br>' + PG.weekdayOf(d) + '</th>';
    }).join('') + '</tr></thead>';
    var body = '<tbody>' + plans.map(function(p){
      return '<tr' + (p.id===focus.id ? ' style="background:var(--pg-primary-light);"' : '') + '>' +
        '<td class="pcm-plan"><div style="font-weight:600;">' + PG.esc(p.name) + '</div>' +
        '<div class="ent-sub">' + PG.esc(PG.planScopeLabel(s,p)) + ' · base ' + money(p.basePrice) + '</div></td>' +
        days.map(function(d){
          var r = PG.resolvePrice(s, p.roomTypeId, p.id, d);
          var lbl = { base:'Base', period:'Period', manual:'Manual', missing:'No price' }[r.source];
          return '<td class="cell" data-plan="'+p.id+'" data-date="'+d+'" title="' +
            PG.esc(r.label + (r.periodName ? ' — ' + r.periodName : '')) + '">' +
            '<div class="amt' + (r.price==null?' missing':'') + '">' + (r.price==null?'No price':money(r.price)) + '</div>' +
            '<div class="src src-'+r.source+'">' + lbl + '</div></td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody>';

    m.innerHTML = '<div class="pg-modal" style="width:1140px;max-width:96vw;">' +
      '<div class="pg-modal-header"><div><h3>Price Calendar</h3>' +
        '<div class="muted text-sm">' + PG.esc(rtName(focus.roomTypeId)) + ' — every rate plan on this room type, and where each price comes from</div></div>' +
        '<button class="pg-modal-close" onclick="PG.closeModal(\'rpCalModal\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
      '<div class="pg-modal-body">' +
        '<div class="rp-toolbar" style="margin-bottom:16px;">' +
          '<button class="btn-icon bordered ic-dir" id="calPrev" aria-label="Previous period">' + PG.icon('chevronLeft',16) + '</button>' +
          '<button class="btn btn-light btn-sm" id="calToday">Today</button>' +
          '<button class="btn-icon bordered ic-dir" id="calNext" aria-label="Next period">' + PG.icon('chevronRight',16) + '</button>' +
          '<input type="date" class="form-control" id="calFrom" value="'+from+'" style="width:160px;" aria-label="Calendar start date">' +
          PG.segmented('calSpan', [{value:'7',label:'7 Days'},{value:'14',label:'14 Days'},{value:'30',label:'30 Days'}], String(span), {ariaLabel:'Range length'}) +
        '</div>' +
        '<div class="pcm-wrap"><table class="pcm">' + head + body + '</table></div>' +
        '<div class="pcm-legend">' +
          '<span><span class="src src-base">BASE</span> the plan’s base price</span>' +
          '<span><span class="src src-period">PERIOD</span> a named pricing period</span>' +
          '<span><span class="src src-manual">MANUAL</span> a one-off price on that cell</span>' +
          '<span><span class="src src-missing">NO PRICE</span> not sellable that night</span>' +
        '</div>' +
      '</div>' +
    '</div>';

    document.getElementById('calPrev').addEventListener('click', function(){ from = PG.addDays(from, -span); paint(); });
    document.getElementById('calNext').addEventListener('click', function(){ from = PG.addDays(from, span); paint(); });
    document.getElementById('calToday').addEventListener('click', function(){ from = PG.TODAY; paint(); });
    document.getElementById('calFrom').addEventListener('change', function(){ from = this.value; paint(); });
    PG.wireSegmented(m, 'calSpan', function(v){ span = +v; paint(); });
    if (CAN_MANAGE) m.querySelectorAll('.cell').forEach(function(td){
      td.addEventListener('click', function(){ openCellEditor(td.dataset.plan, td.dataset.date); });
    });
  }
  paint();
  PG.openModal('rpCalModal');
}

/* One-off price for a single plan+date. Explains the current number first, then offers
   to change it — a price cell must never be an unexplained editable box. */
function openCellEditor(planId, dateStr){
  s = PG.getState();
  var p = planById(planId);
  var r = PG.resolvePrice(s, p.roomTypeId, planId, dateStr);
  var key = PG.overrideKey(p.roomTypeId, planId, dateStr);
  var cur = (s.rateOverrides||{})[key];
  var mm = modal('rpCellModal');
  mm.innerHTML = '<div class="pg-modal" style="max-width:450px;">' +
    '<div class="pg-modal-header"><div><h3>Price for one date</h3>' +
      '<div class="muted text-sm">' + PG.esc(p.name) + ' · ' + PG.fmtDate(dateStr) + '</div></div>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpCellModal\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
    '<div class="pg-modal-body">' +
      '<div class="preview-box" style="margin-bottom:18px;">' +
        '<div class="pv-line"><span>Rate plan</span><span>' + PG.esc(p.name) + '</span></div>' +
        '<div class="pv-line"><span>Pricing period</span><span>' + (r.periodName ? PG.esc(r.periodName) : '—') + '</span></div>' +
        '<div class="pv-line"><span>Plan base price</span><span>' + money(p.basePrice) + '</span></div>' +
        '<div class="pv-line total"><span>Current price</span><span>' +
          (r.price==null ? '<span class="src-missing">No price</span>' : money(r.price)) +
          ' <span class="text-sm muted">(' + r.label + ')</span></span></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label" for="ceVal">One-off price for this date <span class="opt">(optional)</span></label>' +
        '<div class="price-input-wrap"><span class="cur-pre">' + CURRENCY + '</span>' +
        '<input type="number" min="0.01" step="0.01" class="form-control" id="ceVal" value="'+(cur!=null?cur:'')+'" placeholder="Leave empty to use the rule above">' +
        '<span class="unit">/ night</span></div>' +
        '<div class="form-hint">Applies to this one date on this one rate plan. Use a pricing period for anything recurring.</div></div>' +
      '<div id="ceStatus" role="status" aria-live="polite"></div>' +
    '</div>' +
    '<div class="pg-modal-footer">' +
      (cur!=null ? '<button class="btn btn-light" id="ceClear">Remove one-off price</button>' : '') +
      '<button class="btn btn-light" onclick="PG.closeModal(\'rpCellModal\')">Cancel</button>' +
      '<button class="btn btn-primary" id="ceSave">Save Price</button></div>' +
  '</div>';

  function save(raw){
    var st = PG.getState();
    st.rateOverrides = st.rateOverrides || {};
    var prev = st.rateOverrides[key];
    if (!raw){ delete st.rateOverrides[key]; }
    else {
      var v = parseFloat(raw);
      if (!(v>0)){
        document.getElementById('ceStatus').innerHTML = '<div class="help-note help-note-danger">' + PG.icon('alert',16) + '<div>Enter a price greater than 0.</div></div>';
        return;
      }
      st.rateOverrides[key] = Math.round(v*100)/100;
    }
    PG.setState(st);
    PG.addAudit('Rate Changed', p.name + ' — one-off price for ' + PG.fmtDateShort(dateStr) + ' ' +
      (raw ? 'set to ' + money(parseFloat(raw)) : 'removed') + '.', null,
      { module:'Rate Plans & Pricing', recordId:key, previousValue: prev!=null?prev:'none', newValue: raw?parseFloat(raw):'none' });
    PG.toast(raw ? 'One-off price saved.' : 'One-off price removed.', 'success');
    PG.closeModal('rpCellModal');
    s = PG.getState();
    openPriceCalendar(planId);
  }
  document.getElementById('ceSave').addEventListener('click', function(){ save(document.getElementById('ceVal').value.trim()); });
  var cb = document.getElementById('ceClear');
  if (cb) cb.addEventListener('click', function(){ save(''); });
  PG.openModal('rpCellModal');
}

/* ================================================================== */
/* Plan and period mutations                                           */
/* ================================================================== */
function togglePlan(id){
  var st = PG.getState();
  var p = st.ratePlans.find(function(x){return x.id===id;});
  var prev = p.active;
  p.active = !p.active; p.updatedAt = PG.nowIso();
  PG.setState(st);
  PG.addAudit(p.active ? 'Rate Plan Activated' : 'Rate Plan Deactivated',
    p.name + ' (' + PG.planScopeLabel(st,p) + ') was ' + (p.active?'activated':'deactivated') + '.' +
    (p.active ? '' : ' Existing reservations booked on it keep their booked price.'), null,
    { module:'Rate Plans & Pricing', recordId:id, previousValue: prev?'Active':'Inactive', newValue: p.active?'Active':'Inactive' });
  PG.toast('Rate plan ' + (p.active?'activated':'deactivated') + '.', 'success');
  s = PG.getState(); renderShell();
}

function duplicatePlan(id){
  var st = PG.getState();
  var src = st.ratePlans.find(function(x){return x.id===id;});
  var copy = JSON.parse(JSON.stringify(src));
  copy.id = newId('rp'); copy.name = src.name + ' (Copy)';
  copy.code = src.code ? src.code + '-C' : null;
  copy.isDefault = false;  // never two defaults on one room type
  copy.active = false;     // a copy starts switched off so it cannot sell before review
  copy.createdAt = PG.nowIso(); copy.updatedAt = PG.nowIso();
  (copy.periods||[]).forEach(function(pp){ pp.id = newId('pp'); });
  st.ratePlans.push(copy);
  PG.setState(st);
  PG.addAudit('Rate Plan Created', copy.name + ' duplicated from ' + src.name + ', created inactive with ' +
    (copy.periods||[]).length + ' pricing period(s).', null,
    { module:'Rate Plans & Pricing', recordId: copy.id, newValue: copy.name });
  PG.toast('Rate plan duplicated — review and activate it when ready.', 'success');
  s = PG.getState(); renderShell();
}

function confirmDeletePlan(id){
  var p = planById(id), deps = reservationsUsingPlan(id);
  var m = modal('rpDelPlan');
  m.innerHTML = '<div class="pg-modal" style="max-width:480px;">' +
    '<div class="pg-modal-header"><h3>Delete Rate Plan</h3>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpDelPlan\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
    '<div class="pg-modal-body">' + (deps.length
      ? '<div class="help-note help-note-danger">' + PG.icon('alert',16) + '<div><strong>' + deps.length + ' reservation' +
        (deps.length===1?' was':'s were') + '</strong> booked on “' + PG.esc(p.name) + '”. Deleting it would leave them pointing at a plan that no longer exists. ' +
        'Deactivate it instead — it stops being offered for new reservations while existing ones keep their booked price.</div></div>'
      : '<div class="preview-box" style="margin-bottom:16px;">' +
          '<div class="pv-line"><span>Rate plan</span><span>' + PG.esc(p.name) + '</span></div>' +
          '<div class="pv-line"><span>Applies to</span><span>' + PG.esc(PG.planScopeLabel(s,p)) + '</span></div>' +
          '<div class="pv-line"><span>Base price</span><span>' + money(p.basePrice) + ' / night</span></div>' +
          '<div class="pv-line total"><span>Pricing periods deleted with it</span><span>' + (p.periods||[]).length + '</span></div>' +
        '</div>' +
        '<div class="help-note help-note-warning">' + PG.icon('alert',16) +
        '<div>This can’t be undone. No reservation currently uses this plan, so nothing on the books is affected.</div></div>') +
    '</div>' +
    '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'rpDelPlan\')">Cancel</button>' +
      (deps.length ? '' : '<button class="btn btn-danger" id="delPlanGo">Delete Rate Plan</button>') + '</div></div>';
  if (!deps.length) document.getElementById('delPlanGo').addEventListener('click', function(){
    var st = PG.getState();
    var i = st.ratePlans.findIndex(function(x){return x.id===id;});
    var removed = st.ratePlans[i];
    st.ratePlans.splice(i,1); PG.setState(st);
    PG.addAudit('Rate Plan Deleted', removed.name + ' was permanently deleted.', null,
      { module:'Rate Plans & Pricing', recordId:id, previousValue: removed.name, newValue:'deleted' });
    PG.toast('Rate plan deleted.', 'success');
    PG.closeModal('rpDelPlan'); s = PG.getState(); renderShell();
  });
  PG.openModal('rpDelPlan');
}

function duplicatePeriod(planId, periodId){
  var src = periodRef(planId, periodId);
  if (!src) return;
  var len = PG.dateRange(src.startDate, PG.addDays(src.endDate,1)).length;
  openPeriodEditor(planId, null, {
    name: src.name + ' (Copy)',
    startDate: PG.addDays(src.endDate, 1), endDate: PG.addDays(src.endDate, len),
    daysOfWeek: (src.daysOfWeek||[]).slice(), mode: src.mode,
    prices: JSON.parse(JSON.stringify(src.prices||{}))
  });
}

function togglePeriod(planId, periodId){
  var st = PG.getState();
  var p = st.ratePlans.find(function(x){return x.id===planId;});
  var pp = (p.periods||[]).find(function(x){return x.id===periodId;});
  var prev = pp.active !== false;
  pp.active = !prev; pp.updatedAt = PG.nowIso(); p.updatedAt = PG.nowIso();
  PG.setState(st);
  PG.addAudit('Pricing Period Updated',
    '“' + pp.name + '” on ' + p.name + ' was ' + (pp.active?'reactivated':'deactivated') +
    '. ' + (pp.active ? 'It prices its dates again.' : 'Those dates fall back to the plan base price of ' + money(p.basePrice) + '.'), null,
    { module:'Rate Plans & Pricing', recordId: pp.id, previousValue: prev?'Active':'Inactive', newValue: pp.active?'Active':'Inactive' });
  PG.toast('Pricing period ' + (pp.active?'reactivated':'deactivated') + '.', 'success');
  s = PG.getState(); renderShell();
}

function confirmDeletePeriod(planId, periodId){
  var p = planById(planId), pp = periodRef(planId, periodId);
  var nights = periodNights(pp);
  var m = modal('rpDelPeriod');
  m.innerHTML = '<div class="pg-modal" style="max-width:480px;">' +
    '<div class="pg-modal-header"><h3>Delete Pricing Period</h3>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpDelPeriod\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
    '<div class="pg-modal-body">' +
      '<div class="preview-box" style="margin-bottom:16px;">' +
        '<div class="pv-line"><span>Pricing period</span><span>' + PG.esc(pp.name) + '</span></div>' +
        '<div class="pv-line"><span>Rate plan</span><span>' + PG.esc(p.name) + '</span></div>' +
        '<div class="pv-line"><span>Date range</span><span>' + PG.fmtDateShort(pp.startDate) + ' – ' + PG.fmtDateShort(pp.endDate) + '</span></div>' +
        '<div class="pv-line total"><span>Nights returning to base price</span><span>' + nights + ' → ' + money(p.basePrice) + '</span></div>' +
      '</div>' +
      '<div class="help-note help-note-warning">' + PG.icon('alert',16) +
      '<div>Those ' + nights + ' night' + (nights===1?'':'s') + ' will sell at the plan’s base price instead. Reservations already booked keep the price they were sold at.</div></div>' +
    '</div>' +
    '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'rpDelPeriod\')">Cancel</button>' +
      '<button class="btn btn-danger" id="delPeriodGo">Delete Period</button></div></div>';
  document.getElementById('delPeriodGo').addEventListener('click', function(){
    var st = PG.getState();
    var tp = st.ratePlans.find(function(x){return x.id===planId;});
    var i = tp.periods.findIndex(function(x){return x.id===periodId;});
    var removed = tp.periods[i];
    tp.periods.splice(i,1); tp.updatedAt = PG.nowIso();
    PG.setState(st);
    PG.addAudit('Pricing Period Deleted',
      '“' + removed.name + '” removed from ' + tp.name + '. ' + nights + ' night(s) return to the base price of ' + money(tp.basePrice) + '.', null,
      { module:'Rate Plans & Pricing', recordId: periodId, previousValue: describePeriod(removed), newValue:'deleted' });
    PG.toast('Pricing period deleted.', 'success');
    PG.closeModal('rpDelPeriod'); s = PG.getState(); renderShell();
  });
  PG.openModal('rpDelPeriod');
}

/* ================================================================== */
/* Boot — permission gate LAST                                         */
/* ================================================================== */
function init(){
  renderShell();
  // Deep links: from global search (?plan=, &period=) and from the retired
  // rate-plan-form.html route (&edit=1 / ?new=1).
  var planParam = qp.get('plan');
  if (qp.get('new') && CAN_MANAGE){ openPlanEditor(null); return; }
  if (planParam && planById(planParam)){
    var periodParam = qp.get('period');
    if (periodParam && CAN_MANAGE && periodRef(planParam, periodParam)) openPeriodEditor(planParam, periodParam);
    else if (qp.get('edit') && CAN_MANAGE) openPlanEditor(planParam);
    else openPlanDrawer(planParam);
  }
}

if (!CAN_VIEW){
  page.innerHTML = '<div class="pg-page-head"><div><h1>Rate Plans &amp; Pricing</h1></div></div>' +
    '<div class="card"><div class="card-body"><div class="empty-state"><div class="ic">' + PG.icon('lock',28) + '</div>' +
    '<strong>No access to Rate Plans &amp; Pricing</strong>Contact a Hotel Admin to request access.</div></div></div>';
} else {
  init();
  window.pgAssistantRefresh = renderShell; // lets the Hotel Assistant update this screen after applying a change
  PG.mountHotelAssistant('Rate Plans & Pricing');
}
</script>
