<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Plans &amp; Pricing — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* Search-first toolbar: search, then chips, then advanced/sort. Never a row of selects. */
  .rp-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .rp-toolbar .grow{flex:1 1 260px;min-width:220px;}
  .rp-chiprow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;}
  .rp-chiprow .lbl{font-size:12.5px;font-weight:600;color:var(--pg-gray-500);}
  .rp-applied{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;}

  /* --- Identity cell shared by both tables --- */
  .ent{display:flex;align-items:center;gap:11px;min-width:0;}
  .ent-ic{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ent-ic.plan{background:var(--pg-primary-light);color:var(--pg-primary);}
  .ent-ic.period{background:var(--pg-info-light);color:var(--pg-info);}
  .ent-ic.period.expired{background:var(--pg-gray-200);color:var(--pg-gray-500);}
  .ent-main{min-width:0;}
  .ent-name{font-weight:600;font-size:13.5px;color:var(--pg-gray-900);cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;}
  .ent-name:hover{color:var(--pg-primary);}
  .ent-sub{font-size:12px;color:var(--pg-gray-500);margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
  .price-cell{font-weight:600;color:var(--pg-gray-900);font-variant-numeric:tabular-nums;}
  .price-delta{font-size:11.5px;font-weight:600;margin-top:2px;}
  .price-delta.up{color:#0BB463;}
  .price-delta.down{color:var(--pg-danger);}

  /* --- Drawer internals --- */
  .scope-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .scope-chip{display:inline-flex;align-items:center;gap:6px;background:var(--pg-gray-100);
    border:1px solid var(--pg-border);border-radius:var(--pg-radius-sm);padding:5px 6px 5px 10px;
    font-size:12px;font-weight:600;color:var(--pg-gray-700);}
  .scope-chip .x{border:none;background:none;color:var(--pg-gray-400);cursor:pointer;
    font-size:15px;line-height:1;padding:0 3px;}
  .scope-chip .x:hover{color:var(--pg-danger);}
  .scope-room-list{max-height:230px;overflow-y:auto;border:1px solid var(--pg-border);
    border-radius:var(--pg-radius-btn);margin-top:10px;}
  .scope-room{display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px dashed var(--pg-gray-200);cursor:pointer;}
  .scope-room:last-child{border-bottom:none;}
  .scope-room:hover{background:var(--pg-gray-100);}
  .scope-room.disabled{opacity:.5;cursor:not-allowed;background:var(--pg-gray-100);}
  .scope-room input{width:16px;height:16px;accent-color:var(--pg-primary);flex-shrink:0;}
  .scope-room .rn{font-weight:600;font-size:13px;color:var(--pg-gray-900);}
  .scope-room .rm{font-size:11.5px;color:var(--pg-gray-500);}
  .scope-summary{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;
    background:var(--pg-gray-100);border-radius:var(--pg-radius-btn);font-size:12.5px;margin-top:10px;}
  .scope-summary strong{color:var(--pg-gray-900);}

  .price-input-wrap{display:flex;align-items:stretch;gap:0;max-width:280px;}
  .price-input-wrap .cur-pre{display:inline-flex;align-items:center;padding:0 12px;background:var(--pg-gray-100);
    border:1px solid var(--pg-border-strong);border-right:none;border-radius:var(--pg-radius-btn) 0 0 var(--pg-radius-btn);
    font-size:12.5px;font-weight:600;color:var(--pg-gray-600);}
  .price-input-wrap .form-control{border-radius:0;}
  .price-input-wrap .unit{display:inline-flex;align-items:center;padding:0 12px;background:var(--pg-gray-100);
    border:1px solid var(--pg-border-strong);border-left:none;border-radius:0 var(--pg-radius-btn) var(--pg-radius-btn) 0;
    font-size:12.5px;color:var(--pg-gray-600);white-space:nowrap;}
  html[dir="rtl"] .price-input-wrap .cur-pre{border-right:1px solid var(--pg-border-strong);border-left:none;
    border-radius:0 var(--pg-radius-btn) var(--pg-radius-btn) 0;}
  html[dir="rtl"] .price-input-wrap .unit{border-left:1px solid var(--pg-border-strong);border-right:none;
    border-radius:var(--pg-radius-btn) 0 0 var(--pg-radius-btn);}

  .dow-grid{display:flex;gap:7px;flex-wrap:wrap;}
  .dow-chip{border:1px solid var(--pg-border-strong);background:#fff;border-radius:var(--pg-radius-btn);
    padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--pg-gray-600);cursor:pointer;
    user-select:none;font-family:var(--pg-font);min-width:50px;text-align:center;transition:all .12s;}
  .dow-chip:hover{border-color:var(--pg-gray-400);}
  .dow-chip.active{border-color:var(--pg-primary);background:var(--pg-primary);color:#fff;}
  .dow-chip:focus-visible{outline:2px solid var(--pg-primary);outline-offset:2px;}
  .byday-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  .byday-grid .form-group{margin-bottom:0;}
  .byday-grid .form-group.off{opacity:.4;}
  .byday-grid .form-label{font-size:12px;}
  .copy-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}

  .preview-box{border:1px solid var(--pg-border);border-radius:var(--pg-radius-btn);
    background:var(--pg-gray-100);font-size:12.5px;overflow:hidden;}
  .preview-box .pv-line{display:flex;justify-content:space-between;gap:14px;padding:8px 13px;
    border-bottom:1px dashed var(--pg-gray-300);}
  .preview-box .pv-line:last-child{border-bottom:none;}
  .preview-box .pv-line > span:first-child{color:var(--pg-gray-600);}
  .preview-box .pv-line > span:last-child{font-weight:600;color:var(--pg-gray-900);text-align:end;}
  .preview-box .pv-line.total{background:#fff;font-size:13.5px;}

  /* --- Price calendar modal --- */
  .pcm-wrap{overflow:auto;max-height:54vh;border:1px solid var(--pg-border);border-radius:var(--pg-radius-btn);}
  .pcm{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;}
  .pcm th,.pcm td{padding:9px 10px;font-size:12px;text-align:center;white-space:nowrap;
    border-bottom:1px dashed var(--pg-gray-200);border-right:1px solid var(--pg-border);}
  .pcm thead th{position:sticky;top:0;z-index:5;background:var(--pg-gray-100);font-weight:600;
    color:var(--pg-gray-600);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .pcm thead th.today{background:var(--pg-primary-light);color:var(--pg-primary);}
  .pcm .pcm-plan{position:sticky;inset-inline-start:0;z-index:4;background:#fff;text-align:start;min-width:190px;}
  .pcm thead .pcm-plan{z-index:6;background:var(--pg-gray-100);}
  .pcm td.cell{cursor:pointer;}
  .pcm td.cell:hover{background:var(--pg-primary-light);}
  .pcm .amt{font-weight:600;color:var(--pg-gray-900);font-variant-numeric:tabular-nums;}
  .pcm .amt.missing{color:var(--pg-danger);font-size:11px;}
  .pcm .src{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-top:2px;}
  .src-base{color:var(--pg-gray-500);}
  .src-period{color:var(--pg-primary);}
  .src-manual{color:#A56A00;}
  .src-missing{color:var(--pg-danger);}
  .pcm-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--pg-gray-600);margin-top:14px;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("rates", ["Hotel Operations", "Rate Plans & Pricing"]);
var CAN_VIEW = PG.hasPermission('view_rates');
var CAN_MANAGE = PG.hasPermission('manage_rates');
var DOW_LABELS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DOW_SHORT  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WEEKEND_DOW = [4,5];              // Thu/Fri — this property's regional weekend
var CURRENCY = 'USD';
var s = PG.getState();

var qp = new URLSearchParams(location.search);
var ui = {
  tab: (qp.get('tab') === 'periods') ? 'periods' : 'plans',
  search: '',
  planStatus: 'all',      // all | active | inactive
  planScope:  'all',      // all | roomType | rooms
  periodState:'all',      // all | upcoming | active | expired
  roomType:   'all',
  ratePlan:   'all',
  sort: 'name'
};

/* ================================================================== */
/* Shared helpers                                                      */
/* ================================================================== */
function rtName(id){ var rt = s.roomTypes.find(function(r){return r.id===id;}); return rt ? rt.name : id; }
function planById(id){ return PG.ratePlanById(s, id); }
function newId(p){ return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(v){ return v == null ? '—' : PG.fmtMoney(v); }

// Every pricing period in the property, flattened and carrying its owning plan — the
// Pricing Periods tab is a view over these, not over the plans.
function allPeriods(){
  var out = [];
  s.ratePlans.forEach(function(p){
    (p.periods||[]).forEach(function(pp){ out.push({ plan: p, period: pp, state: PG.periodTimeState(pp) }); });
  });
  return out;
}
function periodRef(planId, periodId){
  var p = planById(planId); if (!p) return null;
  return (p.periods||[]).find(function(x){ return x.id===periodId; }) || null;
}
function periodNights(pp){ return PG.periodAffectedDates(pp).length; }
function periodPriceLabel(pp){
  if (pp.mode === 'byday'){
    var vals = (pp.daysOfWeek||[]).map(function(d){ return (pp.prices||{})[String(d)]; })
      .filter(function(v){ return v != null && v !== ''; }).map(Number);
    if (!vals.length) return null;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    return lo === hi ? money(lo) : money(lo) + ' – ' + money(hi);
  }
  return (pp.prices||{}).same != null ? money(Number(pp.prices.same)) : null;
}
function stateBadge(st){
  var m = { active:['badge-green','Active'], upcoming:['badge-blue','Upcoming'],
            expired:['badge-gray','Expired'], inactive:['badge-gray','Switched off'] }[st] || ['badge-gray','—'];
  return '<span class="badge '+m[0]+'"><span class="badge-dot"></span>'+m[1]+'</span>';
}
function planStatusBadge(p){
  return p.active
    ? '<span class="badge badge-green"><span class="badge-dot"></span>Active</span>'
    : '<span class="badge badge-gray"><span class="badge-dot"></span>Inactive</span>';
}
function reservationsUsingPlan(planId){
  return s.reservations.filter(function(r){
    return (r.rooms||[]).some(function(rm){ return rm.ratePlanId === planId; });
  });
}
// The period actually governing TODAY — matching weekday as well as dates, so the
// "current period" named next to a price is the one that produced it.
function currentPeriodOf(p){
  var ps = p.periods || [];
  return ps.find(function(pp){ return PG.periodCoversDate(pp, PG.TODAY); })
    || ps.find(function(pp){ return PG.periodTimeState(pp) === 'active'; }) || null;
}
function ensureEl(id, cls){
  var el = document.getElementById(id);
  if (el) return el;
  el = document.createElement('div'); el.className = cls; el.id = id;
  document.body.appendChild(el);
  return el;
}
function drawer(id){ return ensureEl(id, 'pg-drawer-overlay'); }
function modal(id){ return ensureEl(id, 'pg-modal-overlay'); }
function emptyRow(cols, icon, title, sub){
  return '<tr><td colspan="'+cols+'"><div class="empty-state"><div class="ic">' + PG.icon(icon,28) + '</div>' +
    '<strong>' + title + '</strong>' + sub + '</div></td></tr>';
}
function describePeriod(pp){
  if (!pp) return null;
  var days = (pp.daysOfWeek||[]).length===7 ? 'all days' : (pp.daysOfWeek||[]).map(function(d){return DOW_SHORT[d];}).join('/');
  return PG.fmtDateShort(pp.startDate) + '–' + PG.fmtDateShort(pp.endDate) + ', ' + days + ', ' +
    (pp.mode==='byday' ? 'per-day pricing' : (periodPriceLabel(pp) || 'unpriced') + '/night');
}

/* ================================================================== */
/* Page shell — exactly two underline tabs                             */
/* ================================================================== */
function renderShell(){
  s = PG.getState();
  var planCount = s.ratePlans.length;
  var periodCount = allPeriods().length;
  var onPlans = ui.tab === 'plans';

  var html = '';
  html += '<div class="pg-page-head"><div>' +
      '<h1>' + (onPlans ? 'Rate Plans' : 'Pricing Periods') + '</h1>' +
      '<div class="sub">' + (onPlans
        ? 'Create pricing plans and assign them to room types or specific physical rooms.'
        : 'Override rate-plan prices for named date ranges.') + '</div>' +
    '</div>' +
    (CAN_MANAGE ? '<div class="pg-actions">' + (onPlans
      ? '<button class="btn btn-primary" id="addPlanBtn">' + PG.icon('plus',16) + ' Add Rate Plan</button>'
      : '<button class="btn btn-primary" id="addPeriodBtn">' + PG.icon('plus',16) + ' Add Pricing Period</button>') +
    '</div>' : '') +
  '</div>';

  html += '<div class="pg-tabs" role="tablist">' +
    '<button class="pg-tab' + (onPlans?' active':'') + '" role="tab" aria-selected="' + onPlans + '" data-tab="plans">' +
      PG.icon('tag',16) + ' Rate Plans <span class="tab-count">' + planCount + '</span></button>' +
    '<button class="pg-tab' + (!onPlans?' active':'') + '" role="tab" aria-selected="' + !onPlans + '" data-tab="periods">' +
      PG.icon('calendar',16) + ' Pricing Periods <span class="tab-count">' + periodCount + '</span></button>' +
  '</div>';

  html += '<div id="rpBody"></div>';
  page.innerHTML = html;

  page.querySelectorAll('.pg-tab').forEach(function(tb){
    tb.addEventListener('click', function(){ ui.tab = tb.dataset.tab; ui.search=''; renderShell(); });
  });
  if (CAN_MANAGE){
    var ap = document.getElementById('addPlanBtn');
    if (ap) ap.addEventListener('click', function(){ openPlanEditor(null); });
    var pb = document.getElementById('addPeriodBtn');
    if (pb) pb.addEventListener('click', function(){ openPeriodEditor(null, null); });
  }
  onPlans ? renderPlansTab() : renderPeriodsTab();
}
function rerender(keepFocus){
  s = PG.getState();
  ui.tab === 'plans' ? renderPlansTab() : renderPeriodsTab();
  if (keepFocus){
    var el = document.getElementById('rpSearch');
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

/* ================================================================== */
/* TAB 1 — Rate Plans                                                  */
/* ================================================================== */
function visiblePlans(){
  var list = s.ratePlans.filter(function(p){
    if (ui.planStatus==='active' && !p.active) return false;
    if (ui.planStatus==='inactive' && p.active) return false;
    if (ui.planScope==='roomType' && p.scope==='rooms') return false;
    if (ui.planScope==='rooms' && p.scope!=='rooms') return false;
    if (ui.roomType!=='all' && p.roomTypeId!==ui.roomType) return false;
    if (ui.search){
      var hay = (p.name+' '+(p.code||'')+' '+(p.description||'')+' '+PG.planScopeLabel(s,p)).toLowerCase();
      if (hay.indexOf(ui.search.toLowerCase())===-1) return false;
    }
    return true;
  });
  var cmp = { name:function(a,b){ return a.name<b.name?-1:1; },
              price:function(a,b){ return (b.basePrice||0)-(a.basePrice||0); },
              updated:function(a,b){ return (b.updatedAt||'')<(a.updatedAt||'')?-1:1; } }[ui.sort];
  return list.sort(cmp);
}

function renderPlansTab(){
  var plans = visiblePlans();
  var applied = [];
  if (ui.roomType!=='all') applied.push({key:'roomType', label:'Room Type', value: rtName(ui.roomType)});
  if (ui.search) applied.push({key:'search', label:'Search', value: ui.search});

  var html = '<div class="card"><div class="card-body">';
  html += '<div class="rp-toolbar">' +
    '<div class="grow pg-searchwrap"><span class="ic">' + PG.icon('search',15) + '</span>' +
      '<input class="form-control" id="rpSearch" type="search" placeholder="Search rate plans…" ' +
      'aria-label="Search rate plans" value="' + PG.esc(ui.search) + '"></div>' +
    '<button class="btn btn-outline btn-sm" id="advBtn">' + PG.icon('filter',15) + ' Advanced Filters' +
      (ui.roomType!=='all' ? ' <span class="pg-chip-count" style="background:var(--pg-primary);color:#fff;">1</span>' : '') + '</button>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
      '<span class="text-sm muted">Sort</span>' +
      PG.segmented('planSort', [{value:'name',label:'Name'},{value:'price',label:'Price'},{value:'updated',label:'Updated'}], ui.sort, {ariaLabel:'Sort rate plans'}) +
    '</div>' +
  '</div>';
  html += '<div class="rp-chiprow"><span class="lbl">Status</span>' +
    PG.filterChips('planStatus', [{value:'all',label:'All'},{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}], ui.planStatus, {ariaLabel:'Filter by status'}) +
    '<span class="lbl" style="margin-inline-start:10px;">Scope</span>' +
    PG.filterChips('planScope', [{value:'all',label:'All'},{value:'roomType',label:'Room Types'},{value:'rooms',label:'Specific Rooms'}], ui.planScope, {ariaLabel:'Filter by scope'}) +
  '</div>';
  if (applied.length){
    html += '<div class="rp-applied"><span class="text-sm muted">' + applied.length + ' filter' + (applied.length===1?'':'s') + ' applied</span>' +
      PG.appliedChips(applied) + '<button class="btn btn-light btn-sm" id="clearFilters">Clear Filters</button></div>';
  }
  html += '</div></div>';

  html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
    '<th scope="col">Rate Plan</th><th scope="col">Applies To</th><th class="num" scope="col">Base Price</th>' +
    '<th scope="col">Current Period</th><th scope="col">Status</th><th scope="col">Last Updated</th>' +
    '<th scope="col"><span class="sr-only">Actions</span></th>' +
  '</tr></thead><tbody id="plansBody"></tbody></table></div></div></div>';

  document.getElementById('rpBody').innerHTML = html;
  wireToolbar();

  var body = plans.map(function(p){
    var cur = currentPeriodOf(p);
    var scopeRooms = PG.planScopeRooms(s,p).length;
    return '<tr>' +
      '<td><div class="ent"><span class="ent-ic plan">' + PG.icon('tag',18) + '</span><div class="ent-main">' +
        '<span class="ent-name" data-view="'+p.id+'" role="button" tabindex="0">' + PG.esc(p.name) +
          (p.isDefault ? ' <span class="badge badge-blue">Default</span>' : '') + '</span>' +
        '<div class="ent-sub">' + PG.esc(p.mealPlan) + (p.code ? ' · ' + PG.esc(p.code) : '') +
          ' · ' + (p.periods||[]).length + ' pricing period' + ((p.periods||[]).length===1?'':'s') + '</div>' +
      '</div></div></td>' +
      '<td><div style="font-weight:600;color:var(--pg-gray-900);">' + PG.esc(PG.planScopeLabel(s,p)) + '</div>' +
        '<div class="ent-sub">' + PG.esc(rtName(p.roomTypeId)) + ' · ' + scopeRooms + ' room' + (scopeRooms===1?'':'s') + '</div></td>' +
      '<td class="num"><div class="price-cell">' + money(p.basePrice) + '</div>' +
        '<div class="ent-sub">' + CURRENCY + ' / night</div></td>' +
      '<td>' + (cur ? '<div style="font-weight:600;color:var(--pg-gray-900);">' + PG.esc(cur.name) + '</div>' +
          '<div class="ent-sub">' + PG.fmtDateShort(cur.startDate) + ' – ' + PG.fmtDateShort(cur.endDate) + '</div>'
        : '<span class="muted text-sm">Base price applies</span>') + '</td>' +
      '<td>' + planStatusBadge(p) + '</td>' +
      '<td class="text-sm muted">' + (p.updatedAt ? PG.fmtDateShort(p.updatedAt.slice(0,10)) : '—') + '</td>' +
      '<td style="text-align:end;">' + planRowMenu(p) + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('plansBody').innerHTML = body || emptyRow(7, 'tag',
    'No rate plans match these filters',
    CAN_MANAGE ? 'Clear the filters, or add a rate plan to start selling this room type.' : 'Clear the filters to see all rate plans.');
  wireRows();
}

function planRowMenu(p){
  var items = '<button type="button" data-act="view" data-id="'+p.id+'">' + PG.icon('info',15) + ' View Details</button>';
  if (CAN_MANAGE){
    items += '<button type="button" data-act="edit" data-id="'+p.id+'">' + PG.icon('edit',15) + ' Edit Rate Plan</button>' +
      '<button type="button" data-act="addperiod" data-id="'+p.id+'">' + PG.icon('calendar',15) + ' Add Pricing Period</button>' +
      '<button type="button" data-act="calendar" data-id="'+p.id+'">' + PG.icon('grid',15) + ' View Price Calendar</button>' +
      '<button type="button" data-act="duplicate" data-id="'+p.id+'">' + PG.icon('copy',15) + ' Duplicate</button>' +
      '<div class="menu-sep"></div>' +
      '<button type="button" data-act="toggle" data-id="'+p.id+'">' + PG.icon(p.active?'pause':'check',15) + ' ' + (p.active?'Deactivate':'Activate') + '</button>';
    var deps = reservationsUsingPlan(p.id);
    items += '<div class="menu-sep"></div>' + (deps.length
      ? '<button type="button" disabled title="' + deps.length + ' reservation(s) were booked on this plan">' + PG.icon('trash',15) + ' Delete (in use)</button>'
      : '<button type="button" class="danger" data-act="delete" data-id="'+p.id+'">' + PG.icon('trash',15) + ' Delete Rate Plan</button>');
  }
  return '<div class="more-wrap"><button class="more-btn" aria-label="Actions for ' + PG.esc(p.name) + '" aria-haspopup="menu">' +
    PG.icon('dots',16) + '</button><div class="more-menu" role="menu">' + items + '</div></div>';
}

/* ================================================================== */
/* TAB 2 — Pricing Periods                                             */
/* ================================================================== */
function visiblePeriods(){
  return allPeriods().filter(function(x){
    if (ui.periodState!=='all' && x.state!==ui.periodState) return false;
    if (ui.roomType!=='all' && x.plan.roomTypeId!==ui.roomType) return false;
    if (ui.ratePlan!=='all' && x.plan.id!==ui.ratePlan) return false;
    if (ui.search){
      var hay = (x.period.name + ' ' + x.plan.name + ' ' + PG.planScopeLabel(s, x.plan)).toLowerCase();
      if (hay.indexOf(ui.search.toLowerCase())===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return a.period.startDate < b.period.startDate ? -1 : 1; });
}

/* ================================================================== */
/* Toolbar + row wiring (shared by both tabs)                          */
/* ================================================================== */
function wireToolbar(){
  var search = document.getElementById('rpSearch'), timer = null;
  search.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ ui.search = search.value.trim(); rerender(true); }, 200);
  });
  PG.wireChips(page, 'planStatus',  function(v){ ui.planStatus = v; rerender(); });
  PG.wireChips(page, 'planScope',   function(v){ ui.planScope = v; rerender(); });
  PG.wireChips(page, 'periodState', function(v){ ui.periodState = v; rerender(); });
  PG.wireSegmented(page, 'planSort', function(v){ ui.sort = v; rerender(); });
  var clear = document.getElementById('clearFilters');
  if (clear) clear.addEventListener('click', function(){
    ui.roomType='all'; ui.ratePlan='all'; ui.search=''; rerender();
  });
  page.querySelectorAll('[data-remove-filter]').forEach(function(b){
    b.addEventListener('click', function(){
      var k=b.dataset.removeFilter;
      if (k==='search') ui.search=''; else ui[k]='all';
      rerender();
    });
  });
  document.getElementById('advBtn').addEventListener('click', openAdvancedFilters);
}

function wireRows(){
  page.querySelectorAll('.ent-name').forEach(function(el){
    function go(){
      if (el.dataset.view) openPlanDrawer(el.dataset.view);
      else if (el.dataset.editperiod){
        var parts = el.dataset.editperiod.split('|');
        CAN_MANAGE ? openPeriodEditor(parts[0], parts[1]) : openPlanDrawer(parts[0]);
      }
    }
    el.addEventListener('click', go);
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
  });
  PG.wireMoreMenus(page);
  page.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var act = btn.dataset.act, id = btn.dataset.id, parts = id.split('|');
      if (act==='view') openPlanDrawer(id);
      else if (act==='edit') openPlanEditor(id);
      else if (act==='addperiod') openPeriodEditor(id, null);
      else if (act==='calendar') openPriceCalendar(id);
      else if (act==='duplicate') duplicatePlan(id);
      else if (act==='toggle') togglePlan(id);
      else if (act==='delete') confirmDeletePlan(id);
      else if (act==='viewperiod') openPlanDrawer(parts[0]);
      else if (act==='editperiod') openPeriodEditor(parts[0], parts[1]);
      else if (act==='dupperiod') duplicatePeriod(parts[0], parts[1]);
      else if (act==='toggleperiod') togglePeriod(parts[0], parts[1]);
      else if (act==='delperiod') confirmDeletePeriod(parts[0], parts[1]);
    });
  });
}

/* ================================================================== */
/* Rate Plan editor drawer — Basic information / Target scope / Base   */
/* price. The SAME drawer serves Add and Edit.                         */
/* ================================================================== */
function openPlanEditor(planId){
  s = PG.getState();
  var existing = planId ? planById(planId) : null;
  var deps = existing ? reservationsUsingPlan(existing.id) : [];
  var d = drawer('rpPlanEditor');

  var draft = existing ? {
    name: existing.name, code: existing.code || '', description: existing.description || '',
    active: !!existing.active, isDefault: !!existing.isDefault, strict: !!existing.strictPeriodPricing,
    roomTypeId: existing.roomTypeId, scope: existing.scope || 'roomType',
    physicalRoomIds: (existing.physicalRoomIds||[]).slice(),
    mealPlan: existing.mealPlan, basePrice: existing.basePrice
  } : {
    name:'', code:'', description:'', active:true, isDefault:false, strict:false,
    roomTypeId: s.roomTypes[0].id, scope:'roomType', physicalRoomIds:[],
    mealPlan: s.mealPlans[0], basePrice: s.roomTypes[0].baseRate
  };

  function roomsOfType(){
    return s.physicalRooms.filter(function(r){ return r.roomTypeId === draft.roomTypeId; })
      .sort(function(a,b){ return Number(a.roomNumber) - Number(b.roomNumber); });
  }
  // An inactive or non-sellable room can never be a plan target — offering it would
  // create a plan that prices a room the property cannot actually sell.
  function roomSelectable(r){ return r.isActive && r.isSellable; }
  function distinctVals(list, key){
    var seen = {}, out = [];
    list.forEach(function(r){ var v = r[key]; if (v!=null && !seen[v]){ seen[v]=true; out.push(v); } });
    return out.sort();
  }

  // Scalable room-targeting state — search + scope filters + a paging cap so a
  // 300-room property never renders hundreds of checkbox rows at once (§6).
  var scopeUi = { search:'', building:'all', floor:'all', opStatus:'all', sellable:'all', rangeText:'', expanded:false, visible:60 };
  function resetScopeUi(){ scopeUi = { search:'', building:'all', floor:'all', opStatus:'all', sellable:'all', rangeText:'', expanded:false, visible:60 }; }

  function scopeFilteredRooms(){
    var rooms = roomsOfType();
    var q = scopeUi.search.trim().toLowerCase();
    return rooms.filter(function(r){
      if (scopeUi.building!=='all' && r.building!==scopeUi.building) return false;
      if (scopeUi.floor!=='all' && String(r.floor)!==scopeUi.floor) return false;
      if (scopeUi.opStatus!=='all' && r.operationalStatus!==scopeUi.opStatus) return false;
      if (scopeUi.sellable==='yes' && !r.isSellable) return false;
      if (scopeUi.sellable==='no' && r.isSellable) return false;
      if (q){
        var hay = (r.roomNumber+' '+r.building+' Floor '+r.floor+' '+r.bedConfiguration).toLowerCase();
        if (hay.indexOf(q)===-1) return false;
      }
      return true;
    });
  }

  // "101-110, 201-210, 305" → matching, selectable rooms of the current type, plus a
  // report of what could not be added (invalid syntax, no such room, inactive/not
  // sellable, or a duplicate of what's already selected) so validation can name numbers.
  function parseRoomRanges(text){
    var rooms = roomsOfType();
    var byNumber = {};
    rooms.forEach(function(r){ byNumber[r.roomNumber] = r; });
    var matched = [], skippedInactive = [], skippedMissing = [], skippedDuplicate = [], invalidTokens = [];
    (text||'').split(',').map(function(t){return t.trim();}).filter(Boolean).forEach(function(tok){
      var m = tok.match(/^(\d+)\s*[-–]\s*(\d+)$/);
      var nums = [];
      if (m) {
        var lo = parseInt(m[1],10), hi = parseInt(m[2],10);
        if (isNaN(lo) || isNaN(hi) || hi < lo) { invalidTokens.push(tok); return; }
        for (var n=lo; n<=hi; n++) nums.push(String(n));
      } else if (/^\d+$/.test(tok)) {
        nums.push(tok);
      } else {
        invalidTokens.push(tok); return;
      }
      nums.forEach(function(numStr){
        // Room numbers in the seed are stored as-is (e.g. "101"); tolerate a bare
        // numeric match even if the stored value has extra formatting.
        var r = byNumber[numStr] || rooms.find(function(x){ return String(parseInt(x.roomNumber,10))===String(parseInt(numStr,10)); });
        if (!r) { skippedMissing.push(numStr); return; }
        if (draft.physicalRoomIds.indexOf(r.id) > -1 || matched.indexOf(r) > -1) { skippedDuplicate.push(r.roomNumber); return; }
        if (!roomSelectable(r)) { skippedInactive.push(r.roomNumber); return; }
        matched.push(r);
      });
    });
    return { matched: matched, skippedInactive: skippedInactive, skippedMissing: skippedMissing, skippedDuplicate: skippedDuplicate, invalidTokens: invalidTokens };
  }

  function addRooms(rooms){
    rooms.forEach(function(r){
      if (roomSelectable(r) && draft.physicalRoomIds.indexOf(r.id)===-1) draft.physicalRoomIds.push(r.id);
    });
  }

  // Selected rooms grouped by building for the summary — "Main Building · Floor 1"
  // when a whole floor's selectable rooms are all picked, else a collapsed room-number
  // range via PG.summarizeRoomNumbers (e.g. "Rooms 101–105, 108").
  function selectionSummaryGroups(){
    var rooms = roomsOfType();
    var picked = rooms.filter(function(r){ return draft.physicalRoomIds.indexOf(r.id)>-1; });
    if (!picked.length) return [];
    var byBuilding = {};
    picked.forEach(function(r){ (byBuilding[r.building] = byBuilding[r.building] || []).push(r); });
    var groups = [];
    Object.keys(byBuilding).forEach(function(bld){
      var inBld = byBuilding[bld];
      var byFloor = {};
      inBld.forEach(function(r){ (byFloor[r.floor] = byFloor[r.floor] || []).push(r); });
      Object.keys(byFloor).forEach(function(fl){
        var floorRooms = rooms.filter(function(r){ return r.building===bld && String(r.floor)===String(fl) && roomSelectable(r); });
        var pickedOnFloor = byFloor[fl];
        if (floorRooms.length && pickedOnFloor.length === floorRooms.length){
          groups.push(PG.esc(bld) + ' &middot; Floor ' + fl + ' <span class="muted">(all ' + floorRooms.length + ')</span>');
        } else {
          groups.push(PG.esc(bld) + ' &middot; Rooms ' + PG.esc(PG.summarizeRoomNumbers(pickedOnFloor.map(function(r){return r.roomNumber;}))));
        }
      });
    });
    return groups;
  }

  function scopeSection(){
    if (draft.scope !== 'rooms'){
      var n = roomsOfType().length;
      return '<div class="form-group"><label class="form-label">Room Type <span class="req">*</span></label>' +
        '<div id="peRt"></div>' + (deps.length
          ? '<div class="form-hint">Locked — ' + deps.length + ' reservation(s) are booked on this plan.</div>'
          : '<div class="form-hint">This plan will be sellable on every room of this type.</div>') + '</div>' +
        '<div class="scope-summary"><span>Rooms covered</span><strong>' + n + ' ' + PG.esc(rtName(draft.roomTypeId)) + ' room' + (n===1?'':'s') + '</strong></div>';
    }
    return '<div class="form-group"><label class="form-label">Room Type <span class="req">*</span></label><div id="peRt"></div>' +
      '<div class="form-hint">Specific rooms are always chosen from within one room type, so a plan can never price a room it was not built for.</div></div>' +
      '<div id="peScopeRooms"></div>';
  }

  // Renders/rewires ONLY the "Specific Rooms" picker sub-tree, so typing in the
  // search box or range field never re-paints (and loses focus in) the whole drawer.
  function renderScopeRoomsBody(){
    var host = document.getElementById('peScopeRooms');
    if (!host) return;
    var allRooms = roomsOfType();
    var buildings = distinctVals(allRooms, 'building');
    var floors = distinctVals(allRooms, 'floor');
    var opStatuses = distinctVals(allRooms, 'operationalStatus');
    var filtered = scopeFilteredRooms();
    var picked = allRooms.filter(function(r){ return draft.physicalRoomIds.indexOf(r.id)>-1; });
    var visibleRooms = filtered.slice(0, scopeUi.visible);
    var groups = selectionSummaryGroups();

    host.innerHTML =
      '<div class="form-group"><label class="form-label">Physical Rooms <span class="req">*</span></label>' +

      '<div class="scope-summary" style="margin:0 0 10px;flex-direction:column;align-items:stretch;gap:6px;">' +
        '<div style="display:flex;justify-content:space-between;"><span><strong>' + picked.length + '</strong> room' + (picked.length===1?'':'s') + ' selected</span>' +
          (picked.length ? '<button type="button" class="row-link text-sm" id="peExpandSel">' + (scopeUi.expanded?'Hide list':'Review individual rooms') + '</button>' : '') + '</div>' +
        (groups.length ? '<div class="text-sm" style="color:var(--pg-gray-600);">' + groups.join('<br>') + '</div>' : '') +
        (scopeUi.expanded && picked.length ? '<div class="scope-chips">' + picked.map(function(r){
          return '<span class="scope-chip">Room ' + PG.esc(r.roomNumber) +
            '<button type="button" class="x" data-unpick="'+r.id+'" aria-label="Remove room ' + PG.esc(r.roomNumber) + '">&times;</button></span>';
        }).join('') + '</div>' : '') +
      '</div>' +

      '<div class="pg-searchwrap" style="margin-bottom:10px;"><span class="ic">' + PG.icon('search',14) + '</span>' +
        '<input class="form-control" id="peScopeSearch" type="search" placeholder="Search by room number, building, or floor" value="'+PG.esc(scopeUi.search)+'" aria-label="Search rooms"></div>' +

      '<div class="grid-2" style="gap:8px;margin-bottom:10px;">' +
        '<select class="form-control" id="peScopeBuilding"><option value="all">All Buildings</option>' + buildings.map(function(b){return '<option value="'+PG.esc(b)+'"'+(scopeUi.building===b?' selected':'')+'>'+PG.esc(b)+'</option>';}).join('') + '</select>' +
        '<select class="form-control" id="peScopeFloor"><option value="all">All Floors</option>' + floors.map(function(f){return '<option value="'+f+'"'+(String(scopeUi.floor)===String(f)?' selected':'')+'>Floor '+f+'</option>';}).join('') + '</select>' +
        '<select class="form-control" id="peScopeStatus"><option value="all">All Statuses</option>' + opStatuses.map(function(st2){return '<option value="'+PG.esc(st2)+'"'+(scopeUi.opStatus===st2?' selected':'')+'>'+PG.esc(st2)+'</option>';}).join('') + '</select>' +
        '<select class="form-control" id="peScopeSellable"><option value="all">Sellable: Any</option><option value="yes"'+(scopeUi.sellable==='yes'?' selected':'')+'>Sellable only</option><option value="no"'+(scopeUi.sellable==='no'?' selected':'')+'>Not sellable</option></select>' +
      '</div>' +

      '<div class="copy-row">' +
        '<button type="button" class="btn btn-light btn-sm" id="peSelFiltered">Select all filtered (' + filtered.filter(roomSelectable).length + ')</button>' +
        (scopeUi.building!=='all' ? '<button type="button" class="btn btn-light btn-sm" id="peSelBuilding">Select all in ' + PG.esc(scopeUi.building) + '</button>' : '') +
        (scopeUi.floor!=='all' ? '<button type="button" class="btn btn-light btn-sm" id="peSelFloor">Select all Floor ' + scopeUi.floor + '</button>' : '') +
        '<button type="button" class="btn btn-light btn-sm" id="peSelAllType">Select all ' + PG.esc(rtName(draft.roomTypeId)) + '</button>' +
        (picked.length ? '<button type="button" class="btn btn-light btn-sm" id="peClearSel">Clear selection</button>' : '') +
      '</div>' +

      '<div class="grid-2" style="gap:8px;align-items:end;margin-bottom:10px;">' +
        '<div class="form-group" style="margin-bottom:0;"><label class="form-label" for="peRangeInput">Room number ranges</label>' +
        '<input class="form-control" id="peRangeInput" placeholder="e.g. 101-110, 201-210, 305" value="'+PG.esc(scopeUi.rangeText)+'"></div>' +
        '<button type="button" class="btn btn-outline" id="peRangeAdd">' + PG.icon('plus',15) + ' Add Range</button>' +
      '</div>' +
      '<div id="peRangeFeedback"></div>' +

      '<div class="scope-room-list" id="peRooms">' + (visibleRooms.length ? visibleRooms.map(function(r){
        var ok = roomSelectable(r);
        var on = draft.physicalRoomIds.indexOf(r.id)>-1;
        return '<label class="scope-room' + (ok?'':' disabled') + '">' +
          '<input type="checkbox" value="'+r.id+'"' + (on?' checked':'') + (ok?'':' disabled') + '>' +
          '<span><span class="rn">Room ' + PG.esc(r.roomNumber) + '</span> ' +
          '<span class="rm">· ' + PG.esc(r.building) + ' &middot; Floor ' + r.floor + ' &middot; ' + PG.esc(r.bedConfiguration) +
          (ok ? '' : ' &middot; ' + (r.isActive ? 'not sellable' : 'inactive')) + '</span></span></label>';
      }).join('') : '<div class="text-sm muted" style="padding:14px;">No rooms match these filters.</div>') + '</div>' +
      (filtered.length > scopeUi.visible
        ? '<button type="button" class="btn btn-light btn-sm" id="peShowMore" style="margin-top:8px;">Show ' + Math.min(60, filtered.length-scopeUi.visible) + ' more (' + (filtered.length-scopeUi.visible) + ' remaining)</button>'
        : (filtered.length ? '<div class="text-sm muted" style="margin-top:6px;">Showing all ' + filtered.length + ' filtered room' + (filtered.length===1?'':'s') + '.</div>' : '')) +
    '</div>';

    document.getElementById('peScopeSearch').addEventListener('input', function(){ scopeUi.search=this.value; scopeUi.visible=60; renderScopeRoomsBody(); reviewSave(); });
    document.getElementById('peScopeBuilding').addEventListener('change', function(){ scopeUi.building=this.value; scopeUi.visible=60; renderScopeRoomsBody(); });
    document.getElementById('peScopeFloor').addEventListener('change', function(){ scopeUi.floor=this.value; scopeUi.visible=60; renderScopeRoomsBody(); });
    document.getElementById('peScopeStatus').addEventListener('change', function(){ scopeUi.opStatus=this.value; scopeUi.visible=60; renderScopeRoomsBody(); });
    document.getElementById('peScopeSellable').addEventListener('change', function(){ scopeUi.sellable=this.value; scopeUi.visible=60; renderScopeRoomsBody(); });

    document.getElementById('peSelFiltered').addEventListener('click', function(){ addRooms(scopeFilteredRooms()); renderScopeRoomsBody(); reviewSave(); });
    var selBld = document.getElementById('peSelBuilding'); if (selBld) selBld.addEventListener('click', function(){ addRooms(allRooms.filter(function(r){return r.building===scopeUi.building;})); renderScopeRoomsBody(); reviewSave(); });
    var selFlr = document.getElementById('peSelFloor'); if (selFlr) selFlr.addEventListener('click', function(){ addRooms(allRooms.filter(function(r){return String(r.floor)===String(scopeUi.floor);})); renderScopeRoomsBody(); reviewSave(); });
    document.getElementById('peSelAllType').addEventListener('click', function(){ addRooms(allRooms); renderScopeRoomsBody(); reviewSave(); });
    var clearBtn = document.getElementById('peClearSel'); if (clearBtn) clearBtn.addEventListener('click', function(){ draft.physicalRoomIds = []; renderScopeRoomsBody(); reviewSave(); });

    var expandBtn = document.getElementById('peExpandSel'); if (expandBtn) expandBtn.addEventListener('click', function(){ scopeUi.expanded = !scopeUi.expanded; renderScopeRoomsBody(); });

    document.getElementById('peRangeInput').addEventListener('input', function(){ scopeUi.rangeText=this.value; });
    document.getElementById('peRangeAdd').addEventListener('click', function(){
      var result = parseRoomRanges(scopeUi.rangeText);
      addRooms(result.matched);
      var msgs = [];
      if (result.matched.length) msgs.push('<div class="help-note help-note-success" style="margin-bottom:8px;">' + PG.icon('check',15) + '<div>Added ' + result.matched.length + ' room' + (result.matched.length===1?'':'s') + ': ' + PG.esc(PG.summarizeRoomNumbers(result.matched.map(function(r){return r.roomNumber;}))) + '</div></div>');
      if (result.invalidTokens.length) msgs.push('<div class="help-note help-note-danger" style="margin-bottom:8px;">' + PG.icon('alert',15) + '<div>Invalid range: ' + PG.esc(result.invalidTokens.join(', ')) + '</div></div>');
      if (result.skippedMissing.length) msgs.push('<div class="help-note help-note-warning" style="margin-bottom:8px;">' + PG.icon('info',15) + '<div>No room numbered ' + PG.esc(result.skippedMissing.join(', ')) + ' in ' + PG.esc(rtName(draft.roomTypeId)) + '</div></div>');
      if (result.skippedInactive.length) msgs.push('<div class="help-note help-note-warning" style="margin-bottom:8px;">' + PG.icon('alert',15) + '<div>Skipped inactive/not-sellable rooms: ' + PG.esc(result.skippedInactive.join(', ')) + '</div></div>');
      if (result.skippedDuplicate.length) msgs.push('<div class="help-note" style="margin-bottom:8px;">' + PG.icon('info',15) + '<div>Already selected: ' + PG.esc(result.skippedDuplicate.join(', ')) + '</div></div>');
      scopeUi.rangeText = '';
      // Rebuild the picker FIRST (it recreates #peRangeFeedback empty), then write the
      // feedback into the fresh node — setting it before the rebuild just gets wiped.
      renderScopeRoomsBody();
      var fb = document.getElementById('peRangeFeedback');
      if (fb) fb.innerHTML = msgs.join('');
      reviewSave();
    });

    var showMoreBtn = document.getElementById('peShowMore'); if (showMoreBtn) showMoreBtn.addEventListener('click', function(){ scopeUi.visible += 60; renderScopeRoomsBody(); });

    var roomBox = document.getElementById('peRooms');
    roomBox.addEventListener('change', function(e){
      var cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
      var i = draft.physicalRoomIds.indexOf(cb.value);
      if (cb.checked && i===-1) draft.physicalRoomIds.push(cb.value);
      if (!cb.checked && i>-1) draft.physicalRoomIds.splice(i,1);
      renderScopeRoomsBody(); reviewSave();
    });
    host.querySelectorAll('[data-unpick]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = draft.physicalRoomIds.indexOf(b.dataset.unpick);
        if (i>-1) draft.physicalRoomIds.splice(i,1);
        renderScopeRoomsBody(); reviewSave();
      });
    });
  }
  // No-op placeholder overwritten once the save button exists (defined below, after
  // paint() creates #peSave) — lets the room-picker helpers above call it unconditionally.
  var reviewSave = function(){};

  function paint(){
    d.innerHTML = '<div class="pg-drawer pg-drawer-wide">' +
      '<div class="pg-drawer-header"><div><h3>' + (existing ? 'Edit Rate Plan' : 'Add Rate Plan') + '</h3>' +
        '<div class="muted text-sm">' + (existing ? PG.esc(existing.name) : 'A commercial offer, priced per night') + '</div></div>' +
        '<button class="pg-modal-close" onclick="PG.closeModal(\'rpPlanEditor\')" aria-label="Close">' + PG.icon('x',16) + '</button></div>' +
      '<div class="pg-drawer-body">' +

        '<div class="drawer-section">' +
          '<div class="drawer-section-title">' + PG.icon('note',15) + ' Basic information</div>' +
          '<div class="form-group"><label class="form-label" for="pe-name">Rate Plan Name <span class="req">*</span></label>' +
            '<input class="form-control" id="pe-name" value="'+PG.esc(draft.name)+'" placeholder="e.g. Breakfast Included">' +
            '<div class="form-hint">Name the offer, not a season — date ranges belong to pricing periods.</div></div>' +
          '<div class="grid-2" style="margin-bottom:0;gap:14px;">' +
            '<div class="form-group"><label class="form-label" for="pe-code">Internal Code <span class="opt">(optional)</span></label>' +
              '<input class="form-control" id="pe-code" value="'+PG.esc(draft.code)+'" placeholder="e.g. BB-STD"></div>' +
            '<div class="form-group"><label class="form-label">Meal Plan</label><div id="pe-meal"></div></div>' +
          '</div>' +
          '<div class="form-group"><label class="form-label" for="pe-desc">Description <span class="opt">(optional)</span></label>' +
            '<textarea class="form-control" id="pe-desc" rows="2" placeholder="Short summary of what this offer includes">'+PG.esc(draft.description)+'</textarea></div>' +
          '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Status</label>' +
            '<label class="pg-switch"><input type="checkbox" id="pe-active"' + (draft.active?' checked':'') + '><span class="track"></span>' +
            '<span class="text-sm">Active — available for new reservations</span></label></div>' +
        '</div>' +

        '<div class="drawer-section">' +
          '<div class="drawer-section-title">' + PG.icon('door',15) + ' Target scope</div>' +
          '<div class="form-group">' +
            PG.segmented('peScope', [{value:'roomType',label:'Room Type'},{value:'rooms',label:'Specific Physical Rooms'}], draft.scope, {ariaLabel:'Target scope'}) +
          '</div>' +
          '<div id="peScopeBody">' + scopeSection() + '</div>' +
        '</div>' +

        '<div class="drawer-section">' +
          '<div class="drawer-section-title">' + PG.icon('money',15) + ' Base price</div>' +
          '<div class="form-group"><label class="form-label" for="pe-base">Amount <span class="req">*</span></label>' +
            '<div class="price-input-wrap"><span class="cur-pre">' + CURRENCY + '</span>' +
            '<input type="number" min="0.01" step="0.01" class="form-control" id="pe-base" value="'+(draft.basePrice!=null?draft.basePrice:'')+'">' +
            '<span class="unit">/ night</span></div></div>' +
          '<div class="help-note">' + PG.icon('info',16) + '<div>This is the default nightly price for this plan. ' +
            '<strong>Pricing Periods can override this base price for selected dates.</strong></div></div>' +
          '<div class="form-group" style="margin-top:18px;"><label class="form-label">Dates no pricing period covers</label>' +
            PG.segmented('peStrict', [{value:'0',label:'Sell at base price'},{value:'1',label:'Not sellable'}], draft.strict?'1':'0', {ariaLabel:'Behavior outside pricing periods'}) +
            '<div class="form-hint">“Not sellable” shows <strong>No price</strong> instead of quietly selling — use it for contracted plans limited to specific days.</div></div>' +
          '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Default plan for this room type</label>' +
            '<label class="pg-switch"><input type="checkbox" id="pe-default"' + (draft.isDefault?' checked':'') + '><span class="track"></span>' +
            '<span class="text-sm">Use this plan when a price is requested without naming one</span></label>' +
            '<div class="form-hint">Exactly one per room type — turning this on moves the flag off whichever plan holds it.</div></div>' +
        '</div>' +

        '<div id="peStatus" role="status" aria-live="polite"></div>' +
      '</div>' +
      '<div class="pg-drawer-footer">' +
        '<button class="btn btn-light" onclick="PG.closeModal(\'rpPlanEditor\')">Cancel</button>' +
        '<button class="btn btn-primary" id="peSave">' + (existing ? 'Save Changes' : 'Create Rate Plan') + '</button>' +
      '</div>' +
    '</div>';

    PG.renderCombobox(document.getElementById('peRt'), {
      placeholder:'Select a room type', ariaLabel:'Room type', value: draft.roomTypeId,
      items: s.roomTypes.map(function(rt){
        return { id:rt.id, label:rt.name,
          sub: s.physicalRooms.filter(function(r){return r.roomTypeId===rt.id;}).length + ' physical rooms · base ' + money(rt.baseRate),
          disabled: deps.length>0, reason: deps.length ? 'Locked while reservations are booked on this plan' : null };
      }),
      onSelect: function(id){ draft.roomTypeId = id; draft.physicalRoomIds = []; resetScopeUi(); paint(); }
    });
    PG.renderManagedSelect(document.getElementById('pe-meal'), {
      value: draft.mealPlan,
      getList: function(){ return PG.getState().mealPlans; },
      setList: function(list){ var st=PG.getState(); st.mealPlans=list; PG.setState(st); },
      onChange: function(v){ draft.mealPlan = v; },
      placeholder: 'e.g. All Inclusive'
    });
    document.getElementById('pe-name').addEventListener('input', function(){ draft.name=this.value; });
    document.getElementById('pe-code').addEventListener('input', function(){ draft.code=this.value; });
    document.getElementById('pe-desc').addEventListener('input', function(){ draft.description=this.value; });
    document.getElementById('pe-base').addEventListener('input', function(){ draft.basePrice=this.value; });
    document.getElementById('pe-active').addEventListener('change', function(){ draft.active=this.checked; });
    document.getElementById('pe-default').addEventListener('change', function(){ draft.isDefault=this.checked; });
    PG.wireSegmented(d, 'peScope', function(v){ draft.scope=v; if (v==='rooms') resetScopeUi(); paint(); });
    PG.wireSegmented(d, 'peStrict', function(v){ draft.strict = v==='1'; });

    // The "Specific Rooms" picker is a big enough sub-tree that it renders itself
    // (see renderScopeRoomsBody) rather than forcing a full drawer repaint on every
    // keystroke/checkbox — that would lose focus in the search/range inputs.
    if (draft.scope === 'rooms') renderScopeRoomsBody();

    document.getElementById('peSave').addEventListener('click', function(){ savePlan(this); });
    reviewSave = function(){
      var saveBtn = document.getElementById('peSave');
      if (!saveBtn) return;
      if (draft.scope === 'rooms' && !draft.physicalRoomIds.length){
        saveBtn.title = 'Select at least one physical room before saving.';
      } else saveBtn.title = '';
    };
    reviewSave();
  }

  function savePlan(btn){
    var status = document.getElementById('peStatus');
    var errs = [];
    if (!draft.name.trim()) errs.push('A rate plan name is required.');
    var dupe = s.ratePlans.some(function(p){
      return p.id !== (existing?existing.id:null) && p.roomTypeId === draft.roomTypeId &&
        p.name.trim().toLowerCase() === draft.name.trim().toLowerCase();
    });
    if (dupe) errs.push('Another rate plan on this room type already uses this name.');
    if (!(Number(draft.basePrice) > 0)) errs.push('Enter a base price greater than 0.');
    if (!CAN_MANAGE) errs.push('You don’t have permission to modify rate-plan assignments.');
    if (draft.scope==='rooms'){
      if (!draft.physicalRoomIds.length) errs.push('Select at least one physical room for this plan.');
      else {
        // Re-check every selected room against LIVE state — it may have been
        // deactivated, marked not-sellable, or reassigned to another room type
        // since this drawer opened.
        var freshState = PG.getState();
        var badInactive = [], badType = [], missing = [];
        draft.physicalRoomIds.forEach(function(id){
          var r = freshState.physicalRooms.find(function(x){return x.id===id;});
          if (!r) { missing.push(id); return; }
          if (r.roomTypeId !== draft.roomTypeId) { badType.push(r.roomNumber); return; }
          if (!r.isActive || !r.isSellable) badInactive.push(r.roomNumber);
        });
        if (missing.length) errs.push(missing.length + ' selected room(s) no longer exist. Reopen the picker and reselect.');
        if (badType.length) errs.push('Room(s) ' + badType.join(', ') + ' no longer belong to ' + PG.esc(rtName(draft.roomTypeId)) + '.');
        if (badInactive.length) errs.push('Room(s) ' + badInactive.join(', ') + ' are inactive or not sellable and can’t be assigned to a rate plan.');
      }
    }
    if (errs.length){
      status.innerHTML = '<div class="help-note help-note-danger" style="margin-top:6px;">' + PG.icon('alert',16) +
        '<div>' + errs.map(PG.esc).join('<br>') + '</div></div>';
      return;
    }
    status.innerHTML = '';
    btn.disabled = true; btn.textContent = 'Saving…';
    setTimeout(function(){
      try {
        var st = PG.getState();
        var prev = null;
        if (draft.isDefault){
          st.ratePlans.forEach(function(p){
            if (p.roomTypeId === draft.roomTypeId && (!existing || p.id !== existing.id)) p.isDefault = false;
          });
        }
        var target;
        if (existing){
          target = st.ratePlans.find(function(p){ return p.id===existing.id; });
          if (!target) throw new Error('This rate plan no longer exists.');
          prev = target.name + ' · base ' + money(target.basePrice) + ' · ' + PG.planScopeLabel(st, target);
        } else {
          target = { id: newId('rp'), propertyId: st.hotel.propertyCode, periods: [], createdAt: PG.nowIso() };
          st.ratePlans.push(target);
        }
        target.name = draft.name.trim();
        target.code = draft.code.trim() || null;
        target.description = draft.description.trim();
        target.roomTypeId = draft.roomTypeId;
        target.scope = draft.scope;
        target.physicalRoomIds = draft.scope==='rooms' ? draft.physicalRoomIds.slice() : [];
        target.mealPlan = draft.mealPlan;
        target.basePrice = Math.round(Number(draft.basePrice)*100)/100;
        target.currency = CURRENCY;
        target.active = draft.active;
        target.isDefault = draft.isDefault;
        target.strictPeriodPricing = draft.strict;
        target.updatedAt = PG.nowIso();
        PG.setState(st);

        var after = target.name + ' · base ' + money(target.basePrice) + ' · ' + PG.planScopeLabel(st, target);
        PG.addAudit(existing ? 'Rate Plan Updated' : 'Rate Plan Created',
          target.name + ' (' + rtName(target.roomTypeId) + ') — ' + PG.planScopeLabel(st, target) +
          ', base ' + money(target.basePrice) + ' / night, ' + (target.active?'active':'inactive') +
          '. Reservations already booked keep their booked price.', null,
          { module:'Rate Plans & Pricing', recordId: target.id, previousValue: prev, newValue: after });

        PG.toast(existing ? 'Rate plan updated.' : 'Rate plan created.', 'success');
        PG.closeModal('rpPlanEditor');
        s = PG.getState(); renderShell();
      } catch(e){
        btn.disabled = false; btn.textContent = existing ? 'Save Changes' : 'Create Rate Plan';
        status.innerHTML = '<div class="help-note help-note-danger" style="margin-top:6px;">' + PG.icon('alert',16) +
          '<div>Couldn’t save — ' + PG.esc(e.message) + ' Nothing was changed.</div></div>';
        PG.toast('Couldn’t save the rate plan.', 'danger');
      }
    }, 400);
  }

  paint();
  PG.openModal('rpPlanEditor');
}
