<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rates — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("rates", ["Hotel Management", "Rates"]);
var s = PG.getState();

function rtName(id){ var rt = s.roomTypes.find(function(r){return r.id===id;}); return rt ? rt.name : id; }

var html = '';
html += '<div class="pg-page-head"><div><h1>Rate Plans</h1><div class="sub">Simple per-room-type rate plans for Palestine Grand Hotel</div></div>' +
  '<div class="pg-actions"><a class="btn btn-primary" href="rate-plan-form.html">+ Add Rate Plan</a></div></div>';

html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
  '<th>Rate Plan</th><th>Room Type</th><th>Meal Plan</th><th>Date Range</th><th class="num">Price</th><th>Status</th><th></th>' +
'</tr></thead><tbody>';

s.ratePlans.forEach(function(rp){
  html += '<tr>' +
    '<td style="font-weight:600;">'+rp.name+'</td>' +
    '<td>'+rtName(rp.roomTypeId)+'</td>' +
    '<td>'+rp.mealPlan+'</td>' +
    '<td class="text-sm">'+PG.fmtDateShort(rp.startDate)+' &ndash; '+PG.fmtDateShort(rp.endDate)+'</td>' +
    '<td class="num">'+PG.fmtMoney(rp.price)+' / night</td>' +
    '<td>'+(rp.active ? '<span class="badge badge-green"><span class="badge-dot"></span>Active</span>' : '<span class="badge badge-gray"><span class="badge-dot"></span>Inactive</span>')+'</td>' +
    '<td><a class="btn btn-light btn-sm" href="rate-plan-form.html?id='+rp.id+'">Edit</a></td>' +
  '</tr>';
});

html += '</tbody></table></div></div></div>';
html += '<div class="pg-lightweight-note">Rate plans define a single price per night, per room type, for a date range — enough to make reservation pricing understandable. Dynamic pricing, promotions, and discount engines are outside the Initial MVP.</div>';

page.innerHTML = html;
</script>
</body>
</html>
