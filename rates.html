<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Plans &amp; Pricing — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* Toolbar — search first, then chips, then the segmented range control. */
  .rp-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .rp-toolbar .grow{flex:1 1 220px;min-width:200px;}
  .rp-datenav{display:inline-flex;align-items:center;gap:6px;}
  .rp-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--pg-border);
    background:#fff;border-radius:6px;color:var(--pg-gray-700);cursor:pointer;}
  .rp-iconbtn:hover{border-color:var(--pg-gray-400);background:var(--pg-gray-100);}
  .rp-meta{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:12px;color:var(--pg-gray-600);margin:12px 0 16px;}
  .rp-meta strong{color:var(--pg-gray-900);}

  /* ---- Price matrix ---- */
  /* A fixed-height, two-axis scroll region — the same pattern the Operations Calendar
     uses. Sticky offsets are relative to THIS box, not the page, so the date header and
     the rate-plan column both pin correctly and the page body never scrolls sideways. */
  .pm-wrap{position:relative;overflow:auto;height:calc(100vh - 430px);min-height:340px;}
  /* Narrow widths: the toolbar stacks and eats vertical space, so give the matrix its
     own taller box rather than letting it compress into an unreadable strip (§12). */
  @media (max-width:900px){ .pm-wrap{height:calc(100vh - 300px);min-height:300px;} }
  .pm{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;}
  .pm th,.pm td{border-bottom:1px solid var(--pg-border);border-right:1px solid var(--pg-border);padding:8px 10px;font-size:12px;text-align:center;white-space:nowrap;}
  .pm thead th{position:sticky;top:0;z-index:15;background:var(--pg-gray-100);font-weight:600;}
  .pm-corner{position:sticky;inset-inline-start:0;z-index:22!important;background:var(--pg-gray-100);text-align:start!important;min-width:210px;}
  .pm-datehead{min-width:82px;}
  .pm-datehead .dow{display:block;font-size:10px;color:var(--pg-gray-500);font-weight:500;margin-top:1px;}
  .pm-datehead.today{background:var(--pg-primary-light);color:var(--pg-primary);}
  .pm-datehead.weekend{background:#f3f4f8;}
  .pm-group td{position:sticky;inset-inline-start:0;z-index:12;background:var(--pg-gray-200);text-align:start;
    font-weight:700;font-size:12px;color:var(--pg-gray-800);}
  .pm-group .rt-sub{font-weight:500;color:var(--pg-gray-600);margin-inline-start:8px;font-size:11.5px;}
  .pm-plancell{position:sticky;inset-inline-start:0;z-index:10;background:#fff;text-align:start!important;min-width:210px;}
  .pm-plancell .pn{font-weight:700;font-size:12.8px;display:flex;align-items:center;gap:6px;}
  .pm-plancell .ps{font-size:11px;color:var(--pg-gray-500);margin-top:2px;}
  .pm-cell{cursor:pointer;min-width:82px;position:relative;}
  .pm-cell:hover{background:var(--pg-primary-light);}
  .pm-cell.today{box-shadow:inset 0 0 0 1px #b9dcff;}
  .pm-cell.weekend{background:#fcfcfd;}
  .pm-cell.weekend:hover{background:var(--pg-primary-light);}
  .pm-cell:focus-visible{outline:2px solid var(--pg-primary);outline-offset:-2px;}
  .pm-price{font-weight:700;font-size:13px;color:var(--pg-gray-900);}
  .pm-src{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-top:2px;}
  .src-base{color:var(--pg-gray-500);}
  .src-period{color:var(--pg-primary);}
  .src-manual{color:#a56a00;}
  .src-missing{color:var(--pg-danger);}
  .pm-price.missing{color:var(--pg-danger);font-size:11.5px;font-weight:700;}
  .pm-row.inactive .pm-price,.pm-row.inactive .pm-src{opacity:.45;}
  .pm-row.inactive .pm-plancell{background:var(--pg-gray-100);}

  .rp-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--pg-gray-600);margin-top:12px;}
  .rp-legend .li{display:flex;align-items:center;gap:5px;}

  /* ---- Day-of-week + price grid in the period editor ---- */
  .dow-grid{display:flex;gap:6px;flex-wrap:wrap;}
  .dow-chip{border:1px solid var(--pg-border);background:#fff;border-radius:6px;padding:6px 11px;font-size:12px;font-weight:600;
    color:var(--pg-gray-700);cursor:pointer;user-select:none;font-family:var(--pg-font);}
  .dow-chip.active{border-color:var(--pg-primary);background:var(--pg-primary-light);color:var(--pg-primary);}
  .dow-chip:focus-visible{outline:2px solid var(--pg-primary);outline-offset:1px;}
  .byday-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:760px){.byday-grid{grid-template-columns:repeat(2,1fr);}}
  .byday-grid .form-group{margin-bottom:0;}
  .byday-grid .form-group.off{opacity:.4;}
  .copy-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .preview-box{border:1px solid var(--pg-border);border-radius:8px;padding:12px 14px;background:var(--pg-gray-100);font-size:12.5px;}
  .preview-box .pv-line{display:flex;justify-content:space-between;gap:12px;padding:3px 0;}
  .preview-box .pv-line span:last-child{font-weight:700;color:var(--pg-gray-900);}

  /* ---- Rate plan worklist ---- */
  .rpl-group-head{background:var(--pg-gray-200);font-weight:700;font-size:12px;color:var(--pg-gray-800);}
  /* Give the identity columns room so plan and period names read on one line. */
  #rplBody td:first-child{min-width:210px;}
  #rplBody td:nth-child(2){min-width:110px;}
  #rplBody td:nth-child(3),#rplBody td:nth-child(4){min-width:150px;}
  .rpl-name{font-weight:700;font-size:13.5px;color:var(--pg-primary);cursor:pointer;}
  .rpl-name:hover{text-decoration:underline;}
  .rpl-sub{font-size:11px;color:var(--pg-gray-500);margin-top:2px;}
  .period-row{border:1px solid var(--pg-border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .period-row.expired{background:var(--pg-gray-100);}
  .period-row-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .period-row-top .pnm{font-weight:700;font-size:13px;}
  .period-row .pmeta{font-size:11.5px;color:var(--pg-gray-600);margin-top:4px;}
  .cell-pop-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;}
  .cell-pop-row span:last-child{font-weight:700;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("rates", ["Hotel Management", "Rate Plans & Pricing"]);
var CAN_VIEW = PG.hasPermission('view_rates');
var CAN_MANAGE = PG.hasPermission('manage_rates');
var DOW_LABELS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DOW_SHORT  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WEEKEND_DOW = [4,5]; // Thu/Fri — the regional weekend this property prices against
var s = PG.getState();

var qp = new URLSearchParams(location.search);
var ui = {
  tab: qp.get('plan') ? 'plans' : (qp.get('tab') || 'calendar'),
  roomType: 'all',
  planStatus: 'all',
  search: '',
  from: PG.TODAY,
  span: 14,
  lastRefreshed: new Date()
};

function rtName(id){ var rt = s.roomTypes.find(function(r){return r.id===id;}); return rt ? rt.name : id; }
function planById(id){ return PG.ratePlanById(s, id); }
function periodById(planId, periodId){
  var p = planById(planId); if (!p) return null;
  return (p.periods||[]).find(function(x){return x.id===periodId;}) || null;
}
function newId(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function timeStateBadge(st){
  var map = { active:['badge-green','Active'], upcoming:['badge-blue','Upcoming'], expired:['badge-gray','Expired'], inactive:['badge-gray','Inactive'] };
  var m = map[st] || map.inactive;
  return '<span class="badge '+m[0]+'"><span class="badge-dot"></span>'+m[1]+'</span>';
}
function planStatusBadge(p){
  return p.active
    ? '<span class="badge badge-green"><span class="badge-dot"></span>Active</span>'
    : '<span class="badge badge-gray"><span class="badge-dot"></span>Inactive</span>';
}
// Which plans a reservation currently depends on — a plan referenced by a booking
// can be deactivated but never deleted, so no reservation is left pointing at nothing.
function reservationsUsingPlan(planId){
  return s.reservations.filter(function(r){
    return (r.rooms||[]).some(function(rm){ return rm.ratePlanId === planId; });
  });
}
function planPriceRange(p){
  var vals = [];
  (p.periods||[]).forEach(function(pp){
    if (pp.active === false) return;
    if (pp.mode === 'byday'){
      (pp.daysOfWeek||[]).forEach(function(d){ var v = (pp.prices||{})[String(d)]; if (v != null && v !== '') vals.push(Number(v)); });
    } else if (pp.prices && pp.prices.same != null && pp.prices.same !== '') vals.push(Number(pp.prices.same));
  });
  if (!vals.length) return null;
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  return min === max ? PG.fmtMoney(min) : PG.fmtMoney(min) + ' – ' + PG.fmtMoney(max);
}
// "Current" means the period actually governing TODAY — matching on weekday as well as
// dates. A plan split into Weekend Premium (Thu–Sat) and Midweek Family (Sun–Wed) has
// both in an active date range, but only one prices tonight; naming the wrong one next
// to tonight's price is exactly the kind of unexplained number §3 exists to prevent.
function currentPeriodOf(p){
  var periods = p.periods || [];
  return periods.find(function(pp){ return PG.periodCoversDate(pp, PG.TODAY); })
    || periods.find(function(pp){ return PG.periodTimeState(pp) === 'active'; })
    || null;
}
function nextPeriodOf(p){
  return (p.periods||[]).filter(function(pp){ return PG.periodTimeState(pp) === 'upcoming'; })
    .sort(function(a,b){ return a.startDate < b.startDate ? -1 : 1; })[0] || null;
}
function visiblePlans(){
  return s.ratePlans.filter(function(p){
    if (ui.roomType !== 'all' && p.roomTypeId !== ui.roomType) return false;
    if (ui.planStatus === 'active' && !p.active) return false;
    if (ui.planStatus === 'inactive' && p.active) return false;
    if (ui.search){
      var hay = (p.name + ' ' + (p.code||'') + ' ' + (p.periods||[]).map(function(x){return x.name;}).join(' ')).toLowerCase();
      if (hay.indexOf(ui.search.toLowerCase()) === -1) return false;
    }
    return true;
  });
}
function activeFilterChips(){
  var out = [];
  if (ui.roomType !== 'all') out.push({key:'roomType', label:'Room Type', value: rtName(ui.roomType)});
  if (ui.planStatus !== 'all') out.push({key:'planStatus', label:'Status', value: ui.planStatus === 'active' ? 'Active' : 'Inactive'});
  if (ui.search) out.push({key:'search', label:'Search', value: ui.search});
  return out;
}

/* ================================================================== */
/* Page shell                                                          */
/* ================================================================== */
function renderShell(){
  var html = '';
  html += '<div class="pg-page-head"><div><h1>Rate Plans &amp; Pricing</h1>' +
    '<div class="sub">Commercial rate plans per room type, priced through named pricing periods</div></div>' +
    (CAN_MANAGE ? '<div class="pg-actions">' +
      '<button class="btn btn-outline" id="addPeriodBtn">' + PG.icon('plus',15) + ' Add Pricing Period</button>' +
      '<button class="btn btn-primary" id="addPlanBtn">' + PG.icon('plus',15) + ' Add Rate Plan</button>' +
    '</div>' : '') +
  '</div>';

  html += '<div class="pg-tabs" role="tablist">' +
    '<button class="pg-tab' + (ui.tab==='calendar'?' active':'') + '" role="tab" aria-selected="' + (ui.tab==='calendar') + '" data-tab="calendar">Price Calendar</button>' +
    '<button class="pg-tab' + (ui.tab==='plans'?' active':'') + '" role="tab" aria-selected="' + (ui.tab==='plans') + '" data-tab="plans">Rate Plans</button>' +
  '</div>';

  html += '<div id="rpBody"></div>';
  page.innerHTML = html;

  page.querySelectorAll('.pg-tab').forEach(function(t){
    t.addEventListener('click', function(){ ui.tab = t.dataset.tab; renderShell(); });
  });
  if (CAN_MANAGE){
    document.getElementById('addPlanBtn').addEventListener('click', function(){ location.href = 'rate-plan-form.html'; });
    document.getElementById('addPeriodBtn').addEventListener('click', function(){ openPeriodPicker(); });
  }
  if (ui.tab === 'calendar') renderCalendarTab(); else renderPlansTab();
}

/* Shared filter bar used by both tabs — one control set, one mental model. */
function filterBarHtml(includeDateNav){
  var rtChips = [{value:'all', label:'All Room Types'}].concat(s.roomTypes.map(function(rt){
    return { value: rt.id, label: rt.name, count: PG.ratePlansForType(s, rt.id).length };
  }));
  var statusChips = [{value:'all',label:'All'},{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}];

  var html = '<div class="card"><div class="card-body">';
  html += '<div class="rp-toolbar">';
  html += '<div class="grow pg-searchwrap"><span class="ic">' + PG.icon('search',15) + '</span>' +
    '<input class="form-control" id="rpSearch" type="search" placeholder="Search rate plans and pricing periods…" ' +
    'aria-label="Search rate plans and pricing periods" value="' + PG.esc(ui.search) + '"></div>';
  if (includeDateNav){
    html += '<div class="rp-datenav">' +
      '<button class="rp-iconbtn ic-dir" id="calPrev" aria-label="Previous period" title="Previous period">' + PG.icon('chevronLeft',16) + '</button>' +
      '<button class="btn btn-light btn-sm" id="calToday">Today</button>' +
      '<button class="rp-iconbtn ic-dir" id="calNext" aria-label="Next period" title="Next period">' + PG.icon('chevronRight',16) + '</button>' +
      '<input type="date" class="form-control" id="calFrom" value="' + ui.from + '" aria-label="Calendar start date" style="width:150px;">' +
    '</div>';
    html += PG.segmented('span', [
      {value:'7', label:'7 Days'}, {value:'14', label:'14 Days'}, {value:'30', label:'30 Days'}
    ], String(ui.span), {ariaLabel:'Date range length'});
  }
  html += '</div>';

  html += '<div style="margin-top:12px;">' + PG.filterChips('roomType', rtChips, ui.roomType, {ariaLabel:'Filter by room type'}) + '</div>';
  html += '<div style="margin-top:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">' +
    '<span class="text-sm muted" style="font-weight:600;">Plan status</span>' +
    PG.filterChips('planStatus', statusChips, ui.planStatus, {ariaLabel:'Filter by plan status'}) + '</div>';

  var applied = activeFilterChips();
  if (applied.length){
    html += '<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
      '<span class="text-sm muted">' + applied.length + ' active filter' + (applied.length===1?'':'s') + '</span>' +
      PG.appliedChips(applied) +
      '<button class="btn btn-light btn-sm" id="clearFilters">Clear Filters</button></div>';
  }
  html += '</div></div>';
  return html;
}

function wireFilterBar(includeDateNav){
  var search = document.getElementById('rpSearch');
  var t = null;
  search.addEventListener('input', function(){
    clearTimeout(t);
    t = setTimeout(function(){ ui.search = search.value.trim(); rerenderBody(true); }, 200);
  });
  PG.wireChips(page, 'roomType', function(v){ ui.roomType = v; rerenderBody(); });
  PG.wireChips(page, 'planStatus', function(v){ ui.planStatus = v; rerenderBody(); });
  var clear = document.getElementById('clearFilters');
  if (clear) clear.addEventListener('click', function(){
    ui.roomType='all'; ui.planStatus='all'; ui.search=''; rerenderBody();
  });
  page.querySelectorAll('[data-remove-filter]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var k = btn.dataset.removeFilter;
      if (k==='roomType') ui.roomType='all';
      else if (k==='planStatus') ui.planStatus='all';
      else if (k==='search') ui.search='';
      rerenderBody();
    });
  });
  if (includeDateNav){
    PG.wireSegmented(page, 'span', function(v){ ui.span = +v; rerenderBody(); });
    document.getElementById('calPrev').addEventListener('click', function(){ ui.from = PG.addDays(ui.from, -ui.span); rerenderBody(); });
    document.getElementById('calNext').addEventListener('click', function(){ ui.from = PG.addDays(ui.from, ui.span); rerenderBody(); });
    document.getElementById('calToday').addEventListener('click', function(){ ui.from = PG.TODAY; rerenderBody(); });
    document.getElementById('calFrom').addEventListener('change', function(){ ui.from = this.value; rerenderBody(); });
  }
}
// Re-renders only the tab body, keeping caret position in the search box when the
// change came from typing.
function rerenderBody(keepFocus){
  if (ui.tab === 'calendar') renderCalendarTab(); else renderPlansTab();
  if (keepFocus){
    var el = document.getElementById('rpSearch');
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

/* ================================================================== */
/* Price Calendar tab                                                  */
/* ================================================================== */
function renderCalendarTab(){
  s = PG.getState();
  var days = PG.dateRange(ui.from, PG.addDays(ui.from, ui.span));
  var plans = visiblePlans();

  var html = filterBarHtml(true);

  html += '<div class="rp-meta">' +
    '<span>Showing <strong>' + PG.fmtDateShort(days[0]) + ' – ' + PG.fmtDateShort(days[days.length-1]) + '</strong></span>' +
    '<span><strong>' + plans.length + '</strong> rate plan' + (plans.length===1?'':'s') + ' across <strong>' +
      (ui.roomType==='all' ? s.roomTypes.length : 1) + '</strong> room type' + ((ui.roomType==='all' && s.roomTypes.length!==1)?'s':'') + '</span>' +
    '<span>Last refreshed <strong>' + ui.lastRefreshed.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</strong></span>' +
    '<button class="btn btn-light btn-sm" id="calRefresh">' + PG.icon('refresh',14) + ' Refresh</button>' +
  '</div>';

  html += '<div class="card"><div class="card-body no-pad"><div class="pm-wrap"><table class="pm" id="pmTable"></table></div></div></div>';

  html += '<div class="rp-legend">' +
    '<div class="li"><span class="pm-src src-base">BASE</span> Room type base price (no period covers this date)</div>' +
    '<div class="li"><span class="pm-src src-period">PERIOD</span> Priced by a named pricing period</div>' +
    '<div class="li"><span class="pm-src src-manual">MANUAL</span> One-off price set on this cell</div>' +
    '<div class="li"><span class="pm-src src-missing">NO PRICE</span> Not bookable on this date</div>' +
  '</div>';
  html += '<div class="pg-lightweight-note">A price resolves as <strong>Manual Override → Pricing Period → Base Price</strong>. Every cell shows which of the three produced its number, so no figure on this page is unexplained. Click any cell to open the rate plan and pricing period behind it.</div>';

  document.getElementById('rpBody').innerHTML = html;
  wireFilterBar(true);
  document.getElementById('calRefresh').addEventListener('click', function(){
    ui.lastRefreshed = new Date(); rerenderBody(); PG.toast('Price calendar refreshed.', 'success');
  });

  // ---- matrix ----
  var thead = '<thead><tr><th class="pm-corner">Rate Plan</th>' + days.map(function(d){
    var cls = 'pm-datehead' + (d===PG.TODAY ? ' today' : '') + (WEEKEND_DOW.indexOf(PG.dayOfWeek(d))>-1 ? ' weekend' : '');
    return '<th class="'+cls+'" scope="col">' + PG.fmtDateShort(d) + '<span class="dow">' + PG.weekdayOf(d) + (d===PG.TODAY?' · Today':'') + '</span></th>';
  }).join('') + '</tr></thead>';

  var body = '';
  var typeIds = ui.roomType === 'all' ? s.roomTypes.map(function(rt){return rt.id;}) : [ui.roomType];
  var anyRows = false;
  typeIds.forEach(function(rtId){
    var rtPlans = plans.filter(function(p){ return p.roomTypeId === rtId; });
    if (!rtPlans.length) return;
    anyRows = true;
    var rt = s.roomTypes.find(function(r){return r.id===rtId;});
    body += '<tr class="pm-group"><td colspan="' + (days.length+1) + '">' + PG.esc(rt.name) +
      '<span class="rt-sub">' + rtPlans.length + ' rate plan' + (rtPlans.length===1?'':'s') +
      ' · base ' + PG.fmtMoney(rt.baseRate) + '/night</span></td></tr>';
    rtPlans.forEach(function(p){
      body += '<tr class="pm-row' + (p.active ? '' : ' inactive') + '">' +
        '<td class="pm-plancell"><div class="pn">' + PG.esc(p.name) +
          (p.isDefault ? ' <span class="badge badge-blue" title="Used when a price is asked for without naming a plan">Default</span>' : '') +
          (p.active ? '' : ' <span class="badge badge-gray">Inactive</span>') +
        '</div><div class="ps">' + PG.esc(p.mealPlan) + (p.code ? ' · ' + PG.esc(p.code) : '') + '</div></td>';
      days.forEach(function(d){
        var r = PG.resolvePrice(s, rtId, p.id, d);
        var cls = 'pm-cell' + (d===PG.TODAY ? ' today' : '') + (WEEKEND_DOW.indexOf(PG.dayOfWeek(d))>-1 ? ' weekend' : '');
        var srcCls = 'src-' + r.source;
        var srcLabel = { base:'Base', period:'Period', manual:'Manual', missing:'No price' }[r.source];
        var aria = p.name + ', ' + PG.fmtDate(d) + ', ' +
          (r.price==null ? 'no price' : PG.fmtMoney(r.price) + ', ' + r.label + (r.periodName ? ', ' + r.periodName : ''));
        body += '<td class="'+cls+'" tabindex="0" role="button" data-rt="'+rtId+'" data-plan="'+p.id+'" data-date="'+d+'" ' +
          'aria-label="'+PG.esc(aria)+'"' + (r.periodName ? ' title="'+PG.esc(r.periodName)+'"' : '') + '>' +
          '<div class="pm-price'+(r.price==null?' missing':'')+'">' + (r.price==null ? 'No price' : PG.fmtMoney(r.price)) + '</div>' +
          '<div class="pm-src '+srcCls+'">' + srcLabel + '</div>' +
        '</td>';
      });
      body += '</tr>';
    });
  });
  if (!anyRows){
    body = '<tr><td colspan="' + (days.length+1) + '"><div class="empty-state"><div class="ic">' + PG.icon('tag',30) + '</div>' +
      'No rate plans match these filters.<br><span class="text-sm">Clear the filters, or add a rate plan for this room type.</span></div></td></tr>';
  }
  document.getElementById('pmTable').innerHTML = thead + '<tbody>' + body + '</tbody>';

  document.getElementById('pmTable').querySelectorAll('.pm-cell').forEach(function(td){
    function open(){ openCellDrawer(td.dataset.rt, td.dataset.plan, td.dataset.date); }
    td.addEventListener('click', open);
    td.addEventListener('keydown', function(e){ if (e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });
  });
}

/* ================================================================== */
/* Price cell → explains the number, then routes to the right editor.  */
/* §6.5: clicking a cell must open the rate plan and pricing period    */
/* behind it — never leave the user hunting for where a price came from.*/
/* ================================================================== */
var cellDrawer = null;
function ensureDrawer(id){
  var el = document.getElementById(id);
  if (el) return el;
  el = document.createElement('div');
  el.className = 'pg-drawer-overlay';
  el.id = id;
  document.body.appendChild(el);
  return el;
}
function openCellDrawer(rtId, planId, dateStr){
  s = PG.getState();
  var plan = planById(planId);
  var r = PG.resolvePrice(s, rtId, planId, dateStr);
  var base = PG.basePriceFor(s, rtId, dateStr);
  cellDrawer = ensureDrawer('rpCellDrawer');

  var rows =
    '<div class="cell-pop-row"><span>Room Type</span><span>' + PG.esc(rtName(rtId)) + '</span></div>' +
    '<div class="cell-pop-row"><span>Rate Plan</span><span>' + PG.esc(plan.name) + (plan.active?'':' (inactive)') + '</span></div>' +
    '<div class="cell-pop-row"><span>Date</span><span>' + PG.fmtDate(dateStr) + ' · ' + PG.weekdayOf(dateStr) + '</span></div>' +
    '<div class="cell-pop-row"><span>Pricing Period</span><span>' + (r.periodName ? PG.esc(r.periodName) : '—') + '</span></div>' +
    '<div class="cell-pop-row"><span>Price Source</span><span class="src-'+r.source+'">' + r.label + '</span></div>' +
    '<div class="cell-pop-row"><span>Room type base price</span><span>' + PG.fmtMoney(base) + '</span></div>' +
    '<div class="cell-pop-row" style="border-top:1px solid var(--pg-border);margin-top:6px;padding-top:10px;font-size:14px;">' +
      '<span>Price on this date</span><span>' + (r.price==null ? '<span class="src-missing">No price</span>' : PG.fmtMoney(r.price)) + '</span></div>';

  var actions = '';
  if (CAN_MANAGE){
    if (r.periodId) actions += '<button class="btn btn-primary" id="cdEditPeriod">' + PG.icon('edit',15) + ' Edit “' + PG.esc(r.periodName) + '”</button>';
    else actions += '<button class="btn btn-primary" id="cdAddPeriod">' + PG.icon('plus',15) + ' Add Pricing Period</button>';
  }

  cellDrawer.innerHTML = '<div class="pg-drawer" style="max-width:460px;">' +
    '<div class="pg-drawer-header"><div><h3>Price Detail</h3>' +
      '<div class="muted text-sm">' + PG.esc(plan.name) + ' · ' + PG.fmtDateShort(dateStr) + '</div></div>' +
      '<button class="pg-modal-close" id="cdClose" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
    '<div class="pg-drawer-body">' +
      '<div class="preview-box" style="margin-bottom:16px;">' + rows + '</div>' +
      (r.source==='missing'
        ? '<div class="help-note help-note-danger">' + PG.icon('alert',16) + '<div>This rate plan has no price for this date, so it can’t be sold on ' + PG.fmtDateShort(dateStr) + '. Add a pricing period that covers this weekday, or set a one-off price below.</div></div>'
        : r.source==='base'
          ? '<div class="help-note">' + PG.icon('info',16) + '<div>No pricing period on this plan covers this date, so it falls back to the room type’s base price.</div></div>'
          : r.source==='manual'
            ? '<div class="help-note help-note-warning">' + PG.icon('info',16) + '<div>A one-off price was set directly on this cell. It overrides “' + PG.esc((r.periodName||'the pricing period')) + '” and every other rule for this date only.</div></div>'
            : '') +
      (CAN_MANAGE ? '<div class="form-group" style="margin-top:16px;"><label class="form-label" for="cdManual">One-off price for this date <span class="opt">(optional)</span></label>' +
        '<input type="number" min="0.01" step="0.01" class="form-control" id="cdManual" value="' +
        ((s.rateOverrides||{})[PG.overrideKey(rtId,planId,dateStr)] != null ? (s.rateOverrides||{})[PG.overrideKey(rtId,planId,dateStr)] : '') + '" placeholder="Leave empty to use the rule above">' +
        '<div class="form-hint">Applies to this one date and this one rate plan. Use a pricing period for anything recurring.</div></div>' : '') +
      '<div id="cdStatus" role="status" aria-live="polite"></div>' +
    '</div>' +
    (CAN_MANAGE ? '<div class="pg-drawer-footer">' +
      (r.source==='manual' ? '<button class="btn btn-outline" id="cdClearManual">Remove one-off price</button>' : '<span></span>') +
      '<div style="display:flex;gap:8px;">' + actions +
      '<button class="btn btn-primary" id="cdSaveManual">Save Price</button></div></div>' : '') +
  '</div>';

  document.getElementById('cdClose').addEventListener('click', function(){ PG.closeModal('rpCellDrawer'); });
  if (CAN_MANAGE){
    var editBtn = document.getElementById('cdEditPeriod');
    if (editBtn) editBtn.addEventListener('click', function(){
      PG.closeModal('rpCellDrawer'); openPeriodEditor(planId, r.periodId);
    });
    var addBtn = document.getElementById('cdAddPeriod');
    if (addBtn) addBtn.addEventListener('click', function(){
      PG.closeModal('rpCellDrawer'); openPeriodEditor(planId, null, { startDate: dateStr, endDate: dateStr });
    });
    document.getElementById('cdSaveManual').addEventListener('click', function(){
      var raw = document.getElementById('cdManual').value.trim();
      var st = PG.getState();
      st.rateOverrides = st.rateOverrides || {};
      var key = PG.overrideKey(rtId, planId, dateStr);
      var prev = st.rateOverrides[key];
      if (!raw){
        if (prev == null){ PG.toast('Nothing to save — no one-off price was entered.', 'warning'); return; }
        delete st.rateOverrides[key];
      } else {
        var val = parseFloat(raw);
        if (!(val > 0)){
          document.getElementById('cdStatus').innerHTML = '<div class="help-note help-note-danger">' + PG.icon('alert',16) + '<div>Enter a price greater than 0.</div></div>';
          return;
        }
        st.rateOverrides[key] = Math.round(val*100)/100;
      }
      PG.setState(st);
      PG.addAudit('Rate Changed',
        plan.name + ' (' + rtName(rtId) + ') — one-off price for ' + PG.fmtDateShort(dateStr) + ' ' +
          (raw ? 'set to ' + PG.fmtMoney(parseFloat(raw)) : 'removed') + '.', null,
        { module:'Rate Plans & Pricing', recordId: PG.overrideKey(rtId, planId, dateStr),
          previousValue: prev != null ? prev : 'none', newValue: raw ? parseFloat(raw) : 'none' });
      PG.toast(raw ? 'One-off price saved.' : 'One-off price removed.', 'success');
      PG.closeModal('rpCellDrawer');
      s = PG.getState(); rerenderBody();
    });
    var clearBtn = document.getElementById('cdClearManual');
    if (clearBtn) clearBtn.addEventListener('click', function(){
      document.getElementById('cdManual').value = '';
      document.getElementById('cdSaveManual').click();
    });
  }
  PG.openModal('rpCellDrawer');
}

/* ================================================================== */
/* Rate Plans tab — worklist grouped by room type                      */
/* ================================================================== */
function renderPlansTab(){
  s = PG.getState();
  var plans = visiblePlans();
  var html = filterBarHtml(false);

  html += '<div class="rp-meta"><span><strong>' + plans.length + '</strong> rate plan' + (plans.length===1?'':'s') + ' shown</span></div>';

  html += '<div class="card"><div class="card-body no-pad"><div class="table-wrap"><table class="dt"><thead><tr>' +
    '<th scope="col">Rate Plan</th><th scope="col">Room Type</th><th scope="col">Current Pricing Period</th>' +
    '<th scope="col">Next Upcoming</th><th class="num" scope="col">Price Range</th><th scope="col">Status</th>' +
    '<th scope="col">Last Updated</th><th scope="col"><span class="sr-only">Actions</span></th>' +
  '</tr></thead><tbody id="rplBody"></tbody></table></div></div></div>';

  html += '<div class="pg-lightweight-note">A rate plan is a commercial offer attached to a room type; its dates and prices live inside named pricing periods, so an entire season can be edited as one unit instead of date by date.</div>';

  document.getElementById('rpBody').innerHTML = html;
  wireFilterBar(false);

  var body = '';
  var typeIds = ui.roomType === 'all' ? s.roomTypes.map(function(rt){return rt.id;}) : [ui.roomType];
  var any = false;
  typeIds.forEach(function(rtId){
    var rtPlans = plans.filter(function(p){ return p.roomTypeId === rtId; });
    if (!rtPlans.length) return;
    any = true;
    body += '<tr class="rpl-group-head"><td colspan="8">' + PG.esc(rtName(rtId)) + ' — ' + rtPlans.length + ' rate plan' + (rtPlans.length===1?'':'s') + '</td></tr>';
    rtPlans.forEach(function(p){
      var cur = currentPeriodOf(p), nxt = nextPeriodOf(p), range = planPriceRange(p);
      body += '<tr>' +
        '<td><div class="rpl-name" data-view="'+p.id+'" role="button" tabindex="0">' + PG.esc(p.name) +
            (p.isDefault ? ' <span class="badge badge-blue">Default</span>' : '') + '</div>' +
          '<div class="rpl-sub">' + PG.esc(p.mealPlan) + (p.code ? ' · ' + PG.esc(p.code) : '') +
            ' · ' + (p.periods||[]).length + ' period' + ((p.periods||[]).length===1?'':'s') + '</div></td>' +
        '<td>' + PG.esc(rtName(p.roomTypeId)) + '</td>' +
        '<td>' + (cur ? '<div style="font-weight:600;">' + PG.esc(cur.name) + '</div><div class="rpl-sub">' +
            PG.fmtDateShort(cur.startDate) + ' – ' + PG.fmtDateShort(cur.endDate) + '</div>'
          : '<span class="muted text-sm">No period covers today</span>') + '</td>' +
        '<td>' + (nxt ? '<div style="font-weight:600;">' + PG.esc(nxt.name) + '</div><div class="rpl-sub">from ' +
            PG.fmtDateShort(nxt.startDate) + '</div>' : '<span class="muted text-sm">—</span>') + '</td>' +
        '<td class="num">' + (range || '<span class="muted text-sm">Not priced</span>') + '</td>' +
        '<td>' + planStatusBadge(p) + '</td>' +
        '<td class="text-sm">' + (p.updatedAt ? PG.fmtDateShort(p.updatedAt.slice(0,10)) : '—') + '</td>' +
        '<td style="text-align:end;">' + rowMenu(p) + '</td>' +
      '</tr>';
    });
  });
  if (!any){
    body = '<tr><td colspan="8"><div class="empty-state"><div class="ic">' + PG.icon('tag',30) + '</div>' +
      'No rate plans match these filters.' + (CAN_MANAGE ? '<br><span class="text-sm">Clear the filters, or add a rate plan.</span>' : '') + '</div></td></tr>';
  }
  document.getElementById('rplBody').innerHTML = body;
  wirePlanRows();
}

function rowMenu(p){
  var items = '<button type="button" data-act="view" data-id="'+p.id+'">View Details</button>';
  if (CAN_MANAGE){
    items += '<a href="rate-plan-form.html?id='+p.id+'">Edit Rate Plan</a>' +
      '<button type="button" data-act="addperiod" data-id="'+p.id+'">Add Pricing Period</button>' +
      '<button type="button" data-act="duplicate" data-id="'+p.id+'">Duplicate Rate Plan</button>' +
      '<button type="button" data-act="toggle" data-id="'+p.id+'">' + (p.active ? 'Deactivate' : 'Activate') + '</button>';
    // Deletion is offered only when nothing depends on the plan; otherwise the menu
    // says why, rather than presenting an action that would be refused on click.
    var deps = reservationsUsingPlan(p.id);
    items += deps.length
      ? '<button type="button" disabled title="' + deps.length + ' reservation(s) were booked on this plan">Delete (in use)</button>'
      : '<button type="button" class="danger" data-act="delete" data-id="'+p.id+'">Delete Rate Plan</button>';
  }
  return '<div class="more-wrap"><button class="more-btn" aria-label="Actions for ' + PG.esc(p.name) + '" aria-haspopup="menu">' +
    PG.icon('dots',16) + '</button><div class="more-menu" role="menu">' + items + '</div></div>';
}

function wirePlanRows(){
  page.querySelectorAll('.rpl-name').forEach(function(el){
    function go(){ openPlanDrawer(el.dataset.view); }
    el.addEventListener('click', go);
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
  });
  page.querySelectorAll('.more-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var menu = btn.nextElementSibling;
      var wasOpen = menu.classList.contains('show');
      document.querySelectorAll('.more-menu.show').forEach(function(m){ m.classList.remove('show'); });
      if (!wasOpen) menu.classList.add('show');
    });
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.more-menu.show').forEach(function(m){ m.classList.remove('show'); });
  });
  page.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.dataset.id, act = btn.dataset.act;
      if (act==='view') openPlanDrawer(id);
      else if (act==='addperiod') openPeriodEditor(id, null);
      else if (act==='duplicate') duplicatePlan(id);
      else if (act==='toggle') togglePlan(id);
      else if (act==='delete') confirmDeletePlan(id);
    });
  });
}

function togglePlan(id){
  var st = PG.getState();
  var p = st.ratePlans.find(function(x){return x.id===id;});
  var prev = p.active;
  p.active = !p.active;
  p.updatedAt = PG.nowIso();
  PG.setState(st);
  PG.addAudit(p.active ? 'Rate Plan Activated' : 'Rate Plan Deactivated',
    p.name + ' (' + rtName(p.roomTypeId) + ') was ' + (p.active ? 'activated' : 'deactivated') + '.' +
    (p.active ? '' : ' Existing reservations booked on it keep their booked price.'), null,
    { module:'Rate Plans & Pricing', recordId:id, previousValue: prev ? 'Active' : 'Inactive', newValue: p.active ? 'Active' : 'Inactive' });
  PG.toast('Rate plan ' + (p.active ? 'activated' : 'deactivated') + '.', 'success');
  s = PG.getState(); rerenderBody();
}

function duplicatePlan(id){
  var st = PG.getState();
  var src = st.ratePlans.find(function(x){return x.id===id;});
  var copy = JSON.parse(JSON.stringify(src));
  copy.id = newId('rp');
  copy.name = src.name + ' (Copy)';
  copy.code = src.code ? src.code + '-C' : null;
  copy.isDefault = false; // never two defaults on one room type
  copy.active = false;    // a copy starts switched off so it can't sell before review
  copy.createdAt = PG.nowIso();
  copy.updatedAt = PG.nowIso();
  (copy.periods||[]).forEach(function(pp){ pp.id = newId('pp'); });
  st.ratePlans.push(copy);
  PG.setState(st);
  PG.addAudit('Rate Plan Created', copy.name + ' duplicated from ' + src.name + ' (' + rtName(src.roomTypeId) + '), created inactive with ' + (copy.periods||[]).length + ' pricing period(s).', null,
    { module:'Rate Plans & Pricing', recordId: copy.id, newValue: copy.name });
  PG.toast('Rate plan duplicated — review and activate it when ready.', 'success');
  s = PG.getState(); rerenderBody();
}

function confirmDeletePlan(id){
  var p = planById(id);
  var deps = reservationsUsingPlan(id);
  var m = ensureModal('rpDeleteModal');
  m.innerHTML = '<div class="pg-modal" style="max-width:460px;">' +
    '<div class="pg-modal-header"><h3>Delete Rate Plan</h3>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpDeleteModal\')" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
    '<div class="pg-modal-body">' +
      (deps.length
        ? '<div class="help-note help-note-danger">' + PG.icon('alert',16) + '<div><strong>' + deps.length + ' reservation' + (deps.length===1?'':'s') +
            '</strong> were booked on “' + PG.esc(p.name) + '”. Deleting it would leave them pointing at a plan that no longer exists. Deactivate it instead — it will stop being offered for new reservations while existing ones keep their booked price.</div></div>'
        : '<p class="text-sm">Permanently delete <strong>' + PG.esc(p.name) + '</strong> (' + PG.esc(rtName(p.roomTypeId)) + ') and its ' +
          (p.periods||[]).length + ' pricing period' + ((p.periods||[]).length===1?'':'s') + '?</p>' +
          '<div class="help-note help-note-warning">' + PG.icon('alert',16) + '<div>This can’t be undone. No reservation currently uses this plan, so nothing on the books is affected.</div></div>') +
    '</div>' +
    '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'rpDeleteModal\')">Cancel</button>' +
      (deps.length ? '' : '<button class="btn btn-danger" id="rpDelConfirm">Delete Rate Plan</button>') + '</div>' +
  '</div>';
  if (!deps.length){
    document.getElementById('rpDelConfirm').addEventListener('click', function(){
      var st = PG.getState();
      var idx = st.ratePlans.findIndex(function(x){return x.id===id;});
      var removed = st.ratePlans[idx];
      st.ratePlans.splice(idx,1);
      PG.setState(st);
      PG.addAudit('Rate Plan Deleted', removed.name + ' (' + rtName(removed.roomTypeId) + ') was permanently deleted.', null,
        { module:'Rate Plans & Pricing', recordId:id, previousValue: removed.name, newValue:'deleted' });
      PG.toast('Rate plan deleted.', 'success');
      PG.closeModal('rpDeleteModal');
      s = PG.getState(); rerenderBody();
    });
  }
  PG.openModal('rpDeleteModal');
}

function ensureModal(id){
  var el = document.getElementById(id);
  if (el) return el;
  el = document.createElement('div');
  el.className = 'pg-modal-overlay';
  el.id = id;
  document.body.appendChild(el);
  return el;
}

/* ================================================================== */
/* Rate plan detail drawer (§6.6)                                      */
/* ================================================================== */
function openPlanDrawer(planId){
  s = PG.getState();
  var p = planById(planId);
  if (!p) return;
  var d = ensureDrawer('rpPlanDrawer');
  var cur = currentPeriodOf(p);
  var todayPrice = PG.resolvePrice(s, p.roomTypeId, p.id, PG.TODAY);

  function periodCard(pp){
    var st = PG.periodTimeState(pp);
    var priceText = pp.mode==='byday'
      ? (pp.daysOfWeek||[]).map(function(dw){
          var v=(pp.prices||{})[String(dw)];
          return DOW_SHORT[dw] + ' ' + (v!=null&&v!=='' ? PG.fmtMoney(Number(v)) : '—');
        }).join(' · ')
      : ((pp.prices||{}).same != null ? PG.fmtMoney(Number(pp.prices.same)) + ' / night' : 'Not priced');
    return '<div class="period-row' + (st==='expired'?' expired':'') + '">' +
      '<div class="period-row-top"><div class="pnm">' + PG.esc(pp.name) + '</div>' + timeStateBadge(st) + '</div>' +
      '<div class="pmeta">' + PG.fmtDateShort(pp.startDate) + ' – ' + PG.fmtDateShort(pp.endDate) + ' · ' +
        ((pp.daysOfWeek||[]).length === 7 ? 'All days' : (pp.daysOfWeek||[]).map(function(dw){return DOW_SHORT[dw];}).join(', ')) + '</div>' +
      '<div class="pmeta" style="color:var(--pg-gray-800);font-weight:600;">' + priceText + '</div>' +
      (CAN_MANAGE ? '<div style="margin-top:8px;display:flex;gap:8px;">' +
        '<button class="btn btn-light btn-sm" data-editperiod="'+pp.id+'">' + PG.icon('edit',14) + ' Edit Period</button>' +
        '<button class="btn btn-light btn-sm" data-dupperiod="'+pp.id+'">' + PG.icon('copy',14) + ' Duplicate</button>' +
      '</div>' : '') +
    '</div>';
  }

  var periods = (p.periods||[]).slice().sort(function(a,b){ return a.startDate < b.startDate ? -1 : 1; });
  var upcoming = periods.filter(function(x){return PG.periodTimeState(x)==='upcoming';});
  var active = periods.filter(function(x){return PG.periodTimeState(x)==='active';});
  var expired = periods.filter(function(x){return PG.periodTimeState(x)==='expired';});
  var inactive = periods.filter(function(x){return PG.periodTimeState(x)==='inactive';});

  d.innerHTML = '<div class="pg-drawer" style="max-width:520px;">' +
    '<div class="pg-drawer-header"><div><h3>' + PG.esc(p.name) + '</h3>' +
      '<div class="muted text-sm">' + PG.esc(rtName(p.roomTypeId)) + ' · ' + PG.esc(p.mealPlan) + (p.code ? ' · ' + PG.esc(p.code) : '') + '</div></div>' +
      '<button class="pg-modal-close" id="pdClose" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
    '<div class="pg-drawer-body">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">' + planStatusBadge(p) +
        (p.isDefault ? '<span class="badge badge-blue"><span class="badge-dot"></span>Default plan for this room type</span>' : '') +
        (p.strictPeriodPricing ? '<span class="badge badge-yellow"><span class="badge-dot"></span>Sells only inside its periods</span>' : '') +
      '</div>' +
      (p.description ? '<p class="text-sm" style="color:var(--pg-gray-700);">' + PG.esc(p.description) + '</p>' : '') +
      '<div class="preview-box" style="margin:14px 0 18px;">' +
        '<div class="cell-pop-row"><span>Price today (' + PG.fmtDateShort(PG.TODAY) + ')</span><span>' +
          (todayPrice.price==null ? '<span class="src-missing">No price</span>' : PG.fmtMoney(todayPrice.price)) + '</span></div>' +
        '<div class="cell-pop-row"><span>Source</span><span class="src-'+todayPrice.source+'">' + todayPrice.label + '</span></div>' +
        '<div class="cell-pop-row"><span>Current pricing period</span><span>' + (cur ? PG.esc(cur.name) : '—') + '</span></div>' +
        '<div class="cell-pop-row"><span>Price range</span><span>' + (planPriceRange(p) || '—') + '</span></div>' +
      '</div>' +
      (active.length ? '<div class="form-label">Active Pricing Periods</div>' + active.map(periodCard).join('') : '') +
      (upcoming.length ? '<div class="form-label" style="margin-top:14px;">Upcoming Pricing Periods</div>' + upcoming.map(periodCard).join('') : '') +
      (inactive.length ? '<div class="form-label" style="margin-top:14px;">Switched-Off Pricing Periods</div>' + inactive.map(periodCard).join('') : '') +
      (expired.length ? '<div class="form-label" style="margin-top:14px;">Expired Pricing Periods</div>' + expired.map(periodCard).join('') : '') +
      (!periods.length ? '<div class="empty-state" style="padding:30px 12px;"><div class="ic">' + PG.icon('calendar',28) + '</div>' +
        'No pricing periods yet.<br><span class="text-sm">Until one is added, this plan falls back to the room type’s base price.</span></div>' : '') +
    '</div>' +
    '<div class="pg-drawer-footer">' +
      '<a class="btn btn-light" href="rates.html?tab=calendar">View Price Calendar</a>' +
      (CAN_MANAGE ? '<div style="display:flex;gap:8px;">' +
        '<a class="btn btn-outline" href="rate-plan-form.html?id='+p.id+'">Edit Rate Plan</a>' +
        '<button class="btn btn-primary" id="pdAddPeriod">' + PG.icon('plus',15) + ' Add Pricing Period</button></div>' : '') +
    '</div>' +
  '</div>';

  document.getElementById('pdClose').addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); });
  if (CAN_MANAGE){
    document.getElementById('pdAddPeriod').addEventListener('click', function(){
      PG.closeModal('rpPlanDrawer'); openPeriodEditor(p.id, null);
    });
    d.querySelectorAll('[data-editperiod]').forEach(function(b){
      b.addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); openPeriodEditor(p.id, b.dataset.editperiod); });
    });
    d.querySelectorAll('[data-dupperiod]').forEach(function(b){
      b.addEventListener('click', function(){ PG.closeModal('rpPlanDrawer'); duplicatePeriod(p.id, b.dataset.dupperiod); });
    });
  }
  PG.openModal('rpPlanDrawer');
}

/* Duplicating a period opens the editor pre-filled and shifted past the original,
   so "same prices, next season" is a rename + date tweak rather than a retype. */
function duplicatePeriod(planId, periodId){
  var src = periodById(planId, periodId);
  if (!src) return;
  var len = PG.dateRange(src.startDate, PG.addDays(src.endDate,1)).length;
  openPeriodEditor(planId, null, {
    name: src.name + ' (Copy)',
    startDate: PG.addDays(src.endDate, 1),
    endDate: PG.addDays(src.endDate, len),
    daysOfWeek: (src.daysOfWeek||[]).slice(),
    mode: src.mode,
    prices: JSON.parse(JSON.stringify(src.prices||{}))
  });
}

/* When "Add Pricing Period" is clicked from the page header there's no plan in
   context yet — ask which one first, using the same combobox pattern as everywhere else. */
function openPeriodPicker(){
  var m = ensureModal('rpPickPlanModal');
  m.innerHTML = '<div class="pg-modal" style="max-width:440px;">' +
    '<div class="pg-modal-header"><h3>Add Pricing Period</h3>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpPickPlanModal\')" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
    '<div class="pg-modal-body">' +
      '<div class="form-group"><label class="form-label">Rate Plan</label><div id="ppPlanCbx"></div>' +
      '<div class="form-hint">A pricing period always belongs to one rate plan on one room type.</div></div>' +
    '</div>' +
    '<div class="pg-modal-footer"><button class="btn btn-light" onclick="PG.closeModal(\'rpPickPlanModal\')">Cancel</button>' +
      '<button class="btn btn-primary" id="ppPickGo" disabled>Continue</button></div>' +
  '</div>';
  var chosen = null;
  PG.renderCombobox(document.getElementById('ppPlanCbx'), {
    placeholder: 'Search rate plans…',
    ariaLabel: 'Rate plan',
    items: s.ratePlans.map(function(p){
      return { id: p.id, label: p.name, sub: rtName(p.roomTypeId) + ' · ' + p.mealPlan + (p.active ? '' : ' · inactive'),
        badge: p.isDefault ? '<span class="badge badge-blue">Default</span>' : '' };
    }),
    onSelect: function(id){ chosen = id; document.getElementById('ppPickGo').disabled = false; }
  });
  document.getElementById('ppPickGo').addEventListener('click', function(){
    PG.closeModal('rpPickPlanModal');
    openPeriodEditor(chosen, null);
  });
  PG.openModal('rpPickPlanModal');
}

/* ================================================================== */
/* Pricing Period editor (§6.7) — the SAME editor for create and edit.  */
/* Name, dates, weekdays, pricing mode, prices, live preview, overlap   */
/* detection, then an explicit confirmation naming how many nights move.*/
/* ================================================================== */
function openPeriodEditor(planId, periodId, prefill){
  s = PG.getState();
  var plan = planById(planId);
  if (!plan){ PG.toast('That rate plan no longer exists.', 'danger'); return; }
  var existing = periodId ? periodById(planId, periodId) : null;
  var isEdit = !!existing;

  // Working copy — nothing is written to state until Save succeeds, so Cancel and
  // a failed save both leave the original period exactly as it was.
  var draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: null,
    name: (prefill && prefill.name) || '',
    startDate: (prefill && prefill.startDate) || PG.TODAY,
    endDate: (prefill && prefill.endDate) || PG.addDays(PG.TODAY, 30),
    daysOfWeek: (prefill && prefill.daysOfWeek) || [0,1,2,3,4,5,6],
    mode: (prefill && prefill.mode) || 'same',
    prices: (prefill && prefill.prices) || {},
    active: true
  };

  var m = ensureModal('rpPeriodModal');

  function pricesForm(){
    if (draft.mode === 'same'){
      return '<div class="form-group"><label class="form-label" for="ppSame">Price for every selected day</label>' +
        '<input type="number" min="0.01" step="0.01" class="form-control" id="ppSame" style="max-width:220px;" value="' +
        (draft.prices.same != null ? draft.prices.same : '') + '" placeholder="e.g. 120"></div>' +
        '<div class="form-hint">One price, applied to all ' + draft.daysOfWeek.length + ' selected day' + (draft.daysOfWeek.length===1?'':'s') + ' across the whole date range.</div>';
    }
    var html = '<div class="copy-row">' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="first">Copy first day’s price to all</button>' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="weekday">Copy to weekdays (Sat–Wed)</button>' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="weekend">Copy to weekend (Thu–Fri)</button>' +
      '<button type="button" class="btn btn-light btn-sm" data-copy="clear">Clear prices</button>' +
    '</div><div class="byday-grid">';
    for (var i=0;i<7;i++){
      var on = draft.daysOfWeek.indexOf(i) > -1;
      html += '<div class="form-group' + (on?'':' off') + '"><label class="form-label" for="ppD'+i+'">' + DOW_SHORT[i] + '</label>' +
        '<input type="number" min="0.01" step="0.01" class="form-control byday-input" id="ppD'+i+'" data-dow="'+i+'"' +
        (on?'':' disabled') + ' value="' + (draft.prices[String(i)] != null ? draft.prices[String(i)] : '') + '" placeholder="—"></div>';
    }
    return html + '</div>';
  }

  function validate(){
    var errs = [];
    if (!draft.name.trim()) errs.push('Give this pricing period a name — that name is how it will be found and edited later.');
    if (!draft.startDate || !draft.endDate) errs.push('Both a start date and an end date are required.');
    else if (draft.endDate < draft.startDate) errs.push('The end date can’t be before the start date.');
    if (!draft.daysOfWeek.length) errs.push('Select at least one day of the week.');

    var priced = 0, negative = false;
    if (draft.mode === 'same'){
      var v = draft.prices.same;
      if (v != null && v !== ''){ if (Number(v) > 0) priced++; else negative = true; }
    } else {
      draft.daysOfWeek.forEach(function(d){
        var x = draft.prices[String(d)];
        if (x != null && x !== ''){ if (Number(x) > 0) priced++; else negative = true; }
      });
    }
    if (negative) errs.push('Prices must be greater than 0.');
    if (!priced) errs.push('Enter at least one valid price.');

    var overlaps = PG.overlappingPeriods(plan, draft, existing ? existing.id : null);
    return { errors: errs, overlaps: overlaps, ok: errs.length === 0 && overlaps.length === 0 };
  }

  function renderPreview(){
    var v = validate();
    var dates = PG.periodAffectedDates(draft);
    var box = document.getElementById('ppPreview');
    var saveBtn = document.getElementById('ppSave');

    var lines = '';
    lines += '<div class="pv-line"><span>Date range</span><span>' +
      (draft.startDate && draft.endDate && draft.endDate >= draft.startDate
        ? PG.fmtDateShort(draft.startDate) + ' – ' + PG.fmtDateShort(draft.endDate) : '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Days of week</span><span>' +
      (draft.daysOfWeek.length === 7 ? 'All days' : draft.daysOfWeek.slice().sort().map(function(d){return DOW_SHORT[d];}).join(', ') || '—') + '</span></div>';
    lines += '<div class="pv-line"><span>Nights affected</span><span>' + dates.length + '</span></div>';
    if (draft.mode === 'same'){
      lines += '<div class="pv-line"><span>Price per night</span><span>' +
        (draft.prices.same ? PG.fmtMoney(Number(draft.prices.same)) : '—') + '</span></div>';
    } else {
      draft.daysOfWeek.slice().sort().forEach(function(d){
        var x = draft.prices[String(d)];
        lines += '<div class="pv-line"><span>' + DOW_LABELS[d] + '</span><span>' +
          (x != null && x !== '' ? PG.fmtMoney(Number(x)) : '<span class="src-missing">No price</span>') + '</span></div>';
      });
    }
    lines += '<div class="pv-line" style="border-top:1px solid var(--pg-border);margin-top:6px;padding-top:8px;"><span>Period state</span><span>' +
      timeStateBadge(PG.periodTimeState(draft)) + '</span></div>';

    var msg = '';
    if (v.overlaps.length){
      msg += '<div class="help-note help-note-danger" style="margin-top:12px;">' + PG.icon('alert',16) + '<div><strong>Overlaps another active pricing period.</strong><br>' +
        v.overlaps.map(function(o){
          return PG.esc(o.name) + ' (' + PG.fmtDateShort(o.startDate) + ' – ' + PG.fmtDateShort(o.endDate) + ', ' +
            ((o.daysOfWeek||[]).length===7 ? 'all days' : (o.daysOfWeek||[]).map(function(d){return DOW_SHORT[d];}).join(', ')) + ')';
        }).join('<br>') +
        '<br><span class="text-sm">This plan has no period priority, so two periods can’t both claim the same night. Narrow the dates or the weekdays to resolve it.</span></div></div>';
    }
    if (v.errors.length){
      msg += '<div class="help-note help-note-warning" style="margin-top:12px;">' + PG.icon('info',16) + '<div>' + v.errors.map(PG.esc).join('<br>') + '</div></div>';
    }
    if (v.ok && isEdit && dates.length){
      msg += '<div class="help-note" style="margin-top:12px;">' + PG.icon('info',16) + '<div>Saving updates <strong>' + dates.length +
        ' night' + (dates.length===1?'':'s') + '</strong> of pricing on “' + PG.esc(plan.name) + '”. Reservations already booked keep the price they were booked at.</div></div>';
    }
    box.innerHTML = lines + msg;
    saveBtn.disabled = !v.ok;
  }

  function paintBody(){
    document.getElementById('ppPrices').innerHTML = pricesForm();
    wirePrices();
    renderPreview();
  }

  function wirePrices(){
    var same = document.getElementById('ppSame');
    if (same) same.addEventListener('input', function(){ draft.prices.same = this.value; renderPreview(); });
    m.querySelectorAll('.byday-input').forEach(function(inp){
      inp.addEventListener('input', function(){ draft.prices[inp.dataset.dow] = inp.value; renderPreview(); });
    });
    m.querySelectorAll('[data-copy]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var kind = btn.dataset.copy;
        if (kind === 'clear'){ draft.prices = {}; paintBody(); return; }
        var sorted = draft.daysOfWeek.slice().sort();
        var srcVal = kind === 'first' ? draft.prices[String(sorted[0])]
          : kind === 'weekday' ? (draft.prices[String(sorted.find(function(d){return WEEKEND_DOW.indexOf(d)===-1;}))])
          : (draft.prices[String(sorted.find(function(d){return WEEKEND_DOW.indexOf(d)>-1;}))]);
        if (srcVal == null || srcVal === ''){ PG.toast('Enter one price first, then copy it across.', 'warning'); return; }
        var targets = kind === 'first' ? sorted
          : kind === 'weekday' ? sorted.filter(function(d){ return WEEKEND_DOW.indexOf(d) === -1; })
          : sorted.filter(function(d){ return WEEKEND_DOW.indexOf(d) > -1; });
        targets.forEach(function(d){ draft.prices[String(d)] = srcVal; });
        paintBody();
      });
    });
  }

  m.innerHTML = '<div class="pg-modal" style="max-width:620px;">' +
    '<div class="pg-modal-header"><div><h3>' + (isEdit ? 'Edit Pricing Period' : 'Add Pricing Period') + '</h3>' +
      '<div class="muted text-sm">' + PG.esc(plan.name) + ' · ' + PG.esc(rtName(plan.roomTypeId)) + '</div></div>' +
      '<button class="pg-modal-close" onclick="PG.closeModal(\'rpPeriodModal\')" aria-label="Close">' + PG.icon('x',18) + '</button></div>' +
    '<div class="pg-modal-body">' +
      '<div class="form-group"><label class="form-label" for="ppName">Period Name <span class="req">*</span></label>' +
        '<input class="form-control" id="ppName" value="' + PG.esc(draft.name) + '" placeholder="e.g. Summer Season 2027, Eid Holiday, Weekend Premium">' +
        '<div class="form-hint">Name it for the operational period it represents — this is how you’ll find and edit the whole period later, without remembering its dates.</div></div>' +
      '<div class="grid-2">' +
        '<div class="form-group"><label class="form-label" for="ppStart">Start Date <span class="req">*</span></label>' +
          '<input type="date" class="form-control" id="ppStart" value="' + draft.startDate + '"></div>' +
        '<div class="form-group"><label class="form-label" for="ppEnd">End Date <span class="req">*</span></label>' +
          '<input type="date" class="form-control" id="ppEnd" value="' + draft.endDate + '"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Days of Week <span class="req">*</span></label>' +
        '<div class="dow-grid" id="ppDow">' + DOW_SHORT.map(function(lbl,i){
          var on = draft.daysOfWeek.indexOf(i) > -1;
          return '<button type="button" class="dow-chip' + (on?' active':'') + '" data-dow="'+i+'" aria-pressed="'+on+'">' + lbl + '</button>';
        }).join('') + '</div>' +
        '<div class="form-hint">Only the selected weekdays are priced by this period. Unselected days fall through to another period or the base price.</div></div>' +
      '<div class="form-group"><label class="form-label">Pricing Mode</label>' +
        PG.segmented('ppMode', [
          {value:'same', label:'Same Price for Selected Days'},
          {value:'byday', label:'Different Price by Day'}
        ], draft.mode, {ariaLabel:'Pricing mode'}) + '</div>' +
      '<div id="ppPrices"></div>' +
      '<div class="form-label" style="margin-top:16px;">Preview</div>' +
      '<div class="preview-box" id="ppPreview" role="status" aria-live="polite"></div>' +
    '</div>' +
    '<div class="pg-modal-footer">' +
      '<button class="btn btn-light" onclick="PG.closeModal(\'rpPeriodModal\')">Cancel</button>' +
      '<button class="btn btn-primary" id="ppSave" disabled>' + (isEdit ? 'Save Changes' : 'Create Pricing Period') + '</button>' +
    '</div>' +
  '</div>';

  document.getElementById('ppName').addEventListener('input', function(){ draft.name = this.value; renderPreview(); });
  document.getElementById('ppStart').addEventListener('change', function(){ draft.startDate = this.value; renderPreview(); });
  document.getElementById('ppEnd').addEventListener('change', function(){ draft.endDate = this.value; renderPreview(); });
  document.getElementById('ppDow').addEventListener('click', function(e){
    var chip = e.target.closest('.dow-chip'); if (!chip) return;
    var d = +chip.dataset.dow, i = draft.daysOfWeek.indexOf(d);
    if (i > -1) draft.daysOfWeek.splice(i,1); else draft.daysOfWeek.push(d);
    chip.classList.toggle('active');
    chip.setAttribute('aria-pressed', chip.classList.contains('active'));
    paintBody();
  });
  PG.wireSegmented(m, 'ppMode', function(v){ draft.mode = v; paintBody(); });
  paintBody();

  document.getElementById('ppSave').addEventListener('click', function(){
    var v = validate();
    if (!v.ok) return;
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = 'Saving…';
    // A beat so the in-button saving state is actually visible — matching the
    // single-loading-indicator-per-action rule used elsewhere in this prototype.
    setTimeout(function(){
      try {
        var st = PG.getState();
        var target = st.ratePlans.find(function(x){return x.id===planId;});
        if (!target) throw new Error('This rate plan no longer exists.');
        // Revalidate against fresh state — another tab may have added an
        // overlapping period since this editor opened.
        var recheck = PG.overlappingPeriods(target, draft, existing ? existing.id : null);
        if (recheck.length) throw new Error('“' + recheck[0].name + '” now overlaps these dates. Reopen the editor and adjust.');

        var clean = {
          id: draft.id || newId('pp'),
          name: draft.name.trim(),
          startDate: draft.startDate,
          endDate: draft.endDate,
          daysOfWeek: draft.daysOfWeek.slice().sort(function(a,b){return a-b;}),
          mode: draft.mode,
          prices: {},
          active: draft.active !== false,
          createdAt: existing ? existing.createdAt : PG.nowIso(),
          updatedAt: PG.nowIso()
        };
        if (draft.mode === 'same') clean.prices.same = Math.round(Number(draft.prices.same)*100)/100;
        else clean.daysOfWeek.forEach(function(d){
          var x = draft.prices[String(d)];
          if (x != null && x !== '') clean.prices[String(d)] = Math.round(Number(x)*100)/100;
        });

        target.periods = target.periods || [];
        var prevDesc = null;
        if (existing){
          var idx = target.periods.findIndex(function(x){return x.id===existing.id;});
          prevDesc = describePeriod(target.periods[idx]);
          target.periods[idx] = clean;
        } else {
          target.periods.push(clean);
        }
        target.updatedAt = PG.nowIso();
        PG.setState(st);

        var nights = PG.periodAffectedDates(clean).length;
        PG.addAudit(existing ? 'Pricing Period Updated' : 'Pricing Period Created',
          '“' + clean.name + '” on ' + target.name + ' (' + rtName(target.roomTypeId) + ') — ' +
          describePeriod(clean) + '. ' + nights + ' night' + (nights===1?'':'s') + ' affected. ' +
          'Existing reservations keep their booked price.', null,
          { module:'Rate Plans & Pricing', recordId: clean.id,
            previousValue: prevDesc, newValue: describePeriod(clean) });

        PG.toast(existing ? 'Pricing period updated.' : 'Pricing period created.', 'success');
        PG.closeModal('rpPeriodModal');
        s = PG.getState();
        rerenderBody();
      } catch(e){
        btn.disabled = false;
        btn.innerHTML = isEdit ? 'Save Changes' : 'Create Pricing Period';
        document.getElementById('ppPreview').innerHTML +=
          '<div class="help-note help-note-danger" style="margin-top:12px;">' + PG.icon('alert',16) +
          '<div>Couldn’t save — ' + PG.esc(e.message) + ' Nothing was changed.</div></div>';
        PG.toast('Couldn’t save the pricing period.', 'danger');
      }
    }, 400);
  });

  PG.openModal('rpPeriodModal');
}

function describePeriod(pp){
  if (!pp) return null;
  var days = (pp.daysOfWeek||[]).length === 7 ? 'all days' : (pp.daysOfWeek||[]).map(function(d){return DOW_SHORT[d];}).join('/');
  var price = pp.mode === 'byday'
    ? 'per-day pricing'
    : ((pp.prices||{}).same != null ? PG.fmtMoney(Number(pp.prices.same)) + '/night' : 'unpriced');
  return PG.fmtDateShort(pp.startDate) + '–' + PG.fmtDateShort(pp.endDate) + ', ' + days + ', ' + price;
}

/* ================================================================== */
/* Boot — permission gate LAST, so nothing above it can run for a user  */
/* who shouldn't see this page (and so hoisting can't bite, per the     */
/* pattern every other gated page here uses).                           */
/* ================================================================== */
function init(){
  renderShell();
  // Deep links from global search: ?plan=… opens that plan's drawer, and
  // &period=… continues straight into that period's editor.
  var planParam = qp.get('plan');
  if (planParam && planById(planParam)){
    var periodParam = qp.get('period');
    if (periodParam && CAN_MANAGE && periodById(planParam, periodParam)) openPeriodEditor(planParam, periodParam);
    else openPlanDrawer(planParam);
  }
}

if (!CAN_VIEW){
  page.innerHTML = '<div class="pg-page-head"><div><h1>Rate Plans &amp; Pricing</h1></div></div>' +
    '<div class="card"><div class="card-body"><div class="empty-state"><div class="ic">' + PG.icon('lock',30) + '</div>' +
    'You don’t have permission to view Rate Plans &amp; Pricing.<br>Contact a Hotel Admin to request access.</div></div></div>';
} else {
  init();
}
</script>
</body>
</html>
