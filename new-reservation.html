<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Reservation — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .item-card{border:1px solid var(--pg-border);border-radius:8px;padding:16px;margin-bottom:14px;background:var(--pg-gray-100);}
  .item-card.insufficient{border-color:var(--pg-danger);background:var(--pg-danger-light);}
  .item-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .item-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--pg-border);}
  .avail-tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .avail-tag.ok{background:var(--pg-success-light);color:#0bb463;}
  .avail-tag.bad{background:var(--pg-danger-light);color:var(--pg-danger);}
  .source-opt{border:1px solid var(--pg-border);border-radius:8px;padding:12px;cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;}
  .source-opt.active{border-color:var(--pg-primary);background:var(--pg-primary-light);color:var(--pg-primary);}
  .pay-opt{border:1px solid var(--pg-border);border-radius:8px;padding:16px;cursor:pointer;flex:1;}
  .pay-opt.active{border-color:var(--pg-primary);background:var(--pg-primary-light);}
  .pay-opt h4{font-size:13.5px;margin-bottom:4px;}
  .pay-opt p{font-size:12px;color:var(--pg-gray-600);margin:0;}
  .cust-opt{border:1px solid var(--pg-border);border-radius:8px;padding:12px 14px;cursor:pointer;margin-bottom:8px;}
  .cust-opt.active{border-color:var(--pg-primary);background:var(--pg-primary-light);}
  .step-panel{display:none;}
  .step-panel.active{display:block;}
  .cust-toolbar{display:flex;gap:10px;margin-bottom:12px;}
  .cust-toolbar input{flex:1;}
  .cust-toolbar .pg-select{width:160px;flex-shrink:0;}
  .cust-pagination{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--pg-gray-600);}
  .room-assign-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:1px solid var(--pg-border);border-radius:8px;padding:10px 12px;margin-top:8px;background:#fff;}
  .room-assign-row.shortfall{border-color:var(--pg-danger);background:var(--pg-danger-light);}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("new-reservation", ["Reservations", "New Reservation"]);
var s = PG.getState();
var SOURCES = ['Admin / Direct Manual','Phone','WhatsApp','Walk-in','Travel Agency','Other Manual'];

function ratePlansFor(roomTypeId){
  var list = s.ratePlans.filter(function(rp){ return rp.roomTypeId===roomTypeId && rp.active; });
  if (!list.length){
    var rt = s.roomTypes.find(function(r){return r.id===roomTypeId;});
    return [{id:'default-'+roomTypeId, name:'Standard Rate', roomTypeId:roomTypeId, price:rt.baseRate}];
  }
  return list;
}
function ratePlanPrice(roomTypeId, ratePlanId){
  var plan = ratePlansFor(roomTypeId).find(function(p){return p.id===ratePlanId;});
  return plan ? plan.price : s.roomTypes.find(function(r){return r.id===roomTypeId;}).baseRate;
}
function occupancyFor(roomTypeId, qty){
  var rt = s.roomTypes.find(function(r){return r.id===roomTypeId;});
  return {adults: rt.maxAdults*qty, children: rt.maxChildren*qty};
}

function defaultItem(){
  var rtId = s.roomTypes[1] ? s.roomTypes[1].id : s.roomTypes[0].id;
  var occ = occupancyFor(rtId, 1);
  return {roomTypeId: rtId, ratePlanId: ratePlansFor(rtId)[0].id, qty: 1, adults: occ.adults, children: occ.children,
    requireAccessibility: false, bedConfigPref: null, requireConnecting: false, assignedRoomIds: [], assignmentShortfall: 0};
}

/* ---- Physical room auto-assignment (see PG.autoAssignRoomsForItem) ---- */
function bedConfigOptionsFor(roomTypeId){
  var opts = [];
  PG.physicalRoomsForType(s, roomTypeId).forEach(function(pr){ if (opts.indexOf(pr.bedConfiguration)===-1) opts.push(pr.bedConfiguration); });
  return opts.sort();
}
function recomputeAssignments(){
  var usedElsewhere = [];
  wizard.items.forEach(function(item, idx){
    var others = [];
    wizard.items.forEach(function(o,i){ if (i!==idx) others = others.concat(o.assignedRoomIds||[]); });
    var result = PG.autoAssignRoomsForItem(s, {
      roomTypeId: item.roomTypeId, checkIn: wizard.checkIn, checkOut: wizard.checkOut, qty: item.qty,
      requireAccessibility: item.requireAccessibility ? ['Wheelchair Accessible'] : [],
      bedConfiguration: item.bedConfigPref || null,
      requireConnecting: item.qty>1 && item.requireConnecting,
      keepRoomIds: item.assignedRoomIds || [],
      excludeRoomIds: others
    });
    item.assignedRoomIds = result.assignedRoomIds;
    item.assignmentShortfall = result.shortfall;
  });
}
function allItemsAssigned(){
  return wizard.items.every(function(it){ return it.assignmentShortfall===0; });
}
function roomSummaryChips(pr){
  var bits = [pr.view, pr.bedConfiguration].concat(pr.accessibilityFeatures||[]);
  return bits.map(function(b){ return '<span class="chip">'+PG.esc(b)+'</span>'; }).join('');
}

var wizard = {
  source: null,
  customerMode: 'existing',
  customerId: null,
  newCustomer: {name:'', phone:'', email:'', country:'', notes:''},
  checkIn: PG.TODAY,
  checkOut: PG.addDays(PG.TODAY, 3),
  items: [defaultItem()],
  paymentMethod: null,
  notes: ''
};
var custState = {search:'', sort:'newest', page:1, pageSize:4};
var PAGE_SIZE = custState.pageSize;

// Guided demo pre-fill — launched from the Guided Journey page for the Ahmad Khalil / WhatsApp scenario.
var demoTaxOverride = null;
var entryParams = new URLSearchParams(location.search);
if (entryParams.get('demo') === 'ahmad-whatsapp'){
  wizard.source = 'WhatsApp';
  wizard.customerMode = 'existing';
  wizard.customerId = 'cus-1';
  wizard.checkIn = '2026-08-20';
  wizard.checkOut = '2026-08-23';
  wizard.items = [
    Object.assign({roomTypeId:'dlx', ratePlanId: ratePlansFor('dlx')[0].id, qty:2, requireAccessibility:false, bedConfigPref:null, requireConnecting:false, assignedRoomIds:[], assignmentShortfall:0}, occupancyFor('dlx',2)),
    Object.assign({roomTypeId:'fam', ratePlanId: ratePlansFor('fam')[0].id, qty:1, requireAccessibility:false, bedConfigPref:null, requireConnecting:false, assignedRoomIds:[], assignmentShortfall:0}, occupancyFor('fam',1))
  ];
  wizard.paymentMethod = 'Payment Link';
  demoTaxOverride = 50;
}
if (entryParams.get('customer')){
  // Entry from the Guests module ("Create Reservation") — prefill the existing guest.
  var prefCust = s.customers.find(function(c){return c.id===entryParams.get('customer');});
  if (prefCust){ wizard.customerMode = 'existing'; wizard.customerId = prefCust.id; }
}
if (entryParams.get('demo') !== 'ahmad-whatsapp' && entryParams.get('rt')){
  // Entry from Operations Calendar: clicking an empty room/date cell — prefill room type,
  // date, and (if still eligible when this page loads) the exact room that was clicked.
  var prefRt = entryParams.get('rt');
  var prefDate = entryParams.get('date');
  if (prefDate){ wizard.checkIn = prefDate; wizard.checkOut = PG.addDays(prefDate, 1); }
  wizard.items = [Object.assign({roomTypeId:prefRt, ratePlanId: ratePlansFor(prefRt)[0].id, qty:1, requireAccessibility:false, bedConfigPref:null, requireConnecting:false, assignedRoomIds:[], assignmentShortfall:0}, occupancyFor(prefRt,1))];
}
recomputeAssignments();
if (entryParams.get('room') && wizard.items[0] && wizard.items[0].assignedRoomIds.indexOf(entryParams.get('room'))===-1){
  // The clicked room wasn't the engine's top pick (or has since become ineligible) —
  // ask it to keep that exact room if it's still eligible, falling back otherwise.
  var forcedResult = PG.autoAssignRoomsForItem(s, {
    roomTypeId: wizard.items[0].roomTypeId, checkIn: wizard.checkIn, checkOut: wizard.checkOut, qty: 1,
    requireAccessibility: [], bedConfiguration: null, requireConnecting: false,
    keepRoomIds: [entryParams.get('room')], excludeRoomIds: []
  });
  wizard.items[0].assignedRoomIds = forcedResult.assignedRoomIds;
  wizard.items[0].assignmentShortfall = forcedResult.shortfall;
}
var currentStep = 1;

var html = '';
html += '<div class="pg-page-head"><div><h1>New Reservation</h1><div class="sub">Guided reservation workflow for Palestine Grand Hotel</div></div></div>';
html += '<div class="pg-steps" id="stepsBar"></div>';
html += '<div class="row"><div class="col" style="flex:2;">';

// Step 1 — Guest & Source
html += '<div class="step-panel" id="step1">' +
  '<div class="card"><div class="card-header"><h3>Reservation Source</h3><div class="desc">Manual source selection — required for every reservation</div></div><div class="card-body">' +
    '<div class="grid-3" id="sourceGrid">' + SOURCES.map(function(src){ return '<div class="source-opt" data-src="'+src+'">'+src+'</div>'; }).join('') + '</div>' +
  '</div></div>' +
  '<div class="card"><div class="card-header"><h3>Guest Information</h3></div><div class="card-body">' +
    '<div class="pill-toggle" id="custModePill" style="margin-bottom:16px;"><button type="button" class="active" data-m="existing">Existing Customer</button><button type="button" data-m="new">New Customer</button></div>' +
    '<div id="existingCustWrap">' +
      '<div class="cust-toolbar">' +
        '<input class="form-control" id="custSearch" placeholder="Search by name or phone">' +
        '<select class="form-control" id="custSort"><option value="newest">Newest</option><option value="alpha">Alphabetical</option></select>' +
      '</div>' +
      '<div id="custList"></div>' +
      '<div class="cust-pagination" id="custPagination"></div>' +
    '</div>' +
    '<div id="newCustWrap" style="display:none;">' +
      '<div class="grid-2">' +
        '<div class="form-group"><label class="form-label">Full Name</label><input class="form-control" id="nc-name" placeholder="e.g. Ahmad Khalil"></div>' +
        '<div class="form-group"><label class="form-label">Mobile</label><input class="form-control" id="nc-phone" placeholder="+970 599 123 456"></div>' +
        '<div class="form-group"><label class="form-label">Email</label><input class="form-control" id="nc-email" placeholder="ahmad@example.com"></div>' +
        '<div class="form-group"><label class="form-label">Country</label><input class="form-control" id="nc-country" placeholder="Palestine"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Notes <span class="opt">(optional)</span></label><textarea class="form-control" id="nc-notes" placeholder="Any relevant guest notes"></textarea></div>' +
    '</div>' +
  '</div></div>' +
'</div>';

// Step 2 — Stay & Rooms
html += '<div class="step-panel" id="step2">' +
  '<div class="card"><div class="card-header"><h3>Stay</h3></div><div class="card-body">' +
    '<div class="grid-3">' +
      '<div class="form-group"><label class="form-label">Arrival Date</label><input type="date" class="form-control" id="checkIn" value="'+wizard.checkIn+'"></div>' +
      '<div class="form-group"><label class="form-label">Departure Date</label><input type="date" class="form-control" id="checkOut" value="'+wizard.checkOut+'"></div>' +
      '<div class="form-group"><label class="form-label">Number of Nights</label><input class="form-control" id="nightsDisplay" disabled></div>' +
    '</div>' +
  '</div></div>' +
  '<div class="card"><div class="card-header"><h3>Reservation Items</h3><div class="desc">Add one or more room types for a multi-room reservation</div></div><div class="card-body">' +
    '<div id="itemCards"></div>' +
    '<button class="btn btn-outline btn-sm" id="addItem">+ Add Another Room</button>' +
    '<div class="help-note" style="margin-top:14px;">All reservation items must be available before the reservation can be confirmed.</div>' +
  '</div></div>' +
'</div>';

// Step 3 — Pricing & Payment
html += '<div class="step-panel" id="step3">' +
  '<div class="card"><div class="card-header"><h3>Pricing Summary</h3></div><div class="card-body" id="pricingBody"></div></div>' +
  '<div class="card"><div class="card-header"><h3>Payment Method</h3></div><div class="card-body">' +
    '<div style="display:flex;gap:14px;" id="payGrid">' +
      '<div class="pay-opt" data-pm="Pay on Arrival"><h4>Pay on Arrival</h4><p>Reservation can be confirmed according to hotel policy. Payment remains outstanding.</p></div>' +
      '<div class="pay-opt" data-pm="Payment Link"><h4>Payment Link</h4><p>Generate a secure payment link and track payment status.</p></div>' +
    '</div>' +
    '<div class="form-group" style="margin-top:16px;"><label class="form-label">Notes <span class="opt">(optional)</span></label><textarea class="form-control" id="notesInput" placeholder="Internal notes about this reservation"></textarea></div>' +
  '</div></div>' +
  '<button class="btn btn-light btn-sm" id="simAvailChange" title="Prototype aid — simulates inventory changing elsewhere while this reservation is being built">Simulate: Availability Changed (Demo)</button>' +
'</div>';

// Step 4 — Review & Save
html += '<div class="step-panel" id="step4">' +
  '<div class="card"><div class="card-header"><h3>Review Reservation</h3></div><div class="card-body" id="reviewBody"></div></div>' +
'</div>';

html += '<div style="display:flex;justify-content:space-between;margin-top:6px;">' +
  '<button class="btn btn-light" id="backBtn" style="visibility:hidden;">&larr; Back</button>' +
  '<div style="display:flex;gap:10px;" id="forwardActions"></div>' +
'</div>';

html += '</div>';
html += '<div class="col"><div class="card" style="position:sticky;top:80px;"><div class="card-header"><h3>Booking Summary</h3></div><div class="card-body" id="summaryBox"></div></div></div>';
html += '</div>';

page.innerHTML = html;
PG.enhanceSelects(page);

var STEP_LABELS = ['Guest & Source','Stay & Rooms','Pricing & Payment','Review & Save'];
function renderSteps(){
  document.getElementById('stepsBar').innerHTML = STEP_LABELS.map(function(label, i){
    var n = i+1;
    var cls = n===currentStep ? 'active' : (n<currentStep ? 'done' : '');
    var connector = i>0 ? '<div class="pg-step-connector'+(n<=currentStep?' done':'')+'"></div>' : '';
    return connector + '<div class="pg-step '+cls+'"><div class="num">'+(n<currentStep?'&#10003;':n)+'</div><div class="label">'+label+'</div></div>';
  }).join('');
}

function nights(){ return PG.dateRange(wizard.checkIn, wizard.checkOut); }
function itemAvailability(item){
  return PG.validateAvailability(s, item.roomTypeId, wizard.checkIn, wizard.checkOut, item.qty);
}
function itemTotal(item){
  return ratePlanPrice(item.roomTypeId, item.ratePlanId) * item.qty * nights().length;
}
function allItemsAvailable(){
  return wizard.items.every(function(it){ return wizard.checkOut>wizard.checkIn && itemAvailability(it).ok; });
}

function renderAssignmentBlock(item, idx){
  var rows = [];
  for (var slot=0; slot<item.qty; slot++){
    var roomId = item.assignedRoomIds[slot];
    if (roomId){
      var pr = s.physicalRooms.find(function(p){return p.id===roomId;});
      rows.push('<div class="room-assign-row">' +
        '<div><div style="font-weight:700;font-size:13px;">&#10003; Room '+PG.esc(pr.roomNumber)+' <span class="muted text-sm">&middot; Floor '+pr.floor+'</span></div>' +
        '<div style="margin-top:5px;">'+roomSummaryChips(pr)+'</div>' +
        '<div class="muted text-sm" style="margin-top:5px;">'+PG.fmtDateShort(wizard.checkIn)+' &ndash; '+PG.fmtDateShort(wizard.checkOut)+'</div></div>' +
        '<button class="btn btn-outline btn-sm change-room-btn" data-idx="'+idx+'" data-slot="'+slot+'">Change Room</button>' +
      '</div>');
    } else {
      rows.push('<div class="room-assign-row shortfall"><div class="text-sm" style="color:var(--pg-danger);">&#9888; Unit '+(slot+1)+': no eligible physical room could be assigned for these dates.</div></div>');
    }
  }
  return rows.join('');
}

function renderItemCards(){
  document.getElementById('nightsDisplay').value = nights().length + ' night' + (nights().length===1?'':'s');
  var wrap = document.getElementById('itemCards');
  wrap.innerHTML = wizard.items.map(function(item, idx){
    var rt = s.roomTypes.find(function(r){return r.id===item.roomTypeId;});
    var plans = ratePlansFor(item.roomTypeId);
    var a = wizard.checkOut>wizard.checkIn ? itemAvailability(item) : {ok:false, problems:[{available:0}]};
    var worst = a.problems && a.problems.length ? a.problems[0].available : rt.sellable;
    var commerciallyOk = a.ok;
    var physicallyOk = item.assignmentShortfall===0;
    var ok = commerciallyOk && physicallyOk;
    var rtOptions = s.roomTypes.map(function(r){return '<option value="'+r.id+'"'+(r.id===item.roomTypeId?' selected':'')+'>'+r.name+'</option>';}).join('');
    var planOptions = plans.map(function(p){return '<option value="'+p.id+'"'+(p.id===item.ratePlanId?' selected':'')+'>'+p.name+' ('+PG.fmtMoney(p.price)+'/night)</option>';}).join('');
    var bedOptions = '<option value="">No preference</option>' + bedConfigOptionsFor(item.roomTypeId).map(function(b){return '<option value="'+PG.esc(b)+'"'+(item.bedConfigPref===b?' selected':'')+'>'+PG.esc(b)+'</option>';}).join('');
    return '<div class="item-card'+(ok?'':' insufficient')+'" data-idx="'+idx+'">' +
      '<div class="item-card-head"><strong class="text-sm">Room Item '+(idx+1)+'</strong>' +
        (wizard.items.length>1 ? '<button class="btn btn-danger-outline btn-sm remove-item" data-idx="'+idx+'">Remove</button>' : '') +
      '</div>' +
      '<div class="item-grid">' +
        '<div class="form-group"><label class="form-label">Room Type</label><select class="form-control it-rt" data-idx="'+idx+'">'+rtOptions+'</select></div>' +
        '<div class="form-group"><label class="form-label">Quantity</label><input type="number" min="1" class="form-control it-qty" data-idx="'+idx+'" value="'+item.qty+'"></div>' +
        '<div class="form-group"><label class="form-label">Rate Plan</label><select class="form-control it-plan" data-idx="'+idx+'">'+planOptions+'</select></div>' +
        '<div class="form-group"><label class="form-label">Price per Night</label><input class="form-control" disabled value="'+PG.fmtMoney(ratePlanPrice(item.roomTypeId, item.ratePlanId))+'"></div>' +
        '<div class="form-group" style="grid-column:span 2;"><label class="form-label">Max Occupancy <span class="opt">(set by room type × quantity)</span></label><input class="form-control" disabled value="'+item.adults+' Adults, '+item.children+' Children"></div>' +
        '<div class="form-group"><label class="form-label">Bed Configuration Preference <span class="opt">(optional)</span></label><select class="form-control it-bed" data-idx="'+idx+'">'+bedOptions+'</select></div>' +
        '<div class="form-check" style="align-self:end;padding-bottom:10px;"><input type="checkbox" class="it-access" data-idx="'+idx+'" id="it-access-'+idx+'"'+(item.requireAccessibility?' checked':'')+'><label class="form-label" style="margin:0;" for="it-access-'+idx+'">Requires Wheelchair Accessible Room</label></div>' +
        (item.qty>1 ? '<div class="form-check" style="align-self:end;padding-bottom:10px;"><input type="checkbox" class="it-connect" data-idx="'+idx+'" id="it-connect-'+idx+'"'+(item.requireConnecting?' checked':'')+'><label class="form-label" style="margin:0;" for="it-connect-'+idx+'">Request Connecting Rooms</label></div>' : '<div></div>') +
      '</div>' +
      '<div class="item-foot">' +
        '<span class="text-sm"><strong>Item Total: '+PG.fmtMoney(itemTotal(item))+'</strong></span>' +
        '<span class="text-sm">Available: '+worst+' &middot; Requested: '+item.qty+'</span>' +
        '<span class="avail-tag '+(ok?'ok':'bad')+'">'+(ok?'Room(s) Assigned':(commerciallyOk?'Room Assignment Incomplete':'Insufficient Inventory'))+'</span>' +
      '</div>' +
      (commerciallyOk ? '' : '<div class="avail-msg bad" style="margin-top:10px;background:#fff;border-radius:6px;padding:8px 10px;font-size:12px;color:var(--pg-danger);">&#9888; Only '+worst+' '+rt.name+' room(s) available for the selected dates. Reduce quantity, change dates, or remove this item to continue.</div>') +
      (commerciallyOk && !physicallyOk ? '<div class="avail-msg bad" style="margin-top:10px;background:#fff;border-radius:6px;padding:8px 10px;font-size:12px;color:var(--pg-danger);">&#9888; Only '+(item.qty-item.assignmentShortfall)+' of '+item.qty+' '+rt.name+' physical room(s) could be assigned for these dates. Reduce quantity, change dates, or choose another room type to continue.</div>' : '') +
      '<div style="margin-top:10px;">'+renderAssignmentBlock(item, idx)+'</div>' +
    '</div>';
  }).join('');
  PG.enhanceSelects(wrap);
  bindItemEvents();
}

function bindItemEvents(){
  document.querySelectorAll('.it-rt').forEach(function(el){ el.addEventListener('change', function(){
    var idx=+el.dataset.idx; var it = wizard.items[idx];
    it.roomTypeId = el.value; it.ratePlanId = ratePlansFor(el.value)[0].id;
    it.bedConfigPref = null; it.assignedRoomIds = [];
    Object.assign(it, occupancyFor(it.roomTypeId, it.qty));
    recomputeAssignments(); renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.it-qty').forEach(function(el){ el.addEventListener('input', function(){
    var it = wizard.items[+el.dataset.idx];
    it.qty = Math.max(1, parseInt(el.value,10)||1);
    Object.assign(it, occupancyFor(it.roomTypeId, it.qty));
    recomputeAssignments(); renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.it-plan').forEach(function(el){ el.addEventListener('change', function(){
    wizard.items[+el.dataset.idx].ratePlanId = el.value; renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.it-bed').forEach(function(el){ el.addEventListener('change', function(){
    wizard.items[+el.dataset.idx].bedConfigPref = el.value || null;
    recomputeAssignments(); renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.it-access').forEach(function(el){ el.addEventListener('change', function(){
    wizard.items[+el.dataset.idx].requireAccessibility = el.checked;
    recomputeAssignments(); renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.it-connect').forEach(function(el){ el.addEventListener('change', function(){
    wizard.items[+el.dataset.idx].requireConnecting = el.checked;
    recomputeAssignments(); renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.remove-item').forEach(function(el){ el.addEventListener('click', function(){
    wizard.items.splice(+el.dataset.idx,1);
    recomputeAssignments(); renderItemCards(); renderSummary();
  });});
  document.querySelectorAll('.change-room-btn').forEach(function(el){ el.addEventListener('click', function(){
    var idx=+el.dataset.idx, slot=+el.dataset.slot;
    var item = wizard.items[idx];
    var rt = s.roomTypes.find(function(r){return r.id===item.roomTypeId;});
    var others = [];
    wizard.items.forEach(function(o,i){ others = others.concat(i===idx ? o.assignedRoomIds.filter(function(id,si){return si!==slot;}) : o.assignedRoomIds); });
    PG.renderChangeRoomDrawer({
      roomTypeId: item.roomTypeId, checkIn: wizard.checkIn, checkOut: wizard.checkOut,
      preferences: { requireAccessibility: item.requireAccessibility ? ['Wheelchair Accessible'] : [], bedConfiguration: item.bedConfigPref, requireConnecting: item.qty>1 && item.requireConnecting },
      currentRoomId: item.assignedRoomIds[slot] || null,
      excludeRoomIds: others,
      title: 'Change Room',
      summaryLabel: rt.name + ' &middot; Unit ' + (slot+1) + ' of ' + item.qty,
      summarySub: PG.fmtDateShort(wizard.checkIn) + ' – ' + PG.fmtDateShort(wizard.checkOut),
      onConfirm: function(newRoomId){
        item.assignedRoomIds[slot] = newRoomId;
        item.assignmentShortfall = item.assignedRoomIds.filter(function(x){return !!x;}).length < item.qty ? item.qty - item.assignedRoomIds.filter(function(x){return !!x;}).length : 0;
        renderItemCards(); renderSummary();
        PG.toast('Room updated.', 'success');
      }
    });
  });});
}

document.getElementById('addItem').addEventListener('click', function(){
  wizard.items.push(defaultItem());
  recomputeAssignments(); renderItemCards(); renderSummary();
});
document.getElementById('simAvailChange').addEventListener('click', function(){
  if (!wizard.items.length) return;
  var it = wizard.items[0];
  var st = PG.getState();
  var key = it.roomTypeId + '|' + wizard.checkIn;
  st.inventoryOverrides[key] = {stopSell:true, reason:'Simulated concurrent change (demo)'};
  PG.setState(st);
  s = PG.getState();
  PG.toast('Simulated: inventory changed elsewhere for this room type/date. Continue to Review & Save to see the warning.', 'warn');
  recomputeAssignments(); renderItemCards();
});
document.getElementById('checkIn').addEventListener('change', function(){ wizard.checkIn=this.value; recomputeAssignments(); renderItemCards(); renderSummary(); });
document.getElementById('checkOut').addEventListener('change', function(){ wizard.checkOut=this.value; recomputeAssignments(); renderItemCards(); renderSummary(); });

function pricingBreakdown(){
  var roomCharges = wizard.items.reduce(function(a,it){return a+itemTotal(it);},0);
  var taxes = demoTaxOverride!=null ? demoTaxOverride : Math.round(roomCharges*0.04*100)/100;
  var fees = wizard.items.length ? 20 : 0;
  return {roomCharges:roomCharges, taxes:taxes, fees:fees, total:roomCharges+taxes+fees};
}
function renderPricing(){
  var p = pricingBreakdown();
  document.getElementById('pricingBody').innerHTML =
    prow('Room Charges', PG.fmtMoney(p.roomCharges)) +
    prow('Taxes', PG.fmtMoney(p.taxes)) +
    prow('Fees', PG.fmtMoney(p.fees)) +
    '<div class="divider"></div>' +
    '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;"><span>Total</span><span>'+PG.fmtMoney(p.total)+'</span></div>';
}
function prow(l,v){ return '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;"><span class="muted">'+l+'</span><span style="font-weight:600;">'+v+'</span></div>'; }

function guestSelected(){
  return wizard.customerMode==='existing' ? !!wizard.customerId : !!wizard.newCustomer.name.trim();
}
function guestName(){
  if (wizard.customerMode==='existing'){ var c = s.customers.find(function(c){return c.id===wizard.customerId;}); return c ? c.name : '—'; }
  return wizard.newCustomer.name || 'New Guest';
}
function guestPhone(){
  if (wizard.customerMode==='existing'){ var c = s.customers.find(function(c){return c.id===wizard.customerId;}); return c ? c.phone : '—'; }
  return wizard.newCustomer.phone || '—';
}

function renderSummary(){
  var p = pricingBreakdown();
  var box = document.getElementById('summaryBox');
  var rows = '';
  if (guestSelected()) rows += srow('Guest', guestName());
  if (wizard.source) rows += srow('Source', wizard.source);
  if (wizard.source || guestSelected()) rows += '<div class="divider"></div>';
  rows += srow('Arrival', PG.fmtDateShort(wizard.checkIn)) + srow('Departure', PG.fmtDateShort(wizard.checkOut)) + srow('Nights', nights().length);
  rows += '<div class="divider"></div>';
  rows += wizard.items.map(function(it){ var rt=s.roomTypes.find(function(r){return r.id===it.roomTypeId;}); return srow(it.qty+'× '+rt.name, PG.fmtMoney(itemTotal(it))); }).join('');
  if (wizard.paymentMethod){ rows += '<div class="divider"></div>'; rows += srow('Payment Method', wizard.paymentMethod); }
  rows += '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-top:6px;"><span>Total</span><span>'+PG.fmtMoney(p.total)+'</span></div>';
  box.innerHTML = rows;
}
function srow(l,v){ return '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;"><span class="muted">'+l+'</span><span style="font-weight:600;text-align:right;">'+v+'</span></div>'; }

function renderReview(){
  s = PG.getState(); // re-check live state — availability may have changed in another tab/session
  recomputeAssignments(); // re-check physical room assignments against the live state too
  var stillOk = wizard.checkOut>wizard.checkIn && wizard.items.every(function(it){ return itemAvailability(it).ok; }) && allItemsAssigned();
  var warningHtml = '';
  if (!stillOk){
    warningHtml = '<div class="help-note help-note-warning" style="margin-bottom:16px;">' +
      'Availability or room assignment changed while this reservation was being created. Please review the selected room items before confirming.<br>' +
      '<button class="btn btn-outline btn-sm" id="reviewAvailBtn" style="margin-top:10px;">Review Availability</button></div>';
  }
  var p = pricingBreakdown();
  var html2 = '<div class="grid-2">' +
    revBlock('Guest', guestName() + '<br><span class="muted text-sm">'+guestPhone()+'</span>') +
    revBlock('Source', wizard.source) +
    revBlock('Stay', PG.fmtDate(wizard.checkIn) + ' &rarr; ' + PG.fmtDate(wizard.checkOut) + ' ('+nights().length+' nights)') +
    revBlock('Payment Method', wizard.paymentMethod) +
  '</div><div class="divider"></div>' +
  '<div class="form-label">Room Items</div>' +
  wizard.items.map(function(it){ var rt=s.roomTypes.find(function(r){return r.id===it.roomTypeId;}); return '<div class="text-sm" style="padding:6px 0;">'+it.qty+'× '+rt.name+' — '+it.adults+' Adults'+(it.children?', '+it.children+' Children':'')+' — '+PG.fmtMoney(itemTotal(it))+'</div>'; }).join('') +
  '<div class="divider"></div>' +
  prow('Room Charges', PG.fmtMoney(p.roomCharges)) + prow('Taxes', PG.fmtMoney(p.taxes)) + prow('Fees', PG.fmtMoney(p.fees)) +
  '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-top:6px;"><span>Total</span><span>'+PG.fmtMoney(p.total)+'</span></div>';
  document.getElementById('reviewBody').innerHTML = warningHtml + html2;

  var fwd = document.getElementById('forwardActions');
  if (!stillOk){
    fwd.innerHTML = '<button class="btn btn-outline" disabled title="Resolve the availability warning above to continue">Save as Draft</button><button class="btn btn-primary" disabled title="Resolve the availability warning above to continue">Confirm / Continue with Payment</button>';
    document.getElementById('reviewAvailBtn').addEventListener('click', function(){ showStep(2); });
  } else {
    fwd.innerHTML = '<button class="btn btn-outline" id="draftBtn">Save as Draft</button><button class="btn btn-primary" id="confirmBtn">Confirm / Continue with Payment</button>';
    document.getElementById('draftBtn').addEventListener('click', function(){ createReservation('Draft'); });
    document.getElementById('confirmBtn').addEventListener('click', function(){ createReservation('Confirm'); });
  }
}
function revBlock(l,v){ return '<div class="form-group"><div class="form-label">'+l+'</div><div style="font-size:13px;">'+v+'</div></div>'; }

function showStep(n){
  currentStep = n;
  document.querySelectorAll('.step-panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById('step'+n).classList.add('active');
  renderSteps();
  document.getElementById('backBtn').style.visibility = n===1 ? 'hidden' : 'visible';
  var fwd = document.getElementById('forwardActions');
  if (n===4){
    fwd.innerHTML = '<button class="btn btn-outline" id="draftBtn">Save as Draft</button><button class="btn btn-primary" id="confirmBtn">Confirm / Continue with Payment</button>';
    document.getElementById('draftBtn').addEventListener('click', function(){ createReservation('Draft'); });
    document.getElementById('confirmBtn').addEventListener('click', function(){ createReservation('Confirm'); });
  } else {
    fwd.innerHTML = '<button class="btn btn-primary" id="nextBtn">Next &rarr;</button>';
    document.getElementById('nextBtn').addEventListener('click', onNext);
  }
  if (n===1) renderCustList();
  if (n===2) renderItemCards();
  if (n===3) renderPricing();
  if (n===4) renderReview();
  renderSummary();
  window.scrollTo({top:0, behavior:'smooth'});
}

function onNext(){
  if (currentStep===1){
    if (!wizard.source){ PG.toast('Select a reservation source to continue.', 'danger'); return; }
    if (wizard.customerMode==='new' && !wizard.newCustomer.name.trim()){ PG.toast('Enter the guest\'s full name to continue.', 'danger'); return; }
    if (wizard.customerMode==='new' && !wizard.newCustomer.phone.trim()){ PG.toast('Enter the guest\'s mobile number to continue.', 'danger'); return; }
    if (wizard.customerMode==='existing' && !wizard.customerId){ PG.toast('Select an existing guest to continue.', 'danger'); return; }
    showStep(2); return;
  }
  if (currentStep===2){
    if (wizard.checkOut<=wizard.checkIn){ PG.toast('Departure date must be after arrival date.', 'danger'); return; }
    if (!wizard.items.length){ PG.toast('Add at least one room item.', 'danger'); return; }
    if (!allItemsAvailable()){ PG.toast('All reservation items must be available before the reservation can be confirmed.', 'danger'); return; }
    if (!allItemsAssigned()){ PG.toast('Every room in this reservation must have a physical room assigned before continuing.', 'danger'); return; }
    showStep(3); return;
  }
  if (currentStep===3){
    if (!wizard.paymentMethod){ PG.toast('Select a payment method to continue.', 'danger'); return; }
    showStep(4); return;
  }
}

document.getElementById('backBtn').addEventListener('click', function(){ if(currentStep>1) showStep(currentStep-1); });

document.querySelectorAll('.source-opt').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('.source-opt').forEach(function(o){o.classList.remove('active');});
    el.classList.add('active'); wizard.source = el.dataset.src; renderSummary();
  });
});
document.getElementById('custModePill').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#custModePill button').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active'); wizard.customerMode = btn.dataset.m;
  document.getElementById('existingCustWrap').style.display = wizard.customerMode==='existing' ? 'block' : 'none';
  document.getElementById('newCustWrap').style.display = wizard.customerMode==='new' ? 'block' : 'none';
  renderSummary();
});

function renderCustList(){
  var q = custState.search.trim().toLowerCase();
  var list = s.customers.filter(function(c){
    if (!q) return true;
    return c.name.toLowerCase().indexOf(q)>-1 || (c.phone||'').replace(/\s/g,'').indexOf(q.replace(/\s/g,''))>-1;
  });
  if (custState.sort==='alpha') list = list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  else list = list.slice().reverse(); // "Newest" — later entries in the array were added more recently

  var totalPages = Math.max(1, Math.ceil(list.length/custState.pageSize));
  custState.page = Math.min(custState.page, totalPages);
  var pageItems = list.slice((custState.page-1)*custState.pageSize, custState.page*custState.pageSize);

  var listEl = document.getElementById('custList');
  if (!pageItems.length){
    listEl.innerHTML = '<div class="empty-state" style="padding:24px;">No customers match your search.</div>';
  } else {
    listEl.innerHTML = pageItems.map(function(c){
      return '<div class="cust-opt'+(c.id===wizard.customerId?' active':'')+'" data-cid="'+c.id+'"><div style="font-weight:600;font-size:13px;">'+PG.esc(c.name)+'</div><div class="muted text-sm">'+PG.esc(c.phone)+' &middot; '+PG.esc(c.email)+'</div></div>';
    }).join('');
    listEl.querySelectorAll('.cust-opt').forEach(function(el){
      el.addEventListener('click', function(){
        wizard.customerId = el.dataset.cid;
        listEl.querySelectorAll('.cust-opt').forEach(function(o){o.classList.remove('active');});
        el.classList.add('active');
        renderSummary();
      });
    });
  }
  document.getElementById('custPagination').innerHTML =
    '<span>'+list.length+' customer'+(list.length===1?'':'s')+' &middot; Page '+custState.page+' of '+totalPages+'</span>' +
    '<span style="display:flex;gap:6px;"><button class="btn btn-outline btn-sm" id="custPrev" '+(custState.page<=1?'disabled':'')+'>&larr; Prev</button><button class="btn btn-outline btn-sm" id="custNext" '+(custState.page>=totalPages?'disabled':'')+'>Next &rarr;</button></span>';
  var prevBtn = document.getElementById('custPrev'), nextBtn2 = document.getElementById('custNext');
  if (prevBtn) prevBtn.addEventListener('click', function(){ custState.page--; renderCustList(); });
  if (nextBtn2) nextBtn2.addEventListener('click', function(){ custState.page++; renderCustList(); });
}
document.getElementById('custSearch').addEventListener('input', function(){ custState.search=this.value; custState.page=1; renderCustList(); });
document.getElementById('custSort').addEventListener('change', function(){ custState.sort=this.value; custState.page=1; renderCustList(); });

['nc-name','nc-phone','nc-email','nc-country','nc-notes'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(){
    wizard.newCustomer.name = document.getElementById('nc-name').value;
    wizard.newCustomer.phone = document.getElementById('nc-phone').value;
    wizard.newCustomer.email = document.getElementById('nc-email').value;
    wizard.newCustomer.country = document.getElementById('nc-country').value;
    wizard.newCustomer.notes = document.getElementById('nc-notes').value;
    renderSummary();
  });
});
document.querySelectorAll('.pay-opt').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('.pay-opt').forEach(function(o){o.classList.remove('active');});
    el.classList.add('active'); wizard.paymentMethod = el.dataset.pm; renderSummary();
  });
});
document.getElementById('notesInput').addEventListener('input', function(){ wizard.notes = this.value; });

// Demo pre-fill needs the matching source/customer/payment tiles visually highlighted on load.
if (wizard.source){ var so = document.querySelector('.source-opt[data-src="'+wizard.source+'"]'); if (so) so.classList.add('active'); }
if (wizard.paymentMethod){ var po = document.querySelector('.pay-opt[data-pm="'+wizard.paymentMethod+'"]'); if (po) po.classList.add('active'); }

function createReservation(mode){
  if (!allItemsAvailable()){ PG.toast('All reservation items must be available before the reservation can be confirmed.', 'danger'); return; }
  if (!allItemsAssigned()){ PG.toast('Every room in this reservation must have a physical room assigned before the reservation can be confirmed.', 'danger'); return; }
  var st = PG.getState();
  var id = 'RES-' + st.nextResId;
  st.nextResId += 1;

  var customerId = wizard.customerId;
  if (wizard.customerMode==='new'){
    customerId = 'cus-' + Date.now();
    st.customers.push({id:customerId, name:wizard.newCustomer.name, phone:wizard.newCustomer.phone, email:wizard.newCustomer.email||'—', nationality:wizard.newCustomer.country||'—', notes:wizard.newCustomer.notes||''});
  }

  var status, paymentStatus;
  if (mode==='Draft'){
    status = 'Draft';
    paymentStatus = wizard.paymentMethod==='Pay on Arrival' ? 'Pay on Arrival' : 'Payment Required';
  } else if (wizard.paymentMethod==='Pay on Arrival'){
    status = 'Confirmed'; paymentStatus = 'Pay on Arrival';
  } else {
    status = 'Pending Payment'; paymentStatus = 'Payment Required';
  }

  var activity = [{ts: PG.nowIso(), text: 'Reservation created via ' + wizard.source + ' by Hotel Admin.'}];
  if (mode==='Draft') activity.push({ts: PG.nowIso(), text: 'Saved as Draft.'});
  else if (wizard.paymentMethod==='Pay on Arrival') activity.push({ts: PG.nowIso(), text: 'Payment method set to Pay on Arrival. Reservation confirmed.'});
  else activity.push({ts: PG.nowIso(), text: 'Payment method set to Payment Link. Awaiting link generation.'});

  var p = pricingBreakdown();
  var roomItems = wizard.items.map(function(it,i){ return {id: id+'-itm-'+(i+1), roomTypeId:it.roomTypeId, qty:it.qty, adults:it.adults, children:it.children, ratePlanName: ratePlansFor(it.roomTypeId).find(function(rp){return rp.id===it.ratePlanId;}).name}; });
  var reservation = {
    id: id, customerId: customerId, source: wizard.source, createdAt: PG.nowIso(),
    checkIn: wizard.checkIn, checkOut: wizard.checkOut, status: status, paymentStatus: paymentStatus, paymentMethod: wizard.paymentMethod,
    rooms: roomItems,
    taxAmount: p.taxes, feeAmount: p.fees,
    notes: wizard.notes, activity: activity
  };
  st.reservations.push(reservation);

  // Turn each unit's provisional pick into a real RoomAssignment. Confirmed
  // reservations get a firm "Assigned" record; Draft/Pending Payment get a
  // tentative "Held" one, matching the Reservation/Payment status convention.
  var assignmentStatus = status==='Confirmed' ? 'Assigned' : 'Held';
  var assignedRoomNumbers = [];
  wizard.items.forEach(function(it, i){
    it.assignedRoomIds.forEach(function(roomId){
      if (!roomId) return;
      var pr = st.physicalRooms.find(function(p){return p.id===roomId;});
      if (pr) assignedRoomNumbers.push(pr.roomNumber);
      st.roomAssignments.push({
        id: 'asn-' + Date.now() + '-' + st.roomAssignments.length,
        propertyId: st.hotel.propertyCode, reservationId: id, reservationItemId: roomItems[i].id,
        physicalRoomId: roomId, arrivalDate: wizard.checkIn, departureDate: wizard.checkOut,
        assignmentStatus: assignmentStatus, assignedAt: PG.nowIso(), assignedBy: 'Hotel Admin', changeReason: ''
      });
    });
  });
  reservation.activity.push({ts: PG.nowIso(), text: 'Room(s) assigned: ' + assignedRoomNumbers.join(', ') + '.'});

  PG.setState(st);
  PG.addAudit('Reservation Created', id + ' created via ' + wizard.source + (mode==='Draft' ? ' (Draft)' : '') + '. Rooms assigned: ' + assignedRoomNumbers.join(', ') + '.');
  PG.toast('Reservation ' + id + (mode==='Draft' ? ' saved as Draft.' : ' created.'), 'success');
  setTimeout(function(){ location.href = 'reservation-detail.html?id=' + id; }, 500);
}

showStep(1);
</script>
</body>
</html>
