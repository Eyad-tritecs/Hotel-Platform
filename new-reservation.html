<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Reservation — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .room-line{border:1px solid var(--pg-border);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--pg-gray-100);}
  .room-line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .avail-msg{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:6px;}
  .avail-msg.ok{background:var(--pg-success-light);color:#0bb463;}
  .avail-msg.bad{background:var(--pg-danger-light);color:var(--pg-danger);}
  .source-opt{border:1px solid var(--pg-border);border-radius:8px;padding:12px;cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;}
  .source-opt.active{border-color:var(--pg-primary);background:var(--pg-primary-light);color:var(--pg-primary);}
  .pay-opt{border:1px solid var(--pg-border);border-radius:8px;padding:16px;cursor:pointer;flex:1;}
  .pay-opt.active{border-color:var(--pg-primary);background:var(--pg-primary-light);}
  .pay-opt h4{font-size:13.5px;margin-bottom:4px;}
  .pay-opt p{font-size:12px;color:var(--pg-gray-600);margin:0;}
  .cust-opt{border:1px solid var(--pg-border);border-radius:8px;padding:12px 14px;cursor:pointer;margin-bottom:8px;}
  .cust-opt.active{border-color:var(--pg-primary);background:var(--pg-primary-light);}
  .step-panel{display:none;}
  .step-panel.active{display:block;}
</style>
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("new-reservation", ["Reservations", "New Reservation"]);
var s = PG.getState();

var wizard = {
  checkIn: PG.TODAY,
  checkOut: PG.addDays(PG.TODAY, 1),
  rooms: [{roomTypeId: s.roomTypes[0].id, qty: 1}],
  customerMode: 'existing',
  customerId: s.customers[0].id,
  newCustomer: {name:'', phone:'', email:''},
  source: 'Admin / Direct Manual',
  paymentMethod: 'Pay on Arrival',
  notes: ''
};
var currentStep = 1;
var SOURCES = ['Admin / Direct Manual','Phone','WhatsApp','Walk-in','Travel Agency','Other Manual'];

var html = '';
html += '<div class="pg-page-head"><div><h1>New Reservation</h1><div class="sub">Create a manual reservation for Palestine Grand Hotel</div></div></div>';

html += '<div class="pg-steps" id="stepsBar"></div>';

html += '<div class="row"><div class="col" style="flex:2;">';

// Step 1
html += '<div class="step-panel" id="step1">' +
  '<div class="card"><div class="card-header"><h3>Stay Details &amp; Rooms</h3></div><div class="card-body">' +
    '<div class="grid-2">' +
      '<div class="form-group"><label class="form-label">Check-in Date</label><input type="date" class="form-control" id="checkIn" value="'+wizard.checkIn+'"></div>' +
      '<div class="form-group"><label class="form-label">Check-out Date</label><input type="date" class="form-control" id="checkOut" value="'+wizard.checkOut+'"></div>' +
    '</div>' +
    '<div class="form-label" style="margin-top:6px;">Rooms <span class="opt">— add one or more room types for a multi-room reservation</span></div>' +
    '<div id="roomLines"></div>' +
    '<button class="btn btn-outline btn-sm" id="addRoomLine">+ Add Another Room</button>' +
    '<div id="availSummary"></div>' +
  '</div></div>' +
'</div>';

// Step 2
html += '<div class="step-panel" id="step2">' +
  '<div class="card"><div class="card-header"><h3>Guest Information</h3></div><div class="card-body">' +
    '<div class="pill-toggle" id="custModePill" style="margin-bottom:16px;"><button type="button" class="active" data-m="existing">Existing Customer</button><button type="button" data-m="new">New Customer</button></div>' +
    '<div id="existingCustWrap">' + s.customers.map(function(c){
      return '<div class="cust-opt" data-cid="'+c.id+'"><div style="font-weight:600;font-size:13px;">'+c.name+'</div><div class="muted text-sm">'+c.phone+' &middot; '+c.email+'</div></div>';
    }).join('') + '</div>' +
    '<div id="newCustWrap" style="display:none;">' +
      '<div class="grid-2">' +
        '<div class="form-group"><label class="form-label">Full Name</label><input class="form-control" id="nc-name" placeholder="e.g. Layla Nasser"></div>' +
        '<div class="form-group"><label class="form-label">Phone</label><input class="form-control" id="nc-phone" placeholder="+970 5X XXX XXXX"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">Email <span class="opt">(optional)</span></label><input class="form-control" id="nc-email" placeholder="guest@example.com"></div>' +
    '</div>' +
  '</div></div>' +
  '<div class="card"><div class="card-header"><h3>Reservation Source</h3><div class="desc">Manual source selection — required for every reservation</div></div><div class="card-body">' +
    '<div class="grid-3" id="sourceGrid">' + SOURCES.map(function(src){ return '<div class="source-opt" data-src="'+src+'">'+src+'</div>'; }).join('') + '</div>' +
  '</div></div>' +
'</div>';

// Step 3
html += '<div class="step-panel" id="step3">' +
  '<div class="card"><div class="card-header"><h3>Pricing Summary</h3></div><div class="card-body no-pad"><div class="table-wrap"><table class="dt" id="priceTable"></table></div></div>' +
    '<div class="card-footer" style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:600;">Total Amount Due</span><span style="font-size:19px;font-weight:800;color:var(--pg-gray-900);" id="grandTotal"></span></div>' +
  '</div>' +
  '<div class="card"><div class="card-header"><h3>Payment Method</h3></div><div class="card-body">' +
    '<div style="display:flex;gap:14px;" id="payGrid">' +
      '<div class="pay-opt" data-pm="Pay on Arrival"><h4>Pay on Arrival</h4><p>Guest pays at the hotel during check-in. Reservation is confirmed immediately.</p></div>' +
      '<div class="pay-opt" data-pm="Payment Link"><h4>Payment Link</h4><p>Generate a payment link to send to the guest. Reservation stays Pending Payment until paid.</p></div>' +
    '</div>' +
    '<div class="form-group" style="margin-top:16px;"><label class="form-label">Notes <span class="opt">(optional)</span></label><textarea class="form-control" id="notesInput" placeholder="Internal notes about this reservation"></textarea></div>' +
  '</div></div>' +
'</div>';

// Step 4
html += '<div class="step-panel" id="step4">' +
  '<div class="card"><div class="card-body" style="text-align:center;padding:48px 20px;">' +
    '<div style="font-size:42px;margin-bottom:14px;">&#10003;&#65039;</div>' +
    '<h2 style="font-size:19px;margin-bottom:8px;">Ready to Create Reservation</h2>' +
    '<div class="muted" style="margin-bottom:20px;">Review the summary on the right, then confirm to create this reservation and reserve inventory.</div>' +
  '</div></div>' +
'</div>';

html += '<div style="display:flex;justify-content:space-between;margin-top:6px;">' +
  '<button class="btn btn-light" id="backBtn" style="visibility:hidden;">&larr; Back</button>' +
  '<button class="btn btn-primary" id="nextBtn">Continue &rarr;</button>' +
'</div>';

html += '</div>';

// Right summary column
html += '<div class="col"><div class="card" style="position:sticky;top:80px;"><div class="card-header"><h3>Booking Summary</h3></div><div class="card-body" id="summaryBox"></div></div></div>';

html += '</div>';

page.innerHTML = html;

var STEP_LABELS = ['Stay & Rooms','Guest & Source','Pricing & Payment','Confirm'];
function renderSteps(){
  var bar = document.getElementById('stepsBar');
  bar.innerHTML = STEP_LABELS.map(function(label, i){
    var n = i+1;
    var cls = n===currentStep ? 'active' : (n<currentStep ? 'done' : '');
    return '<div class="pg-step '+cls+'"><div class="num">'+(n<currentStep?'&#10003;':n)+'</div><div class="label">'+label+'</div></div>';
  }).join('');
}

function renderRoomLines(){
  var wrap = document.getElementById('roomLines');
  wrap.innerHTML = wizard.rooms.map(function(line, idx){
    var opts = s.roomTypes.map(function(rt){ return '<option value="'+rt.id+'"'+(rt.id===line.roomTypeId?' selected':'')+'>'+rt.name+' ('+PG.fmtMoney(rt.baseRate)+'/night)</option>'; }).join('');
    return '<div class="room-line" data-idx="'+idx+'">' +
      '<div class="room-line-head"><strong class="text-sm">Room '+(idx+1)+'</strong>' + (wizard.rooms.length>1 ? '<button class="btn btn-danger-outline btn-sm remove-line" data-idx="'+idx+'">Remove</button>' : '') + '</div>' +
      '<div class="grid-2">' +
        '<div class="form-group"><label class="form-label">Room Type</label><select class="form-control rt-select" data-idx="'+idx+'">'+opts+'</select></div>' +
        '<div class="form-group"><label class="form-label">Number of Rooms</label><input type="number" min="1" max="10" class="form-control qty-input" data-idx="'+idx+'" value="'+line.qty+'"></div>' +
      '</div>' +
      '<div class="avail-line" data-idx="'+idx+'"></div>' +
    '</div>';
  }).join('');
  bindRoomLineEvents();
  refreshAvailability();
}

function bindRoomLineEvents(){
  document.querySelectorAll('.rt-select').forEach(function(sel){
    sel.addEventListener('change', function(){ wizard.rooms[+sel.dataset.idx].roomTypeId = sel.value; refreshAvailability(); renderSummary(); });
  });
  document.querySelectorAll('.qty-input').forEach(function(inp){
    inp.addEventListener('input', function(){ wizard.rooms[+inp.dataset.idx].qty = Math.max(1, parseInt(inp.value,10)||1); refreshAvailability(); renderSummary(); });
  });
  document.querySelectorAll('.remove-line').forEach(function(btn){
    btn.addEventListener('click', function(){ wizard.rooms.splice(+btn.dataset.idx,1); renderRoomLines(); renderSummary(); });
  });
}

var allValid = true;
function refreshAvailability(){
  allValid = true;
  wizard.checkIn = document.getElementById('checkIn') ? document.getElementById('checkIn').value : wizard.checkIn;
  wizard.checkOut = document.getElementById('checkOut') ? document.getElementById('checkOut').value : wizard.checkOut;
  wizard.rooms.forEach(function(line, idx){
    var el = document.querySelector('.avail-line[data-idx="'+idx+'"]');
    if (!el) return;
    if (wizard.checkOut <= wizard.checkIn){
      el.innerHTML = '<div class="avail-msg bad">Check-out date must be after check-in date.</div>';
      allValid = false; return;
    }
    var v = PG.validateAvailability(s, line.roomTypeId, wizard.checkIn, wizard.checkOut, line.qty);
    var rtName = s.roomTypes.find(function(r){return r.id===line.roomTypeId;}).name;
    if (v.ok){
      el.innerHTML = '<div class="avail-msg ok">&#10003; '+line.qty+' × '+rtName+' available for all '+v.nights.length+' night(s).</div>';
    } else {
      allValid = false;
      var worst = v.problems[0];
      el.innerHTML = '<div class="avail-msg bad">&#9888; Not enough availability on '+PG.fmtDateShort(worst.date)+' — only '+worst.available+' '+rtName+' room(s) left'+(worst.stopSell?' (Stop Sell active)':'')+'. Reduce quantity or change dates.</div>';
    }
  });
  document.getElementById('nextBtn').disabled = (currentStep===1 && !allValid);
}

function nights(){ return PG.dateRange(wizard.checkIn, wizard.checkOut); }

function reservationLines(){
  var n = nights();
  return wizard.rooms.map(function(line){
    var rt = s.roomTypes.find(function(r){return r.id===line.roomTypeId;});
    var subtotal = 0;
    n.forEach(function(d){ subtotal += PG.rateFor(s, line.roomTypeId, d) * line.qty; });
    return {roomTypeId: line.roomTypeId, name: rt.name, qty: line.qty, nights: n.length, subtotal: subtotal};
  });
}

function renderPricing(){
  var lines = reservationLines();
  var total = lines.reduce(function(a,l){return a+l.subtotal;},0);
  var table = document.getElementById('priceTable');
  table.innerHTML = '<thead><tr><th>Room Type</th><th class="center">Qty</th><th class="center">Nights</th><th class="num">Subtotal</th></tr></thead><tbody>' +
    lines.map(function(l){ return '<tr><td>'+l.name+'</td><td class="center">'+l.qty+'</td><td class="center">'+l.nights+'</td><td class="num">'+PG.fmtMoney(l.subtotal)+'</td></tr>'; }).join('') +
  '</tbody>';
  document.getElementById('grandTotal').textContent = PG.fmtMoney(total);
}

function guestName(){
  if (wizard.customerMode==='existing'){
    var c = s.customers.find(function(c){return c.id===wizard.customerId;});
    return c ? c.name : '—';
  }
  return wizard.newCustomer.name || 'New Guest';
}

function renderSummary(){
  var lines = reservationLines();
  var total = lines.reduce(function(a,l){return a+l.subtotal;},0);
  var box = document.getElementById('summaryBox');
  box.innerHTML =
    srow('Guest', guestName()) +
    srow('Check-in', PG.fmtDateShort(wizard.checkIn)) +
    srow('Check-out', PG.fmtDateShort(wizard.checkOut)) +
    srow('Nights', nights().length) +
    '<div class="divider"></div>' +
    lines.map(function(l){ return srow(l.qty+'× '+l.name, PG.fmtMoney(l.subtotal)); }).join('') +
    '<div class="divider"></div>' +
    srow('Source', wizard.source) +
    (currentStep>=3 ? srow('Payment Method', wizard.paymentMethod) : '') +
    '<div class="divider"></div>' +
    '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;"><span>Total</span><span>'+PG.fmtMoney(total)+'</span></div>';
}
function srow(label, value){
  return '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;"><span class="muted">'+label+'</span><span style="font-weight:600;text-align:right;">'+value+'</span></div>';
}

function showStep(n){
  currentStep = n;
  document.querySelectorAll('.step-panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById('step'+n).classList.add('active');
  renderSteps();
  document.getElementById('backBtn').style.visibility = n===1 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = n===4 ? 'Create Reservation' : 'Continue →';
  if (n===3) renderPricing();
  if (n===2) { /* nothing extra */ }
  renderSummary();
  window.scrollTo({top:0, behavior:'smooth'});
}

// Init step 1
renderRoomLines();
document.getElementById('checkIn').addEventListener('change', function(){ refreshAvailability(); renderSummary(); });
document.getElementById('checkOut').addEventListener('change', function(){ refreshAvailability(); renderSummary(); });
document.getElementById('addRoomLine').addEventListener('click', function(){
  wizard.rooms.push({roomTypeId: s.roomTypes[0].id, qty:1});
  renderRoomLines(); renderSummary();
});

// Step 2 bindings
document.getElementById('custModePill').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#custModePill button').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  wizard.customerMode = btn.dataset.m;
  document.getElementById('existingCustWrap').style.display = wizard.customerMode==='existing' ? 'block' : 'none';
  document.getElementById('newCustWrap').style.display = wizard.customerMode==='new' ? 'block' : 'none';
  renderSummary();
});
document.querySelectorAll('.cust-opt').forEach(function(el){
  if (el.dataset.cid===wizard.customerId) el.classList.add('active');
  el.addEventListener('click', function(){
    document.querySelectorAll('.cust-opt').forEach(function(o){o.classList.remove('active');});
    el.classList.add('active');
    wizard.customerId = el.dataset.cid;
    renderSummary();
  });
});
['nc-name','nc-phone','nc-email'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(){
    wizard.newCustomer.name = document.getElementById('nc-name').value;
    wizard.newCustomer.phone = document.getElementById('nc-phone').value;
    wizard.newCustomer.email = document.getElementById('nc-email').value;
    renderSummary();
  });
});
document.querySelectorAll('.source-opt').forEach(function(el){
  if (el.dataset.src===wizard.source) el.classList.add('active');
  el.addEventListener('click', function(){
    document.querySelectorAll('.source-opt').forEach(function(o){o.classList.remove('active');});
    el.classList.add('active');
    wizard.source = el.dataset.src;
    renderSummary();
  });
});

// Step 3 bindings
document.querySelectorAll('.pay-opt').forEach(function(el){
  if (el.dataset.pm===wizard.paymentMethod) el.classList.add('active');
  el.addEventListener('click', function(){
    document.querySelectorAll('.pay-opt').forEach(function(o){o.classList.remove('active');});
    el.classList.add('active');
    wizard.paymentMethod = el.dataset.pm;
    renderSummary();
  });
});
document.getElementById('notesInput').addEventListener('input', function(){ wizard.notes = this.value; });

document.getElementById('backBtn').addEventListener('click', function(){ if(currentStep>1) showStep(currentStep-1); });

document.getElementById('nextBtn').addEventListener('click', function(){
  if (currentStep===1){
    refreshAvailability();
    if (!allValid){ PG.toast('Please resolve availability issues before continuing.', 'danger'); return; }
    if (wizard.checkOut<=wizard.checkIn){ PG.toast('Check-out date must be after check-in date.', 'danger'); return; }
    showStep(2); return;
  }
  if (currentStep===2){
    if (wizard.customerMode==='new' && !wizard.newCustomer.name.trim()){ PG.toast('Enter the guest\'s full name to continue.', 'danger'); return; }
    if (wizard.customerMode==='new' && !wizard.newCustomer.phone.trim()){ PG.toast('Enter the guest\'s phone number to continue.', 'danger'); return; }
    showStep(3); return;
  }
  if (currentStep===3){
    showStep(4); return;
  }
  if (currentStep===4){
    createReservation();
  }
});

function createReservation(){
  var st = PG.getState();
  var id = 'RES-' + st.nextResId;
  st.nextResId += 1;

  var customerId = wizard.customerId;
  if (wizard.customerMode==='new'){
    customerId = 'cus-' + Date.now();
    st.customers.push({id:customerId, name:wizard.newCustomer.name, phone:wizard.newCustomer.phone, email:wizard.newCustomer.email||'—', nationality:'—', notes:''});
  }

  var status = wizard.paymentMethod==='Pay on Arrival' ? 'Confirmed' : 'Pending Payment';
  var paymentStatus = wizard.paymentMethod==='Pay on Arrival' ? 'Pay on Arrival' : 'Payment Required';

  var activity = [{ts: PG.nowIso(), text: 'Reservation created via ' + wizard.source + ' by Hotel Admin.'}];
  if (wizard.paymentMethod==='Pay on Arrival'){
    activity.push({ts: PG.nowIso(), text: 'Payment method set to Pay on Arrival.'});
    activity.push({ts: PG.nowIso(), text: 'Reservation confirmed.'});
  } else {
    activity.push({ts: PG.nowIso(), text: 'Payment method set to Payment Link. Awaiting link generation.'});
  }

  var reservation = {
    id: id,
    customerId: customerId,
    source: wizard.source,
    createdAt: PG.nowIso(),
    checkIn: wizard.checkIn,
    checkOut: wizard.checkOut,
    status: status,
    paymentStatus: paymentStatus,
    paymentMethod: wizard.paymentMethod,
    rooms: wizard.rooms.map(function(r){ return {roomTypeId:r.roomTypeId, qty:r.qty}; }),
    notes: wizard.notes,
    activity: activity
  };
  st.reservations.push(reservation);
  PG.setState(st);
  PG.addAudit('Reservation Created', id + ' created via ' + wizard.source + ' — ' + reservationLines().map(function(l){return l.qty+'× '+l.name;}).join(', ') + '.');
  PG.toast('Reservation ' + id + ' created successfully.', 'success');
  setTimeout(function(){ location.href = 'reservation-detail.html?id=' + id; }, 500);
}

showStep(1);
</script>
</body>
</html>
