<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Plan — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var id = new URLSearchParams(location.search).get('id');
var page = PG.mount("rates", ["Hotel Management", "Rates", id ? "Edit Rate Plan" : "Add Rate Plan"]);
var s = PG.getState();
var rp = id ? s.ratePlans.find(function(r){return r.id===id;}) : null;

var rtOptions = s.roomTypes.map(function(rt){
  return '<option value="'+rt.id+'"'+(rp && rp.roomTypeId===rt.id ? ' selected':'')+'>'+rt.name+' (base '+PG.fmtMoney(rt.baseRate)+')</option>';
}).join('');

var html = '';
html += '<div class="pg-page-head"><div><h1>'+(id ? 'Edit Rate Plan' : 'Add Rate Plan')+'</h1><div class="sub">'+(rp ? rp.name : 'Create a new rate plan')+'</div></div>' +
  '<div class="pg-actions">' +
    (rp ? '<button class="btn btn-danger-outline" id="deleteBtn">Delete Rate Plan</button>' : '') +
    '<a class="btn btn-light" href="rates.html">&larr; Back to Rate Plans</a>' +
  '</div></div>';

html += '<div class="card"><div class="card-body"><div class="grid-2">' +
  '<div class="form-group"><label class="form-label">Rate Plan Name</label><input class="form-control" id="f-name" value="'+PG.esc(rp ? rp.name : '')+'"></div>' +
  '<div class="form-group"><label class="form-label">Room Type</label><select class="form-control" id="f-rt">'+rtOptions+'</select></div>' +
  '<div class="form-group"><label class="form-label">Meal Plan</label><div id="meal-select"></div></div>' +
  '<div class="form-group"><label class="form-label">Currency</label><select class="form-control" id="f-currency">' + PG.REF.currencies.map(function(c){return '<option value="'+c+'"'+((rp?rp.currency:'USD')===c?' selected':'')+'>'+c+'</option>';}).join('') + '</select></div>' +
  '<div class="form-group"><label class="form-label">Start Date</label><input type="date" class="form-control" id="f-start" value="'+(rp ? rp.startDate : PG.TODAY)+'"></div>' +
  '<div class="form-group"><label class="form-label">End Date</label><input type="date" class="form-control" id="f-end" value="'+(rp ? rp.endDate : PG.addDays(PG.TODAY,90))+'"></div>' +
  '<div class="form-group"><label class="form-label">Price per Night</label><input type="number" min="0" class="form-control" id="f-price" value="'+(rp ? rp.price : 100)+'"></div>' +
'</div>' +
'<div id="priceWarning"></div>' +
'<div class="form-check"><input type="checkbox" id="f-active" '+((!rp || rp.active) ? 'checked' : '')+'><label class="form-label" style="margin:0;" for="f-active">Active</label></div>' +
'</div>' +
'<div class="card-footer"><button class="btn btn-primary" id="saveBtn">Save</button></div></div>';

page.innerHTML = html;
PG.enhanceSelects(page);

var mealValue = rp ? rp.mealPlan : s.mealPlans[0];
PG.renderManagedSelect(document.getElementById('meal-select'), {
  value: mealValue,
  getList: function(){ return PG.getState().mealPlans; },
  setList: function(list){ var st = PG.getState(); st.mealPlans = list; PG.setState(st); },
  onChange: function(v){ mealValue = v; },
  placeholder: 'e.g. All Inclusive'
});

function checkPriceWarning(){
  var rt = s.roomTypes.find(function(r){return r.id===document.getElementById('f-rt').value;});
  var price = parseFloat(document.getElementById('f-price').value) || 0;
  var box = document.getElementById('priceWarning');
  if (rt && price < rt.baseRate){
    box.innerHTML = '<div class="help-note help-note-warning" style="margin-bottom:16px;">This price ('+PG.fmtMoney(price)+') is below '+rt.name+'\'s base rate of '+PG.fmtMoney(rt.baseRate)+'.</div>';
  } else {
    box.innerHTML = '';
  }
}
document.getElementById('f-rt').addEventListener('change', checkPriceWarning);
document.getElementById('f-price').addEventListener('input', checkPriceWarning);
checkPriceWarning();

if (rp){
  document.getElementById('deleteBtn').addEventListener('click', function(){
    if (!confirm('Delete rate plan "'+rp.name+'"? This cannot be undone.')) return;
    var st = PG.getState();
    st.ratePlans = st.ratePlans.filter(function(p){ return p.id!==rp.id; });
    PG.setState(st);
    PG.addAudit('Rate Plan Deleted', rp.name + ' was deleted.');
    PG.toast('Rate plan deleted.', 'warn');
    setTimeout(function(){ location.href = 'rates.html'; }, 500);
  });
}

document.getElementById('saveBtn').addEventListener('click', function(){
  var name = document.getElementById('f-name').value.trim();
  if (!name){ PG.toast('Rate plan name is required.', 'danger'); return; }
  var data = {
    name: name,
    roomTypeId: document.getElementById('f-rt').value,
    mealPlan: mealValue,
    currency: document.getElementById('f-currency').value || 'USD',
    startDate: document.getElementById('f-start').value,
    endDate: document.getElementById('f-end').value,
    price: parseFloat(document.getElementById('f-price').value) || 0,
    active: document.getElementById('f-active').checked
  };
  var st = PG.getState();
  if (rp){
    var target = st.ratePlans.find(function(r){return r.id===rp.id;});
    Object.assign(target, data);
    PG.addAudit('Rate Plan Updated', target.name + ' updated.');
    PG.toast('Rate plan updated.', 'success');
  } else {
    var newPlan = Object.assign({id: 'rp-' + Date.now()}, data);
    st.ratePlans.push(newPlan);
    PG.addAudit('Rate Plan Created', newPlan.name + ' created.');
    PG.toast('Rate plan created.', 'success');
  }
  PG.setState(st);
  setTimeout(function(){ location.href = 'rates.html'; }, 500);
});
</script>
</body>
</html>
