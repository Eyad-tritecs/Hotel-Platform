<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Plan — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
/* Creating and editing a rate plan is now a right-side drawer on the Rate Plans tab,
   not a separate full-page form — the drawer keeps the plan list visible behind it and
   matches every other editor in the app.

   This route is deliberately kept alive rather than deleted: old bookmarks and any
   external link still resolve, they just land on the drawer that replaced this page.
   `?id=` opens that plan's editor; no id opens the Add Rate Plan drawer. */
var id = new URLSearchParams(location.search).get('id');
var target = 'rates.html?tab=plans' + (id ? '&plan=' + encodeURIComponent(id) + '&edit=1' : '&new=1');

var page = PG.mount("rates", ["Hotel Configuration", "Rate Plans & Pricing", id ? "Edit Rate Plan" : "Add Rate Plan"]);
page.innerHTML =
  '<div class="pg-page-head"><div><h1>Rate Plan</h1>' +
    '<div class="sub">Rate plans are now edited in a drawer on the Rate Plans tab</div></div></div>' +
  '<div class="card"><div class="card-body"><div class="empty-state">' +
    '<div class="ic">' + PG.icon('tag',28) + '</div>' +
    '<strong>Opening the rate plan editor…</strong>' +
    'If you are not redirected, <a href="' + target + '">continue to Rate Plans &amp; Pricing</a>.' +
  '</div></div></div>';

location.replace(target);
</script>
</body>
</html>
