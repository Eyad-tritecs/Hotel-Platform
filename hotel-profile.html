<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Profile — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var page = PG.mount("hotel-profile", ["Hotel Configuration", "Hotel Profile"]);
var s = PG.getState();
var h = s.hotel;
var R = PG.REF;

function field(id, label, value, type){
  type = type || 'text';
  return '<div class="form-group"><label class="form-label">'+label+'</label><input class="form-control" id="'+id+'" type="'+type+'" value="'+PG.esc(value)+'"></div>';
}
function selectField(id, label, options, current){
  return '<div class="form-group"><label class="form-label">'+label+'</label><select class="form-control" id="'+id+'">' +
    options.map(function(o){ return '<option value="'+o+'"'+(o===current?' selected':'')+'>'+o+'</option>'; }).join('') +
  '</select></div>';
}

var html = '';
html += '<div class="pg-page-head"><div><h1>Hotel Profile</h1><div class="sub">Core configuration for this pilot tenant — Palestine Grand Hotel</div></div>' +
  '<div class="pg-actions"><span class="badge badge-green"><span class="badge-dot"></span>'+h.status+'</span></div></div>';

html += '<div class="row"><div class="col" style="flex:2;">';
html += '<div class="card"><div class="card-header"><h3>General Information</h3></div><div class="card-body"><div class="grid-2">' +
  field('f-name','Hotel Name', h.name) + field('f-code','Property Code', h.propertyCode) +
  field('f-address','Address', h.address) +
  selectField('f-country','Country', R.countries, h.country) +
  selectField('f-city','City', R.citiesByCountry[h.country] || [h.city], h.city) +
  selectField('f-currency','Default Currency', R.currencies, h.currency) +
  selectField('f-tz','Time Zone', R.timezones, h.timezone) +
  field('f-email','Contact Email', h.email, 'email') +
'</div>' +
'<div class="form-group"><label class="form-label">Contact Phone</label><div style="display:flex;gap:8px;">' +
  '<div style="width:110px;"><select class="form-control" id="f-phone-code">' + R.phoneCodes.map(function(c){return '<option value="'+c+'"'+(c===h.phoneCode?' selected':'')+'>'+c+'</option>';}).join('') + '</select></div>' +
  '<input class="form-control" id="f-phone" value="'+PG.esc(h.phone)+'" style="flex:1;">' +
'</div></div>' +
'</div></div>';

html += '<div class="card"><div class="card-header"><h3>Check-in / Check-out</h3></div><div class="card-body"><div class="grid-2">' +
  field('f-cin','Check-in Time', h.checkInTime, 'time') + field('f-cout','Check-out Time', h.checkOutTime, 'time') +
'</div></div></div>';

html += '<div class="card"><div class="card-header"><h3>Reservation Policy Summary</h3></div><div class="card-body">' +
  '<textarea class="form-control" id="f-policy" style="min-height:90px;">'+PG.esc(h.policySummary)+'</textarea>' +
'</div></div>';

html += '<div class="card" id="amenitiesCard"></div>';

html += '<button class="btn btn-primary" id="saveBtn">Save Changes</button>';
html += '</div>';

html += '<div class="col"><div class="help-note">This prototype represents a single pilot hotel tenant on a multi-tenant platform. In production, Platform Super Admins provision new hotel tenants; Hotel Admins configure their own tenant here.</div></div>';
html += '</div>';

page.innerHTML = html;
PG.enhanceSelects(page);

/* ================================================================ */
/* Property amenities (§5) — shared facilities and services at the hotel     */
/* level. Managed here only; Room Type and Physical Room have their own      */
/* separate sections for their own scopes.                                    */
/* ================================================================ */
var amenitySearch = '';
function renderAmenitiesSection(){
  var st = PG.getState();
  var ids = st.hotel.amenities || [];
  var catalog = st.amenityCatalog.filter(function(a){ return a.active && ids.indexOf(a.id) > -1; });
  var q = amenitySearch.trim().toLowerCase();
  var visible = q ? catalog.filter(function(a){ return a.name.toLowerCase().indexOf(q) > -1; }) : catalog;
  var cats = PG.amenityCategoryOrder().filter(function(c){ return visible.some(function(a){ return a.category===c; }); });
  var body = '';
  if (!catalog.length){
    body = '<div class="empty-state" style="padding:26px 0;">No property amenities have been added yet.</div>';
  } else if (!visible.length){
    body = '<div class="text-sm muted" style="padding:12px 0;">No amenities match your search.</div>';
  } else {
    body = cats.map(function(c){
      var items = visible.filter(function(a){ return a.category===c; });
      return '<div style="margin-bottom:14px;"><div class="text-sm" style="font-weight:700;color:var(--pg-gray-600);text-transform:uppercase;letter-spacing:.04em;font-size:11px;margin-bottom:8px;">'+PG.esc(c)+'</div>' +
        '<div class="am-section-chips">' + items.map(function(a){ return '<span class="chip">'+PG.esc(a.name)+'</span>'; }).join('') + '</div></div>';
    }).join('');
  }
  document.getElementById('amenitiesCard').innerHTML =
    '<div class="card-header am-section-head"><h3>Amenities</h3><span class="am-section-count">'+catalog.length+' amenit'+(catalog.length===1?'y':'ies')+'</span></div>' +
    '<div class="card-body">' +
      '<div class="help-note" style="margin-bottom:14px;">Add shared facilities and services available to guests across the property.</div>' +
      (catalog.length > 6 ? '<input type="search" class="form-control" id="am-profile-search" placeholder="Search amenities…" style="max-width:280px;margin-bottom:12px;" value="'+PG.esc(amenitySearch)+'">' : '') +
      body +
      '<div class="am-section-actions">' +
        '<button type="button" class="btn btn-primary btn-sm" id="editAmenitiesBtn">'+PG.icon('edit',13)+' Edit Amenities</button>' +
        '<button type="button" class="btn btn-outline btn-sm am-add-custom-btn" id="quickAddAmenityBtn">'+PG.icon('plus',13)+' Add Amenity</button>' +
      '</div>' +
    '</div>';
  var searchEl = document.getElementById('am-profile-search');
  if (searchEl) searchEl.addEventListener('input', function(e){ amenitySearch = e.target.value; renderAmenitiesSection(); });
  function openPropertySelector(openCustom){
    PG.openAmenitySelector({
      scope: 'property',
      title: 'Property Amenities',
      helperText: 'Select shared facilities and services available to guests across the property.',
      selectedIds: PG.getState().hotel.amenities || [],
      auditModule: 'Hotel Profile',
      openCustomFormOnInit: !!openCustom,
      onApply: function(newIds){
        var st2 = PG.getState();
        var before = st2.hotel.amenities || [];
        st2.hotel.amenities = newIds;
        PG.setState(st2);
        PG.addAudit('Property Amenities Updated', 'Property amenities changed from ' + before.length + ' to ' + newIds.length + ' selected.', null, { module: 'Hotel Profile', previousValue: before.length, newValue: newIds.length });
        PG.toast('Amenities updated.', 'success');
        renderAmenitiesSection();
      }
    });
  }
  document.getElementById('editAmenitiesBtn').addEventListener('click', function(){ openPropertySelector(false); });
  document.getElementById('quickAddAmenityBtn').addEventListener('click', function(){ openPropertySelector(true); });
}
renderAmenitiesSection();

document.getElementById('f-country').addEventListener('change', function(){
  var cities = R.citiesByCountry[this.value] || [];
  var citySel = document.getElementById('f-city');
  citySel.innerHTML = cities.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
  citySel.dispatchEvent(new Event('change'));
});

document.getElementById('saveBtn').addEventListener('click', function(){
  var st = PG.getState();
  var hh = st.hotel;
  hh.name = document.getElementById('f-name').value;
  hh.propertyCode = document.getElementById('f-code').value;
  hh.address = document.getElementById('f-address').value;
  hh.city = document.getElementById('f-city').value;
  hh.country = document.getElementById('f-country').value;
  hh.currency = document.getElementById('f-currency').value;
  hh.timezone = document.getElementById('f-tz').value;
  hh.email = document.getElementById('f-email').value;
  hh.phoneCode = document.getElementById('f-phone-code').value;
  hh.phone = document.getElementById('f-phone').value;
  hh.checkInTime = document.getElementById('f-cin').value;
  hh.checkOutTime = document.getElementById('f-cout').value;
  hh.policySummary = document.getElementById('f-policy').value;
  PG.setState(st);
  PG.addAudit('Hotel Profile Updated', 'Hotel profile details were updated.');
  PG.toast('Hotel profile saved.', 'success');
});
</script>
</body>
</html>
