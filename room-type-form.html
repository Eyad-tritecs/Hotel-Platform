<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Type — Palestine Grand Hotel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="pg-app"></div>
<script src="assets/js/app.js"></script>
<script>
var params = new URLSearchParams(location.search);
var id = params.get('id');
var readOnly = params.get('mode') === 'view';
var page = PG.mount("room-types", ["Rooms Management & Pricing", "Room Types", id ? (readOnly ? "View Room Type" : "Edit Room Type") : "Add Room Type"]);
var s = PG.getState();
var rt = id ? s.roomTypes.find(function(r){return r.id===id;}) : null;

function f(fid, label, value, opts){
  opts = opts || {};
  var dis = readOnly ? 'disabled' : '';
  return '<div class="form-group"><label class="form-label">'+label+(opts.optional?' <span class="opt">(optional)</span>':'')+'</label>' +
    '<input class="form-control" id="'+fid+'" type="'+(opts.type||'text')+'" value="'+PG.esc(value)+'" '+dis+'></div>';
}

var html = '';
html += '<div class="pg-page-head"><div><h1>'+(id ? (readOnly ? 'View Room Type' : 'Edit Room Type') : 'Add Room Type')+'</h1>' +
  '<div class="sub">'+(rt ? rt.name : 'Create a new room type for Palestine Grand Hotel')+'</div></div>' +
  '<div class="pg-actions">' +
    (rt && readOnly ? '<a class="btn btn-primary" href="room-type-form.html?id='+id+'">'+PG.icon('edit',14)+' Edit This Room Type</a>' : '') +
    (!readOnly ? '<button class="btn btn-primary" id="saveBtn">'+PG.icon('check',14)+' Save</button>' : '') +
    (rt && !readOnly ? '<button class="btn btn-danger-outline" id="deleteBtn">Delete Room Type</button>' : '') +
    '<a class="btn btn-light" href="room-types.html">&larr; Back to Room Types</a>' +
  '</div></div>';

html += '<div class="help-note" style="margin-bottom:20px;">Inventory is controlled at room-type level — sellable quantity below represents how many rooms of this type can be sold per night, not specific room numbers. Specific rooms of this type are managed on the <a href="physical-rooms.html">Physical Rooms</a> page.</div>';

html += '<div class="card"><div class="card-body"><div class="grid-2">' +
  f('f-name','Room Type Name', rt ? rt.name : '') +
  f('f-code','Internal Code', rt ? rt.code : '') +
  f('f-sellable','Sellable Quantity', rt ? rt.sellable : 1, {type:'number'}) +
  f('f-adults','Max Adults', rt ? rt.maxAdults : 2, {type:'number'}) +
  f('f-children','Max Children', rt ? rt.maxChildren : 0, {type:'number'}) +
  '<div class="form-group"><label class="form-label">Bed Configuration</label><div id="bed-select"></div></div>' +
'</div>' +
'<div class="form-group"><label class="form-label">Essential Description</label><textarea class="form-control" id="f-desc" style="min-height:70px;" '+(readOnly?'disabled':'')+'>'+PG.esc(rt ? rt.desc : '')+'</textarea></div>' +
'<div class="form-check"><input type="checkbox" id="f-active" '+((!rt || rt.active) ? 'checked' : '')+' '+(readOnly?'disabled':'')+'><label class="form-label" style="margin:0;" for="f-active">Active</label></div>' +
'</div>' +
'</div>';

html += '<div class="card" id="amenitiesCard"></div>';

page.innerHTML = html;

var bedValue = rt ? rt.bed : s.bedConfigs[0];
if (readOnly){
  document.getElementById('bed-select').textContent = bedValue;
} else {
  PG.renderManagedSelect(document.getElementById('bed-select'), {
    value: bedValue,
    getList: function(){ return PG.getState().bedConfigs; },
    setList: function(list){ var st = PG.getState(); st.bedConfigs = list; PG.setState(st); },
    onChange: function(v){ bedValue = v; },
    placeholder: 'e.g. 2 Queen Beds',
    entityLabel: 'Bed Configuration',
    deleteButtonLabel: 'Configuration',
    // Assigned to this room type itself (excluding the one being edited) or to any
    // physical room — either usage blocks deletion, same rule as Physical Rooms.
    isUsedCount: function (v) {
      var st2 = PG.getState();
      var onTypes = st2.roomTypes.filter(function (r) { return r.bed === v && r.id !== id; }).length;
      var onRooms = st2.physicalRooms.filter(function (r) { return r.bedConfiguration === v; }).length;
      return onTypes + onRooms;
    },
    addedMessage: 'Bed configuration added successfully.',
    deletedMessage: 'Bed configuration deleted successfully.',
    auditModule: 'Room Types'
  });
}

/* ================================================================ */
/* Room Type amenities (§5) — guaranteed in every physical room of this type. */
/* Physical Rooms display these as read-only inherited chips; they are never  */
/* edited from that page.                                                     */
/* ================================================================ */
var amenitiesValue = rt ? (rt.amenities || []) : [];
function renderRtAmenities(){
  var st = PG.getState();
  var catalog = st.amenityCatalog.filter(function(a){ return a.active && amenitiesValue.indexOf(a.id) > -1; });
  var chips = catalog.length
    ? '<div class="am-section-chips">' + catalog.map(function(a){ return '<span class="chip">'+PG.esc(a.name)+'</span>'; }).join('') + '</div>'
    : '<div class="text-sm muted">No amenities selected yet.</div>';
  document.getElementById('amenitiesCard').innerHTML =
    '<div class="card-header am-section-head"><h3>Amenities</h3><span class="am-section-count">'+catalog.length+' amenit'+(catalog.length===1?'y':'ies')+'</span></div>' +
    '<div class="card-body">' +
      '<div class="help-note" style="margin-bottom:14px;">Select amenities available in every physical room of this room type.</div>' +
      chips +
      (readOnly ? '' :
        '<div class="am-section-actions">' +
          '<button type="button" class="btn btn-primary btn-sm" id="editRtAmenitiesBtn">'+PG.icon('edit',13)+' Edit Amenities</button>' +
          '<button type="button" class="btn btn-outline btn-sm am-add-custom-btn" id="quickAddRtAmenityBtn">'+PG.icon('plus',13)+' Add Amenity</button>' +
        '</div>') +
    '</div>';
  if (readOnly) return;
  function openRtSelector(openCustom){
    PG.openAmenitySelector({
      scope: 'roomType',
      title: 'Room Type Amenities',
      helperText: 'Select amenities available in every physical room of this room type.',
      selectedIds: amenitiesValue,
      auditModule: 'Room Types',
      openCustomFormOnInit: !!openCustom,
      onApply: function(newIds){
        amenitiesValue = newIds;
        renderRtAmenities();
      }
    });
  }
  document.getElementById('editRtAmenitiesBtn').addEventListener('click', function(){ openRtSelector(false); });
  document.getElementById('quickAddRtAmenityBtn').addEventListener('click', function(){ openRtSelector(true); });
}
renderRtAmenities();

if (rt && !readOnly){
  document.getElementById('deleteBtn').addEventListener('click', function(){
    if (!confirm('Delete "'+rt.name+'"? This cannot be undone and will remove its rates, rate plans, and physical rooms.')) return;
    var st = PG.getState();
    st.roomTypes = st.roomTypes.filter(function(r){ return r.id!==rt.id; });
    delete st.rates[rt.id];
    st.ratePlans = st.ratePlans.filter(function(p){ return p.roomTypeId!==rt.id; });
    var removedRoomIds = st.physicalRooms.filter(function(pr){ return pr.roomTypeId===rt.id; }).map(function(pr){ return pr.id; });
    st.physicalRooms = st.physicalRooms.filter(function(pr){ return pr.roomTypeId!==rt.id; });
    st.roomBlocks = st.roomBlocks.filter(function(b){ return removedRoomIds.indexOf(b.physicalRoomId)===-1; });
    st.roomAssignments = st.roomAssignments.filter(function(a){ return removedRoomIds.indexOf(a.physicalRoomId)===-1; });
    PG.setState(st);
    PG.addAudit('Room Type Deleted', rt.name + ' was deleted.');
    PG.toast('Room type deleted.', 'warn');
    setTimeout(function(){ location.href = 'room-types.html'; }, 500);
  });
}

if (!readOnly){
  document.getElementById('saveBtn').addEventListener('click', function(){
    var name = document.getElementById('f-name').value.trim();
    if (!name){ PG.toast('Room type name is required.', 'danger'); return; }
    var data = {
      name: name,
      code: document.getElementById('f-code').value.trim() || name.slice(0,3).toUpperCase(),
      sellable: parseInt(document.getElementById('f-sellable').value,10) || 0,
      maxAdults: parseInt(document.getElementById('f-adults').value,10) || 1,
      maxChildren: parseInt(document.getElementById('f-children').value,10) || 0,
      bed: bedValue,
      amenities: amenitiesValue,
      desc: document.getElementById('f-desc').value,
      active: document.getElementById('f-active').checked
    };
    // Amenity changes on an EXISTING room type reach every physical room of that
    // type automatically (they inherit live, nothing is copied onto the room), so the
    // only thing needed before applying is telling the user how many rooms that is.
    var amenitiesChanged = rt && JSON.stringify((rt.amenities||[]).slice().sort()) !== JSON.stringify(amenitiesValue.slice().sort());
    if (amenitiesChanged) {
      var affected = PG.getState().physicalRooms.filter(function (r) { return r.roomTypeId === rt.id; }).length;
      PG.confirmDialog({
        title: 'Update Room Type Amenities?',
        message: 'This update will apply to ' + affected + ' physical room' + (affected===1?'':'s') + ' assigned to ' + rt.name + '.',
        confirmLabel: 'Save Changes',
        onConfirm: function () { doSaveRoomType(data); }
      });
    } else {
      doSaveRoomType(data);
    }
  });
}
function doSaveRoomType(data){
    var st = PG.getState();
    var auditCalls = []; // deferred until after PG.setState(st) below — see note
    if (rt){
      // PG.getState() re-parses localStorage on every call rather than returning a
      // cached object, so the page-load-time `rt` reference is a different object
      // graph than this fresh `st` — mutating `rt` directly would silently never
      // reach `st`, and PG.setState(st) would write back the room type unchanged.
      // Find and mutate the record that actually lives inside `st`.
      var freshRt = st.roomTypes.find(function (r) { return r.id === rt.id; });
      var prevAmenityCount = (freshRt.amenities||[]).length;
      Object.assign(freshRt, data);
      var newAmenityCount = data.amenities.length;
      auditCalls.push(function () { PG.addAudit('Room Type Updated', freshRt.name + ' details updated.'); });
      if (newAmenityCount !== prevAmenityCount) {
        auditCalls.push(function () { PG.addAudit('Room Type Amenities Updated', freshRt.name + ' amenities changed from ' + prevAmenityCount + ' to ' + newAmenityCount + ' selected.', null, { module: 'Room Types', recordId: freshRt.id, previousValue: prevAmenityCount, newValue: newAmenityCount }); });
      }
      PG.toast('Room type updated.', 'success');
    } else {
      var newId = 'rt-' + Date.now();
      var newRt = Object.assign({id:newId, baseRate:100, baseCapacity: data.sellable}, data);
      st.roomTypes.push(newRt);
      st.rates[newId] = {};
      PG.dateRange(PG.addDays(PG.TODAY,-2), PG.addDays(PG.TODAY,30)).forEach(function(d){ st.rates[newId][d] = newRt.baseRate; });
      auditCalls.push(function () { PG.addAudit('Room Type Created', newRt.name + ' added.'); });
      PG.toast('Room type created.', 'success');
    }
    // PG.setState(st) must run BEFORE PG.addAudit() — addAudit does its own
    // read-current-state/append/write cycle, and calling it first would have its
    // write immediately clobbered by this one (st.audit here doesn't include it).
    PG.setState(st);
    auditCalls.forEach(function (fn) { fn(); });
    setTimeout(function(){ location.href = 'room-types.html'; }, 500);
}
</script>
</body>
</html>
